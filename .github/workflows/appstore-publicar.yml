# LA FICHA DE LA APP STORE Y EL ENVÍO A REVISIÓN de las apps de Fyne (apps/fyne/appstore/).
# Ejecuta apps/fyne/scripts/appstore-publicar.py en el runner, con la clave de la API de
# App Store Connect en los secretos de GitHub (APP_STORE_CONNECT_ISSUER_ID, _KEY_IDENTIFIER
# y _PRIVATE_KEY). Sin Codemagic desde el 19/10. Ver docs/operations.md#app-store-api.
#
#   modo=sondear    solo lee: ¿existe cada app, es la nuestra, qué versiones tiene?
#   modo=preparacion solo lee: presencia de metadatos y capturas reutilizables, sin datos personales
#   modo=ficha      textos, capturas, categoría, edades, precio gratis y países
#   modo=revision   ata el build del tag y ENVÍA A REVISIÓN; pide la frase de confirmación
#
# Solo a mano. No necesita un Mac: el guion es Python y openssl contra la API de Apple.
name: appstore-publicar

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "sondear/preparacion (solo leen) | ficha | cifrado-exento | revision"
        type: choice
        options: [sondear, preparacion, ficha, cifrado-exento, revision]
        required: true
        default: sondear
      ref:
        description: "Tag vX.Y.Z: versión de la ficha y del build; sondear consulta sus builds por plataforma"
        type: string
        required: true
      apps:
        description: "Apps separadas por espacios (vacío = las quince)"
        type: string
        required: false
      plataformas:
        description: "IOS, MAC_OS o las dos separadas por un espacio (vacío = las dos)"
        type: string
        required: false
      confirmacion_cifrado:
        description: "Solo cifrado-exento: ESTANDAR_EXENTO_SIN_FRANCIA (solo completa respuestas pendientes)"
        type: string
        required: false
      confirmacion_revision:
        description: "Solo modo=revision: escribe ENVIAR_<n>_APPS_A_REVISION, con el número de apps (15 si son todas)"
        type: string
        required: false

# Lo que puede hacer GITHUB_TOKEN en este flujo, y nada más.
permissions:
  contents: read

# `bash` EXPLÍCITO: dentro de un `container:` GitHub ejecuta los `run:` con `sh -e`.
defaults:
  run:
    shell: bash

env:
  # El checkout lo escribe el runner (uid 1001) y los pasos corren como root dentro
  # del `container:`: git ve un propietario ajeno y se niega («dubious ownership»).
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

concurrency:
  group: appstore-publicar
  cancel-in-progress: false

jobs:
  appstore:
    name: App Store (${{ github.event.inputs.modo }})
    runs-on: sytue-arm64
    # Los runners propios del frontal (.github/RUNNERS.md).
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      env:
        DOCKER_HOST: unix:///run/sytue-ci/docker.sock
      volumes:
        - /srv/ci/run/proxy.sock:/run/sytue-ci/docker.sock
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    timeout-minutes: 30
    steps:
      - name: Traer el código de main
        env:
          SYTUE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Runner propio: el workspace SOBREVIVE entre jobs, así que se vacía antes.
          find . -mindepth 1 -delete
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$SYTUE_GIT_TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD -- apps/fyne/scripts/appstore-publicar.py apps/fyne/scripts/apple_clave.py apps/fyne/appstore \
            ':(glob)apps/fyne/cmd/*/FyneApp.toml'

      - name: Hablar con App Store Connect
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          # Opcionales: si faltan, se conserva lo que ya tiene App Store Connect.
          APPSTORE_CONTACTO_NOMBRE: ${{ secrets.APPSTORE_CONTACTO_NOMBRE }}
          APPSTORE_CONTACTO_APELLIDOS: ${{ secrets.APPSTORE_CONTACTO_APELLIDOS }}
          APPSTORE_CONTACTO_TELEFONO: ${{ secrets.APPSTORE_CONTACTO_TELEFONO }}
          APPSTORE_CONTACTO_CORREO: ${{ secrets.APPSTORE_CONTACTO_CORREO }}
          APPSTORE_DEMO_USUARIO: ${{ secrets.APPSTORE_DEMO_USUARIO }}
          APPSTORE_DEMO_CLAVE: ${{ secrets.APPSTORE_DEMO_CLAVE }}
          APPSTORE_MODO: ${{ github.event.inputs.modo }}
          TAG: ${{ github.event.inputs.ref }}
          SYTUE_APPS: ${{ github.event.inputs.apps }}
          APPSTORE_PLATAFORMAS: ${{ github.event.inputs.plataformas }}
          CONFIRMACION: ${{ github.event.inputs.confirmacion_revision }}
          CIFRADO: ${{ github.event.inputs.confirmacion_cifrado }}
        run: |
          set -euo pipefail
          # Solo desde main: la ficha que se sube es la de main.
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::lánzalo desde main" >&2; exit 1; }
          case "$SYTUE_APPS" in *[!a-z\ ]*) echo "::error::apps tiene que ser una lista de nombres de apps/fyne/cmd" >&2; exit 1 ;; esac
          case "$APPSTORE_PLATAFORMAS" in "" | IOS | MAC_OS | "IOS MAC_OS") ;; *) echo "::error::plataformas: IOS, MAC_OS o «IOS MAC_OS»" >&2; exit 1 ;; esac
          [ "$APPSTORE_MODO" = cifrado-exento ] || [ -z "$CIFRADO" ] || { echo "::error::confirmacion_cifrado solo se rellena con modo=cifrado-exento" >&2; exit 1; }
          case "$APPSTORE_MODO" in
          sondear | preparacion | ficha)
            # La frase NO viaja fuera de modo=revision: escribirla por error no envía nada.
            [ -z "$CONFIRMACION" ] || { echo "::error::confirmacion_revision solo se rellena con modo=revision" >&2; exit 1; }
            ;;
          cifrado-exento)
            [ -z "$CONFIRMACION" ] && [ "$CIFRADO" = ESTANDAR_EXENTO_SIN_FRANCIA ] || { echo "::error::cifrado-exento requiere su confirmación y no admite confirmacion_revision" >&2; exit 1; }
            export APPSTORE_CONFIRMAR_CIFRADO="$CIFRADO"
            ;;
          revision)
            [[ "$CONFIRMACION" =~ ^ENVIAR_[0-9]+_APPS_A_REVISION$ ]] || {
              echo "::error::para enviar a revisión escribe ENVIAR_<n>_APPS_A_REVISION en confirmacion_revision" >&2
              exit 1
            }
            export APPSTORE_CONFIRMAR_REVISION="$CONFIRMACION"
            ;;
          *) echo "::error::modo «$APPSTORE_MODO» desconocido" >&2; exit 1 ;;
          esac
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::ref tiene que ser un tag vX.Y.Z" >&2; exit 1 ;; esac
          args=("--$APPSTORE_MODO" --version "${TAG#v}")
          [ -z "$APPSTORE_PLATAFORMAS" ] || args+=(--plataformas "$APPSTORE_PLATAFORMAS")
          # shellcheck disable=SC2086 # SYTUE_APPS ya está validado: nombres separados por espacios.
          python3 apps/fyne/scripts/appstore-publicar.py "${args[@]}" $SYTUE_APPS
