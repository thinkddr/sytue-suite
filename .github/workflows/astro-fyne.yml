# SPDX-License-Identifier: Apache-2.0
name: astro-fyne
on:
  push:
    branches: [codex/astro-preact-fyne]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astro-fyne-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  conformance:
    runs-on: sytue-arm64
    timeout-minutes: 35
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchains from the repository's verified catalog
        run: .github/actions/toolchain/accion.sh go bun
      - name: Compiler, native behavior and exact visual comparison
        working-directory: tools/astro-fyne
        run: bash ci/run.sh
      # Una copia, no un veredicto: con la cuota de artefactos llena no tumba el job
      # (mismo criterio que el incidente del 2026-10-06 en operations.md).
      - name: Preserve evidence, including failures
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: astro-fyne-conformance-${{ github.sha }}
          path: |
            tools/astro-fyne/artifacts
            tools/astro-fyne/native/generated
            tools/astro-fyne/native/go.sum
            tools/astro-fyne/native/go.mod
          if-no-files-found: warn
  private-adapter:
    needs: conformance
    runs-on: sytue-arm64
    timeout-minutes: 35
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      volumes:
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      GOPRIVATE: github.com/thinkddr/*,git.sytue.eu/*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate existing private Fyne forks
        env:
          SYTUE_GIT_FORKS_TOKEN: ${{ secrets.SYTUE_GIT_FORKS_TOKEN }}
        run: .github/actions/toolchain/forks.sh
      - name: Reuse verified desktop toolchains
        run: .github/actions/toolchain/accion.sh go escritorio golangci-lint
      - name: Check dependency inventory
        run: go run ./tools/eusupply
      - name: Check the optional adapter against the existing Fyne fork
        working-directory: apps/fyne
        run: |
          go mod tidy
          git diff --exit-code HEAD -- go.mod go.sum
          golangci-lint run --config=../../.golangci.yml ./webui/...
          go vet ./webui/... ./ui
          GOMAXPROCS=2 go test -p=2 -race ./webui/...
      - name: Preserve resolved product dependencies
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: astro-fyne-private-adapter-${{ github.sha }}
          path: |
            apps/fyne/go.mod
            apps/fyne/go.sum
          if-no-files-found: warn
