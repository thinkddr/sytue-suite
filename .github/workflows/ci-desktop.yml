name: ci-desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      empaquetado_solo:
        description: 'Comprobar solo el empaquetado (las releases siempre validan todo)'
        type: boolean
        default: false
      widgets_apple:
        description: "Compilar WidgetKit con los SDK iOS y macOS, sin firma ni publicación"
        type: boolean
        default: false
      solo_ui:
        description: 'Repetir los gates de UI compartida, Hub y núcleo (las releases siempre validan todo)'
        type: boolean
        default: false
      captura_cromo:
        description: 'Guardar el diagnóstico del marco y la cabecera (móvil/escritorio, pintor de software)'
        type: boolean
        default: false
      captura_fichas:
        description: 'Regenerar las capturas seleccionadas para las fichas de las tiendas'
        type: boolean
        default: false
      apps_fichas:
        description: 'Apps separadas por espacios, o todas (solo captura_fichas)'
        type: string
        default: 'calendar hub certipdf rooms'
      clase_fichas:
        description: 'Una clase permite repartir la regeneración en trabajos independientes'
        type: choice
        options: [todas, iphone, ipad, mac, android]
        default: todas

# Lo que puede hacer GITHUB_TOKEN en este flujo, y nada más (GitHub lo
# aplica; en Forgejo este campo se ignoraba y mandaba el token de cada paso).
permissions:
  contents: read

# `bash` EXPLÍCITO. Dentro de un `container:` GitHub ejecuta los `run:` con
# `sh -e` y no con bash: `set -o pipefail`, `[[`, los arrays y `<<<` mueren
# con «Illegal option» (cancelar-al-cerrar, 2026-09-27). Con `shell: bash`
# es `bash --noprofile --norc -eo pipefail`, que es lo que corría en la forja.
defaults:
  run:
    shell: bash

env:
  GOFLAGS: '-tags=goolm'
  # El checkout lo escribe el runner (uid 1001) y los pasos corren como root dentro
  # del `container:`: git ve un propietario ajeno, se niega («dubious ownership»)
  # y `go build` muere con «error obtaining VCS status». La forja montaba el
  # workspace con el mismo usuario y no lo notaba.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'

concurrency:
  # UN DESPACHO A MANO NO CANCELA A OTRO (2026-09-27). El grupo lleva el `run_id`
  # solo cuando el evento es `workflow_dispatch`: en GitHub dos despachos de la
  # misma rama caían en el mismo grupo y el segundo cancelaba al primero, así
  # que lanzar el CI sobre dos commits seguidos dejaba el primero sin veredicto
  # (ci-go del 44d9b1bd, cancelado al lanzar el del 209f58f6). En push y en PR
  # el sufijo vale vacío y todo sigue como antes.
  group: ci-desktop-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  validar-escritorio:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.empaquetado_solo && 'Validar empaquetado de escritorio' || github.event_name == 'workflow_dispatch' && inputs.solo_ui && 'Validar UI compartida, Hub y núcleo (Go/Fyne)' || 'Validar aplicaciones de escritorio (Go/Fyne)' }}
    if: ${{ !inputs.widgets_apple }}
    runs-on: sytue-arm64
    # Los runners propios del frontal (.github/RUNNERS.md): cada job en un
    # contenedor del Docker del CI, con el proxy filtrado como socket de Docker
    # y la caché de Go del host (con varios jobs, ancla `&ci` y `*ci`).
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      env:
        DOCKER_HOST: unix:///run/sytue-ci/docker.sock
      volumes:
        - /srv/ci/run/proxy.sock:/run/sytue-ci/docker.sock
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    # v3.12.5 (run 38655721262) agotó 45 min con paquetes en verde y
    # la suite aún incompleta: el corte no mide su duración total.
    # Damos margen al conjunto y conservamos 20 min por paquete para cuelgues.
    timeout-minutes: 120
    env:
      GOPRIVATE: github.com/thinkddr/*
    steps:
      - name: Clonar el repositorio
        env:
          SYTUE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYTUE_GIT_FORKS_TOKEN: ${{ secrets.SYTUE_GIT_FORKS_TOKEN }}
        run: |
          set -euo pipefail
          # Runner propio: el workspace SOBREVIVE entre jobs (lo deja el anterior,
          # con su .git), así que se vacía antes de clonar (.github/RUNNERS.md).
          find . -mindepth 1 -delete
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$SYTUE_GIT_TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          git config --global "http.$GITHUB_SERVER_URL/.extraHeader" \
            "Authorization: Basic $(printf 'x-access-token:%s' "$SYTUE_GIT_TOKEN" | base64 -w0)"
          # Los dos forks de Fyne son PRIVADOS y la credencial efímera no los lee: el
          # guion configura el token de los forks y comprueba AQUÍ que sirve, no media
          # hora después al compilar (release-desktop v3.5.7 a v3.5.9).
          "$GITHUB_WORKSPACE/.github/actions/toolchain/forks.sh"

      - name: Preparar Go y dependencias gráficas de Fyne
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh go escritorio

      - name: Verificar el parche de formato VP8 de LiveKit
        run: bash apps/fyne/scripts/preparar-livekit-test.sh

      - name: Comprobar la biblioteca Fyne
        run: |
          set -euo pipefail
          version="$(cd apps/fyne && go list -m -f '{{.Version}}' fyne.io/fyne/v2)"
          [ "$version" = v2.8.1 ] || {
            echo "::error::apps/fyne debe declarar la versión vigente de Fyne (v2.8.1); declara $version" >&2
            exit 1
          }
          reemplazo="$(cd apps/fyne && go list -m -f '{{with .Replace}}{{.Path}} {{.Version}}{{end}}' fyne.io/fyne/v2)"
          [ "$reemplazo" = 'github.com/thinkddr/fyne/v2 v2.8.1-sytue.16' ] || {
            echo "::error::apps/fyne debe usar el fork público BSD-3-Clause con URL entrantes; usa $reemplazo" >&2
            exit 1
          }

      - name: Compilar, probar y analizar los módulos nativos
        if: github.event_name != 'workflow_dispatch' || !inputs.empaquetado_solo
        env:
          SOLO_UI: ${{ github.event_name == 'workflow_dispatch' && inputs.solo_ui }}
        run: |
          set -euo pipefail
          command -v golangci-lint >/dev/null 2>&1 || \
            "$GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh" golangci-lint
          for modulo in apps/nucleo apps/fyne; do
            echo "── $modulo ───────────────────────────────"
            ( cd "$modulo"
              paquetes=(./...)
              if [ "$modulo" = apps/fyne ] && [ "$SOLO_UI" = true ]; then
                paquetes=(./ui ./apps/hub)
              fi
              # Fallar pronto en lint: no esperar al final de los tests gráficos.
              golangci-lint run --config=../../.golangci.yml "${paquetes[@]}"
              go build "${paquetes[@]}"
              go vet "${paquetes[@]}"
              if [ "$modulo" = apps/fyne ]; then
                # Los tests gráficos arrancan su propio runtime Fyne. El paralelismo
                # por defecto del host ARM ejecutaba demasiados a la vez y varios
                # paquetes agotaban los 10 minutos sin estar bloqueados entre sí.
                # Dos procesos y dos P reducen esa contención sin serializar todo el job.
                # Y 20 min por paquete: apps/cast hace decenas de capturas con -race y se mide en
                # 570-600 s, pegado a los 10 de serie, así que caía o no según la carga
                # del frontal (v3.8.6, codex/office-commands, #219). No es un cuelgue:
                # uno de verdad sigue cayendo, solo que más tarde.
                GOMAXPROCS=2 go test -p=2 -race -shuffle=on -timeout=20m "${paquetes[@]}"
              else
                go test -race -shuffle=on "${paquetes[@]}"
              fi
            )
          done
          sin_formato="$(gofmt -l apps/fyne apps/nucleo)"
          [ -z "$sin_formato" ] || { echo "::error::sin gofmt: $sin_formato"; exit 1; }

      - name: Guardián de la cadena de empaquetado
        run: |
          "$GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh" jq
          bash apps/fyne/scripts/empaquetar-test.sh
          bash deploy/production/tests/apple-firma-test.sh
          bash deploy/production/tests/appstore-publicar-test.sh

  widgets-apple:
    name: WidgetKit (SDK iOS y macOS, sin firma)
    if: github.event_name == 'workflow_dispatch' && inputs.widgets_apple
    runs-on: [self-hosted, sytue-macos]
    timeout-minutes: 45
    env:
      GOPRIVATE: github.com/thinkddr/*
    steps:
      - name: Clonar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Los forks privados de Fyne, con la configuración de git DEL JOB: el Mac es de una
      # persona y forks.sh escribe en `git config --global` (como en release-desktop).
      - name: Acceso a los forks privados
        env:
          SYTUE_GIT_FORKS_TOKEN: ${{ secrets.SYTUE_GIT_FORKS_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/widget-gitconfig"
          : >"$GIT_CONFIG_GLOBAL"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          .github/actions/toolchain/forks.sh
      - name: Seleccionar el SDK de Xcode del job
        run: |
          xcode="$(bash apps/fyne/scripts/apple-firma.sh directorio-xcode)"
          echo "DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"
      - name: Preparar Go con cachés del job
        run: |
          set -euo pipefail
          .github/actions/toolchain/accion.sh go
          {
            echo "GOPATH=$RUNNER_TEMP/widget-gopath"
            echo "GOCACHE=$RUNNER_TEMP/widget-gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/widget-gopath/pkg/mod"
          } >> "$GITHUB_ENV"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/.sytue-toolchain/go/bin" >> "$GITHUB_PATH"
      - name: Comprobar el contrato privado y el proyecto generado
        run: |
          set -euo pipefail
          temporal="$(mktemp -d "$RUNNER_TEMP/widgetkit-contract.XXXXXX")"
          trap 'rm -rf "$temporal"' EXIT
          python3 apps/fyne/xcode/generar.py --comprobar
          python3 apps/fyne/scripts/widgetkit-apple-test.py
          python3 apps/fyne/scripts/apple-widgets-test.py
          python3 apps/fyne/scripts/apple-widgets.py --seco
          bash apps/fyne/scripts/apple-cgo-enlace-test.sh
          bash apps/fyne/scripts/apple-sesion-sdk-test.sh
          xcrun swiftc apps/fyne/xcode/widgets/Snapshot.swift apps/fyne/xcode/widgets/SnapshotTests.swift -o "$temporal/snapshot"
          "$temporal/snapshot"
          xcrun swiftc -parse-as-library apps/fyne/xcode/widgets/ProjectTests.swift -o "$temporal/project"
          "$temporal/project" "$GITHUB_WORKSPACE"
      - name: Compilar bindings de sesión con ambos SDK
        run: bash apps/fyne/scripts/apple-sesion-sdk.sh
      - name: Compilar widgets y enlaces Go con ambos SDK
        run: |
          set -euo pipefail
          temporal="$(mktemp -d "$RUNNER_TEMP/widgetkit-build.XXXXXX")"
          trap 'rm -rf "$temporal"' EXIT
          # Un único producto por SDK basta para medir primero LC_LOAD/LC_RPATH
          # del enlace Go real. La batería completa reutiliza después su caché.
          python3 apps/fyne/scripts/widgetkit-apple.py --plataforma macos --salida "$temporal" hub
          python3 apps/fyne/scripts/widgetkit-apple.py --plataforma ios --salida "$temporal" hub
          SYTUE_WIDGET_PRODUCTOS_ROOT="$temporal" bash apps/fyne/scripts/apple-sesion-sdk.sh
          python3 apps/fyne/scripts/widgetkit-apple.py --plataforma ios --salida "$temporal"
          python3 apps/fyne/scripts/widgetkit-apple.py --plataforma macos --salida "$temporal"
      - name: Retirar las cachés del job
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/widget-gopath/pkg/mod" ]; then
            (cd "$RUNNER_TEMP" && GOTOOLCHAIN=local GOMODCACHE="$RUNNER_TEMP/widget-gopath/pkg/mod" go clean -modcache)
          fi
          rm -rf "$RUNNER_TEMP/widget-gopath" "$RUNNER_TEMP/widget-gocache" "$RUNNER_TEMP/widget-gitconfig"

  captura-cromo:
    name: ${{ inputs.captura_fichas && format('Capturas de ficha ({0})', inputs.clase_fichas) || 'Diagnóstico del marco y la cabecera (software)' }}
    if: github.event_name == 'workflow_dispatch' && (inputs.captura_cromo || inputs.captura_fichas)
    runs-on: sytue-arm64
    # Independiente de validar-escritorio: las imágenes llegan sin esperar a la suite.
    # El pintor de software no necesita servidor gráfico. Rooms sí enlaza la
    # captura multimedia nativa aunque este diagnóstico no llegue a abrirla.
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      volumes:
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    timeout-minutes: ${{ inputs.captura_fichas && 45 || 15 }}
    env:
      GOPRIVATE: github.com/thinkddr/*
      SYTUE_FORMA: marco
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Go y acceso a los forks
        env:
          SYTUE_GIT_FORKS_TOKEN: ${{ secrets.SYTUE_GIT_FORKS_TOKEN }}
        run: |
          .github/actions/toolchain/forks.sh
          .github/actions/toolchain/accion.sh go escritorio
      - name: Validar cabeceras, modales y vistas móviles
        if: inputs.captura_cromo
        working-directory: apps/fyne
        env:
          SYTUE_CAPTURA_CROMO: ${{ runner.temp }}/cromo-marco/cromo
          SYTUE_CAPTURA_DIALOGOS: ${{ runner.temp }}/cromo-marco/dialogos
          SYTUE_CAPTURAS: ${{ runner.temp }}/cromo-marco/movil
          SYTUE_CAPTURA_EMOJIS: ${{ runner.temp }}/cromo-marco/emojis
          SYTUE_CAPTURA: ${{ runner.temp }}/cromo-marco/photos
        run: |
          mkdir -p "$SYTUE_CAPTURA_CROMO" "$SYTUE_CAPTURA_DIALOGOS" "$SYTUE_CAPTURAS" "$SYTUE_CAPTURA_EMOJIS" "$SYTUE_CAPTURA"
          casos='TestRetratoDeLaBarraConElLateral|TestLasCabecerasDeMarcoNoLlevanFiletes|TestElMenuDeCuentaEsElDeAccountMenuTsx'
          casos+='|TestLaTiraNoRecortaLosBotonesTactiles|TestLaCabeceraTactilCambiaDeAnchoSinRecortarAcciones|TestLaBarraDeLoteSeDeslizaEnTactil'
          casos+='|TestElDialogoMovilEncogeElCuerpoYEnvuelveLasAcciones|TestElDialogoConPocaAlturaNoPierdeCabeceraNiAcciones|TestElDialogoRespetaElAreaSeguraDesdeLaApertura|TestLaColumnaMideLosParrafosAnidadosAlAnchoDisponible'
          casos+='|TestLaCabeceraNoRecortaHoyConControlesDe44|TestElPieDeEventoCabeEnElTelefono|TestElFormularioMovilDejaVerLasAccionesSinTeclado|TestLaListaDeBloqueadosCabeEnElTelefonoYAnunciaElNombre|TestElHubMovilConservaLaPaletaDeLaWeb'
          casos+='|TestLasTarjetasMovilesPintanPapelBajoTodoSuContenido'
          casos+='|TestLaFuenteEmojiCubreTodoElCatalogoConImagenesDeColor|TestLasCeldasEmojiPintanColorYNoElGlifoAusente|TestElSelectorEmojiNoAbreElTecladoConElDedo|TestElSelectorEmojiConPocaAlturaTieneUnSoloDesplazador|TestElSelectorEmojiMovilSeAjustaAlMenu|TestElPopoverLargoCabeYPermiteAlcanzarSuUltimaAccion|TestElMenuPuedeEntregarSuAltoVisibleAlContenido'
          casos+='|TestElCompositorConFormatoMantieneEnviarVisible|TestElCanalEntreDosLateralesReservaElCompositor|TestLaTiraRevelaIconosYConservaSusAvisosDeFoco'
          casos+='|TestLosAjustesDeNotesCabenEnMovilYAlRedimensionar|TestElRecordatorioDeNotesNoRecortaCamposNiAcciones|TestLasDisposicionesDeNotesSiguenLosCortesDeLaWeb|TestLaRejillaMideElTextoAlAnchoDeCadaColumna|TestLaEleccionEnvueltaMideElAnchoAsignadoAlRedimensionar|TestElConmutadorEnvueltoMideElAnchoAsignadoAlRedimensionar'
          casos+='|TestElZoomInvalidaElLienzoSoloCuandoCambia|TestElZoomMovilRedibujaElFolioSinRedimensionar|TestElParaMovilNoPintaEncimaDeCcCco'
          casos+='|TestLaReaccionUnicodeUsaLaFuenteEmojiAlMedirYPintar'
          casos+='|TestLaPilaReservaLaBarraDeLoteAlAnchoActual'
          casos+='|TestCrearAlbumCabeEnMovil'
          casos+='|TestLaCabeceraDelGraficoNoSeSolapaEnMovil|TestLosDatosDelGraficoSeEditan'
          casos+='|TestElHubClaroMideElFondoRetina|TestElFondoSolidoNoGastaUnaTexturaDelAltoDeLaPagina'
          casos+='|TestLosPanelesTraslucidosTapanElContenidoDeDebajo'
          casos+='|TestElContenidoDeCastDejaVerElPapelDeMarco|TestLasCabecerasPublicasDeMarcoCabenEnEstrecho'
          GOMAXPROCS=2 go test -p=2 ./ui ./calendario ./apps/rooms ./apps/hub ./apps/notes ./apps/mail ./apps/photos ./apps/cast ./diapos ./editor ./editor/docus -run "^($casos)$" -count=1 -v
      - name: Regenerar las capturas de ficha
        if: inputs.captura_fichas
        working-directory: apps/fyne
        env:
          FICHAS_DIR: ${{ runner.temp }}/cromo-marco
          FICHAS_APPS: ${{ inputs.apps_fichas }}
          FICHAS_CLASE: ${{ inputs.clase_fichas }}
        run: |
          set -euo pipefail
          if [ "$FICHAS_APPS" = todas ]; then
            FICHAS_APPS="$(bash scripts/empaquetar.sh publicables android | sed 's/^sytue-//; s/-android\.aab$//' | tr '\n' ' ')"
          fi
          [[ "$FICHAS_APPS" =~ ^[a-z\ ]+$ ]] || { echo '::error::Lista de apps no válida'; exit 1; }
          case "$FICHAS_CLASE" in todas | iphone | ipad | mac | android) ;; *) echo '::error::Clase de ficha no válida'; exit 1 ;; esac
          while read -r clase medida; do
            [ "$FICHAS_CLASE" = todas ] || [ "$FICHAS_CLASE" = "$clase" ] || continue
            for app in $FICHAS_APPS; do
              case "$app" in
                calendar) paquete=./calendario ;;
                contacts) paquete=./contactos ;;
                docus) paquete=./editor/docus ;;
                calcus | diapos) paquete="./$app" ;;
                *) paquete="./apps/$app" ;;
              esac
              [ -f "cmd/$app/FyneApp.toml" ] && [ -d "$paquete" ] || { echo "::error::App desconocida: $app"; exit 1; }
              dir="$FICHAS_DIR/fichas-brutas/$clase/$app"
              mkdir -p "$dir"
              SYTUE_CAPTURAS_PLAY="$dir" SYTUE_CAPTURAS_MEDIDA="$medida" GOMAXPROCS=2 \
                go test "$paquete" -run '^TestRecorridoConSesion$' -count=1 -timeout=15m -v
              echo "── Capturas disponibles: $clase/$app ($medida) ──"
              find "$dir" -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort
            done
          done <<'MEDIDAS'
          iphone 393x852@3
          ipad 1024x1366@2
          mac 1440x900@2
          android 360x640@3
          MEDIDAS
          find "$FICHAS_DIR/fichas-brutas" -type f -name '*.png' -printf '%P\n' | sort > "$FICHAS_DIR/fichas-indice.txt"
          faltan=0
          for dir in "$FICHAS_DIR/fichas-brutas"/*/*; do
            app="${dir##*/}"
            padre="${dir%/*}"
            clase="${padre##*/}"
            # Cada tienda conserva su selección en su guion; el CI la importa.
            # Capturar todo primero permite revisar las otras apps si cambia un índice.
            if [ "$clase" = android ]; then
              lista="$(bash play/graficos.sh --seleccion "$app")"
            else
              lista="$(bash appstore/capturas.sh --seleccion "$clase" "$app")"
            fi
            if [ -z "$lista" ]; then
              echo "::error::Sin selección para $clase/$app"
              faltan=1
              continue
            fi
            destino="$FICHAS_DIR/fichas/$clase/$app"
            mkdir -p "$destino"
            i=0
            for n in $lista; do
              i=$((i + 1))
              origen="$(find "$dir" -maxdepth 1 -name "$n-*.png" -print -quit)"
              if [ -z "$origen" ]; then
                echo "::error::Falta $clase/$app/$n-*.png; revisar selección"
                faltan=1
                continue
              fi
              cp "$origen" "$destino/$clase-$i.png"
              printf 'SYTUE_FICHA_ELEGIDA %s/%s/%s-%s.png <- %s\n' "$clase" "$app" "$clase" "$i" "${origen##*/}"
            done
          done
          [ "$faltan" = 0 ]
      - name: Guardar las capturas
        id: subir_cromo
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cromo-marco-software-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cromo-marco/**/*.png
            ${{ runner.temp }}/cromo-marco/fichas-indice.txt
            !${{ runner.temp }}/cromo-marco/fichas-brutas/**
          if-no-files-found: error
          retention-days: 7
      - name: Recuperar las capturas por el log si falla el almacén
        if: always() && steps.subir_cromo.outcome == 'failure'
        env:
          CROMO_DIR: ${{ runner.temp }}/cromo-marco
          INCLUIR_CROMO: ${{ inputs.captura_cromo }}
        run: |
          # La cuenta del retrato es sintética. Nueve imágenes bastan para medir las
          # líneas incluso si GitHub rechaza el artefacto por su cuota de almacén.
          # Una captura que falta SIGUE siendo un fallo: no se oculta un pintor roto.
          emitir() {
            nombre="${1#"$CROMO_DIR/"}"
            printf 'SYTUE_CROMO_PNG_BEGIN %s\n' "$nombre"
            base64 -w 120 "$1"
            printf 'SYTUE_CROMO_PNG_END %s\n' "$nombre"
          }
          if [ "$INCLUIR_CROMO" = true ]; then
            for modo in claro traslucido oscuro; do
              for medida in 390-x1.25 390-x2 1280-x1.25; do
                nombre="cromo-$modo-$medida.png"
                fichero="$CROMO_DIR/$nombre"
                [ -s "$fichero" ] || { echo "::error::Falta la captura $nombre"; exit 1; }
                emitir "$fichero"
              done
            done
          fi
          # Los bancos móviles también usan datos sintéticos. Sus capturas permiten
          # comprobar modales y Calendar/Hub aunque el almacén siga sin cuota.
          # Del recorrido se guarda su índice y solo los PNG elegidos para la ficha.
          # Los descartados no van al artefacto ni desbordan el log de recuperación.
          find "$CROMO_DIR" -mindepth 2 -type f -name '*.png' ! -path "$CROMO_DIR/fichas-brutas/*" -print0 |
            while IFS= read -r -d '' fichero; do emitir "$fichero"; done
