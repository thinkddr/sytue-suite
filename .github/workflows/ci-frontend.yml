# SPDX-License-Identifier: Apache-2.0
name: ci-frontend-sytue-git

# El auditor de desbordamiento de www vive en test/e2e y NO estaba aquí: tocar el
# propio detector no volvía a ejecutar la puerta que lo usa. Se listan los dos
# ficheros que consume el job, no `test/e2e/**`: ahí viven cincuenta sondas
# sueltas que no tienen por qué levantar el CI del frontend entero.
# Lo mismo vale para el job `accesibilidad-office`: lo que lanza son tres ficheros de
# test/e2e (`correr-accesibilidad.sh`, `cinta.mjs`, `accesibilidad-office.mjs`) y los
# bancos de pruebas de apps/docus (`pages/dev/`), no el resto de sondas.
# NO SE EJECUTA AL EMPUJAR NI AL FUSIONAR EN `main`, y es deliberado: en PR y al
# publicar una release. Lo que llega a `main` ya pasó por su pull request, así
# que repetir la misma comprobación sobre el commit de fusión gasta runner —el de
# git.gay es compartido y hace cola— sin decir nada nuevo. La red de seguridad
# local sigue siendo el hook de pre-push (.githooks/pre-push), que corre estos
# mismos gates antes de dejar empujar.
on:
  # SIN `pull_request`, A PROPOSITO (2026-09-12). En fase piloto se abren
  # demasiadas y el runner es UNO y va en serie: se midio una cola de 412 jobs
  # —unas 20 horas—, y el efecto real no fue esperar, fue que los gates NO
  # LLEGABAN A CORRER y las PRs se fusionaban sin ellos. Asi salio a produccion
  # una migracion que no aplicaba, y Sytue ID quedo tres releases sin arrancar.
  #
  # El gate vive ahora donde pasa algo irreversible: `imagenes-produccion` mira
  # el estado COMBINADO del commit y se niega a publicar si no esta en verde.
  # Lo que se pierde es aviso temprano; lo que se gana es un gate que de verdad
  # corre. Antes de fusionar, el hook de pre-push ya valida en local.
  # Y al publicar una release: es la última oportunidad de ver un fallo antes
  # de que la versión salga con él.
  release:
    types:
      - published

  # A MANO, y hace falta más aquí que en ningún otro workflow. Esta rama recibe
  # varios pushes por hora, y `cancel-in-progress` descarta la ejecución anterior:
  # una tanda de veinte minutos --build, typecheck, lint, test, build:all y
  # lighthouse-- rara vez llega al final antes de que otro commit la mate. El
  # resultado medido: dos ejecuciones seguidas canceladas sobre el mismo commit y
  # ninguna forma de validar un cambio del frontend salvo esperar a que la rama se
  # quede quieta.
  #
  # Un `workflow_dispatch` entra en su PROPIO grupo de concurrencia --el evento
  # forma parte del nombre-- así que ningún push lo cancela. Es la misma salida que
  # ci-integration ya tenía por el mismo motivo.
  workflow_dispatch:

# Lo que puede hacer GITHUB_TOKEN en este flujo, y nada más (GitHub lo
# aplica; en Forgejo este campo se ignoraba y mandaba el token de cada paso).
permissions:
  contents: read
  issues: write

# `bash` EXPLÍCITO. Dentro de un `container:` GitHub ejecuta los `run:` con
# `sh -e` y no con bash: `set -o pipefail`, `[[`, los arrays y `<<<` mueren
# con «Illegal option» (cancelar-al-cerrar, 2026-09-27). Con `shell: bash`
# es `bash --noprofile --norc -eo pipefail`, que es lo que corría en la forja.
defaults:
  run:
    shell: bash

# Un push nuevo cancela el anterior de la misma rama: igual que en GitHub, y
# sin esto un runner propio acumula cola en vez de descartar trabajo muerto.
# El grupo se construye con la RAMA DE ORIGEN, no con `github.ref`.
#
# Esto se escribió cuando el workflow disparaba TAMBIÉN en `push`, y entonces
# `github.ref` valía distinto en cada caso —`refs/heads/sytue-native` para el
# push y `refs/pull/38/head` para la PR—: dos grupos distintos, o sea DOS COPIAS
# de todo corriendo a la vez sobre dos runners, sin que ninguna cancelara a la
# otra. Ya no hay push, pero el grupo sigue construyéndose así porque el mismo
# razonamiento vale para los otros eventos que quedan (release, dispatch).
#
# `github.head_ref` está vacío fuera de una PR, así que en un push cae a
# `github.ref_name` —que ya es el nombre pelado de la rama—. Push y PR de la
# misma rama comparten grupo y el nuevo cancela al viejo.
concurrency:
  # `github.sha` y no `github.ref_name` fuera de una PR: con el nombre de la rama,
  # todos los push a `main` caen en el mismo grupo y `cancel-in-progress: true`
  # mata el gate anterior en cada fusión. Medido el 2026-08-17: ni un `success`
  # en los ultimos 100 runs de este workflow. En dias de varias fusiones seguidas
  # `main` no llega a validarse, y su verde significa «no dio tiempo».
  #
  # En una pull request `github.head_ref` SI tiene valor, asi que ahi se sigue
  # agrupando por rama y un push nuevo cancela al anterior, que es lo correcto.
  # Por RAMA y no por commit fuera de una pull request, al contrario que en
  # `security.yml`, y la diferencia es deliberada.
  #
  # Con historia lineal, que este gate pase sobre el último commit de `main`
  # valida también los anteriores: compila y pasa los tests. Agrupar por commit
  # hacía que ninguna fusión cancelara a la anterior y, en una ráfaga de
  # fusiones, se acumulaban: medido el 2026-08-17, DOCE ejecuciones de `main` a
  # la vez con la cola a 23 y 13 plazas. Eso no valida más, solo espera más.
  #
  # `security` sí va por commit porque su pregunta es distinta: una dependencia
  # vulnerable introducida y quitada en dos fusiones seguidas no aparece si solo
  # se mira la última.
  # UN DESPACHO A MANO NO CANCELA A OTRO (2026-09-27). El grupo lleva el `run_id`
  # solo cuando el evento es `workflow_dispatch`: en GitHub dos despachos de la
  # misma rama caían en el mismo grupo y el segundo cancelaba al primero, así
  # que lanzar el CI sobre dos commits seguidos dejaba el primero sin veredicto
  # (ci-go del 44d9b1bd, cancelado al lanzar el del 209f58f6). En push y en PR
  # el sufijo vale vacío y todo sigue como antes.
  group: ci-frontend-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  # El EVENTO va en el grupo, así que push y pull request de la misma rama NUNCA
  # comparten cola.
  #
  # Compartirlo ahorraba un runner —una copia en vez de dos— y a cambio hacía
  # `main` INFUSIONABLE: el run del PR llega después y cancelaba al del push, y un
  # run cancelado deja sus jobs con estado `failure` pegados al commit. La
  # protección de `main` mira el estado COMBINADO, no solo los checks del PR, así
  # que la fusión se rechazaba con «Not all required status checks successful»
  # teniendo todo en verde. El PR no se podía fusionar porque existía el PR.
  #
  # Se intentó antes con `cancel-in-progress: ${{ github.event_name == 'push' }}`
  # y NO sirve: Forgejo no evalúa esa expresión como booleano y la cadena «false»
  # cuenta como verdadera, así que seguía cancelando. Por eso la separación va en
  # el nombre del grupo, que es texto y no depende de que nadie lo interprete.
  #
  # El coste que esto tenía —dos copias mientras hubiera un PR abierto desde esta
  # rama— ya no se paga (2026-08-15): cada job lleva
  #
  #     if: github.event_name != 'pull_request' || github.head_ref != 'sytue-native'
  #
  # así que la PR de sincronía no repite un trabajo hecho sobre EL MISMO commit.
  # Las PR de cualquier otra rama sí corren enteras, que es donde el push no ha
  # validado nada.
  #
  # Lo que hay que vigilar: la protección de `main` exige cuatro checks de
  # `security`, y ahora los produce el PUSH a la rama, no la PR. Con historia
  # lineal el commit es el mismo y el estado combinado los tiene; si alguna vez la
  # fusión se rechaza con «Not all required status checks successful» teniendo todo
  # en verde, ES ESTO: basta con devolverle el `if` a los cuatro jobs de security.
  cancel-in-progress: true

env:
  # El checkout lo escribe el runner (uid 1001) y los pasos corren como root dentro
  # del `container:`: git ve un propietario ajeno, se niega («dubious ownership»)
  # y `go build` muere con «error obtaining VCS status». La forja montaba el
  # workspace con el mismo usuario y no lo notaba.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
  FE_DIR: apps/frontend
  ASTRO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  # quality y lighthouse se ejecutan en paralelo en el mismo runner: con
  # una caché de bun compartida, la extracción de tarballs se pisa.
  #
  # El nombre NO lleva el id de la ejecución: `actions/cache` guarda las rutas
  # tal cual y las restaura en el mismo sitio, así que un directorio distinto
  # en cada ejecución no se restauraría nunca. Contra el resto de riesgo va el
  # reintento con caché limpia de los pasos de instalación, que es lo que
  # faltaba en `lighthouse`.
  BUN_INSTALL_CACHE_DIR: /tmp/bun-cache-${{ github.job }}

jobs:
  quality:
    # La rama `sytue-native` queda fuera del CI de pull request: es la de la
    # migración y arrastra un árbol que no compila con esta cadena.
    if: (github.event_name != 'pull_request' || github.head_ref != 'sytue-native')
    runs-on: sytue-arm64
    # Los runners propios del frontal (.github/RUNNERS.md): cada job en un
    # contenedor del Docker del CI, con el proxy filtrado como socket de Docker
    # y la caché de Go del host (con varios jobs, ancla `&ci` y `*ci`).
    container: &ci
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      env:
        DOCKER_HOST: unix:///run/sytue-ci/docker.sock
      volumes:
        - /srv/ci/run/proxy.sock:/run/sytue-ci/docker.sock
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    # El run 38560241750 pasó todos los gates en 24m53s, pero el cierre del
    # contenedor agotó los 25m y canceló también los jobs dependientes.
    # Mantener los builds secuenciales con margen para toolchain y limpieza.
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.FE_DIR }}
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # La imagen del runner compartido de git.gay no trae Go ni Bun.
      # Se instalan con la MISMA versión y sha256 que la imagen propia.
      - name: Preparar toolchain
        run: |
          exec > >(tee -a /tmp/quality.log) 2>&1
          $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh bun

      - name: Verificar Bun
        run: |
          exec > >(tee -a /tmp/quality.log) 2>&1
          test "$(bun --version)" = "$(node -p 'require("./package.json").packageManager.replace(/^bun@/, "")')"
      # Sobre `$BUN_INSTALL_CACHE_DIR`, no sobre `~/.bun/install/cache`: la
      # variable está puesta arriba, así que la caché por defecto no la tocaba
      # nadie. Se restauraba y se guardaba un directorio vacío mientras bun
      # bajaba el árbol entero en cada ejecución.
      - name: Restaurar caché de Bun
        id: cache-bun
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun2-${{ hashFiles('apps/frontend/bun.lock') }}
          restore-keys: bun2-

      # Con reintento y caché limpia, porque una caché envenenada no se cura
      # sola. El 2026-08-10 una entrada guardó un tarball de TypeScript a
      # medias y ci-frontend estuvo en rojo cuatro ejecuciones seguidas con el
      # mismo error: la clave sale del hash del lockfile, así que no cambia
      # hasta que alguien toca una dependencia, y el guardado no sobrescribe
      # una clave que ya existe. Sin esta red, un fallo de red de un segundo
      # bloquea el CI hasta que un humano lo investiga.
      # El reintento borraba `~/.bun/install/cache`, que NO es la caché que este
      # job usa: `BUN_INSTALL_CACHE_DIR` está fijada más arriba, así que la
      # entrada rota sobrevivía al «desde cero» y el segundo intento repetía el
      # mismo error. El script mira la variable y borra la de verdad.
      - name: Instalar dependencias
        working-directory: .
        run: |
          exec > >(tee -a /tmp/quality.log) 2>&1
          bash "$GITHUB_WORKSPACE/scripts/bun-install-reintento.sh" ${{ env.FE_DIR }}

      # `success()` y NO `always()`: guardar la caché de un job que ha fallado
      # es lo que la envenena. La instalación a medias se subía bajo la clave
      # buena y a partir de ahí todas las ejecuciones restauraban lo mismo.
      - name: Guardar caché de Bun
        if: success() && steps.cache-bun.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: bun2-${{ hashFiles('apps/frontend/bun.lock') }}
      # El formato no necesita compilar paquetes: fallar aquí evita gastar toda
      # la tanda de tipos y tests para descubrir al final un cambio de espacios.
      - name: Comprobar formato antes de compilar
        run: |
          exec > >(tee -a /tmp/quality.log) 2>&1
          bun run format:check

      # NO SE INSTALA IMAGEMAGICK AQUÍ, y estuvo puesto un día. Merece explicación
      # para que nadie lo vuelva a añadir pensando que arregla algo.
      #
      # `lint:marca` se autoexcusa cuando no encuentra `magick`, así que el gate
      # llevaba tiempo en verde sin mirar un icono. Instalarlo parecía la
      # corrección obvia. No lo es, y el log del propio job lo dice en una línea
      # (incidencia #424, la primera que publicó el informe del gate):
      #
      #     Setting up imagemagick (8:6.9.12.98+dfsg1-5.2build2) ...
      #     /var/run/act/workflow/6.sh: line 5: magick: command not found
      #
      # EL RUNNER ES UBUNTU y su paquete `imagemagick` es ImageMagick **6**, que no
      # instala el binario `magick` —ese llegó con la 7—: deja `convert-im6`,
      # `identify-im6` y compañía. El paso terminaba comprobando `magick -version`
      # y moría ahí, tumbando `quality` entero.
      #
      # Y aunque no muriera no serviría de nada: `gen-marks.sh` y `lint-marca.sh`
      # invocan `magick`, así que con IM6 el gate volvería a autoexcusarse igual.
      # Para que corriera de verdad habría que traer un binario de IM7 aparte, y
      # aun así lo versionado no cuadraría: depende del rasterizador con el que se
      # generó —IM7 sin delegado rsvg, el del piloto— y cualquier otro produce
      # bytes, y a veces imágenes, distintos. Comprobado en un contenedor con el
      # IM7 de Debian, que sí trae `magick` pero delega el SVG a `rsvg-convert`:
      # sin ese binario `gen-marks.sh` falla, y con él dibuja trazos que el
      # rasterizador original no dibuja.
      #
      # Donde el gate corre y sirve es en el piloto y en el hook de pre-push, que
      # es la red que de verdad se usa antes de fusionar.

      - run: |
          exec > >(tee -a /tmp/quality.log) 2>&1
          bun run build
      # typecheck y build:all van EN SECUENCIA (`--sequential` en package.json), y
      # no es lentitud gratuita. En paralelo lanzan todas las apps a la vez: medido
      # en el piloto el 2026-09-15, typecheck llega a 9,4 GB con 51 procesos y
      # build:all a 9,7 GB. El runner compartido no los tiene: el run 2055 murió a
      # mitad de typecheck con «failed to inspect exec … connection reset», que es
      # como se ve aquí que el contenedor se quedó sin memoria, sin un solo error de
      # código. En secuencia los dos se quedan en 2,1 GB y tardan 102 s y 61 s en el
      # piloto (46 y 29 en paralelo). Cada idioma y cada app nuevos suben ese pico.
      - run: |
          exec > >(tee -a /tmp/quality.log) 2>&1
          bun run typecheck
      - run: |
          exec > >(tee -a /tmp/quality.log) 2>&1
          bun run lint
        # lint:marca no puede correr aquí (ver el comentario de ImageMagick de arriba) y,
        # sin esto, en el CI es rojo: se salta A LA VISTA, con un aviso en el log.
        env:
          SYTUE_MARCA_NO_SE_COMPRUEBA: 'el runner no tiene el ImageMagick 7 con el que se generó la marca; corre en el piloto y en el pre-push'
      - run: |
          exec > >(tee -a /tmp/quality.log) 2>&1
          bun run test
      - name: Catálogo Office común web y Fyne
        run: bash ../../scripts/sync-office-catalog.sh --check
      - run: |
          exec > >(tee -a /tmp/quality.log) 2>&1
          bun run build:all

      # Que nadie lea del entorno CONGELADO del build lo que solo vive en el del
      # contenedor. No lo cazan ni typecheck ni lint: compila, y el `??` de
      # respaldo suele acertar en producción por casualidad, así que el fallo solo
      # se ve en staging o en el efímero —apuntando a prod—. Ver la cabecera del
      # script: costó una pantalla que enlazaba a sí misma en bucle.
      # Ruta ABSOLUTA: este job corre con `working-directory: $FE_DIR`, así que
      # `scripts/…` se resolvía contra `apps/frontend/` y el paso moría con un
      # 127 —«No such file or directory»— tumbando el CI entero del frontend con
      # todo lo demás en verde. El script vive en la raíz y ya se recoloca solo
      # (`cd "$(dirname "$0")/.."`), así que solo hay que nombrarlo entero, igual
      # que los pasos de caché de más arriba.
      - run: |
          exec > >(tee -a /tmp/quality.log) 2>&1
          bash "$GITHUB_WORKSPACE/scripts/check-runtime-env.sh"

      # Nació en git.gay, donde el log de una ejecución no se leía desde fuera
      # (API 404, web 403). En GitHub el log sí se lee, y se conserva porque una
      # incidencia con la cola del fallo sigue siendo lo que se abre primero.
      - name: Informe si algo falla
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # EL TÍTULO SE LEE DE UN VISTAZO. Antes era «fallo quality <sha de 40
        # caracteres>»: en la lista de incidencias no se distinguía una de otra
        # sin abrirlas, y no decía ni en qué rama había pasado.
        run: |
          $GITHUB_WORKSPACE/.github/actions/informe/accion.sh /tmp/quality.log \
            "fallo quality · ${GITHUB_REF_NAME} · ${GITHUB_SHA:0:7}"

  # Benchmark del motor de Calcus (10.000 y 100.000 celdas). NO BLOQUEANTE: mide, no
  # puede poner rojo el CI (`continue-on-error`), y nada lo espera (`needs` de nadie).
  # Los tiempos dependen del runner, así que se guardan para COMPARAR entre releases: el
  # JSON queda como artefacto y la tabla en el resumen de la ejecución. Lo que sí es un test
  # (y falla) es la corrección de los escenarios: `bench/calcus.test.ts`, dentro de `quality`.
  # Lo que se compara es `cpuMs` y no `ms`: el runner es compartido y el reloj de pared mide
  # también a los vecinos (docs/architecture.md#calcus-rendimiento).
  bench-calcus:
    runs-on: sytue-arm64
    container: *ci
    if: github.event_name != 'pull_request' || github.head_ref != 'sytue-native'
    continue-on-error: true
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.FE_DIR }}/packages/formula
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Preparar toolchain
        working-directory: .
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh bun
      - name: Instalar dependencias
        working-directory: .
        run: bash "$GITHUB_WORKSPACE/scripts/bun-install-reintento.sh" ${{ env.FE_DIR }}
      - name: Medir
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          bun bench/calcus.ts --repeticiones 7 --json | tee "$RUNNER_TEMP/bench/calcus-${GITHUB_SHA:0:12}.json"
          bun -e '
            const r = JSON.parse(await Bun.file(process.argv[1]).text());
            const f = (x) => x.toFixed(1);
            let md = `### Benchmark de Calcus\n\n${r.runtime} · ${r.maquina} · carga ${f(r.cargaMedia)} · ${r.fecha}\n\n`;
            md += "| escenario | celdas | cpu ms | pared ms | evaluadas |\n|---|---:|---:|---:|---:|\n";
            for (const m of r.medidas) md += `| ${m.escenario} | ${m.celdas} | ${f(m.cpuMs)} | ${f(m.ms)} | ${m.evaluadas} |\n`;
            await Bun.write(Bun.env.GITHUB_STEP_SUMMARY, md);
          ' "$RUNNER_TEMP/bench/calcus-${GITHUB_SHA:0:12}.json"
      # No tumba el job: la medida ya va en el resumen, y con el almacén de artefactos
      # lleno (2026-10-06) `ci-frontend` saldría en rojo por un fichero de cortesía.
      - name: Guardar el resultado
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-calcus-${{ github.sha }}
          path: ${{ runner.temp }}/bench/calcus-*.json
          retention-days: 90

  lighthouse:
    runs-on: sytue-arm64
    container: *ci
    if: github.event_name != 'pull_request' || github.head_ref != 'sytue-native'
    timeout-minutes: 25
    needs: quality
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      # Con reintento, por lo mismo que `quality`: la descarga de un tarball
      # falla de vez en cuando y la caché guarda el trozo roto, así que el
      # segundo intento tiene que ir contra una caché vacía o repite el error.
      # Aquí faltaba, y es donde ha caído dos veces («Fail extracting tarball
      # for "lighthouse"»), que es además el paquete más grande del árbol.

      # La imagen del runner compartido de git.gay no trae Go ni Bun.
      # Se instalan con la MISMA versión y sha256 que la imagen propia.
      - name: Preparar toolchain
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh go bun

      - run: bash "$GITHUB_WORKSPACE/scripts/bun-install-reintento.sh" apps/frontend
      - working-directory: apps/frontend
        run: bun run --filter '@sytue/app-www' build

      # Desbordamiento móvil de www, sobre el dist que se acaba de construir.
      # Es la ÚNICA app con `output: 'static'`: las otras diez son `server` y
      # redirigen al IdP, así que su puerta es el barrido nocturno contra
      # producción (.github/workflows/mobile.yml). Pero www SÍ se puede auditar
      # antes de desplegar, y es donde estuvo la regresión de agosto de 2026 —23
      # rutas localizadas desbordando el documento entero— que nada paró: lhci
      # usa `preset: "desktop"` sobre cuatro URLs sin localizar, o sea que nadie
      # miraba www a 320 px. El detector es el del barrido nocturno, importado,
      # no una copia.
      - run: bash "$GITHUB_WORKSPACE/scripts/bun-install-reintento.sh" test/e2e
      - working-directory: test/e2e
        # `--with-deps` NO es adorno: instala el binario Y las bibliotecas del
        # sistema que necesita. La imagen del runner propio las traía; la genérica
        # de git.gay no, así que Chromium se instalaba bien y moría al arrancar con
        # «error while loading shared libraries: libglib-2.0.so.0» — que se lee
        # como un fallo de la sonda o de la página medida, y es un runner pelado
        # (lo dice la propia sonda-runner). Usa apt, y el runner corre como root.
        run: |
          ./node_modules/.bin/playwright install --with-deps chromium
          # Y SE ANOTA DÓNDE QUEDÓ, porque el paso de Lighthouse fijaba
          # `CHROME_PATH: /usr/bin/chromium`: esa ruta existe en la imagen propia
          # del runner y no en la compartida de git.gay, así que lhci moría con
          # «Chrome installation not found» después de haber construido www y
          # medido las dos sondas —veinte minutos para caer en el último paso—.
          # Se le pregunta a Playwright, que es quien acaba de instalarlo, en vez
          # de fijar otra ruta que también puede dejar de ser cierta.
          ruta="$(bun -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')"
          test -x "$ruta" || { echo "Playwright dice $ruta y ahí no hay un ejecutable" >&2; exit 1; }
          echo "CHROME_PATH=$ruta" >>"$GITHUB_ENV"
      - name: Desbordamiento móvil de www (320 y 390 px)
        working-directory: test/e2e
        run: bun run audit-www-estatico.mjs

      # Las once plantillas de Pages se publican mediante el renderizador puro;
      # medir una maqueta no protege la salida que verá una persona. El script
      # toma sus JSON reales, los materializa con `publicar` y Lighthouse abre
      # cada portada resultante. La aceptación contra el piloto (DNS/TLS y
      # dominio propio) sigue siendo una prueba distinta de integración.
      - name: Lighthouse de las plantillas publicadas de Pages
        working-directory: apps/frontend
        run: bun run --filter '@sytue/pages-render' fixtures:lighthouse

      # El motor de Sytue PDF traduce PDF a SVG y delega el dibujo en el
      # navegador (ADR-0033), así que la única forma de saber que una página SE
      # PINTA es abrirla en uno. Los tests en Go comprueban la CADENA del SVG, y
      # un SVG correcto carácter a carácter puede salir en blanco: un `clipPath`
      # que recorta todo, una fuente que no carga, un `viewBox` mal puesto.
      #
      # Corre AQUÍ y no en el portátil porque las pruebas de navegador van en la
      # nube, y estos runners están en Scaleway.
      #
      # Las muestras las escribe un test de Go: el motor vive en `internal/` y no
      # se puede importar desde fuera de `services/docs`.
      #
      # El directorio lleva el id de la ejecución y va en /tmp, no en el
      # workspace: los runners COMPARTEN disco —varios jobs a la vez en el mismo
      # sistema de ficheros— y un nombre fijo los haría pisarse entre sí.
      - name: Muestras del render de Sytue PDF
        run: SYTUE_PDF_MUESTRAS="/tmp/pdf-muestras-${{ github.run_id }}" go test ./services/docs/internal/domain -run TestMuestrasParaNavegador
        working-directory: .
      - name: El render de Sytue PDF se pinta en un navegador
        working-directory: test/e2e
        run: bun run audit-pdf-render.mjs "/tmp/pdf-muestras-${{ github.run_id }}"
      # Desde el LOCKFILE, no con `bunx @lhci/cli@0.15.1`: `bun install` de dos
      # pasos más arriba ya lo dejó instalado y con su integridad comprobada, y
      # `bunx` lo volvía a bajar del registro en cada ejecución. Eso es una
      # descarga sin verificar dentro del CI, y además puede no coincidir con la
      # versión que fija el catálogo si alguien republica el tag.
      #
      # El job corre como root dentro del contenedor y Chrome se niega a arrancar
      # así sin --no-sandbox. Los flags van aquí y no en .lighthouserc.json porque
      # ese fichero también lo usan los desarrolladores en su portátil, donde el
      # navegador no corre como root y desactivar el sandbox no tiene excusa.
      # CHROME_PATH lo pone el paso que instala Chromium, arriba: sale de
      # Playwright y no de una ruta escrita a mano.
      #
      # `--disable-dev-shm-usage` NO ES REDUNDANTE. Un contenedor monta /dev/shm
      # con 64 MB por defecto y Chrome guarda ahí sus buffers de render; con las
      # doce pasadas que pide esta configuración —cuatro URL × tres runs— la
      # segunda ya no cabe. El síntoma es exactamente el que dio: «Run #1...done.
      # Run #2...failed!» y «Browser tab has unexpectedly crashed», que se lee
      # como una página que rompe el navegador y no como falta de sitio. Con este
      # flag los buffers van a /tmp, que tiene el disco entero.
      - run: apps/frontend/node_modules/.bin/lhci autorun --config=.lighthouserc.json
          --collect.settings.chromeFlags="--no-sandbox --disable-dev-shm-usage"
      - run: apps/frontend/node_modules/.bin/lhci autorun --config=.lighthouserc.pages.json
          --collect.settings.chromeFlags="--no-sandbox --disable-dev-shm-usage"

  # La cinta y el editor de Office (Docus, Calcus, Diapos) y CertiPDF, medidos con un
  # navegador: `cinta.mjs` (maquetación, «Más», popovers, F6 y flechas a 1280/390/320 px, en
  # tres tipos de documento y dos idiomas) y `accesibilidad-office.mjs` (axe-core WCAG 2.2 AA,
  # teclado, zoom al 200 %, objetivos táctiles de 44 px y lector de pantalla, en claro y
  # oscuro). Hasta ahora `cinta.mjs` se lanzaba a mano y nada lo vigilaba: una regresión de
  # la cinta en móvil solo la veía quien abriera el editor en un teléfono.
  #
  # Sirve los bancos de pruebas `/dev/cinta`, `/dev/editor` y `/dev/pdf` con `astro dev`
  # (en producción son un 404) y contesta a la API con `page.route`: no necesita sesión,
  # servicio ni datos. El flujo corre al publicar una release, por `workflow_dispatch` y
  # nunca en push ni en pull request, como el resto de este fichero.
  accesibilidad-office:
    runs-on: sytue-arm64
    container: *ci
    if: github.event_name != 'pull_request' || github.head_ref != 'sytue-native'
    # Más que los demás: son cuatro productos × seis combinaciones de ancho y esquema, con axe
    # en cada pestaña de la cinta, y los navegadores comparten núcleos.
    timeout-minutes: 60
    needs: quality
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Preparar toolchain
        # Las muestras SVG/PDF de este mismo job también se generan con Go.
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh go bun
      - run: bash "$GITHUB_WORKSPACE/scripts/bun-install-reintento.sh" apps/frontend
      - run: bash "$GITHUB_WORKSPACE/scripts/bun-install-reintento.sh" test/e2e
      # `--with-deps`: ver el comentario del job `lighthouse` (el runner genérico no trae
      # las bibliotecas del sistema que Chromium necesita para arrancar).
      - name: Instalar Chromium
        working-directory: test/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Menús, opciones nativas y ayudas en las tres apariencias
        env:
          MENUS_OUT: /tmp/menus-traslucidos-${{ github.run_id }}
        run: |
          apps/frontend/node_modules/.bin/tailwindcss -i apps/frontend/packages/ui/src/styles.css -o /tmp/menus-traslucidos.css
          bun run test/e2e/compilar-menus-traslucidos.mjs
          cd test/e2e
          bun run menus-traslucidos.mjs
      - name: Capturas de contraste de menús
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: menus-traslucidos-${{ github.run_id }}
          path: /tmp/menus-traslucidos-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
      - name: Cinta, accesibilidad, teclado, zoom y táctil
        working-directory: test/e2e
        env:
          ACC_OUT: /tmp/accesibilidad-${{ github.run_id }}
          CINTA_OUT: /tmp/cinta-${{ github.run_id }}
        run: bash correr-accesibilidad.sh
      # Sytue Bases: sus bancos `/bases/dev/*` (rejilla, tablero, formulario público y las
      # pantallas enteras con el marco) en su propio servidor de desarrollo.
      - name: Accesibilidad de Sytue Bases
        if: always()
        working-directory: test/e2e
        env:
          ACC_OUT: /tmp/accesibilidad-bases-${{ github.run_id }}
        run: bash correr-accesibilidad-bases.sh

  # Real Drive, Rooms and Admin wizards, mocked APIs: consent, recovery, keyboard
  # and mobile layout. Independent of quality to expose browser failures early.
  almacenamiento-externo:
    runs-on: sytue-arm64
    container: *ci
    timeout-minutes: 30
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Preparar toolchain
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh bun
      - run: bash "$GITHUB_WORKSPACE/scripts/bun-install-reintento.sh" apps/frontend
      - run: bash "$GITHUB_WORKSPACE/scripts/bun-install-reintento.sh" test/e2e
      - name: Instalar Chromium
        working-directory: test/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Almacenamiento externo, teclado y móvil
        working-directory: test/e2e
        env:
          STORAGE_OUT: /tmp/almacenamiento-externo
        run: bash correr-almacenamiento-externo.sh
      - name: Conexiones de Rooms, consentimiento, canales y móvil
        if: ${{ !cancelled() }}
        working-directory: test/e2e
        env:
          ROOMS_OUT: /tmp/rooms-conexiones
        run: bash correr-rooms-conexiones.sh
      - name: Conectar aplicaciones, consentimiento y URL rechazada
        if: ${{ !cancelled() }}
        working-directory: test/e2e
        env:
          CONSOLE_OUT: /tmp/conectar-app
        run: bash correr-conectar-app.sh
      - name: Capturas e informe del wizard
        id: upload-storage-wizard
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: almacenamiento-externo-${{ github.run_id }}
          path: /tmp/almacenamiento-externo
          if-no-files-found: warn
          retention-days: 7
      - name: Capturas e informe de conexiones de Rooms
        id: upload-rooms-wizard
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rooms-conexiones-${{ github.run_id }}
          path: /tmp/rooms-conexiones
          if-no-files-found: warn
          retention-days: 7
      - name: Capturas e informe de conexión de aplicaciones
        id: upload-console-wizard
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conectar-app-${{ github.run_id }}
          path: /tmp/conectar-app
          if-no-files-found: warn
          retention-days: 7
      - name: Recuperar capturas de Drive en el log si falla el almacén
        if: ${{ always() && steps.upload-storage-wizard.outcome == 'failure' }}
        continue-on-error: true
        run: bash test/e2e/lib/emitir-capturas-log.sh almacenamiento-externo
      - name: Recuperar capturas de Rooms en el log si falla el almacén
        if: ${{ always() && steps.upload-rooms-wizard.outcome == 'failure' }}
        continue-on-error: true
        run: bash test/e2e/lib/emitir-capturas-log.sh rooms-conexiones
      - name: Recuperar capturas de Admin en el log si falla el almacén
        if: ${{ always() && steps.upload-console-wizard.outcome == 'failure' }}
        continue-on-error: true
        run: bash test/e2e/lib/emitir-capturas-log.sh conectar-app
