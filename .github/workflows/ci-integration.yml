# SPDX-License-Identifier: Apache-2.0
name: ci-integration-sytue-git

# NO SE EJECUTA AL EMPUJAR NI AL FUSIONAR EN `main`, y es deliberado: en PR y al
# publicar una release. Lo que llega a `main` ya pasó por su pull request, así
# que repetir la misma comprobación sobre el commit de fusión gasta runner —el de
# git.gay es compartido y hace cola— sin decir nada nuevo. La red de seguridad
# local sigue siendo el hook de pre-push (.githooks/pre-push), que corre estos
# mismos gates antes de dejar empujar.
on:
  # SIN `pull_request`, A PROPOSITO (2026-09-12). En fase piloto se abren
  # demasiadas y el runner es UNO y va en serie: se midio una cola de 412 jobs
  # —unas 20 horas—, y el efecto real no fue esperar, fue que los gates NO
  # LLEGABAN A CORRER y las PRs se fusionaban sin ellos. Asi salio a produccion
  # una migracion que no aplicaba, y Sytue ID quedo tres releases sin arrancar.
  #
  # El gate vive ahora donde pasa algo irreversible: `imagenes-produccion` mira
  # el estado COMBINADO del commit y se niega a publicar si no esta en verde.
  # Lo que se pierde es aviso temprano; lo que se gana es un gate que de verdad
  # corre. Antes de fusionar, el hook de pre-push ya valida en local.
  # Y al publicar una release: es la última oportunidad de ver un fallo antes
  # de que la versión salga con él.
  release:
    types:
      - published
  # A mano, sin tocar código. Estos tests dependen de cosas que no viven en el
  # repositorio —que el runner tenga credencial del registro, que el servicio de
  # PostgreSQL levante—, y cuando se arregla algo de eso hace falta poder
  # relanzarlos. Sin esto, la única forma era inventarse un commit en un fichero
  # .go para que el filtro de rutas dejara pasar el push.
  #
  # `paquetes` acota la tanda a lo que se está mirando. La suite entera son 5m36s
  # (medido en la ejecución 2192 del 2026-08-15) y hay un paquete que se lleva
  # 133 s él solo, `services/id/internal/http`: cuando se depura ALGO DE AHÍ, la
  # espera es toda de los demás.
  #
  # Y `verbose` existe por cómo informa `go test ./...`: la línea `ok` de cada
  # paquete se imprime al TERMINAR, así que mientras uno tarda —o se cuelga— el
  # log parece parado en el ANTERIOR y no dice en qué test está. Con `-v` sí.
  workflow_dispatch:
    inputs:
      paquetes:
        description: "Paquetes a probar (por defecto, todos)"
        type: string
        default: "./..."
      verbose:
        description: "Salida por test (-v): dice en cuál se queda"
        type: choice
        options:
          - "no"
          - "si"
        default: "no"

# Lo que puede hacer GITHUB_TOKEN en este flujo, y nada más (GitHub lo
# aplica; en Forgejo este campo se ignoraba y mandaba el token de cada paso).
permissions:
  contents: read

# `bash` EXPLÍCITO. Dentro de un `container:` GitHub ejecuta los `run:` con
# `sh -e` y no con bash: `set -o pipefail`, `[[`, los arrays y `<<<` mueren
# con «Illegal option» (cancelar-al-cerrar, 2026-09-27). Con `shell: bash`
# es `bash --noprofile --norc -eo pipefail`, que es lo que corría en la forja.
defaults:
  run:
    shell: bash

# Un push nuevo cancela el anterior de la misma rama: igual que en GitHub, y
# sin esto un runner propio acumula cola en vez de descartar trabajo muerto.
# El grupo se construye con la RAMA DE ORIGEN, no con `github.ref`.
#
# Esto se escribió cuando el workflow disparaba TAMBIÉN en `push`, y entonces
# `github.ref` valía distinto en cada caso —`refs/heads/sytue-native` para el
# push y `refs/pull/38/head` para la PR—: dos grupos distintos, o sea DOS COPIAS
# de todo corriendo a la vez sobre dos runners, sin que ninguna cancelara a la
# otra. Ya no hay push, pero el grupo sigue construyéndose así porque el mismo
# razonamiento vale para los otros eventos que quedan (release, dispatch).
#
# `github.head_ref` está vacío fuera de una PR, así que en un push cae a
# `github.ref_name` —que ya es el nombre pelado de la rama—. Push y PR de la
# misma rama comparten grupo y el nuevo cancela al viejo.
concurrency:
  # `github.sha` y no `github.ref_name` fuera de una PR: con el nombre de la rama,
  # todos los push a `main` caen en el mismo grupo y `cancel-in-progress: true`
  # mata el gate anterior en cada fusión. Medido el 2026-08-17: ni un `success`
  # en los ultimos 100 runs de este workflow. En dias de varias fusiones seguidas
  # `main` no llega a validarse, y su verde significa «no dio tiempo».
  #
  # En una pull request `github.head_ref` SI tiene valor, asi que ahi se sigue
  # agrupando por rama y un push nuevo cancela al anterior, que es lo correcto.
  # Por RAMA y no por commit fuera de una pull request, al contrario que en
  # `security.yml`, y la diferencia es deliberada.
  #
  # Con historia lineal, que este gate pase sobre el último commit de `main`
  # valida también los anteriores: compila y pasa los tests. Agrupar por commit
  # hacía que ninguna fusión cancelara a la anterior y, en una ráfaga de
  # fusiones, se acumulaban: medido el 2026-08-17, DOCE ejecuciones de `main` a
  # la vez con la cola a 23 y 13 plazas. Eso no valida más, solo espera más.
  #
  # `security` sí va por commit porque su pregunta es distinta: una dependencia
  # vulnerable introducida y quitada en dos fusiones seguidas no aparece si solo
  # se mira la última.
  # UN DESPACHO A MANO NO CANCELA A OTRO (2026-09-27). El grupo lleva el `run_id`
  # solo cuando el evento es `workflow_dispatch`: en GitHub dos despachos de la
  # misma rama caían en el mismo grupo y el segundo cancelaba al primero, así
  # que lanzar el CI sobre dos commits seguidos dejaba el primero sin veredicto
  # (ci-go del 44d9b1bd, cancelado al lanzar el del 209f58f6). En push y en PR
  # el sufijo vale vacío y todo sigue como antes.
  group: ci-integration-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  # El EVENTO va en el grupo, así que push y pull request de la misma rama NUNCA
  # comparten cola.
  #
  # Compartirlo ahorraba un runner —una copia en vez de dos— y a cambio hacía
  # `main` INFUSIONABLE: el run del PR llega después y cancelaba al del push, y un
  # run cancelado deja sus jobs con estado `failure` pegados al commit. La
  # protección de `main` mira el estado COMBINADO, no solo los checks del PR, así
  # que la fusión se rechazaba con «Not all required status checks successful»
  # teniendo todo en verde. El PR no se podía fusionar porque existía el PR.
  #
  # Se intentó antes con `cancel-in-progress: ${{ github.event_name == 'push' }}`
  # y NO sirve: Forgejo no evalúa esa expresión como booleano y la cadena «false»
  # cuenta como verdadera, así que seguía cancelando. Por eso la separación va en
  # el nombre del grupo, que es texto y no depende de que nadie lo interprete.
  #
  # El coste que esto tenía —dos copias mientras hubiera un PR abierto desde esta
  # rama— ya no se paga (2026-08-15): cada job lleva
  #
  #     if: github.event_name != 'pull_request' || github.head_ref != 'sytue-native'
  #
  # así que la PR de sincronía no repite un trabajo hecho sobre EL MISMO commit.
  # Las PR de cualquier otra rama sí corren enteras, que es donde el push no ha
  # validado nada.
  #
  # Lo que hay que vigilar: la protección de `main` exige cuatro checks de
  # `security`, y ahora los produce el PUSH a la rama, no la PR. Con historia
  # lineal el commit es el mismo y el estado combinado los tiene; si alguna vez la
  # fusión se rechaza con «Not all required status checks successful» teniendo todo
  # en verde, ES ESTO: basta con devolverle el `if` a los cuatro jobs de security.
  cancel-in-progress: true

# EL POSTGRES LO LEVANTA EL RUNNER, NO EL JOB.
#
# El harness de integración (platform/pkg/pgtest) arranca por defecto un
# contenedor con testcontainers, que es lo cómodo en un portátil. Aquí no puede:
# el runner de CI NO monta el socket de contenedores a propósito —ahí corre lo
# que diga un workflow, que puede venir de cualquier rama, y darle el motor de
# contenedores de la máquina es un permiso mayor y menos contenido que el resto
# de lo que hace (ver bootstrap-runner.sh)—. Por eso los tests de integración
# llevaban desde la migración fallando con «rootless Docker not found».
#
# `services:` lo resuelve sin ceder nada: el contenedor lo levanta act_runner,
# que sí habla con podman, y el job solo recibe un host al que conectarse. Con
# PGTEST_DSN el harness usa ese servidor y se crea una base propia por test.
env:
  # El checkout lo escribe el runner (uid 1001) y los pasos corren como root dentro
  # del `container:`: git ve un propietario ajeno, se niega («dubious ownership»)
  # y `go build` muere con «error obtaining VCS status». La forja montaba el
  # workspace con el mismo usuario y no lo notaba.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  GOTOOLCHAIN: local
  GOFLAGS: "-mod=readonly"

jobs:
  integration:
    # La rama `sytue-native` queda fuera del CI de pull request: es la de la
    # migración y arrastra un árbol que no compila con esta cadena.
    if: (github.event_name != 'pull_request' || github.head_ref != 'sytue-native')
    runs-on: sytue-arm64
    # Los runners propios del frontal (.github/RUNNERS.md): cada job en un
    # contenedor del Docker del CI, con el proxy filtrado como socket de Docker
    # y la caché de Go del host (con varios jobs, ancla `&ci` y `*ci`).
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      env:
        DOCKER_HOST: unix:///run/sytue-ci/docker.sock
      volumes:
        - /srv/ci/run/proxy.sock:/run/sytue-ci/docker.sock
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    # 60: el doble de lo medido, que es la regla de `scripts/ci-margen-de-reloj.sh`.
    # En septiembre iba por 14:10 y bastaban 30; en octubre ya tardaba 26:07
    # (v3.12.6) y 23:59 (v3.12.7), con `services/id/internal/http` solo en
    # 750-815 s, y v3.12.8 se cortó a los 30:00 con los 224 primeros paquetes en
    # verde y la cola alfabética (syerp/store, syphotos, tools) sin terminar.
    timeout-minutes: 60
    services:
      postgres:
        # Del registro de Sytue y NO del registro público de contenedores, que
        # está marcado `blocked` en compliance/supply-chain/providers.tsv
        # (empresa estadounidense) y hace que el gate de soberanía rechace el
        # workflow. Es la MISMA imagen: deploy/production/upstream-images.txt la
        # replica desde su origen con el digest fijado, servida desde la UE.
        #
        # (El nombre del registro público no se escribe aquí a propósito: el gate
        # busca hosts en el texto del fichero y no distingue una mención en un
        # comentario de una dependencia real.)
        #
        # Es 18.4 y no 18-alpine, que es lo que usa pgtest para el contenedor
        # efímero: la base es Debian en vez de Alpine, mismo motor y misma
        # versión mayor. Se prefiere la que ya está replicada antes que replicar
        # otra solo por la variante.
        # Namespace `private-git` y no el de producción: el runner solo tenía
        # credenciales para este —de aquí sacaba su propia imagen— y con el otro
        # el pull moría con `denied` antes de arrancar un solo test. La copia se
        # hizo con `crane copy`, que conserva el digest: era sha256:3a82e1f5….
        #
        # CAMBIADO 2026-09-04: ese registro es de Scaleway y se está dando de
        # baja, así que la réplica deja de existir y el runner de git.gay no
        # tiene ni tendría credenciales para ella. Se pasa al origen público,
        # ANCLADO POR DIGEST —que es lo que de verdad fija qué se ejecuta, no la
        # etiqueta— y a la MISMA imagen que despliega el baremetal
        # (deploy/helm/versions.env, POSTGRES_IMAGE): una sola
        # versión de PostgreSQL entre lo que se prueba y lo que corre.
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: sytue_test
          POSTGRES_PASSWORD: sytue_test_pwd
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U sytue_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # La imagen del runner compartido de git.gay no trae Go ni Bun.
      # Se instalan con la MISMA versión y sha256 que la imagen propia.
      - name: Preparar toolchain
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh go bun psql

      - run: go mod download && go mod verify
      # Comprueba que el servicio responde ANTES de correr nada: si no, cada test
      # falla por su cuenta con un error de conexión y hay que leer veinte
      # mensajes para deducir que lo que pasa es que no hay base de datos.
      - name: Esperar a PostgreSQL
        # La espera TCP comprueba que el servicio responde antes de ejecutar
        # SQL o tests; no depende de la versión de las herramientas del cliente.
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; then
              exec 3<&- 3>&-
              echo "  PostgreSQL acepta conexiones"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL no respondió en 60 s" >&2
          exit 1
      - name: Bootstrap OIDC de Pages contra PostgreSQL
        env:
          PGTEST_DSN: "postgres://sytue_test:sytue_test_pwd@postgres:5432/postgres?sslmode=disable"
        run: bash deploy/helm/tests/bootstrap-pages-integration.sh
      - run: go build -tags=integration ./...
      - name: Tests de integración
        env:
          # El harness crea una base propia por test dentro de este servidor y la
          # borra al terminar, así que `-p 2` sigue siendo seguro: comparten
          # servidor, no datos.
          PGTEST_DSN: "postgres://sytue_test:sytue_test_pwd@postgres:5432/postgres?sslmode=disable"
          PAQUETES: ${{ github.event.inputs.paquetes || './...' }}
          VERBOSE: ${{ github.event.inputs.verbose || 'no' }}
        # `read -ra` sobre $PAQUETES y no `$PAQUETES` a pelo: con comillas sería un
        # único patrón y con varios paquetes hay que partir por espacios, que es
        # justo lo que el shellcheck del gate exige hacer a propósito.
        run: |
          set -euo pipefail
          read -ra pkgs <<< "$PAQUETES"
          # `case` y no una cadena de `[ … ] && v=-v`: con `set -e`, esa cadena
          # aborta el paso cuando la última comparación es falsa, que es el caso
          # normal (verbose apagado).
          v=""
          case "$VERBOSE" in sí | si | yes | true | 1) v="-v" ;; esac
          echo "▸ go test ${v} ${pkgs[*]}"
          go test -tags=integration -count=1 -p 2 -timeout 20m ${v} \
            -covermode=atomic -coverprofile=coverage-integracion.out "${pkgs[@]}"

      # LA OTRA MITAD DE LA COBERTURA. `ci-go` mide solo los tests unitarios, y
      # ahí los paquetes `store` salen a 0,0% aunque estén probados: sus 152
      # ficheros `*_integration_test.go` son estos, y llevan `//go:build
      # integration`. Sin este número, el 43,8% de allí parecía la cobertura de
      # la suite y no lo era.
      #
      # No se fusionan los dos perfiles: cada uno se mide con un `-p` y unos
      # paquetes distintos, y sumarlos a mano —los formatos de texto de `go
      # tool cover` no se combinan solos— pediría una dependencia nueva para un
      # número que nadie va a usar como gate. Dos líneas en dos logs dicen lo
      # mismo sin traerse nada.
      - name: Cobertura de integración
        if: always()
        run: |
          [ -f coverage-integracion.out ] || { echo "sin perfil: los tests no llegaron a correr"; exit 0; }
          go tool cover -func=coverage-integracion.out | tail -1
