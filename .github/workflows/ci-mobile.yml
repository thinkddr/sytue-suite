name: ci-mobile

on:
  release:
    types: [published]
  workflow_dispatch:

# Lo que puede hacer GITHUB_TOKEN en este flujo, y nada más (GitHub lo
# aplica; en Forgejo este campo se ignoraba y mandaba el token de cada paso).
permissions:
  contents: read

# `bash` EXPLÍCITO. Dentro de un `container:` GitHub ejecuta los `run:` con
# `sh -e` y no con bash: `set -o pipefail`, `[[`, los arrays y `<<<` mueren
# con «Illegal option» (cancelar-al-cerrar, 2026-09-27). Con `shell: bash`
# es `bash --noprofile --norc -eo pipefail`, que es lo que corría en la forja.
defaults:
  run:
    shell: bash

env:
  GOFLAGS: '-tags=goolm'
  # El checkout lo escribe el runner (uid 1001) y los pasos corren como root dentro
  # del `container:`: git ve un propietario ajeno, se niega («dubious ownership»)
  # y `go build` muere con «error obtaining VCS status». La forja montaba el
  # workspace con el mismo usuario y no lo notaba.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'

concurrency:
  # UN DESPACHO A MANO NO CANCELA A OTRO (2026-09-27). El grupo lleva el `run_id`
  # solo cuando el evento es `workflow_dispatch`: en GitHub dos despachos de la
  # misma rama caían en el mismo grupo y el segundo cancelaba al primero, así
  # que lanzar el CI sobre dos commits seguidos dejaba el primero sin veredicto
  # (ci-go del 44d9b1bd, cancelado al lanzar el del 209f58f6). En push y en PR
  # el sufijo vale vacío y todo sigue como antes.
  group: ci-mobile-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  validar-movil:
    name: Validar aplicaciones móviles (Go/Fyne)
    runs-on: sytue-arm64
    # Los runners propios del frontal (.github/RUNNERS.md): cada job en un
    # contenedor del Docker del CI, con el proxy filtrado como socket de Docker
    # y la caché de Go del host (con varios jobs, ancla `&ci` y `*ci`).
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      env:
        DOCKER_HOST: unix:///run/sytue-ci/docker.sock
      volumes:
        - /srv/ci/run/proxy.sock:/run/sytue-ci/docker.sock
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    timeout-minutes: 20
    env:
      GOPRIVATE: github.com/thinkddr/*
    steps:
      - name: Clonar el repositorio
        env:
          SYTUE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYTUE_GIT_FORKS_TOKEN: ${{ secrets.SYTUE_GIT_FORKS_TOKEN }}
        run: |
          set -euo pipefail
          # Runner propio: el workspace SOBREVIVE entre jobs (lo deja el anterior,
          # con su .git), así que se vacía antes de clonar (.github/RUNNERS.md).
          find . -mindepth 1 -delete
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$SYTUE_GIT_TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          git config --global "http.$GITHUB_SERVER_URL/.extraHeader" \
            "Authorization: Basic $(printf 'x-access-token:%s' "$SYTUE_GIT_TOKEN" | base64 -w0)"
          # Los dos forks de Fyne son PRIVADOS y la credencial efímera no los lee: el
          # guion configura el token de los forks y comprueba AQUÍ que sirve, no media
          # hora después al compilar (release-desktop v3.5.7 a v3.5.9).
          "$GITHUB_WORKSPACE/.github/actions/toolchain/forks.sh"

      - name: Preparar Go y dependencias Fyne
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh go escritorio

      - name: Comprobar la biblioteca Fyne
        run: |
          set -euo pipefail
          version="$(cd apps/fyne && go list -m -f '{{.Version}}' fyne.io/fyne/v2)"
          [ "$version" = v2.8.1 ] || {
            echo "::error::apps/fyne debe declarar la versión vigente de Fyne (v2.8.1); declara $version" >&2
            exit 1
          }
          reemplazo="$(cd apps/fyne && go list -m -f '{{with .Replace}}{{.Path}} {{.Version}}{{end}}' fyne.io/fyne/v2)"
          [ "$reemplazo" = 'github.com/thinkddr/fyne/v2 v2.8.1-sytue.16' ] || {
            echo "::error::apps/fyne debe usar el fork público BSD-3-Clause con URL entrantes; usa $reemplazo" >&2
            exit 1
          }

      - name: Validar la arquitectura móvil compartida
        run: |
          set -euo pipefail
          ( cd apps/nucleo && go vet ./... && go test ./... )
          ( cd apps/fyne && go vet ./... && go test ./... )
          bash apps/fyne/scripts/empaquetar-test.sh
