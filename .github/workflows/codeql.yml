# Única definición de CodeQL del repositorio (Advanced setup).
name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '38 6 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: go
            build-mode: manual
          # No hay Kotlin: el modo sin build cubre los puentes Android Java.
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: swift
            build-mode: manual
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Mismo build de plataforma que ci.yml. Los módulos Go independientes de
      # escritorio y herramientas requieren sus propias plataformas y builds.
      - name: Build Go platform
        if: matrix.language == 'go'
        run: go build ./...

      # Los tres targets compilan todas las fuentes Swift de producción. No
      # construyen las apps host ni ejecutan su empaquetado Go/Fyne; no requieren
      # certificados de firma. Los widgets comparten las mismas fuentes.
      - name: Build Swift extensions and bridge
        if: matrix.language == 'swift'
        run: |
          xcodebuild \
            -project apps/fyne/xcode/Sytue.xcodeproj \
            -target drive-archivos \
            -target notes-widgets \
            -target SytueWidgetBridge \
            -configuration Debug \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
