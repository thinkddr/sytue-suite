name: Codex security fix
run-name: Codex · seguridad · ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-security-fix.yml
      - .github/scripts/security-*.mjs
  workflow_run:
    workflows: [CodeQL Advanced]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      finding_type:
        description: Tipo de alerta de GitHub Security
        type: choice
        options: [code-scanning, dependabot]
        required: true
      alert_number:
        description: Número de la alerta (último segmento de su URL)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Serializar selección y publicación para no asignar dos veces una alerta.
  group: codex-security-queue
  cancel-in-progress: false

jobs:
  select:
    # Solo código de la rama predeterminada; nunca usar artefactos ni checkouts
    # del workflow que disparó workflow_run, especialmente los de una PR/fork.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
      pull-requests: read
    outputs:
      has_finding: ${{ steps.queue.outputs.has_finding }}
      finding_type: ${{ steps.queue.outputs.finding_type }}
      alert_number: ${{ steps.queue.outputs.alert_number }}
      existing_pr_number: ${{ steps.queue.outputs.existing_pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check connector configuration
        env:
          PR_TOKEN_CONFIGURED: ${{ secrets.CODEX_PR_TOKEN != '' }}
          ALERT_TOKEN_CONFIGURED: ${{ secrets.SECURITY_ALERTS_TOKEN != '' }}
        run: |
          test "$PR_TOKEN_CONFIGURED" = true || { echo 'Configure CODEX_PR_TOKEN (Contents y Pull requests: write).' >&2; exit 1; }
          test "$ALERT_TOKEN_CONFIGURED" = true || { echo 'Configure SECURITY_ALERTS_TOKEN (Dependabot alerts: read).' >&2; exit 1; }

      - name: Select one unassigned open finding
        id: queue
        env:
          FINDING_TYPE: ${{ inputs.finding_type }}
          ALERT_NUMBER: ${{ inputs.alert_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CODE_SCANNING_TOKEN: ${{ github.token }}
          SECURITY_ALERTS_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/security-queue.mjs

      - name: Summarize queue decision
        env:
          HAS_FINDING: ${{ steps.queue.outputs.has_finding }}
          FINDING_TYPE: ${{ steps.queue.outputs.finding_type }}
          ALERT_NUMBER: ${{ steps.queue.outputs.alert_number }}
          QUEUE_REASON: ${{ steps.queue.outputs.reason }}
        run: |
          printf 'Cola automática de seguridad: %s\n' "$QUEUE_REASON" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_FINDING" = true ]; then
            printf 'Encargo seleccionado: %s #%s\n' "$FINDING_TYPE" "$ALERT_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          fi

  prepare:
    needs: select
    if: needs.select.outputs.has_finding == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      finding_url: ${{ steps.alert.outputs.finding_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fix the trusted base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read the selected open alert
        id: alert
        env:
          FINDING_TYPE: ${{ needs.select.outputs.finding_type }}
          ALERT_NUMBER: ${{ needs.select.outputs.alert_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SECURITY_ALERTS_TOKEN: ${{ needs.select.outputs.finding_type == 'dependabot' && secrets.SECURITY_ALERTS_TOKEN || github.token }}
          ALERT_CONTEXT_PATH: ${{ runner.temp }}/alert-context/alert.json
        run: |
          mkdir -p "$RUNNER_TEMP/alert-context"
          node .github/scripts/security-alert.mjs

      - name: Pass selected metadata to the isolated job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-alert-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alert-context/alert.json
          if-no-files-found: error
          retention-days: 1

  request:
    needs: [select, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # El token es del usuario conectado a Codex; @codex se ejecuta mediante
    # su integración de ChatGPT, sin invocar la API de OpenAI desde Actions.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-alert-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alert-context

      - name: Prepare the native Codex task
        id: task
        env:
          SECURITY_ALERT_CONTEXT: ${{ runner.temp }}/alert-context/alert.json
          SECURITY_REQUEST_DIR: ${{ runner.temp }}/security-request
          SECURITY_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p "$RUNNER_TEMP/security-request"
          node .github/scripts/security-request.mjs

      - name: Open a request PR and mention the native Codex connector
        id: publish
        env:
          GH_TOKEN: ${{ secrets.CODEX_PR_TOKEN }}
          FINDING_TYPE: ${{ needs.select.outputs.finding_type }}
          ALERT_NUMBER: ${{ needs.select.outputs.alert_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUEST_PATH: ${{ steps.task.outputs.request_path }}
          PR_TITLE: ${{ steps.task.outputs.request_title }}
          SECURITY_REQUEST_DIR: ${{ runner.temp }}/security-request
          EXISTING_PR_NUMBER: ${{ needs.select.outputs.existing_pr_number }}
        run: node .github/scripts/security-publish.mjs
