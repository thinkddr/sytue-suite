name: Codex security fix
run-name: Codex · ${{ inputs.finding_type }} · alerta ${{ inputs.alert_number }}

on:
  workflow_dispatch:
    inputs:
      finding_type:
        description: Tipo de alerta de GitHub Security
        type: choice
        options: [code-scanning, dependabot]
        required: true
      alert_number:
        description: Número de la alerta (último segmento de su URL)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: codex-security-${{ inputs.finding_type }}-${{ inputs.alert_number }}
  cancel-in-progress: false

jobs:
  prepare:
    # Nunca cargar código ni secretos desde una rama elegida en Run workflow.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      finding_url: ${{ steps.alert.outputs.finding_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check configuration and fix base
        id: base
        env:
          PR_TOKEN_CONFIGURED: ${{ secrets.CODEX_PR_TOKEN != '' }}
          ALERT_TOKEN_CONFIGURED: ${{ secrets.SECURITY_ALERTS_TOKEN != '' }}
          FINDING_TYPE: ${{ inputs.finding_type }}
        run: |
          test "$PR_TOKEN_CONFIGURED" = true || { echo 'Configure CODEX_PR_TOKEN (Contents y Pull requests: write).' >&2; exit 1; }
          if [ "$FINDING_TYPE" = dependabot ] && [ "$ALERT_TOKEN_CONFIGURED" != true ]; then
            echo 'Configure SECURITY_ALERTS_TOKEN con Dependabot alerts: read.' >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read the selected open alert
        id: alert
        env:
          FINDING_TYPE: ${{ inputs.finding_type }}
          ALERT_NUMBER: ${{ inputs.alert_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SECURITY_ALERTS_TOKEN: ${{ inputs.finding_type == 'dependabot' && secrets.SECURITY_ALERTS_TOKEN || github.token }}
          ALERT_CONTEXT_PATH: ${{ runner.temp }}/alert-context/alert.json
        run: |
          mkdir -p "$RUNNER_TEMP/alert-context"
          node .github/scripts/security-alert.mjs

      - name: Pass selected metadata to the isolated job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-alert-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alert-context/alert.json
          if-no-files-found: error
          retention-days: 1

  request:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # El token es del usuario conectado a Codex; @codex se ejecuta mediante
    # su integración de ChatGPT, sin invocar la API de OpenAI desde Actions.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-alert-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alert-context

      - name: Prepare the native Codex task
        id: task
        env:
          SECURITY_ALERT_CONTEXT: ${{ runner.temp }}/alert-context/alert.json
          SECURITY_REQUEST_DIR: ${{ runner.temp }}/security-request
          SECURITY_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p "$RUNNER_TEMP/security-request"
          node .github/scripts/security-request.mjs

      - name: Open a request PR and mention the native Codex connector
        env:
          GH_TOKEN: ${{ secrets.CODEX_PR_TOKEN }}
          FINDING_TYPE: ${{ inputs.finding_type }}
          ALERT_NUMBER: ${{ inputs.alert_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUEST_PATH: ${{ steps.task.outputs.request_path }}
          PR_TITLE: ${{ steps.task.outputs.request_title }}
        run: |
          fix_branch="codex/security/${FINDING_TYPE}-${ALERT_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$(dirname "$REQUEST_PATH")"
          cp "$RUNNER_TEMP/security-request/request.md" "$REQUEST_PATH"
          git add -- "$REQUEST_PATH"
          git -c core.hooksPath=/dev/null -c user.name='codex-security[bot]' -c user.email='codex-security[bot]@users.noreply.github.com' commit -m "$PR_TITLE"
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$fix_branch"
          pr_url="$(gh pr create --draft --base "$DEFAULT_BRANCH" --head "$fix_branch" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/security-request/pr-body.md")"
          printf 'PR de encargo creado: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$pr_url" --body-file "$RUNNER_TEMP/security-request/codex-comment.md"
          printf 'Mención @codex enviada con la cuenta del token. Comprueba la reacción del conector en el PR.\n' >> "$GITHUB_STEP_SUMMARY"
