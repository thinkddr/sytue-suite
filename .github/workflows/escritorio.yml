#
# Puerta de VENTANA DE ESCRITORIO contra producción, hermana de mobile.yml.
#
# QUÉ MIDE QUE NO MIDIERA NADA. La web se usa también en ventanas de escritorio, y
# una ventana SE PUEDE ENCOGER. 880×600 era el mínimo que declaraba el shell de Wails
# (retirado el 2026-09-23; la app nativa es Fyne y no pinta la web), y se sigue
# midiendo porque una ventana de navegador baja a eso igual. Ese tamaño cae en tierra
# de nadie:
#
#   – Es DEMASIADO ANCHO para el barrido móvil, cuyo perfil más grande con sesión
#     es el Galaxy Z Fold 6 (928×1004) y va por la rama de escritorio del layout
#     igualmente. Nadie mide 880.
#   – Y es demasiado ESTRECHO para el layout de escritorio de verdad: a 880px la
#     barra lateral sigue puesta —el punto de ruptura ya pasó— pero no queda sitio
#     para ella y el contenido a la vez.
#
#   – Sobre todo: 600px de ALTO no lo ha visto nunca nadie. Los dieciocho perfiles
#     de móvil son altos y estrechos (el más bajo, 360×298 del Z Flip cerrado, no
#     abre diálogos). Un diálogo de la suite mide más de 600px, y en una ventana
#     de ese alto su «Guardar» queda FUERA, sin scroll con el que llegar. La app
#     no se ve mal: no se puede usar.
#
# POR QUÉ ES EL MISMO GUION. `mobile-audit.mjs` con SUPERFICIE=escritorio cambia la
# tabla de perfiles y enciende la medida vertical; la sesión, las rutas, las
# pestañas y los desplegables son idénticos. Un guion aparte serían novecientas
# líneas duplicadas esperando a diverger, que es lo que ya se decidió para el
# detector (test/e2e/detector-desbordamiento.mjs, compartido por tres puertas).
#
# POR QUÉ NO ES PUERTA DE PR: lo mismo que mobile.yml —las apps con sesión son
# `output: 'server'` y redirigen al IdP, así que el objetivo es producción—.
#
# NO CONSTRUYE NINGÚN BINARIO. Esto audita la INTERFAZ web en ventanas de
# escritorio, que es lo que se rompe sin que nadie se entere.
name: escritorio

on:
  schedule:
    # 08:45: mobile.yml arranca a las 07:00 y tarda ~57 min. Solapar los dos
    # metería a la MISMA cuenta de auditoría por el login del IdP a la vez, que
    # corta por ráfaga (5/min) — y el fallo se leería como «producción caída».
    # Se conserva el hueco de 105 min; lo que se movió es el bloque entero, para
    # que nada empiece antes de las 06:00 UTC.
    - cron: "45 8 * * *"
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps a barrer (vacío = todas)"
        type: string
        required: false

# Lo que puede hacer GITHUB_TOKEN en este flujo, y nada más (GitHub lo
# aplica; en Forgejo este campo se ignoraba y mandaba el token de cada paso).
permissions:
  contents: read

# `bash` EXPLÍCITO. Dentro de un `container:` GitHub ejecuta los `run:` con
# `sh -e` y no con bash: `set -o pipefail`, `[[`, los arrays y `<<<` mueren
# con «Illegal option» (cancelar-al-cerrar, 2026-09-27). Con `shell: bash`
# es `bash --noprofile --norc -eo pipefail`, que es lo que corría en la forja.
defaults:
  run:
    shell: bash

concurrency:
  group: escritorio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# QUÉ ÁRBOL SE CLONA, Y POR QUÉ NO SIEMPRE `github.sha`.
#
# La forja registra cada programación con el commit en el que vio ESTE fichero y
# lo reutiliza en todos los disparos: mientras nadie lo toque, el cron sigue
# clonando el mismo árbol y la rama avanza sin él. Medido el 2026-09-11:
# `security` y `mobile` corrían sobre b0372642 con `main` ya en 0bc05e1e, y los
# dos fallaban por un lockfile que llevaba un día arreglado. Un nocturno que
# escanea un árbol viejo no está mirando lo que se despliega, que es justo lo
# único que tenía que hacer.
#
# En push y en pull request manda `github.sha`, que ahí sí es lo correcto: se
# comprueba el commit concreto que llegó, no la cabeza de la rama.
env:
  # El checkout lo escribe el runner (uid 1001) y los pasos corren como root dentro
  # del `container:`: git ve un propietario ajeno, se niega («dubious ownership»)
  # y `go build` muere con «error obtaining VCS status». La forja montaba el
  # workspace con el mismo usuario y no lo notaba.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  REF_A_CLONAR: ${{ github.event_name == 'schedule' && (github.ref_name || 'main') || github.sha }}

jobs:
  ventanas:
    name: barrido de ventana de escritorio (producción)
    runs-on: sytue-arm64
    # Los runners propios del frontal (.github/RUNNERS.md): cada job en un
    # contenedor del Docker del CI, con el proxy filtrado como socket de Docker
    # y la caché de Go del host (con varios jobs, ancla `&ci` y `*ci`).
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      env:
        DOCKER_HOST: unix:///run/sytue-ci/docker.sock
      volumes:
        - /srv/ci/run/proxy.sock:/run/sytue-ci/docker.sock
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    # Cuatro perfiles frente a los dieciocho de móvil (y uno de ellos soloHome),
    # o sea del orden de un quinto del trabajo: ~12 min medidos sobre los 57 del
    # barrido móvil. 45 deja margen de sobra para una producción lenta sin que la
    # puerta se ponga en rojo por el reloj en vez de por un hallazgo.
    timeout-minutes: 45
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF_A_CLONAR }}
          fetch-depth: 1
          persist-credentials: false

      - name: Preparar toolchain
        # Solo bun, como mobile.yml: Go y `escritorio` eran para el test del shell de
        # Wails, que se fue con él.
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh bun

      # Mismas comprobaciones que mobile.yml y por el mismo motivo: sin el
      # segundo factor el login se queda a medias y el barrido mide pantallas SIN
      # SESIÓN, que salen como fallos de producto. Diagnosticarlo desde fuera
      # costó cuatro ejecuciones.
      - name: ¿Hay credenciales de la cuenta de auditoría?
        env:
          EMAIL: ${{ secrets.SYTUE_AUDIT_EMAIL }}
          PASS: ${{ secrets.SYTUE_AUDIT_PASS }}
          TOTP: ${{ secrets.SYTUE_AUDIT_TOTP }}
        run: |
          if [ -z "$EMAIL" ] || [ -z "$PASS" ] || [ -z "$TOTP" ]; then
            echo "Faltan SYTUE_AUDIT_EMAIL/PASS/TOTP: no se puede entrar en prod." >&2
            echo "  Una puerta que no puede correr es un fallo de configuración, no un aprobado." >&2
            exit 1
          fi
          echo "· reloj del runner: $(date -u +%Y-%m-%dT%H:%M:%SZ) · paso TOTP $(( $(date -u +%s) / 30 ))"

      - working-directory: test/e2e
        run: bun install --frozen-lockfile

      - working-directory: test/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Sembrar el contenido mínimo de la cuenta de auditoría
        working-directory: test/e2e
        env:
          SYTUE_BASE_DOMAIN: sytue.eu
          SYTUE_AUDIT_EMAIL: ${{ secrets.SYTUE_AUDIT_EMAIL }}
          SYTUE_AUDIT_PASS: ${{ secrets.SYTUE_AUDIT_PASS }}
          SYTUE_AUDIT_TOTP: ${{ secrets.SYTUE_AUDIT_TOTP }}
          # Bypass del captcha de login (ADR 0056): OPCIONAL. Si el secreto existe,
          # el barrido firma la cabecera X-Sytue-Test-Auth y no resuelve el PoW;
          # si no existe, el barrido resuelve el ALTCHA como cualquier persona.
          SYTUE_LOGIN_BYPASS_KEY: ${{ secrets.SYTUE_LOGIN_BYPASS_KEY }}
        run: bun run sembrar-auditoria.mjs

      - name: Barrido de ventana de escritorio contra producción
        working-directory: test/e2e
        env:
          SUPERFICIE: escritorio
          SYTUE_BASE_DOMAIN: sytue.eu
          SYTUE_AUDIT_EMAIL: ${{ secrets.SYTUE_AUDIT_EMAIL }}
          SYTUE_AUDIT_PASS: ${{ secrets.SYTUE_AUDIT_PASS }}
          SYTUE_AUDIT_TOTP: ${{ secrets.SYTUE_AUDIT_TOTP }}
          # Bypass del captcha de login (ADR 0056): OPCIONAL. Si el secreto existe,
          # el barrido firma la cabecera X-Sytue-Test-Auth y no resuelve el PoW;
          # si no existe, el barrido resuelve el ALTCHA como cualquier persona.
          SYTUE_LOGIN_BYPASS_KEY: ${{ secrets.SYTUE_LOGIN_BYPASS_KEY }}
          # Alemán, igual que el móvil: es el idioma de palabras más largas y a
          # 880px de ancho es donde se nota.
          LOCALE: de-DE
          # Por entorno y NO interpolado dentro del `run`: una expresión ${{ }} se
          # sustituye antes de que exista el shell, y lo que venga en el input se
          # ejecutaría como código.
          APPS: ${{ inputs.apps }}
        run: bun run mobile-audit.mjs $APPS

      # LAS CAPTURAS SON LA MITAD DEL INFORME. Un «−180px POR ABAJO en button
      # «Speichern»» dice QUÉ pasa; la captura dice si el diálogo entero está mal
      # planteado o si sobra un margen. Sin esto hay que reproducirlo a mano en
      # local con la cuenta de producción, que es justo lo que esta puerta evita.
      # No tumba el job: el veredicto es el barrido, y un almacén de artefactos lleno
      # (2026-10-06) lo pondría en rojo sin ningún hallazgo.
      - name: Guardar capturas e informe
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escritorio-${{ github.run_number }}
          path: |
            /tmp/escritorio/
            /tmp/escritorio-audit.json
          if-no-files-found: ignore
          retention-days: 14
