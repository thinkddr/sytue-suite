#
# Firma un .exe mínimo contra Azure Artifact Signing con las credenciales del repositorio y lo
# verifica. Para probar la firma sin esperar a una release, y SIEMPRE después de renovar
# el client secret (docs/operations.md, «Windows: Azure Artifact Signing»). Solo a mano.
name: firma-windows-prueba

on:
  workflow_dispatch:

# Lo que puede hacer GITHUB_TOKEN en este flujo, y nada más (GitHub lo
# aplica; en Forgejo este campo se ignoraba y mandaba el token de cada paso).
permissions:
  contents: read

# `bash` EXPLÍCITO. Dentro de un `container:` GitHub ejecuta los `run:` con
# `sh -e` y no con bash: `set -o pipefail`, `[[`, los arrays y `<<<` mueren
# con «Illegal option» (cancelar-al-cerrar, 2026-09-27). Con `shell: bash`
# es `bash --noprofile --norc -eo pipefail`, que es lo que corría en la forja.
defaults:
  run:
    shell: bash

env:
  # El checkout lo escribe el runner (uid 1001) y los pasos corren como root dentro
  # del `container:`: git ve un propietario ajeno, se niega («dubious ownership»)
  # y `go build` muere con «error obtaining VCS status». La forja montaba el
  # workspace con el mismo usuario y no lo notaba.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

jobs:
  firmar:
    name: Firmar un exe de prueba
    runs-on: sytue-arm64
    # Los runners propios del frontal (.github/RUNNERS.md): cada job en un
    # contenedor del Docker del CI, con el proxy filtrado como socket de Docker
    # y la caché de Go del host (con varios jobs, ancla `&ci` y `*ci`).
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      env:
        DOCKER_HOST: unix:///run/sytue-ci/docker.sock
      volumes:
        - /srv/ci/run/proxy.sock:/run/sytue-ci/docker.sock
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    # ~3 min medidos (Go + JDK + una firma); el margen del repo es 2× o más.
    timeout-minutes: 15
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Preparar Go, jsign y osslsigncode
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh go jq jdk jsign osslsigncode

      - name: Firmar y verificar
        env:
          GOTOOLCHAIN: local
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          AZURE_SIGNING_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          AZURE_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/firma-prueba"; mkdir -p "$d/src"
          printf 'package main\n\nfunc main() { println("Sytue: prueba de firma") }\n' >"$d/src/main.go"
          (cd "$d/src" && go mod init prueba >/dev/null 2>&1 && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$d/prueba.exe" .)
          cp "$d/prueba.exe" "$d/sin-firmar.exe"
          # El guardián tiene que ver el rojo: un exe sin firmar NO puede pasar.
          if bash deploy/sytue-git/bin/firmar-windows.sh verificar "$d/sin-firmar.exe" 2>/dev/null; then
            echo "::error::verificar dio por bueno un exe SIN firmar" >&2; exit 1
          fi
          echo "✓ el exe sin firmar se rechaza"
          bash deploy/sytue-git/bin/firmar-windows.sh firmar "$d/prueba.exe"
          mkdir -p "$GITHUB_WORKSPACE/salida" && cp "$d/prueba.exe" "$GITHUB_WORKSPACE/salida/sytue-firma-prueba.exe"

      - name: Guardar el exe firmado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firma-windows-prueba
          path: salida/*
          if-no-files-found: error
          retention-days: 7
