#
# CONSTRUYE LAS IMÁGENES DE LA SUITE Y LAS PUBLICA EN ghcr.io/thinkddr,
# para que el servidor físico solo tenga que descargarlas.
#
# POR QUÉ EXISTE. El perfil on-premise construía las 26 imágenes EN el servidor
# (bin/build-images.sh). Funciona, pero deja en su disco la caché de módulos de
# Go —9,1 GB medidos—, la de compilación, las capas intermedias, el .tar que
# `docker save` escribe y una tercera copia al importarlas en containerd. El
# servidor real tiene 80 GB y Ubuntu Desktop encima: no cabe.
#
# Aquí se construye en los runners del frontal, con el Docker del CI
# (ver .github/RUNNERS.md), y el servidor tira del registro con
# `bin/configurar-registro.sh`. En su disco queda UNA copia y ninguna caché.
#
# CREDENCIAL. Desde el 2026-09-27 el registro es ghcr.io/thinkddr y basta el token
# del job con `packages: write`. `SYTUE_GIT_PACKAGES_TOKEN`, si existe, se prefiere:
# es la vía para publicar en otro registro (`vars.SYTUE_REGISTRY`) o con un token
# de usuario. En git.gay el token automático no servía —no llevaba ese alcance—.
#
# La release no dispara este workflow directamente: `security` lo despacha
# después de terminar verde. Así no hay builds de producción en paralelo con
# los controles que deciden si esa release es publicable.
#
# LA ETIQUETA SALE DE LA REFERENCIA QUE ELIJAS al lanzarlo desde Actions: si
# despachas sobre el tag `v2.10.0`, las imágenes se etiquetan `v2.10.0` y se
# construyen con el código de ESE tag, que es justo lo que hay que publicar. El
# input `tag` queda para el caso raro de querer otra etiqueta a propósito.
name: imagenes-produccion

on:
  workflow_dispatch:
    inputs:
      # VACÍO = el tag que has elegido arriba, en el selector de referencia de
      # git.gay. Eran dos sitios para el mismo dato y podían no coincidir:
      # despachar sobre `v2.10.0` y teclear `v2.9.0` publica las imágenes de una
      # versión con la etiqueta de otra, y eso no se nota hasta que el servidor
      # se descarga algo que no es lo que dice ser. Se rellena solo con
      # `github.ref_name`, y el input queda para el caso raro de querer otra
      # etiqueta a propósito.
      tag:
        description: "Etiqueta de las imágenes (vacío = la referencia elegida arriba)"
        type: string
        required: false
      # NO es cosmético: los frontends Astro HORNEAN las URL públicas en tiempo
      # de build (`PUBLIC_*`). Construidos con el dominio equivocado, las
      # páginas se sirven pero el login se va al IdP de otro sitio, y eso no se
      # ve hasta pulsar «entrar».
      #
      # POR DEFECTO `sytue.eu`, que es el dominio de la instalación que existe:
      # exigirlo en cada despacho era teclear el mismo valor siempre y arriesgar
      # una errata en el único sitio donde no perdona.
      dominio:
        description: "Dominio del despliegue (el DOMAIN del .env del servidor)"
        type: string
        required: false
        default: sytue.eu
      # EL PERFIL DEL SERVIDOR AL QUE VA ESTO, y no es solo informativo: decide
      # qué se construye y viaja en la marca que recoge el servidor.
      #
      # El piloto actual tiene CLOUD_ENABLED=true y, por tanto, requiere el
      # perfil completo. Publicar por defecto como `piloto` omitía cloud-api,
      # cloud-builder, cloud-controller, analytics y cloud-dashboard, y el
      # actualizador detenía la release antes de dejar pods sin imagen.
      #
      # `completo` POR DEFECTO desde el 2026-09-27: el piloto enciende Sytue Cloud
      # y Analytics (decisión del dueño), y su actualizador solo despliega marcas
      # de un perfil que le valga. Una release que saliera solo con `piloto` lo
      # dejaría quieto; `completo` lleva todas las imágenes de `piloto`.
      #
      # NO puede ser `required: true`: en el run que dispara la release no hay
      # inputs, y con el obligatorio el run llegaba vacío y moría (o ni eso) en
      # «perfil inválido: «»». El valor por defecto lleva el automático.
      perfil:
        description: "Perfil del servidor de destino (piloto actual: completo)"
        type: choice
        options:
          - piloto
          - completo
        required: false
        default: completo
      # AQUÍ HABÍA UN INPUT `arquitectura`, Y SE QUITÓ PORQUE MENTÍA. Valía
      # cuando todas las imágenes salían iguales y había UNA arquitectura de
      # destino; ahora cada una va a donde va —los frontends Astro y los
      # servicios al piloto (amd64) y el juego de frontends `.com` al frontal ARM64—,
      # así que un desplegable no puede cambiarlo sin cambiar también lo que se
      # construye. Eso vive en `scripts/arquitecturas-imagen.sh`, en un sitio, y
      # es lo que comprueba el guardián de `cerrar`.
      # LA SALIDA DE EMERGENCIA del gate de abajo, y existe porque el CI se rompe
      # por motivos que no son el código: el 2026-09-11 este mismo flujo murió
      # con `error creating overlay mount … no such file or directory` porque al
      # runner se le evaporaron las capas a media construcción. Un gate sin
      # escape convierte una avería de infraestructura en un despliegue
      # imposible; uno con escape obliga a escribir que lo estás saltando.
      ignorar_ci:
        description: "Publicar aunque el CI del commit no esté en verde (di por qué en el resumen)"
        type: boolean
        required: false
        default: false
      # Solo lo fija `security` al iniciar una release. Evita que un despacho
      # manual de imágenes publique por sorpresa clientes de escritorio.
      pipeline_release:
        description: "Uso interno: continúa security → imágenes → escritorio"
        type: string
        required: false
        default: ""

# Lo que puede hacer GITHUB_TOKEN en este flujo, y nada más (GitHub lo
# aplica; en Forgejo este campo se ignoraba y mandaba el token de cada paso).
# POR JOB, NO DEL FLUJO (auditoría 2026-10-06, CI-09). Aquí arriba estaban los tres
# permisos de escritura para los cinco jobs: los turnos que construyen —y corren
# `bun install`, `astro build` y medio árbol de npm— llevaban un token capaz de
# crear etiquetas, y una etiqueta `desplegable/…` es un despliegue. Ahora solo
# escribe en el repositorio el job que marca, y solo publica el que construye.
permissions:
  contents: read

# `bash` EXPLÍCITO. Dentro de un `container:` GitHub ejecuta los `run:` con
# `sh -e` y no con bash: `set -o pipefail`, `[[`, los arrays y `<<<` mueren
# con «Illegal option» (cancelar-al-cerrar, 2026-09-27). Con `shell: bash`
# es `bash --noprofile --norc -eo pipefail`, que es lo que corría en la forja.
defaults:
  run:
    shell: bash

env:
  # El checkout lo escribe el runner (uid 1001) y los pasos corren como root dentro
  # del `container:`: git ve un propietario ajeno, se niega («dubious ownership»)
  # y `go build` muere con «error obtaining VCS status». La forja montaba el
  # workspace con el mismo usuario y no lo notaba.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

concurrency:
  # Sin cancelar: una publicación a medias deja el registro con parte de la
  # versión y el servidor descargando una mezcla de dos builds.
  group: imagenes-produccion
  cancel-in-progress: false

# LAS TREINTA Y CINCO IMÁGENES VAN EN TRES TURNOS, uno por runner.
#
# La etiqueta `sytue-arm64` la atienden TRES runners de capacidad 1 en el mismo host
# (ver .github/RUNNERS.md), así que tres es el techo real de concurrencia y no
# hay nada que ganar partiéndolo más: `max-parallel` Forgejo lo IGNORA —probado
# en la ejecución 703 de security.yml, ocho jobs de la misma matriz arrancaron en
# tres segundos con el tope puesto en tres—, de modo que el único límite es el
# tamaño de la flota. Con más turnos que runners solo se pagan más clonados.
#
# EL REPARTO NO SE ESCRIBE A MANO. La lista sigue saliendo de build-images.sh y
# cada turno se queda con una de cada tres por posición: un servicio nuevo entra
# solo, sin tocar este fichero. Una matriz con los nombres escritos aquí sería un
# segundo catálogo, y el síntoma de que divergiera es el de siempre —un pod en
# ImagePullBackOff— solo que ahora también podría faltar por no tener turno.
#
# LO QUE CUESTA: durante la publicación los tres runners están ocupados y el CI
# de quien esté trabajando espera. A cambio dura un tercio, que es justo lo que
# acorta esa espera.
#
# AQUÍ NO SE PODA NADA, NI EN LOS TURNOS NI FUERA DE ELLOS. Los runners comparten
# el BuildKit del CI con TODO el CI, no solo con este flujo: una poda desde un job
# no rompe el build de otro (BuildKit respeta sus leases), pero le tira la caché a
# media publicación. Las imágenes no pasan por ningún daemon —BuildKit las sube
# directamente— y la caché la poda el temporizador del host
# (docs/operations.md#poda-ci-frontal). Lo vigila .github/tests/ci-sin-azar-test.sh.
jobs:
  preparar:
    name: Comprobar el CI y la credencial
    runs-on: sytue-arm64
    # Los runners propios del frontal (.github/RUNNERS.md): cada job en un
    # contenedor del Docker del CI, con el proxy filtrado como socket de Docker
    # y la caché de Go del host (con varios jobs, ancla `&ci` y `*ci`).
    # Y el BuildKit del CI por SU socket (ADR 0066): con él se construye, sin pasar
    # por la API de Docker.
    container: &ci
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      env:
        DOCKER_HOST: unix:///run/sytue-ci/docker.sock
        BUILDKIT_HOST: unix:///run/sytue-ci/buildkitd.sock
      volumes:
        - /srv/ci/run/proxy.sock:/run/sytue-ci/docker.sock
        - /srv/ci/run/buildkitd.sock:/run/sytue-ci/buildkitd.sock
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    # Casi todo es ESPERAR a que el CI del commit termine (ver «Exigir el CI del
    # commit»): el tope de la espera está justo por debajo de este reloj, y los dos
    # por debajo del `runner.timeout: 3h` de los runners.
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      packages: read
    outputs:
      publicar: ${{ steps.decidir.outputs.publicar }}
      ya_publicadas: ${{ steps.ya.outputs.ya_publicadas }}
      firma: ${{ steps.clave.outputs.firma }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DOMINIO: ${{ github.event.inputs.dominio || 'sytue.eu' }}
      PERFIL: ${{ github.event.inputs.perfil || 'completo' }}
      DESTINO: ${{ vars.SYTUE_REGISTRY || 'ghcr.io/thinkddr' }}
    steps:
      - name: Comprobar la etiqueta
        run: |
          set -euo pipefail
          # El alfabeto es el que exige `validate_config` en el servidor: si la
          # etiqueta no vale allí, no sirve de nada publicarla aquí.
          case "$TAG" in
            "") echo "no hay etiqueta: elige un tag arriba o escribe una." >&2; exit 1 ;;
            *[!A-Za-z0-9._-]*) echo "la etiqueta «$TAG» tiene caracteres que el servidor rechaza." >&2; exit 1 ;;
          esac
          # Publicar con el nombre de una RAMA es legítimo para probar, pero el
          # servidor espera versiones: se avisa para que nadie descubra en el
          # despliegue que sus imágenes se llaman `main`.
          case "$TAG" in
            v[0-9]*) echo "  etiqueta: $TAG" ;;
            *) echo "  AVISO: «$TAG» no parece una versión (vX.Y.Z); si venías a publicar una release, elige su tag en el selector de referencia." ;;
          esac

      - name: Comprobar el perfil
        run: |
          set -euo pipefail
          case "$PERFIL" in
            piloto|completo) echo "  perfil: $PERFIL" ;;
            *) echo "perfil inválido: «$PERFIL» (piloto o completo)" >&2; exit 1 ;;
          esac

      # EL CI DEL COMMIT QUE SE VA A PUBLICAR TIENE QUE ESTAR EN VERDE.
      #
      # No es un gate de PR: en fase piloto se abren demasiadas y con un runner
      # en serie exigirlo en cada una pararía el trabajo. Se pone AQUÍ, que es el
      # único punto donde pasa algo irreversible —las imágenes salen al registro
      # y de ahí al servidor—, y donde ya existen todos los checks del release.
      #
      # LO QUE COSTÓ NO TENERLO. La migración 0061 de Sytue ID no aplicaba
      # (`relation "orgs" does not exist`). El test que la caza EXISTE y estaba
      # en rojo en `ci-integration` del release… y se publicó igual, tres veces:
      # v2.63.0, v2.64.0 y v2.65.0. El IdP quedó en CrashLoopBackOff y el rollout
      # se quedaba con el pod viejo sirviendo, así que desde fuera parecía que
      # todo iba bien. v2.62.0 —lo que llevaba meses corriendo— también se
      # publicó en rojo, con tres fallos.
      #
      # Basta el estado COMBINADO del commit: el peor de lo que cuenta —la última
      # ejecución de cada flujo, ver el paso— y los `skipped` no cuentan (medido en
      # v2.61.1: 16 success + 3 skipped = success). Así no hay una lista de
      # contextos que se quede vieja cada vez que se añade un job.
      - name: Clonar el commit que se va a publicar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # ¿SE FIRMA ESTA VERSIÓN? El interruptor es la clave pública, y es el mismo
      # para el CI, el piloto y las apps: si el commit que se publica trae
      # deploy/firma/publicacion.pub, `marcar` corre en el entorno protegido
      # «publicacion» —que tiene la privada y pide la aprobación del dueño— y firma.
      # Si no la trae, no hay entorno, se publica sin firma y se avisa: la clave
      # todavía no existe (hace falta GitHub Pro para proteger el entorno) y eso no
      # puede parar una publicación. Se decide aquí porque `environment:` no puede
      # mirar ficheros, solo la salida de otro job.
      - name: ¿Hay clave pública de publicación?
        id: clave
        run: |
          if [ -s deploy/firma/publicacion.pub ]; then
            echo "firma=si" >> "$GITHUB_OUTPUT"
            echo "  el commit trae deploy/firma/publicacion.pub: esta versión se firma"
          else
            echo "::warning title=Publicación sin firmar::este commit no trae deploy/firma/publicacion.pub: las imágenes y su marca salen SIN FIRMA, y el piloto no la exige todavía."
          fi

      - name: Bun para los metadatos del CI
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh bun

      - name: Exigir el CI del commit
        id: decidir
        env:
          TOKEN: ${{ secrets.SYTUE_GIT_TOKEN || github.token }}
          IGNORAR: ${{ github.event.inputs.ignorar_ci }}
        run: |
          set -euo pipefail
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          # Deja en $estado el combinado del commit y lista lo que no está en verde.
          # Un corte de red o un 5xx NO es un veredicto: deja «sin-leer» y se
          # reintenta en la vuelta siguiente. Un 4xx sí lo es (token o permisos) y no
          # se arregla esperando. Un commit sin ningún check da estado vacío.
          #
          # EN GITHUB LOS JOBS DE ACTIONS SON «CHECK RUNS», no estados de commit: el
          # combinado de `/status` no los ve (y con cero estados dice «pending», que
          # aquí sería esperar para siempre). Se leen los check runs del commit y,
          # además, los estados de commit que publique algo externo. Los
          # `skipped`/`neutral` no cuentan. Los check runs de ESTA ejecución se
          # excluyen —el propio job `preparar` está «in_progress» mientras
          # pregunta— y se reconocen por la URL del run, que es lo único que los ata.
          #
          # CUENTA LA ÚLTIMA EJECUCIÓN DE CADA FLUJO, no todo lo que haya corrido
          # sobre el commit (decisión del dueño, 2026-10-05). Hasta entonces era el
          # peor de todos, y un flujo cancelado dejaba el commit en «failure» para
          # siempre aunque se relanzara y saliera verde: a v3.10.1 y a v3.11.0 les
          # cancelaron los flujos de la release y ya solo se podían publicar con
          # `ignorar_ci`. Lo que NO cambia: si la última ejecución de un job está
          # fallida, cancelada o sin terminar, sigue bloqueando igual que antes.
          #
          # «La misma ejecución de un job» es su FLUJO, no su nombre. El check run no
          # dice de qué flujo es, así que se cruza por `check_suite` con las
          # ejecuciones del commit (`actions/runs?head_sha=`), y de cada flujo se
          # queda la que EMPEZÓ más tarde —`run_started_at`, que con un reintento es
          # la hora del reintento—, sea de `release` o de `workflow_dispatch`: una
          # release cancelada solo se puede repetir despachando a mano. Emparejar por
          # nombre de job no vale por dos motivos medidos en v3.11.0: dos flujos
          # pueden llamar igual a un job, y una matriz cancelada antes de expandirse
          # deja un check con el nombre SIN EXPANDIR —«trivy image (» y la expresión
          # de la matriz tal cual— que ninguna ejecución posterior vuelve a producir,
          # así que bloquearía siempre.
          #
          # Lo que no se puede atar a una ejecución cuenta como antes: entero. Y la
          # última ejecución de un flujo cuenta aunque no tenga check runs —en cola
          # todavía, o muerta al arrancar—: si no, desaparecería de la cuenta justo
          # el flujo que no ha llegado a decir nada.
          #
          # LOS BARRIDOS PROGRAMADOS CONTRA PRODUCCIÓN NO BLOQUEAN, SOLO AVISAN
          # (decisión del dueño, 2026-10-05). `escritorio` y `mobile` corren cada
          # mañana contra lo DESPLEGADO, pero su check se cuelga del commit que sea
          # cabeza de `main` a esa hora: uno en rojo frenaba la publicación de un
          # commit que no había medido —pasó con v3.9.7— y, peor, la de la versión
          # que traía su arreglo. Se dejan fuera por lo que son, el evento
          # `schedule` de esos dos flujos, no por el nombre de un job: lanzados a
          # mano o por una release cuentan como cualquier otro, y un programado no
          # sustituye a uno de esos. Fuera del veredicto no es fuera de la vista: el
          # rojo sale como aviso, con su enlace, aquí y en el resumen de la ejecución.
          # La lista es la de los flujos con `schedule` que miden producción, y
          # puerta-ci-test.sh comprueba que sigue siendo esa.
          #
          # SE LEEN TODAS LAS PÁGINAS. La API devuelve 100 elementos como mucho por
          # petición, y hasta el 2026-10-05 solo se pedía la primera. Una tanda de
          # los seis flujos son 28 check runs (medido en cc71b8a2f) y v3.11.0 juntó
          # 57 con una tanda y su cadena de release: dos tandas más sobre el mismo
          # commit pasan de 100. La API da primero los más recientes, así que lo que
          # se quedaba sin contar era lo más antiguo, rojos incluidos. Una página
          # llena pide la siguiente; cualquier página que no se lea deja el conjunto
          # «sin-leer», nunca un veredicto a medias.
          #
          # .github/tests/puerta-ci-test.sh ejercita todo esto contra una forja de
          # mentira, y contra los check runs de v3.11.0 tal como quedaron.
          #
          # Deja en /tmp/<qué>-N.json todas las páginas de una lista y en $paginas
          # cuántas son. Devuelve 1 si una no se pudo leer y toca reintentar.
          leer_paginas() {  # <qué> <campo con la lista> <ruta, con su consulta>
            local que="$1" campo="$2" ruta="$3" pagina n=100
            for pagina in $(seq 1 20); do
              codigo="$(curl -sS -o "/tmp/$que-$pagina.json" -w '%{http_code}' --max-time 60 \
                -H "Authorization: token $TOKEN" -H 'Accept: application/vnd.github+json' \
                "$API/$ruta&per_page=100&page=$pagina" || true)"
              case "$codigo" in
                200) ;;
                4*)
                  echo "no se pudo leer el estado del CI de $GITHUB_SHA (HTTP $codigo en $que)." >&2
                  echo "  Sin esa respuesta no se sabe si lo que se va a publicar pasa las pruebas." >&2
                  exit 1 ;;
                *)
                  echo "  no se pudo leer el estado del CI de $GITHUB_SHA (HTTP $codigo en $que): se reintenta"
                  return 1 ;;
              esac
              n="$(PAGINA="/tmp/$que-$pagina.json" CAMPO="$campo" bun -e '
                const pagina = JSON.parse(await Bun.file(Bun.env.PAGINA).text());
                process.stdout.write(String((pagina[Bun.env.CAMPO] || []).length));')" || exit 1
              [ "$n" -eq 100 ] || break
            done
            if [ "$n" -eq 100 ]; then
              # Veinte páginas llenas: o hay más de 2000 elementos o la API no hace
              # caso de `page` y devuelve siempre la misma. En los dos casos lo leído
              # no es todo, y con una parte no se decide.
              echo "no se pudo leer entero el CI de $GITHUB_SHA: $pagina páginas llenas de $que y sigue habiendo más." >&2
              exit 1
            fi
            paginas="$pagina"
          }
          leer_estado() {
            estado=sin-leer
            local paginas paginas_checks
            leer_paginas checks check_runs "commits/$GITHUB_SHA/check-runs?filter=latest" || return 0
            paginas_checks="$paginas"
            leer_paginas runs workflow_runs "actions/runs?head_sha=$GITHUB_SHA" || return 0
            # Los estados de commit son opcionales: si no se leen, se sigue con los checks.
            curl -sS -o /tmp/estado.json --max-time 60 -H "Authorization: token $TOKEN" \
              -H 'Accept: application/vnd.github+json' "$API/commits/$GITHUB_SHA/status" \
              || echo '{"statuses":[]}' > /tmp/estado.json
            estado="$(RUN_ID="$GITHUB_RUN_ID" PAGINAS_CHECKS="$paginas_checks" PAGINAS_RUNS="$paginas" bun -e '
              const leer = async (que, campo) => {
                const todo = [];
                for (let p = 1; p <= Number(Bun.env[`PAGINAS_${que.toUpperCase()}`]); p++)
                  todo.push(...(JSON.parse(await Bun.file(`/tmp/${que}-${p}.json`).text())[campo] || []));
                return todo;
              };
              const checks = await leer("checks", "check_runs");
              const runs = await leer("runs", "workflow_runs");
              const estados = JSON.parse(await Bun.file("/tmp/estado.json").text()).statuses || [];
              const propio = `/actions/runs/${Bun.env.RUN_ID}/`;
              const verde = (c) => ["success", "skipped", "neutral"].includes(c);
              // Los barridos programados contra producción: avisan, no cuentan.
              const BARRIDOS = [".github/workflows/escritorio.yml", ".github/workflows/mobile.yml"];
              const esBarrido = (r) => r.event === "schedule" && BARRIDOS.includes(r.path);
              const cuentan = runs.filter((r) => !esBarrido(r));
              // La última de cada flujo. Las horas son ISO en UTC, que se ordenan
              // como texto; a igual hora, el id mayor.
              const cuando = (r) => `${r.run_started_at || r.created_at || ""} ${String(r.id).padStart(20, "0")}`;
              const ultima = new Map();
              for (const r of cuentan)
                if (!ultima.has(r.workflow_id) || cuando(r) > cuando(ultima.get(r.workflow_id))) ultima.set(r.workflow_id, r);
              const deSuite = new Map(runs.map((r) => [r.check_suite_id, r]));
              const filas = [];
              const conChecks = new Set();
              for (const c of checks) {
                if ((c.html_url || "").includes(propio)) continue;
                // Xcode Cloud publica en el commit sus archivos para la App Store: un rojo
                // suyo (el cupo de subidas de Apple, 90383) no dice nada de estas imágenes.
                if (c.app?.slug === "xcode-cloud") continue;
                const r = deSuite.get(c.check_suite?.id);
                if (r && (esBarrido(r) || ultima.get(r.workflow_id) !== r)) continue;
                if (r) conChecks.add(r.id);
                const veredicto = c.status !== "completed" ? "pending" : verde(c.conclusion) ? "success" : "failure";
                filas.push({nombre: c.name, veredicto, detalle: c.status !== "completed" ? c.status : c.conclusion});
              }
              for (const r of cuentan) {
                if (String(r.id) === Bun.env.RUN_ID) continue;
                const u = ultima.get(r.workflow_id);
                if (u !== r) {
                  // Queda escrito qué rojo se ha dejado de contar y por cuál.
                  if (!verde(r.conclusion))
                    console.error(`    · no cuenta ${r.name}, ejecución ${r.id} (${r.conclusion || r.status}): la sustituye la ${u.id}`);
                } else if (r.status !== "completed") {
                  filas.push({nombre: `${r.name}, ejecución ${r.id}`, veredicto: "pending", detalle: r.status});
                } else if (!conChecks.has(r.id) && !verde(r.conclusion)) {
                  filas.push({nombre: `${r.name}, ejecución ${r.id} (sin ningún job)`, veredicto: "failure", detalle: r.conclusion});
                }
              }
              for (const s of estados) {
                // Y los ESTADOS de commit que deja Xcode Cloud («calcus | Default»), por lo
                // mismo que sus checks: v3.12.28 se quedó sin imágenes por ellos.
                // Desde v3.13.0 llegan SIN `creator`: se reconocen también por su enlace
                // a App Store Connect, que no puede poner nadie más que Apple.
                if (s.creator?.login === "xcode-cloud[bot]" || String(s.target_url ?? "").startsWith("https://appstoreconnect.apple.com/")) continue;
                const veredicto = s.state === "success" ? "success" : s.state === "pending" ? "pending" : "failure";
                filas.push({nombre: s.context, veredicto, detalle: s.state});
              }
              const combinado = filas.length === 0 ? ""
                : filas.some(f => f.veredicto === "failure") ? "failure"
                : filas.some(f => f.veredicto === "pending") ? "pending" : "success";
              for (const f of filas) if (f.veredicto !== "success") console.error(`    ✗ ${f.detalle}  ${f.nombre}`);
              // Los avisos, al log en cada vuelta y a un fichero para el resumen.
              const avisos = runs.filter((r) => esBarrido(r) && r.status === "completed" && !verde(r.conclusion)).map((r) =>
                `aviso, no bloquea: el barrido programado ${r.name} está en ${r.conclusion}. Mide lo desplegado, no este commit: ` +
                (r.html_url || `${Bun.env.GITHUB_SERVER_URL}/${Bun.env.GITHUB_REPOSITORY}/actions/runs/${r.id}`));
              for (const a of avisos) console.error(`    ⚠ ${a}`);
              await Bun.write("/tmp/avisos.md", avisos.map((a) => `- ⚠ ${a}\n`).join(""));
              process.stdout.write(combinado);')"
            echo "  estado combinado de $GITHUB_SHA: ${estado:-sin ningún check}"
          }

          # SE ESPERA AL CI, NO SE RELANZA. Hasta el 2026-09-23 un `pending` aplazaba
          # la publicación y el flujo se despachaba a sí mismo «al final de la cola»,
          # que con UN runner en serie era después del resto de la release. Con tres
          # runners y el pool, el relanzado arrancaba a los 2 s, volvía a ver
          # `pending` y salía rojo: v3.6.2 se quedó sin imágenes (run 2708) mientras
          # quality seguía corriendo. Esperar aquí ocupa un runner; el grupo de
          # concurrencia `imagenes-produccion` garantiza que es uno como mucho, y los
          # despachos no crean estados de commit, así que no se espera a sí mismo.
          #
          # En cada vuelta se lista lo que sigue pendiente, y en cuanto el combinado
          # deja de ser `pending` se decide con él. El tope va justo por debajo del
          # `timeout-minutes` del job, para que el rojo diga qué esperaba.
          limite=$(( $(date +%s) + 170 * 60 ))
          leer_estado
          while [ "$estado" = sin-leer ] || { [ "$estado" = pending ] && [ "$IGNORAR" != true ]; }; do
            if [ "$(date +%s)" -ge "$limite" ]; then
              echo "el CI de $GITHUB_SHA sigue en «$estado» tras 170 minutos." >&2
              echo "  Arriba está lo que no termina. Mira los runners; si el atasco es suyo y" >&2
              echo "  no del código, relanza marcando «ignorar_ci» y di por qué." >&2
              exit 1
            fi
            sleep 60
            leer_estado
          done

          # Los avisos, UNA vez y donde se ven sin abrir el log: el resumen de la
          # ejecución. Se publique o no: un barrido en rojo es noticia igual.
          [ ! -s /tmp/avisos.md ] || cat /tmp/avisos.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          if [ "$estado" = success ]; then
            echo "  ✓ el CI del commit está en verde"
            echo "publicar=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IGNORAR" = true ]; then
            # Ruidoso a propósito: queda escrito en el log de la publicación.
            echo "  ⚠ SE PUBLICA CON EL CI EN «${estado}» porque se pidió ignorar_ci."
            echo "publicar=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "" >&2
          echo "el CI de este commit está en «${estado:-sin ningún check}»: arriba están los contextos que fallan." >&2
          echo "  Publicar esto mete en producción algo que las pruebas rechazan." >&2
          echo "  Si de verdad hay que publicar —p. ej. el fallo es del runner y no del" >&2
          echo "  código—, relanza marcando «ignorar_ci» y di por qué." >&2
          exit 1

      - name: Cliente Docker para la publicación
        if: steps.decidir.outputs.publicar == 'si'
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh docker

      - name: Comprobar la credencial ANTES de construir
        if: steps.decidir.outputs.publicar == 'si'
        env:
          TOKEN: ${{ secrets.SYTUE_GIT_PACKAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Se comprueba primero para no descubrir a los 40 minutos —con las 26
          # imágenes ya construidas— que no se pueden subir.
          if [ -z "${TOKEN:-}" ]; then
            echo "Sin credencial para el registro ${DESTINO%%/*}." >&2
            echo "  En ghcr.io basta el token del job con «packages: write»; para otro registro," >&2
            echo "  guarda su token en el secreto SYTUE_GIT_PACKAGES_TOKEN." >&2
            exit 1
          fi
          # El usuario es el dueño del espacio del registro (`DESTINO`), no quien
          # lanzó el flujo: en ghcr.io da igual, en otro registro no tiene por qué.
          echo "$TOKEN" | docker login "${DESTINO%%/*}" -u "${DESTINO#*/}" --password-stdin

      # LA CADENA DE UNA RELEASE NO REPITE LO QUE YA ESTÁ PUBLICADO.
      #
      # Una release urgente se publica despachando esto a mano con `ignorar_ci`,
      # sin esperar al CI. Pero la release también dispara `security`, que al salir
      # verde despacha esto OTRA VEZ con `pipeline_release=true` para llegar a
      # `release-desktop`. Medido en v3.11.1 (2026-10-05): la ejecución manual
      # 37353988726 publicó las 55 imágenes, y la de la cadena, 37359681242, las
      # volvió a construir y a subir enteras —tres turnos de casi cinco minutos—.
      # No era solo runner tirado: bajo la MISMA etiqueta quedó otro contenido
      # (`sytue-id:v3.11.1-amd64` pasó de sha256:cc747215… a sha256:8015247e…), que
      # es como un servidor acaba con dos builds de «la misma versión».
      #
      # Solo se salta cuando el despacho viene de la cadena Y la marca
      # `desplegable/<perfil>/<tag>` apunta a ESTE commit. La marca la pone `cerrar`
      # después de comprobar lo publicado, así que es la señal de que está entero.
      # Se compara el commit y no el nombre: una marca que apunte a otro commit no
      # dice nada de este. Un despacho a mano construye SIEMPRE: quien lo lanza
      # quiere publicar, también si es por segunda vez. Y si la primera ejecución
      # sigue en marcha, esta espera su turno en el grupo `imagenes-produccion` y
      # pregunta cuando la otra ya ha terminado, con marca o sin ella.
      #
      # Lo prueba .github/tests/puerta-ci-test.sh.
      - name: ¿Están ya publicadas las imágenes de este commit?
        id: ya
        if: steps.decidir.outputs.publicar == 'si' && github.event.inputs.pipeline_release == 'true'
        env:
          TOKEN: ${{ secrets.SYTUE_GIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          # Devuelve 0 solo si la marca existe y apunta a este commit. Ante cualquier
          # otra cosa —no existe, apunta a otro, no se pudo leer— devuelve 1 y se
          # construye: repetir cuesta minutos de runner, y saltarse una publicación
          # deja al servidor sin versión. Dice siempre cuál de los casos fue.
          ya_publicadas() {
            local marca="desplegable/$PERFIL/$TAG" codigo sha quien
            codigo="$(curl -sS -o /tmp/marca-previa.json -w '%{http_code}' --max-time 60 \
              -H "Authorization: token $TOKEN" -H 'Accept: application/vnd.github+json' \
              "$API/git/ref/tags/$marca" || true)"
            case "$codigo" in
              200) ;;
              404)
                echo "  $marca no existe todavía: se construye."
                return 1 ;;
              *)
                echo "  no se pudo leer $marca (HTTP $codigo): ante la duda, se construye."
                return 1 ;;
            esac
            # LA MARCA ES UNA ETIQUETA ANOTADA desde que lleva los digest de lo
            # publicado (auditoría 2026-10-06, CI-01): la referencia apunta al objeto
            # etiqueta y el commit está un salto más allá. Las anteriores, ligeras,
            # apuntan al commit directamente. Se leen las dos.
            a_que_apunta() {
              bun -e '
                const marca = JSON.parse(await Bun.file("/tmp/marca-previa.json").text());
                process.stdout.write(`${marca.object?.type || ""} ${marca.object?.sha || ""}`);' || true
            }
            sha="$(a_que_apunta)"
            if [ "${sha%% *}" = tag ]; then
              codigo="$(curl -sS -o /tmp/marca-previa.json -w '%{http_code}' --max-time 60 \
                -H "Authorization: token $TOKEN" -H 'Accept: application/vnd.github+json' \
                "$API/git/tags/${sha#* }" || true)"
              if [ "$codigo" != 200 ]; then
                echo "  no se pudo leer la etiqueta anotada de $marca (HTTP $codigo): ante la duda, se construye."
                return 1
              fi
              sha="$(a_que_apunta)"
            fi
            if [ "${sha%% *}" = commit ]; then sha="${sha#* }"; else sha=""; fi
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "  $marca existe pero apunta a ${sha:-algo que no es un commit}, no a $GITHUB_SHA: se construye."
              return 1
            fi
            # Quién las publicó: la última ejecución verde de este mismo flujo sobre
            # el commit, de la lista que el paso anterior dejó en /tmp.
            quien="$(RUN_ID="$GITHUB_RUN_ID" bun -e '
              const runs = [];
              for await (const f of new Bun.Glob("runs-*.json").scan("/tmp/"))
                runs.push(...(JSON.parse(await Bun.file(`/tmp/${f}`).text()).workflow_runs || []));
              const esta = runs.find((r) => String(r.id) === Bun.env.RUN_ID);
              const antes = runs
                .filter((r) => esta && r.workflow_id === esta.workflow_id && r !== esta && r.conclusion === "success")
                .sort((a, b) => String(b.run_started_at).localeCompare(String(a.run_started_at)))[0];
              if (antes) process.stdout.write(`la ejecución ${antes.id}` + (antes.html_url ? ` (${antes.html_url})` : ""));')" || quien=""
            echo "  $marca ya apunta a $GITHUB_SHA: imágenes ya publicadas por ${quien:-una ejecución anterior}, no se reconstruyen."
            echo "Imágenes ya publicadas por ${quien:-una ejecución anterior} (\`$marca\` apunta a \`$GITHUB_SHA\`): no se reconstruyen. Se despacha \`release-desktop\`." \
              >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 0
          }
          if ya_publicadas; then
            echo "ya_publicadas=si" >> "$GITHUB_OUTPUT"
          fi

  construir:
    name: Construir y publicar (turno ${{ matrix.turno }} de 3)
    needs: preparar
    if: needs.preparar.outputs.publicar == 'si' && needs.preparar.outputs.ya_publicadas != 'si'
    runs-on: sytue-arm64
    container: *ci
    # ESTE RELOJ ES EL QUE MATÓ LA v3.3.7, y no el demonio Docker.
    #
    # Los tres turnos del run 2520 cayeron con «context deadline exceeded …
    # unable to copy /var/run/act/workflow/SUMMARY.md from container to host»,
    # que se lee como un demonio sin respuesta en un host saturado. No lo era: el
    # turno 1 arrancó a las 16:15:57,165 y murió a las 17:15:57,175, y el turno 3
    # a las 16:15:58,033 → 17:15:58,045. Sesenta minutos y diez milisegundos, en
    # dos runners distintos, y cayendo en pasos distintos del build (uno en `ENV
    # NODE_ENV=development`, que no toca disco). Vence ESTE plazo; el mensaje del
    # demonio es el efecto —act sigue con la limpieza arrastrando el contexto ya
    # caducado— y aparece sesenta minutos después de la causa.
    #
    # 90 y no 60: el doble de lo medido, que es la misma regla con la que se
    # eligieron los 60, ahora con el número al lado. Con una arquitectura por
    # destino (ver el paso de frontends) el turno más cargado son cinco
    # construcciones de 7,5 min más el clonado y los servicios, ~43 min. Dejarlo
    # en 60 era volver a un 28 % de margen sobre un reloj que ya se agotó, y el
    # fallo es asimétrico: un turno colgado bloquea un runner media hora más,
    # pero un reloj corto tira la publicación al 90 % y se lleva 45 minutos de
    # tres runners y ~45 GB de disco. El tope duro sigue siendo el
    # `runner.timeout: 3h` de los runners.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      # Sin cortar a la primera: si un turno se cae, los otros dos siguen y el
      # log dice de una vez TODO lo que falta en el registro. La marca
      # `desplegable` la pone `cerrar`, y solo si los tres salen bien, así que un
      # turno caído no deja una versión medio publicada al alcance del servidor.
      fail-fast: false
      matrix:
        turno: [1, 2, 3]
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DOMINIO: ${{ github.event.inputs.dominio || 'sytue.eu' }}
      PERFIL: ${{ github.event.inputs.perfil || 'completo' }}
      DESTINO: ${{ vars.SYTUE_REGISTRY || 'ghcr.io/thinkddr' }}
      TURNO: ${{ matrix.turno }}
      TURNOS: "3"
    steps:
      - name: Clonar el commit que se va a publicar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Un turno engorda ~15 GB en el disco del CI. Sin ese sitio, fallar YA y
      # diciéndolo, no a media publicación con «no space left on device» (28/09).
      - name: Comprobar el disco del CI
        run: scripts/ci-disco-libre.sh 20

      # `go` y `crane` para las imágenes de servicio, que no se construyen con
      # ningún demonio (scripts/publicar-imagen-go.sh); `buildctl` para lo que sí
      # pasa por un Dockerfile —los frontends y el servicio que lleva algo que no es
      # un binario—, contra el BuildKit del CI (ADR 0066). El cliente de Docker se
      # queda solo para `docker login`, que es el que escribe la credencial que leen
      # `crane` y `buildctl`.
      - name: Herramientas para construir y publicar
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh docker go crane buildctl

      - name: Entrar en el registro
        env:
          TOKEN: ${{ secrets.SYTUE_GIT_PACKAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # `preparar` ya comprobó que el secreto existe; la sesión de docker no
          # se hereda entre jobs, así que cada turno entra por su cuenta.
          # `crane` y `buildctl` leen este mismo ~/.docker/config.json, así que con
          # esto entra todo lo que publica el turno.
          echo "$TOKEN" | docker login "${DESTINO%%/*}" -u "${DESTINO#*/}" --password-stdin

      # CADA IMAGEN SALE SOLO PARA LA ARQUITECTURA DE SU DESTINO.
      #
      # Los tres runners viven en `sytue-rooms-media`, que es ARM64, y los
      # Dockerfiles no fijan plataforma: cada imagen salía con la arquitectura de
      # quien la construyó. El servidor de la suite es x86_64, así que llevaba
      # cuatro versiones sin poder actualizarse —una imagen ajena no falla al
      # descargarse, falla al ARRANCAR con `exec format error`— y nada salía en
      # rojo. Se arregló publicando TODO para las dos, que funciona y cuesta el
      # doble: de las 27 imágenes del perfil piloto, solo UNA la piden los dos
      # destinos. Quién necesita qué —y cómo se midió— está en
      # `scripts/arquitecturas-imagen.sh`, que es de donde sale esta lista y
      # también contra lo que compara el guardián de `cerrar`.
      #
      # Los servicios no pasan por un Dockerfile: el binario se cruza nativo
      # (`GOARCH=amd64 go build` en ARM cuesta lo mismo) y la imagen se monta con
      # `crane`. Solo el que mete en la imagen algo que no es un binario construye
      # su Dockerfile, con el BuildKit del CI.
      - name: Publicar las imágenes de servidor
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # El catálogo y las arquitecturas salen del mismo guion, que a su vez
          # los saca de build-images.sh: ni dos listas que diverjan ni dos ideas
          # distintas de a dónde va cada imagen.
          mapfile -t servicios < <(scripts/arquitecturas-imagen.sh | grep '^go	')
          # `mapfile` NO ve el código de salida de lo que hay al otro lado de la
          # tubería: si el catálogo se rompiera, la lista saldría vacía, el bucle
          # no haría nada y el turno terminaría EN VERDE sin publicar una imagen.
          [ "${#servicios[@]}" -gt 0 ] ||
            { echo "el catálogo de servicios salió vacío: no se publicaría nada." >&2; exit 1; }
          # UNA DE CADA TRES POR POSICIÓN. El reparto va sobre la lista YA
          # filtrada por perfil: con las de cloud dentro, el turno que cargara
          # con ellas haría cuatro imágenes menos que los otros.
          mios=()
          for i in "${!servicios[@]}"; do
            [ $(((i + 1) % TURNOS)) -eq $((TURNO % TURNOS)) ] && mios+=("${servicios[$i]}")
          done
          echo "servicios en este turno: ${#mios[@]} de ${#servicios[@]} publicables (perfil $PERFIL)"
          for linea in "${mios[@]}"; do
            IFS=$'\t' read -r _ nombre arqs dockerfile <<<"$linea"
            # VERSION Y COMMIT los hornea el guion leyendo los `ENV` del propio
            # Dockerfile (`SYTUE_BUILD_VERSION`, `SYTUE_BUILD_COMMIT`): son dos
            # preguntas distintas —qué release corre y qué código es— y sin ellas
            # el panel de versiones de la consola enseña un guion.
            ARQUITECTURAS="$arqs" scripts/publicar-imagen-go.sh "$nombre" "$dockerfile"
          done

      # LOS FRONTENDS SALEN SOLO PARA amd64, y AQUÍ ESTABA EL DESPERDICIO GORDO.
      #
      # Un frontend no se puede montar con `crane` como un servicio: sus
      # `node_modules` de producción traen 16 binarios nativos (medido), así que
      # cada arquitectura es una construcción COMPLETA —57 pasos con `bun
      # install` y `astro build`—. Trece frontends por dos eran veintiséis, y los
      # trece los despliega el piloto, que es amd64: la mitad no la usaba nadie.
      # No es solo coste: la v3.3.7 murió con los tres turnos en `context
      # deadline exceeded` contra el demonio, tres de esos builds a la vez en 6
      # vCPU con el disco al 77 %.
      #
      # La cruzada sigue siendo la que se construye —el runner es ARM64 y el
      # destino amd64—, con `bun install --cpu x64` y `crane rebase` para la
      # base, que es donde vive el único ejecutable que quedaría mal: el propio
      # `bun`. Lo que desaparece es la nativa arm64, que no despliega nadie:
      # sytue.com recibe su propio juego de frontends Astro para hornear su dominio.
      - name: Publicar los frontends
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Mismo catálogo que los servicios y que el guardián de `cerrar`;
          # cloud-dashboard entra solo en el perfil completo, y eso lo decide el
          # guion, no una segunda lista escrita aquí.
          mapfile -t frontends < <(scripts/arquitecturas-imagen.sh | grep '^fe	')
          # Ver la nota del paso de servicios: una lista vacía sale en verde.
          [ "${#frontends[@]}" -gt 0 ] ||
            { echo "el catálogo de frontends salió vacío: no se publicaría nada." >&2; exit 1; }
          # Los frontends se reparten en su propia vuelta y no continuando la
          # cuenta de los servicios: son los caros —Bun y Astro, minutos frente a
          # segundos—, y encadenar los dos repartos haría que un turno se llevara
          # cinco y otro tres. Contados aparte, ninguno se aleja más de uno.
          for i in "${!frontends[@]}"; do
            [ $(((i + 1) % TURNOS)) -eq $((TURNO % TURNOS)) ] || continue
            IFS=$'\t' read -r _ _nombre arqs app <<<"${frontends[$i]}"
            # Los build-args —los MISMOS que bin/build-images.sh— los pasa el
            # guion. Si faltara uno, la imagen se construye igual y el fallo
            # aparece en el navegador del usuario, no en este log: los frontends
            # Astro hornean las URL públicas en tiempo de build, y VERSION y
            # COMMIT son los que contesta su /healthz y pinta el panel de
            # versiones de la consola.
            ARQUITECTURAS="$arqs" scripts/publicar-imagen-frontend.sh "$app"
          done

          # EL SEGUNDO JUEGO: sytue.com (ADR 0049). Misma fuente, otro DOMINIO
          # horneado y otro nombre de imagen (`-com`), porque la etiqueta es la
          # misma versión y si no la segunda pisaría a la primera.
          #
          # Va en su PROPIA vuelta de reparto, como los frontends de arriba y
          # por lo mismo: repartidas en la misma cuenta, un turno se llevaría
          # las dos variantes de la misma app y otro ninguna.
          #
          # Estas son ARM64, o sea las NATIVAS del runner: sin `--cpu` ni
          # `crane rebase`. Medido en el piloto el 2026-09-21, la segunda
          # variante de una app añade ~7 MB al registro y no 647: todas las
          # capas menos el `dist` son las mismas que las del juego de `.eu`.
          mapfile -t frentecom < <(scripts/arquitecturas-imagen.sh | grep '^fecom	')
          for i in "${!frentecom[@]}"; do
            [ $(((i + 1) % TURNOS)) -eq $((TURNO % TURNOS)) ] || continue
            IFS=$'\t' read -r _ _nombre arqs app <<<"${frentecom[$i]}"
            # El DOMINIO es el ÚNICO build-arg que cambia: de él salen el issuer
            # horneado (que es el del apex de los ENLACES, no el del BFF — ese
            # es `SYTUE_OIDC_ISSUER` en ejecución y sigue apuntando a
            # id.sytue.eu) y las bases públicas de hub, drive, docs y cloud.
            DOMINIO=sytue.com SUFIJO=-com ARQUITECTURAS="$arqs" \
              scripts/publicar-imagen-frontend.sh "$app"
          done

      # LA SEÑAL QUE ESPERA EL SERVIDOR. Va al final a propósito: es lo que
      # distingue «esta versión existe» de «esta versión se puede desplegar».
      # El tag `vX.Y.Z` existe desde que se corta la versión, pero las 26
      # imágenes tardan ~40 minutos; un servidor que mirase el tag desplegaría
      # en ese hueco y se quedaría en ImagePullBackOff. `desplegable/vX.Y.Z`
      # solo aparece cuando ya está subida la última.
      #
      # LLEVA EL PERFIL EN EL NOMBRE, y no es cosmético: en piloto faltan cinco
      # imágenes a propósito, así que un servidor con CLOUD_ENABLED=true que
      # desplegara esta versión se quedaría con cinco pods sin imagen. Con el
      # perfil en la marca, `actualizar-suite.sh` lo ve antes de tocar nada.
      #
      # El servidor la recoge con bin/actualizar-suite.sh (timer de systemd, o a
      # mano con `systemctl start sytue-actualizar`). El CI NO entra en
      # producción: no hay llave del runner hacia dentro, que es la misma
      # decisión que documenta desplegar-forja.yml.
  cerrar:
    name: Comprobar lo publicado y sus digest
    needs: [preparar, construir]
    # `always()` y no `!cancelled()`: con este último Forgejo ni siquiera CREA el
    # job (ver la nota de release-desktop.yml, #298). Corre aunque un turno caiga
    # para que un paso de abajo lo diga y ponga el job en rojo.
    if: always() && needs.preparar.outputs.publicar == 'si' && needs.preparar.outputs.ya_publicadas != 'si'
    runs-on: sytue-arm64
    container: *ci
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      cuerpo: ${{ steps.manifiesto.outputs.cuerpo }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      PERFIL: ${{ github.event.inputs.perfil || 'completo' }}
      DESTINO: ${{ vars.SYTUE_REGISTRY || 'ghcr.io/thinkddr' }}
    steps:
      - name: Clonar el commit que se va a publicar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # LO PUBLICADO TIENE QUE PODER ARRANCAR EN SU DESTINO, y esto no lo miraba nadie.
      #
      # Los Dockerfiles no fijan plataforma, así que cada imagen sale con la arquitectura
      # del runner que la construyó. Cuando los runners se mudaron a `sytue-rooms-media`
      # —ARM64— la tubería empezó a publicar arm64 para un servidor que es x86_64, y como
      # una imagen ajena no falla al descargarse sino al ARRANCAR, con `exec format
      # error`, el síntoma aparece lejos de la causa. Medido el 2026-09-21 en `sytue-id`:
      # v3.1.13 arm64, v3.2.0 amd64, v3.2.2 y v3.2.3 arm64 — y el servidor llevaba desde
      # la v3.2.0 sin poder actualizarse, cuatro versiones, sin que nada saliera en rojo.
      #
      # ANTES MIRABA DOS IMÁGENES DE MUESTRA contra UNA arquitectura esperada para todas.
      # Desde que cada imagen sale solo para la de su destino eso ya no vale por partida
      # doble: «la esperada» depende de la imagen, y una muestra de dos deja trece
      # frontends sin mirar. Ahora se comprueban TODAS, cada una contra el mismo fichero
      # del que salió lo que se construyó.
      #
      # Se comprueba ANTES de marcar: las imágenes ya están subidas y eso no se deshace,
      # pero la marca es la que hace que el servidor se las descargue, y una versión que
      # no puede arrancar allí no es desplegable por definición.
      - name: Comprobar que cada imagen salió en la arquitectura de su destino
        if: needs.construir.result == 'success'
        env:
          SYTUE_GIT_USER: ${{ github.repository_owner }}
          SYTUE_GIT_PACKAGES_TOKEN: ${{ secrets.SYTUE_GIT_PACKAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh bun
          # La misma pasada apunta el digest de cada imagen (ver el paso de abajo).
          SYTUE_DIGESTS=/tmp/digests.txt scripts/comprobar-arquitecturas-publicadas.sh

      - name: Exigir que los tres turnos hayan publicado
        if: needs.construir.result != 'success'
        run: |
          echo "algún turno no terminó («${{ needs.construir.result }}»): el registro tiene" >&2
          echo "  parte de $TAG y esta versión NO se marca como desplegable." >&2
          echo "  Mira arriba qué turno falló y relanza el flujo sobre la misma etiqueta:" >&2
          echo "  las que ya están subidas se reconstruyen, pero no se publica a medias." >&2
          exit 1

      # QUÉ SE HA PUBLICADO, EXACTAMENTE. La marca `desplegable` decía «esta versión
      # ya se puede desplegar» y el servidor pedía las imágenes por su etiqueta, que
      # cualquiera con `packages: write` puede volver a apuntar a otra cosa. Ahora
      # la marca lleva el digest de cada imagen tal como quedó en el registro
      # (auditoría 2026-10-06, CI-01), y este es su cuerpo: cabecera, y una línea
      # `sha256:…  nombre:etiqueta` por imagen. El formato es contrato con el piloto
      # y está fijado en .github/tests/firma-publicacion-test.sh.
      #
      # Este job NO firma ni escribe en el repositorio: solo lee el registro. El
      # cuerpo viaja al job `marcar` como salida, en base64 porque son varias líneas.
      - name: Manifiesto de lo publicado
        id: manifiesto
        if: needs.construir.result == 'success'
        run: |
          set -euo pipefail
          esperadas="$(scripts/arquitecturas-imagen.sh | wc -l)"
          LC_ALL=C sort -k2 -u /tmp/digests.txt > /tmp/digests-ordenados.txt
          apuntadas="$(wc -l < /tmp/digests-ordenados.txt)"
          # Con una de menos, el servidor desplegaría una imagen que nadie ha fijado.
          if [ "$apuntadas" -ne "$esperadas" ] || grep -vqE '^sha256:[0-9a-f]{64}  [a-z0-9-]+:[A-Za-z0-9._-]+$' /tmp/digests-ordenados.txt; then
            echo "el manifiesto tiene $apuntadas imágenes y el catálogo $esperadas, o alguna línea no es «sha256:…  nombre:etiqueta»:" >&2
            cat /tmp/digests-ordenados.txt >&2
            exit 1
          fi
          {
            printf 'sytue-desplegable 1\nversion: %s\nperfil: %s\ncommit: %s\nregistro: %s\n' \
              "$TAG" "$PERFIL" "$GITHUB_SHA" "$DESTINO"
            cat /tmp/digests-ordenados.txt
          } > /tmp/desplegable.txt
          cat /tmp/desplegable.txt
          echo "cuerpo=$(base64 -w0 /tmp/desplegable.txt)" >> "$GITHUB_OUTPUT"

  # EL ÚNICO JOB QUE ESCRIBE EN EL REPOSITORIO, Y EL ÚNICO QUE VE LA CLAVE.
  #
  # Firma el manifiesto de `cerrar` y crea la marca `desplegable/<perfil>/<tag>`
  # como etiqueta ANOTADA con ese manifiesto dentro. Es mínimo a propósito: no
  # construye, no compila y no monta la caché de Go ni el socket de Docker. Cuando
  # la versión se firma corre en el entorno «publicacion», que es donde vive la
  # clave y donde el dueño aprueba cada versión; lo que corre a su lado es un
  # checkout, cosign bajado por su sha256 y dos peticiones a la API.
  #
  # `environment` con una expresión que da cadena vacía es «sin entorno»: comprobado
  # el 2026-10-06 en una rama canario (ejecución 37458315310), el job corre y no se
  # crea ningún entorno. Así este flujo no cambia nada hasta que exista la clave.
  marcar:
    name: Firmar y marcar como desplegable
    needs: [preparar, cerrar]
    if: needs.cerrar.result == 'success'
    runs-on: sytue-arm64
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
    environment: ${{ needs.preparar.outputs.firma == 'si' && 'publicacion' || '' }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      PERFIL: ${{ github.event.inputs.perfil || 'completo' }}
      DESTINO: ${{ vars.SYTUE_REGISTRY || 'ghcr.io/thinkddr' }}
      FIRMA: ${{ needs.preparar.outputs.firma }}
    steps:
      - name: Clonar el commit que se va a publicar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Herramientas para firmar
        if: needs.preparar.outputs.firma == 'si'
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh jq cosign

      # Sin clave pública en el commit, `firmar` avisa y no escribe nada. Con ella y
      # sin la privada, falla: lo publicado no verificaría en el piloto. Y lo que
      # firma lo comprueba contra la pública antes de darlo por bueno.
      - name: Firmar el manifiesto
        env:
          CUERPO: ${{ needs.cerrar.outputs.cuerpo }}
          SYTUE_FIRMA_CLAVE: ${{ secrets.SYTUE_FIRMA_CLAVE }}
          SYTUE_FIRMA_PASSWORD: ${{ secrets.SYTUE_FIRMA_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$CUERPO" | base64 -d > /tmp/desplegable.txt
          # Lo que llega tiene que ser el manifiesto de ESTA versión y ESTE commit.
          [ "$(sed -n 1p /tmp/desplegable.txt)" = 'sytue-desplegable 1' ] &&
            grep -qx "version: $TAG" /tmp/desplegable.txt &&
            grep -qx "commit: $GITHUB_SHA" /tmp/desplegable.txt || {
            echo "el manifiesto recibido no es el de $TAG en $GITHUB_SHA: no se marca." >&2
            exit 1
          }
          scripts/firma-publicacion.sh firmar /tmp/desplegable.txt

      # LA SEÑAL QUE ESPERA EL SERVIDOR, y va al final a propósito: es lo que
      # distingue «esta versión existe» de «esta versión se puede desplegar».
      - name: Marcar la versión como desplegable
        env:
          # La API puede exigir Workflows:write si main cambió sus workflows
          # después de cortar el tag. GITHUB_TOKEN no admite ese permiso YAML.
          # Sólo este job recibe la credencial dedicada, si está configurada.
          TOKEN: ${{ secrets.SYTUE_PUBLICACION_TOKEN || github.token }}
        run: |
          set -euo pipefail
          MARCA="desplegable/$PERFIL/$TAG"
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          cp /tmp/desplegable.txt /tmp/mensaje.txt
          [ ! -s /tmp/desplegable.txt.sig ] ||
            printf 'firma: %s\n' "$(cat /tmp/desplegable.txt.sig)" >> /tmp/mensaje.txt
          pedir() {  # <método> <ruta> <fichero con el cuerpo>: deja la respuesta en /tmp/respuesta.json
            curl -sS -o /tmp/respuesta.json -w '%{http_code}' --max-time 60 \
              -X "$1" -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
              -H 'Accept: application/vnd.github+json' --data "@$3" "$API/$2" || true
          }
          no_se_pudo() {
            echo "  ✗ no se pudo crear la marca $MARCA (HTTP $1):" >&2
            cat /tmp/respuesta.json >&2 || true
            echo "" >&2
            echo "  Las imágenes SÍ están publicadas; lo que falta es la señal, y el" >&2
            echo "  servidor no la recogerá solo. No hace falta reconstruir imágenes." >&2
            if [ "$1" = 403 ]; then
              echo "  Este job ya pide Contents:write; GitHub puede exigir además" >&2
              echo "  Workflows:write para crear el ref del tag. GITHUB_TOKEN no lo admite." >&2
              echo "  Configura SYTUE_PUBLICACION_TOKEN sólo para este repositorio con esos" >&2
              echo "  permisos, o recupera esta marca con una sesión gh ya autorizada:" >&2
            fi
            echo "  python3 scripts/recuperar-marca-publicacion.py --run $GITHUB_RUN_ID --tag $TAG --perfil $PERFIL --publicar" >&2
            echo "  El helper exige todos los turnos y el cierre verdes, reutiliza sus" >&2
            echo "  digest exactos y no encadena publicación de clientes." >&2
            exit 1
          }

          # Etiqueta ANOTADA sobre el commit que se acaba de construir: el objeto
          # etiqueta primero, y después la referencia que apunta a él.
          MARCA="$MARCA" node -e '
            const fs = require("fs");
            fs.writeFileSync("/tmp/etiqueta.json", JSON.stringify({
              tag: process.env.MARCA, message: fs.readFileSync("/tmp/mensaje.txt", "utf8"),
              object: process.env.GITHUB_SHA, type: "commit"}));'
          codigo="$(pedir POST git/tags /tmp/etiqueta.json)"
          [ "$codigo" = 201 ] || no_se_pudo "$codigo"
          objeto="$(node -e 'process.stdout.write(require("/tmp/respuesta.json").sha || "")')"
          [ -n "$objeto" ] || no_se_pudo "$codigo"

          printf '{"ref":"refs/tags/%s","sha":"%s"}' "$MARCA" "$objeto" > /tmp/ref.json
          codigo="$(pedir POST git/refs /tmp/ref.json)"
          if [ "$codigo" = 422 ]; then
            # Ya existía: se relanzó el flujo con la misma etiqueta y las imágenes
            # se han vuelto a publicar, con otros digest. La marca tiene que decir
            # lo que hay AHORA en el registro, así que se mueve.
            printf '{"sha":"%s","force":true}' "$objeto" > /tmp/ref.json
            codigo="$(pedir PATCH "git/refs/tags/$MARCA" /tmp/ref.json)"
            [ "$codigo" = 200 ] || no_se_pudo "$codigo"
            echo "  ✓ marca $MARCA movida a lo que se acaba de publicar"
          elif [ "$codigo" = 201 ]; then
            echo "  ✓ marcada $MARCA"
          else
            no_se_pudo "$codigo"
          fi

      - name: Qué hacer ahora en el servidor
        run: |
          echo "Publicado en $DESTINO con la etiqueta $TAG para el perfil $PERFIL."
          echo
          echo "Con el timer instalado (bin/install-actualizar.sh) no hay que hacer nada:"
          echo "el servidor lo recoge en los siguientes diez minutos y verifica."
          echo
          echo "Para no esperar, en el servidor:"
          echo "  sudo systemctl start sytue-actualizar"
          echo
          echo "La primera vez, el .env necesita IMAGE_SOURCE=registry e"
          echo "IMAGE_REGISTRY=$DESTINO, y la credencial de descarga:"
          echo "  sudo ./bin/configurar-registro.sh"

  publicar-escritorio:
    # Se evalúa el output, no solo el éxito del job: solo hay imágenes si
    # `preparar` decidió publicar.
    #
    # Hay imágenes por dos caminos: `marcar` acaba de marcarlas, o ya lo estaban
    # y esta ejecución se ha saltado la construcción. En el segundo `marcar` sale
    # «skipped», y un job que depende de uno saltado se salta también salvo que su
    # condición lleve una función de estado: de ahí el `always()`.
    name: Encadenar release de escritorio
    needs: [preparar, marcar]
    permissions:
      contents: read
      actions: write
    if: >-
      always() &&
      (needs.marcar.result == 'success' || needs.preparar.outputs.ya_publicadas == 'si') &&
      needs.preparar.outputs.publicar == 'si' &&
      github.event.inputs.pipeline_release == 'true'
    runs-on: sytue-arm64
    container: *ci
    timeout-minutes: 5
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bun para el despacho
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh bun

      - name: Despachar escritorio cuando las imágenes ya están publicadas
        env:
          TOKEN: ${{ secrets.SYTUE_GIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          # Xcode Cloud construye iOS y macOS de tienda con el tag; release-desktop ya no
          # tiene la entrada mac_app_store y GitHub rechaza (422) una entrada que no existe.
          # Con el flujo de MAIN y el tag como entrada: la plomería de release-desktop
          # (firma, tiendas) va con el workflow, y un arreglo posterior al corte del tag
          # no llegaba a esa release (v3.13.3).
          REF="$GITHUB_REF_NAME" bun -e 'process.stdout.write(JSON.stringify({ref: "main", inputs: {ref: Bun.env.REF}}))' \
            > /tmp/release-desktop.json
          codigo="$(curl -sS -o /tmp/release-desktop-respuesta.json -w '%{http_code}' --max-time 60 \
            -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/release-desktop.json \
            "$API/actions/workflows/release-desktop.yml/dispatches" || true)"
          case "$codigo" in
            200|201|204)
              echo "✓ imágenes publicadas; release-desktop queda despachado para $GITHUB_REF_NAME" ;;
            *)
              echo "::error::No se pudo despachar release-desktop (HTTP $codigo)." >&2
              cat /tmp/release-desktop-respuesta.json >&2 || true
              exit 1 ;;
          esac
