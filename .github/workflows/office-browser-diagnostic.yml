# SPDX-License-Identifier: Apache-2.0
name: office-browser-diagnostic
on:
  push:
    branches: [codex/astro-css-parity]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-browser-diagnostic-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  original-browser:
    runs-on: sytue-arm64
    timeout-minutes: 30
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      volumes:
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository toolchain
        run: .github/actions/toolchain/accion.sh go bun
      - name: Locked original dependencies
        run: |
          bash scripts/bun-install-reintento.sh apps/frontend
          bash scripts/bun-install-reintento.sh test/e2e
      - name: Chromium
        working-directory: test/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Existing original Office scenarios
        working-directory: test/e2e
        env:
          ACC_OUT: /tmp/accesibilidad-${{ github.run_id }}
          CINTA_OUT: /tmp/cinta-${{ github.run_id }}
        run: bash correr-accesibilidad.sh
      - name: Existing original Bases scenarios
        if: always()
        working-directory: test/e2e
        env:
          ACC_OUT: /tmp/accesibilidad-bases-${{ github.run_id }}
        run: bash correr-accesibilidad-bases.sh
      - name: Original PDF render samples
        run: SYTUE_PDF_MUESTRAS="/tmp/pdf-muestras-${{ github.run_id }}" go test ./services/docs/internal/domain -run TestMuestrasParaNavegador
      - name: Existing PDF browser render checks
        working-directory: test/e2e
        run: bun run audit-pdf-render.mjs "/tmp/pdf-muestras-${{ github.run_id }}"
