#
# SUBE A GOOGLE PLAY la ficha de las apps de Fyne (apps/fyne/play/) y, con un tag, sus
# AAB firmados a la pista «internal» y, únicamente con doble confirmación manual, promoción
# de los quince AAB de internal a producción. Ver docs/operations.md#google-play-api.
#
#   modo=sondear   abre y borra una edición por app: ¿existe y nos deja editarla?
#   modo=huellas   solo lee los certificados finales de Play del tag; no publica
#   modo=ficha     textos, imágenes y seguridad de los datos
#   modo=todo        lo anterior y el AAB del tag a internal (como borrador)
#   modo=produccion  internal del tag → production de las quince apps (draft|completed)
name: play-publicar

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "sondear | huellas | interno | ficha | todo | produccion"
        type: string
        required: true
        default: sondear
      apps:
        description: "Apps separadas por espacios (vacío = las quince)"
        type: string
        required: false
      tag:
        description: "Tag vX.Y.Z de los AAB (obligatorio en huellas, todo y produccion)"
        type: string
        required: false
      estado_produccion:
        description: "Solo produccion: draft prepara borradores; completed envía a revisión"
        type: string
        required: false
      estado_interno:
        description: "Solo interno: sondear consulta; completed distribuye el AAB ya subido"
        type: choice
        options: [sondear, completed]
        default: sondear
        required: false
      confirmacion_produccion:
        description: "Escribe PUBLICAR_15_APPS solo para modo=produccion"
        type: string
        required: false

# Lo que puede hacer GITHUB_TOKEN en este flujo, y nada más (GitHub lo
# aplica; en Forgejo este campo se ignoraba y mandaba el token de cada paso).
# `write` y no `read`, solo para VER la release: GitHub enseña los borradores únicamente
# a quien puede escribir en el repositorio, y los AAB están en uno hasta publicarla
# (v3.13.3: con `read` el listado no la traía). Este flujo no escribe nada en ella.
permissions:
  contents: write

# `bash` EXPLÍCITO. Dentro de un `container:` GitHub ejecuta los `run:` con
# `sh -e` y no con bash: `set -o pipefail`, `[[`, los arrays y `<<<` mueren
# con «Illegal option» (cancelar-al-cerrar, 2026-09-27). Con `shell: bash`
# es `bash --noprofile --norc -eo pipefail`, que es lo que corría en la forja.
defaults:
  run:
    shell: bash

env:
  # El checkout lo escribe el runner (uid 1001) y los pasos corren como root dentro
  # del `container:`: git ve un propietario ajeno, se niega («dubious ownership»)
  # y `go build` muere con «error obtaining VCS status». La forja montaba el
  # workspace con el mismo usuario y no lo notaba.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

concurrency:
  group: play-publicar
  cancel-in-progress: false

jobs:
  play:
    name: Google Play (${{ github.event.inputs.modo }})
    runs-on: sytue-arm64
    # Los runners propios del frontal (.github/RUNNERS.md): cada job en un
    # contenedor del Docker del CI, con el proxy filtrado como socket de Docker
    # y la caché de Go del host (con varios jobs, ancla `&ci` y `*ci`).
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      env:
        DOCKER_HOST: unix:///run/sytue-ci/docker.sock
      volumes:
        - /srv/ci/run/proxy.sock:/run/sytue-ci/docker.sock
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    timeout-minutes: 60
    env:
      MODO: ${{ github.event.inputs.modo }}
      APPS: ${{ github.event.inputs.apps }}
      TAG: ${{ github.event.inputs.tag }}
      ESTADO_PRODUCCION: ${{ github.event.inputs.estado_produccion }}
      ESTADO_INTERNO: ${{ github.event.inputs.estado_interno }}
      CONFIRMACION_PRODUCCION: ${{ github.event.inputs.confirmacion_produccion }}
      PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Clonar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Preparar jq
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh jq

      - name: Traer los AAB firmados del tag
        if: ${{ github.event.inputs.modo == 'todo' }}
        env:
          SYTUE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::modo=todo necesita un tag vX.Y.Z" >&2; exit 1 ;; esac
          mkdir -p aab
          # Por la URL de API del asset, como release-mobile.yml: vale también para
          # un borrador, y el token del job la lee. La release se busca en el LISTADO:
          # GitHub no devuelve los borradores por `releases/tags/<tag>` (404, v3.13.3).
          curl -fsS --max-time 60 -H "Authorization: token $SYTUE_GIT_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq --arg t "$TAG" '[.[] | select(.tag_name == $t)][0] // error("no hay release \($t)")' \
            | jq -r '.assets[] | select(.name | test("^sytue-.*-android\\.aab$")) | "\(.url) \(.name)"' \
            | while read -r url nombre; do
                curl -fsSL --max-time 600 --retry 3 -H "Authorization: token $SYTUE_GIT_TOKEN" \
                  -H 'Accept: application/octet-stream' -o "aab/$nombre" "$url"
              done
          bash apps/fyne/scripts/empaquetar.sh publicables android aab >/dev/null || {
            echo "::error::la release $TAG no trae un AAB firmado por app: lanza release-mobile.yml." >&2
            exit 1
          }

      - name: Subir
        run: |
          set -euo pipefail
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::falta el secreto GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi
          umask 077
          export PLAY_CREDENCIALES="$RUNNER_TEMP/play.json"
          trap 'rm -f "$PLAY_CREDENCIALES"' EXIT
          printf '%s' "$PLAY_JSON" >"$PLAY_CREDENCIALES"
          unset PLAY_JSON
          case "$MODO" in
          sondear) args=(--sondear) ;;
          huellas) args=(--huellas --tag "$TAG") ;;
          ficha) args=() ;;
          todo) args=(--aab aab) ;;
          interno) args=(--interno --tag "$TAG" --estado "${ESTADO_INTERNO:-sondear}") ;;
          produccion)
            [ -z "$APPS" ] || { echo "::error::producción publica siempre las quince apps; deja apps vacío" >&2; exit 1; }
            [ "$CONFIRMACION_PRODUCCION" = "PUBLICAR_15_APPS" ] || {
              echo "::error::para producción escribe exactamente PUBLICAR_15_APPS en confirmacion_produccion" >&2
              exit 1
            }
            export PLAY_CONFIRMAR_PRODUCCION="$CONFIRMACION_PRODUCCION"
            args=(--produccion --tag "$TAG" --estado "$ESTADO_PRODUCCION")
            ;;
          *) echo "::error::modo «$MODO» desconocido" >&2; exit 1 ;;
          esac
          # shellcheck disable=SC2086
          if [ "$MODO" = huellas ]; then
            bash apps/fyne/scripts/play-publicar.sh "${args[@]}" $APPS >play-huellas.jsonl
            cat play-huellas.jsonl
          else
            bash apps/fyne/scripts/play-publicar.sh "${args[@]}" $APPS
          fi

      - name: Conservar certificados públicos de Play
        if: ${{ always() && github.event.inputs.modo == 'huellas' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-huellas-${{ job.status == 'success' && 'completo' || 'incompleto' }}
          path: play-huellas.jsonl
          if-no-files-found: error
