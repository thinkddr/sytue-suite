# Clientes de escritorio nativos construidos exclusivamente desde apps/fyne.
name: release-desktop

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag vX.Y.Z a publicar (vacío = la referencia elegida arriba)"
        type: string
        required: false
      solo_escritorio:
        description: "Reconstruir instaladores y sumas sin repetir las cargas de TestFlight y Mac App Store"
        type: boolean
        default: false
        required: false
      solo_ios:
        description: "Publicar sólo iOS, sin reconstruir instaladores ni Mac App Store"
        type: boolean
        default: false
        required: false
      solo_mas:
        description: "Publicar sólo Mac App Store, sin reenviar iOS ni reconstruir instaladores"
        type: boolean
        default: false
        required: false
      apps_ios:
        description: "Apps iOS separadas por espacios (vacío = las quince del catálogo)"
        type: string
        required: false
      apps_mas:
        description: "Apps Mac App Store separadas por espacios (vacío = las quince del catálogo)"
        type: string
        required: false

# Lo que puede hacer GITHUB_TOKEN en este flujo, y nada más (GitHub lo
# aplica; en Forgejo este campo se ignoraba y mandaba el token de cada paso).
# POR JOB (auditoría 2026-10-06, CI-09): escriben en la release los turnos de
# escritorio y de macOS, que adjuntan lo suyo, y `sumas`.
permissions:
  contents: read

# `bash` EXPLÍCITO. Dentro de un `container:` GitHub ejecuta los `run:` con
# `sh -e` y no con bash: `set -o pipefail`, `[[`, los arrays y `<<<` mueren
# con «Illegal option» (cancelar-al-cerrar, 2026-09-27). Con `shell: bash`
# es `bash --noprofile --norc -eo pipefail`, que es lo que corría en la forja.
defaults:
  run:
    shell: bash

# Por TAG y no por ref: el mismo tag despachado desde `main` (con inputs.ref) y
# desde el propio tag caía en dos grupos y corría dos veces a la vez, cada run
# borrando y resubiendo los assets del otro (2649 y 2650). Igual que release.yml.
# `ref_name` y no `ref`: desde el tag sin inputs, `github.ref` es «refs/tags/vX» y
# no casaba con el «vX» de inputs.ref (2686).
concurrency:
  # Sólo MAS no adjunta instaladores ni sumas: su mutex no necesita esperar
  # el build Linux del mismo tag. Los jobs Apple comparten el único runner Mac.
  group: release-desktop-${{ inputs.solo_mas && 'mas' || github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  # El checkout lo escribe el runner (uid 1001) y los pasos corren como root dentro
  # del `container:`: git ve un propietario ajeno, se niega («dubious ownership»)
  # y `go build` muere con «error obtaining VCS status». La forja montaba el
  # workspace con el mismo usuario y no lo notaba.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  GOTOOLCHAIN: local
  TAG: ${{ github.event.inputs.ref || github.ref_name }}
  SYTUE_SOLO_IOS: ${{ inputs.solo_ios }}
  SYTUE_SOLO_MAS: ${{ inputs.solo_mas }}
  SYTUE_SOLO_ESCRITORIO: ${{ inputs.solo_escritorio }}

jobs:
  escritorio:
    name: Apps Fyne (${{ matrix.plataforma }})
    if: ${{ !inputs.solo_ios && !inputs.solo_mas }}
    runs-on: sytue-arm64
    # Debian 12 (glibc 2.36, MinGW 10) en LOS DOS runners. La imagen por defecto del
    # AMD64 es Ubuntu 24.04: GLFW compila con -D_GNU_SOURCE y desde glibc 2.38 eso
    # cambia strtol/strtoul/sscanf por __isoc23_* @GLIBC_2.38, el binario no arranca
    # en Debian 12 / Ubuntu 22.04 y la guardia de empaquetar.sh lo tumba. En ARM64 es
    # la misma imagen que la etiqueta ya daba (node:lts = 24-bookworm), y fijada
    # por el MISMO digest que `sytue-arm64`: una etiqueta que se mueve cambia el
    # entorno un día cualquiera (ci-sin-azar-test.sh lo exige).
    # Los runners propios del frontal (.github/RUNNERS.md): cada job en un
    # contenedor del Docker del CI, con el proxy filtrado como socket de Docker
    # y la caché de Go del host (con varios jobs, ancla `&ci` y `*ci`).
    container: &ci
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      env:
        DOCKER_HOST: unix:///run/sytue-ci/docker.sock
      volumes:
        - /srv/ci/run/proxy.sock:/run/sytue-ci/docker.sock
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        plataforma: [linux, windows]
    env:
      GOPRIVATE: github.com/thinkddr/*
    # Para `sumas`: si esta versión se firma, y la SHA-256 de lo que adjunta cada
    # plataforma. Claves distintas por plataforma: con la misma, la matriz se
    # quedaría con la del último turno en acabar.
    outputs:
      firma: ${{ steps.clonar.outputs.firma }}
      sumas_linux: ${{ steps.adjuntar.outputs.sumas_linux }}
      sumas_windows: ${{ steps.adjuntar.outputs.sumas_windows }}
    steps:
      - name: Comprobar configuración de firma antes de compilar
        if: matrix.plataforma == 'windows'
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          AZURE_SIGNING_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          AZURE_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          faltan=0
          for nombre in ENDPOINT ACCOUNT PROFILE CLIENT_ID TENANT_ID CLIENT_SECRET; do
            variable="AZURE_SIGNING_$nombre"
            if [ -z "${!variable:-}" ]; then
              echo "::error::Falta $variable en Actions (variables, salvo CLIENT_SECRET que es secreto)."
              faltan=1
            fi
          done
          exit "$faltan"

      - name: Clonar el tag de la release
        id: clonar
        env:
          SYTUE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYTUE_GIT_FORKS_TOKEN: ${{ secrets.SYTUE_GIT_FORKS_TOKEN }}
        run: |
          set -euo pipefail
          # Despachado desde una rama sin `inputs.ref`, TAG es la RAMA: se para aquí y
          # no tras media hora de compilar, con un borrador «main» entre las releases.
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *)
            echo "::error::TAG tiene que ser vX.Y.Z y es «$TAG»: despacha con inputs.ref o desde el tag" >&2; exit 1;; esac
          # Runner propio: el workspace SOBREVIVE entre jobs (lo deja el anterior,
          # con su .git), así que se vacía antes de clonar (.github/RUNNERS.md).
          find . -mindepth 1 -delete
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$SYTUE_GIT_TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "$TAG"
          git checkout -q FETCH_HEAD
          # La plomería del CI (`.github/actions`: instalador de herramientas, acceso a
          # los forks, upload-artifact, caché) va con el WORKFLOW, no con el tag: un tag
          # anterior a `forks.sh` no lo tiene y el job moría con «command not found»
          # (2653). Las fuentes y `empaquetar.sh` siguen siendo los del tag.
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$SYTUE_GIT_TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD -- .github/actions
          # La firma de Windows, también del workflow: quien verifica antes de publicar no
          # puede depender de que el tag ya la traiga (un tag viejo sale rojo, no sin firmar).
          git checkout -q FETCH_HEAD -- deploy/sytue-git/bin/firmar-windows.sh \
            deploy/sytue-git/bin/publicar-asset.sh \
            deploy/sytue-git/microsoft-identity-verification-root-2020.crt
          # ¿Se firma el SHA256SUMS? El interruptor es la clave pública del WORKFLOW,
          # como en imagenes-produccion: sin ella, `sumas` corre sin entorno y avisa.
          if git cat-file -e FETCH_HEAD:deploy/firma/publicacion.pub 2>/dev/null; then
            echo "firma=si" >> "$GITHUB_OUTPUT"
          fi
          git config --global "http.$GITHUB_SERVER_URL/.extraHeader" \
            "Authorization: Basic $(printf 'x-access-token:%s' "$SYTUE_GIT_TOKEN" | base64 -w0)"
          # Los dos forks de Fyne son PRIVADOS y la credencial efímera no los lee: el
          # guion configura el token de los forks y comprueba AQUÍ que sirve, no media
          # hora después al compilar (release-desktop v3.5.7 a v3.5.9).
          "$GITHUB_WORKSPACE/.github/actions/toolchain/forks.sh"

      # `jq` lo necesita publicar-asset.sh al final, y la imagen no lo trae: en
      # v3.5.5 Linux empaquetó las catorce apps y murió al adjuntarlas con
      # «jq: command not found». Se instala aquí, antes de media hora de compilar.
      - name: Preparar Go y dependencias de empaquetado
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh go escritorio-amd64 jq

      # jsign firma contra Azure Artifact Signing y osslsigncode verifica; los dos solo
      # hacen falta en Windows (docs/operations.md, «Windows: Azure Artifact Signing»).
      - name: Preparar la firma de Windows
        if: matrix.plataforma == 'windows'
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh jdk jsign osslsigncode

      - name: Instalar la CLI Fyne fijada
        run: |
          set -euo pipefail
          # La versión va con el WORKFLOW, como la plomería: despachado desde main
          # para un tag viejo, el versions.env del tag puede no fijarla todavía.
          fyne_cli="$(git show "$GITHUB_SHA:deploy/sytue-git/versions.env" | sed -n 's/^FYNE_TOOLS_VERSION=//p')"
          go install "fyne.io/tools/cmd/fyne@v${fyne_cli:?versions.env no fija FYNE_TOOLS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          cd apps/fyne
          go list -m -f 'fyne.io/fyne/v2 {{.Version}}' fyne.io/fyne/v2
          # Sin el literal del fork: despachado desde main con inputs.ref, este workflow es
          # el de main y el go.mod el del TAG (2655). Lo fijan ci-desktop y empaquetar-test.sh,
          # cada uno sobre su propio árbol.

      # En Windows empaquetar.sh firma los .exe de las apps, el desinstalador y los dos
      # instaladores, y verifica cada firma. El secreto va por entorno, nunca en argv.
      - name: Empaquetar y verificar
        env:
          AZURE_SIGNING_ENDPOINT: ${{ matrix.plataforma == 'windows' && vars.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          AZURE_SIGNING_TENANT_ID: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          AZURE_SIGNING_CLIENT_SECRET: ${{ matrix.plataforma == 'windows' && secrets.AZURE_SIGNING_CLIENT_SECRET || '' }}
        run: bash apps/fyne/scripts/empaquetar.sh "${{ matrix.plataforma }}"

      # Copia de rescate por si falla el paso siguiente, no el sitio donde viven los
      # instaladores: eso es la release. Nadie descarga este artefacto, así que con tres
      # días sobra. Con 90, las 19 copias de diez releases sumaban 7,15 GB y llenaron la
      # cuota de artefactos de la cuenta el 2026-10-06: `security` cayó al no poder subir
      # el SBOM y la cadena dejó de publicar. Y por lo mismo no tumba el job: con el
      # almacén lleno, lo que importa es que el paso siguiente adjunte a la release.
      - name: Guardar los artefactos
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fyne-${{ matrix.plataforma }}
          path: apps/fyne/dist/*
          if-no-files-found: error
          retention-days: 3

      - name: Adjuntar instaladores a la release
        id: adjuntar
        env:
          SYTUE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # SOLO LOS BUNDLES («Sytue One» y «Sytue Drive»), y rojo si falta uno: la lista
          # la da empaquetar.sh, que es quien los arma. Un .exe o un .tar.xz por app ya no
          # se publica en escritorio. En una asignación, para que `set -e` vea su fallo.
          lista="$(bash apps/fyne/scripts/empaquetar.sh publicables "${{ matrix.plataforma }}" apps/fyne/dist)"
          publicables=()
          while IFS= read -r f; do publicables+=("$f"); done <<<"$lista"
          # NINGÚN instalador de Windows sin firmar: si la firma faltó o no verifica, rojo
          # aquí y no se adjunta nada (release-workflow-test.sh lo exige).
          if [ "${{ matrix.plataforma }}" = windows ]; then
            bash deploy/sytue-git/bin/firmar-windows.sh verificar "${publicables[@]}"
          fi
          bash deploy/sytue-git/bin/publicar-asset.sh "$TAG" "${publicables[@]}"
          # Lo que acaba de compilar ESTA ejecución: `sumas` exige que lo de la release sea esto.
          echo "sumas_${{ matrix.plataforma }}=$(cd "$(dirname "${publicables[0]}")" &&
            sha256sum "${publicables[@]##*/}" | base64 -w0)" >> "$GITHUB_OUTPUT"

  # FIRMADO Y NOTARIZADO O NADA, EN UN MAC PROPIO (decisión del dueño, 2026-10-19: sin
  # Codemagic). El runner `sytue-macos` lo registra bootstrap-runner-macos.sh y corre sin
  # contenedor, aislado por su perfil de sandbox. apple-firma.sh mete el Developer ID en
  # un llavero EFÍMERO, notariza los .dmg y los verifica con Gatekeeper antes de
  # adjuntarlos; si algo falla, no se publica ningún .dmg y este job sale rojo.
  # La Mac App Store va en el job tiendas, después de los instaladores.
  # Ver «Apple: firma, notarización y TestFlight» en docs/operations.md.
  macos:
    name: Apps Fyne (macOS notarizado, Mac propio)
    if: ${{ !inputs.solo_ios && !inputs.solo_mas }}
    runs-on: [self-hosted, sytue-macos]
    # 14 apps × 2 mitades con cgo, 14 hdiutil y 14 notarizaciones: 35-45 min en frío.
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GOPRIVATE: github.com/thinkddr/*
    steps:
      - &apple-clonar
        name: Clonar el tag y la plomería del workflow
        env:
          SYTUE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYTUE_GIT_FORKS_TOKEN: ${{ secrets.SYTUE_GIT_FORKS_TOKEN }}
        run: |
          set -euo pipefail
          modos=0
          for elegido in "$SYTUE_SOLO_IOS" "$SYTUE_SOLO_MAS" "$SYTUE_SOLO_ESCRITORIO"; do
            [ "$elegido" != true ] || modos=$((modos + 1))
          done
          [ "$modos" -le 1 ] || {
            echo "::error::solo_ios, solo_mas y solo_escritorio son incompatibles" >&2; exit 1; }
          # Ni el ~/.gitconfig de quien usa este Mac: la configuración de git del job va
          # al temporal del runner (`runner.temp` no existe en el `env:` del job).
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *)
            echo "::error::TAG tiene que ser vX.Y.Z y es «$TAG»" >&2; exit 1;; esac
          : > "$GIT_CONFIG_GLOBAL"
          find . -mindepth 1 -delete
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          # macOS: `base64` sin -w0.
          cab="Authorization: Basic $(printf 'x-access-token:%s' "$SYTUE_GIT_TOKEN" | base64 | tr -d '\n')"
          git config --global "http.$GITHUB_SERVER_URL/.extraHeader" "$cab"
          git fetch -q --depth 1 origin "$TAG"
          git checkout -q FETCH_HEAD
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          # Fuentes del tag; herramientas de firma/empaquetado del workflow, para
          # corregir una entrega sin mover el tag ni modificar código de la app.
          git checkout -q FETCH_HEAD -- .github/actions deploy/sytue-git/bin/publicar-asset.sh \
            apps/fyne/scripts/apple-firma.sh apps/fyne/scripts/apple_clave.py apps/fyne/scripts/apple_firma_sonda.py \
            apps/fyne/scripts/empaquetar.sh
          echo "FYNE_TOOLS_VERSION=$(git show "FETCH_HEAD:deploy/sytue-git/versions.env" | sed -n 's/^FYNE_TOOLS_VERSION=//p')" >> "$GITHUB_ENV"
          echo "CODEMAGIC_CLI_TOOLS_VERSION=$(git show "FETCH_HEAD:deploy/sytue-git/versions.env" | sed -n 's/^CODEMAGIC_CLI_TOOLS_VERSION=//p')" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE/.github/actions/toolchain/forks.sh"

      # ANTES de compilar: sin clave o sin certificado, el job cae en su primer minuto.
      # codemagic-cli-tools es la herramienta libre (GPL-3.0) que gestiona el llavero
      # efímero y los certificados por la API de App Store Connect, no el servicio.
      - name: Certificado Developer ID a un llavero efímero
        env:
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cm"
          "$RUNNER_TEMP/cm/bin/pip" install -q "codemagic-cli-tools==${CODEMAGIC_CLI_TOOLS_VERSION:?versions.env no fija CODEMAGIC_CLI_TOOLS_VERSION}"
          echo "$RUNNER_TEMP/cm/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/cm/bin:$PATH"
          identidad="$(bash apps/fyne/scripts/apple-firma.sh preparar macos)"
          echo "SYTUE_MACOS_IDENTIDAD=$identidad" >> "$GITHUB_ENV"
          echo "firma: $identidad"

      # LOS WIDGETS DE APPLE, SOLO CON SU INTERRUPTOR (SYTUE_WIDGETS_APPLE en el
      # Sytue.xcconfig del TAG; un tag anterior sale apagado). Encendido, cada .app y su
      # extensión WidgetKit piden el App Group, y fuera de la tienda eso exige un perfil
      # Developer ID que lo autorice: se traen aquí, antes de compilar, al almacén que lee
      # `apple-firma.sh perfil-ruta`. Apagado, este paso no hace nada y la firma es la de
      # siempre. Ver «Activar los widgets de Apple» en docs/operations.md.
      - name: Perfiles Developer ID de apps y widgets (solo con los widgets de Apple)
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ "$(bash apps/fyne/scripts/empaquetar.sh widgets-apple)" != si ]; then
            echo "SYTUE_WIDGETS_APPLE apagado en este tag: los .app se firman sin App Group ni perfil."
            exit 0
          fi
          perfiles="$RUNNER_TEMP/perfiles-apple"
          python3 apps/fyne/scripts/apple-perfiles.py --plataforma developerid --destinos todos \
            --preparar --salida "$perfiles"
          echo "SYTUE_PERFILES_DIR=$perfiles" >> "$GITHUB_ENV"

      - &apple-go
        name: Go y la CLI Fyne fijada
        run: |
          set -euo pipefail
          # El Mac es el portátil de una persona: sin sitio para el build (14 apps
          # universales y su caché de Go) se para AQUÍ, no con el disco lleno a mitad
          # de enlazar (v3.13.2 lo llenó al 100 %).
          libre_gb="$(df -g "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          [ "${libre_gb:-0}" -ge 15 ] || {
            echo "::error::solo quedan ${libre_gb:-0} GB libres en este Mac; el build pide 15. Libera espacio y relanza." >&2; exit 1; }
          ./.github/actions/toolchain/accion.sh go
          export PATH="/usr/local/go/bin:$HOME/.sytue-toolchain/go/bin:$PATH"
          # La caché de compilación y la de módulos, del JOB y no las de la persona
          # (~/Library/Caches/go-build): se borran al acabar.
          {
            echo "GOPATH=$RUNNER_TEMP/gopath"
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gopath/pkg/mod"
          } >> "$GITHUB_ENV"
          GOPATH="$RUNNER_TEMP/gopath" GOCACHE="$RUNNER_TEMP/gocache" go install "fyne.io/tools/cmd/fyne@v${FYNE_TOOLS_VERSION:?}"
          echo "PATH=$RUNNER_TEMP/gopath/bin:$PATH" >> "$GITHUB_ENV"

      - name: Empaquetar, notarizar y verificar los .dmg
        env:
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash apps/fyne/scripts/empaquetar.sh macos
          # Sin `mapfile`: el bash 3.2 de macOS no lo tiene.
          lista="$(bash apps/fyne/scripts/empaquetar.sh publicables macos apps/fyne/dist)"
          dmgs=()
          while IFS= read -r f; do dmgs+=("$f"); done <<<"$lista"
          bash apps/fyne/scripts/apple-firma.sh notarizar "${dmgs[@]}"
          bash apps/fyne/scripts/apple-firma.sh verificar "${dmgs[@]}"

      - name: Adjuntar los .dmg a la release
        env:
          SYTUE_GIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lista="$(bash apps/fyne/scripts/empaquetar.sh publicables macos apps/fyne/dist)"
          dmgs=()
          while IFS= read -r f; do dmgs+=("$f"); done <<<"$lista"
          bash deploy/sytue-git/bin/publicar-asset.sh "$TAG" "${dmgs[@]}"

      # El Mac es de una persona: el llavero por defecto vuelve a ser el suyo y el
      # efímero, con el Developer ID dentro, desaparece pase lo que pase.
      - &apple-devolver
        name: Devolver el llavero de la sesión
        if: always()
        run: |
          set -euo pipefail
          # La misma CLI que lo inicializa conoce los nombres modernos y antiguos
          # del login y restaura el dominio por defecto que usa la firma.
          keychain use-login
          login=""
          for candidato in "$HOME/Library/Keychains/login.keychain-db" "$HOME/Library/Keychains/login.keychain"; do
            [ ! -f "$candidato" ] || { login="$candidato"; break; }
          done
          [ -n "$login" ] || { echo "::error::falta el llavero de la sesión; se conserva el efímero" >&2; exit 1; }
          for dominio in '' user; do
            consulta=(security default-keychain)
            [ -z "$dominio" ] || consulta+=(-d "$dominio")
            actual="$("${consulta[@]}" | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')"
            [ "$actual" = "$login" ] || { echo "::error::no se restauró el llavero de la sesión (${dominio:-normal}); se conserva el efímero" >&2; exit 1; }
          done
          echo "Llavero de la sesión restaurado y comprobado."
          # La caché de módulos de Go es de solo lectura: sin chmod, rm no la borra.
          chmod -R u+w "$RUNNER_TEMP/gopath" 2>/dev/null || true
          rm -rf "$HOME/Library/codemagic-cli-tools/keychains" "$RUNNER_TEMP/cm" "$RUNNER_TEMP/gopath" "$RUNNER_TEMP/gocache" "$RUNNER_TEMP/gitconfig" \
            "$RUNNER_TEMP/perfiles-apple"

  # LAS TIENDAS DE APPLE EN EL MISMO MAC (decisión del dueño, 2026-10-19): Xcode Cloud
  # cancela las quince apps desde v3.12.29 (horas de cómputo agotadas), así que iOS va a
  # TestFlight y macOS a la Mac App Store desde aquí, sin enviar a revisión (eso lo
  # hace el flujo de envío, a mano). Va detrás del .dmg porque el Mac es uno; si el .dmg falla, esto
  # corre igual. Los pasos comunes son los del job macos, por ancla.
  tiendas:
    name: Apps Fyne (TestFlight y Mac App Store, Mac propio)
    needs: macos
    # Una recuperación de los instaladores conserva los builds ya enviados a Apple.
    # Sin el input (despacho normal o automático), se siguen publicando las tiendas.
    if: ${{ !cancelled() && (inputs.solo_ios || inputs.solo_mas || !inputs.solo_escritorio) }}
    runs-on: [self-hosted, sytue-macos]
    # 15 apps × (iOS + Mac App Store) en un portátil: hasta tres horas en frío.
    timeout-minutes: 240
    env:
      GOPRIVATE: github.com/thinkddr/*
    steps:
      - *apple-clonar
      - name: Seleccionar apps de las tiendas
        env:
          APPS_IOS: ${{ inputs.apps_ios }}
          APPS_MAS: ${{ inputs.apps_mas }}
        run: |
          set -euo pipefail
          seleccionar() { # <plataforma> <sufijo> <solicitud>
            local lista seleccion="" app f
            case "$3" in *[!a-z\ ]*) echo "::error::apps sólo admite nombres separados por espacios" >&2; return 1 ;; esac
            lista="$(bash apps/fyne/scripts/empaquetar.sh publicables "$1")" || return 1
            if [ -n "${3// /}" ]; then
              for app in $3; do
                grep -qxF "sytue-$app-$2" <<<"$lista" || { echo "::error::$app no está en el catálogo $1" >&2; return 1; }
                case " $seleccion " in *" $app "*) ;; *) seleccion="${seleccion:+$seleccion }$app" ;; esac
              done
            else
              while IFS= read -r f; do
                app="${f#sytue-}"; app="${app%-$2}"
                seleccion="${seleccion:+$seleccion }$app"
              done <<<"$lista"
            fi
            [ -n "$seleccion" ] || { echo "::error::el catálogo $1 está vacío" >&2; return 1; }
            printf '%s\n' "$seleccion"
          }
          ios=""; mas=""
          if [ "$SYTUE_SOLO_MAS" = true ]; then
            [ -z "${APPS_IOS// /}" ] || { echo "::error::apps_ios no se aplica a solo_mas" >&2; exit 1; }
          else
            ios="$(seleccionar ios ios.ipa "$APPS_IOS")"
          fi
          if [ "$SYTUE_SOLO_IOS" = true ]; then
            [ -z "${APPS_MAS// /}" ] || { echo "::error::apps_mas no se aplica a solo_ios" >&2; exit 1; }
          else
            mas="$(seleccionar macappstore macos-tienda.pkg "$APPS_MAS")"
          fi
          # Ninguna selección parcial llega al entorno si la otra es inválida.
          {
            echo "SYTUE_APPS_IOS_SELECCIONADAS=$ios"
            echo "SYTUE_APPS_MAS_SELECCIONADAS=$mas"
          } >> "$GITHUB_ENV"
      - name: Apple Distribution, instalador y un perfil de tienda por app
        env:
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cm"
          "$RUNNER_TEMP/cm/bin/pip" install -q "codemagic-cli-tools==${CODEMAGIC_CLI_TOOLS_VERSION:?versions.env no fija CODEMAGIC_CLI_TOOLS_VERSION}"
          echo "$RUNNER_TEMP/cm/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/cm/bin:$PATH"
          # Los App ID salen del FyneApp.toml de cada app que se publica.
          ids() { # <variante> <sufijo del fichero>
            local nombres
            if [ "$1" = ios ]; then
              nombres="$SYTUE_APPS_IOS_SELECCIONADAS"
            else
              nombres="${SYTUE_APPS_MAS_SELECCIONADAS:?falta la selección Mac App Store}"
            fi
            for app in $nombres; do
              sed -n 's/^[[:space:]]*ID[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "apps/fyne/cmd/$app/FyneApp.toml" | sed -n 1p
            done
          }
          # shellcheck disable=SC2046 # un App ID por palabra, a propósito
          ios=""
          if [ "$SYTUE_SOLO_MAS" != true ]; then
            # shellcheck disable=SC2046
            ios="$(bash apps/fyne/scripts/apple-firma.sh preparar ios $(ids ios '-ios.ipa'))"
          fi
          mas=""
          if [ "$SYTUE_SOLO_IOS" != true ]; then
            # shellcheck disable=SC2046
            mas="$(bash apps/fyne/scripts/apple-firma.sh preparar macappstore $(ids macappstore '-macos-tienda.pkg'))"
          fi
          # Lo que firma después: la identidad de iOS y, en la Mac App Store, la de la app
          # (primera línea) y la del instalador (segunda).
          {
            echo "SYTUE_IOS_IDENTIDAD=$ios"
            echo "SYTUE_MAS_IDENTIDAD=$(sed -n 1p <<<"$mas")"
            echo "SYTUE_MAS_INSTALADOR=$(sed -n 2p <<<"$mas")"
          } >> "$GITHUB_ENV"
          echo "firma: $ios · $(tr '\n' ' ' <<<"$mas")"
          # fyne package -os=ios pide Xcode, y `xcode-select` de este Mac apunta a las
          # Command Line Tools: se elige Xcode.app SOLO para el job, sin tocar el sistema.
          xcode="$(bash apps/fyne/scripts/apple-firma.sh directorio-xcode)"
          echo "DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"

      # Como en el job macos: solo con SYTUE_WIDGETS_APPLE encendido en el tag. Los
      # perfiles de tienda de cada app (que ahora autorizan el App Group) y los de sus
      # widgets (`eu.sytue.<app>.widgets`), de las apps seleccionadas, a un almacén propio
      # del job; `apple-firma.sh perfil` y `perfil-ruta` leen solo ese.
      - name: Perfiles de tienda de apps y widgets (solo con los widgets de Apple)
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ "$(bash apps/fyne/scripts/empaquetar.sh widgets-apple)" != si ]; then
            echo "SYTUE_WIDGETS_APPLE apagado en este tag: perfiles de tienda de siempre, sin widgets."
            exit 0
          fi
          perfiles="$RUNNER_TEMP/perfiles-apple"
          if [ "$SYTUE_SOLO_MAS" != true ]; then
            # shellcheck disable=SC2086 # nombres validados contra el catálogo
            python3 apps/fyne/scripts/apple-perfiles.py --plataforma ios --destinos todos \
              --preparar --salida "$perfiles" $SYTUE_APPS_IOS_SELECCIONADAS
          fi
          if [ "$SYTUE_SOLO_IOS" != true ]; then
            # shellcheck disable=SC2086
            python3 apps/fyne/scripts/apple-perfiles.py --plataforma macappstore --destinos todos \
              --preparar --salida "$perfiles" $SYTUE_APPS_MAS_SELECCIONADAS
          fi
          echo "SYTUE_PERFILES_DIR=$perfiles" >> "$GITHUB_ENV"

      - *apple-go

      - name: iOS a TestFlight (pruebas internas)
        if: ${{ !inputs.solo_mas }}
        env:
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # El catálogo decide qué se publica (sin la demo). Las apps de conexiones
          # van primero; cada IPA sube al terminar, aunque otra app falle después.
          lista="$(bash apps/fyne/scripts/empaquetar.sh publicables ios)"
          ipas=()
          for app in hub drive rooms; do
            f="sytue-$app-ios.ipa"
            grep -qxF "$f" <<<"$lista" || { echo "::error::falta $app en el catálogo iOS" >&2; exit 1; }
            ipas+=("$f")
          done
          while IFS= read -r f; do
            case "$f" in sytue-hub-ios.ipa | sytue-drive-ios.ipa | sytue-rooms-ios.ipa) continue ;; esac
            ipas+=("$f")
          done <<<"$lista"
          fallos=0
          for f in "${ipas[@]}"; do
            app="${f#sytue-}"
            app="${app%-ios.ipa}"
            if [ -n "${SYTUE_APPS_IOS_SELECCIONADAS:-}" ]; then
              case " $SYTUE_APPS_IOS_SELECCIONADAS " in *" $app "*) ;; *) continue ;; esac
            fi
            rm -f "apps/fyne/dist/$f"
            if ! bash apps/fyne/scripts/empaquetar.sh ios "$app"; then
              echo "::error::no se pudo empaquetar iOS: $app" >&2
              fallos=1
              continue
            fi
            if [ ! -f "apps/fyne/dist/$f" ]; then
              echo "::error::el empaquetado iOS no dejó $f" >&2
              fallos=1
              continue
            fi
            if ! bash apps/fyne/scripts/apple-firma.sh subir "apps/fyne/dist/$f"; then
              echo "::error::Apple no aceptó el IPA de $app" >&2
              fallos=1
            fi
          done
          [ "$fallos" = 0 ]

      - name: Mac App Store (sin enviar a revisión)
        if: ${{ !cancelled() && !inputs.solo_ios }}
        env:
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "${SYTUE_APPS_MAS_SELECCIONADAS:-}" ] || { echo "::error::falta la selección Mac App Store" >&2; exit 1; }
          pkgs=()
          for app in $SYTUE_APPS_MAS_SELECCIONADAS; do pkgs+=("apps/fyne/dist/sytue-$app-macos-tienda.pkg"); done
          rm -f "${pkgs[@]}"
          # shellcheck disable=SC2086 # lista validada contra el catálogo, sin demo ni duplicados
          bash apps/fyne/scripts/empaquetar.sh macappstore $SYTUE_APPS_MAS_SELECCIONADAS
          for f in "${pkgs[@]}"; do
            [ -f "$f" ] || { echo "::error::el empaquetado Mac App Store no dejó $f" >&2; exit 1; }
          done
          bash apps/fyne/scripts/apple-firma.sh subir "${pkgs[@]}"

      - *apple-devolver

  # EL SHA256SUMS DE LOS INSTALADORES, firmado si hay clave (auditoría 2026-10-06, CI-05).
  # Lo verifican el piloto antes de subirlos al almacén y las apps antes de instalar; el
  # formato está en scripts/firma-publicacion.sh y lo fija .github/tests/firma-publicacion-test.sh.
  # Los de Linux y Windows tienen que ser los que compiló esta misma ejecución; los de
  # macOS se toman de la release, porque los compila el Mac propio en otro job.
  # Corre en el entorno «publicacion» (la clave y la aprobación del dueño) solo si el
  # workflow trae deploy/firma/publicacion.pub; si no, sin entorno, sin firma y con aviso.
  sumas:
    name: SHA256SUMS de los instaladores
    needs: [escritorio, macos]
    runs-on: sytue-arm64
    container:
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
    environment: ${{ needs.escritorio.outputs.firma == 'si' && 'publicacion' || '' }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Clonar el workflow y el tag
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -delete
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          cab="http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "$cab" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git -c "$cab" fetch -q --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          echo "COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_ENV"

      - name: Herramientas
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh jq ${{ needs.escritorio.outputs.firma == 'si' && 'cosign' || '' }}

      - name: Bajar los instaladores de la release
        env:
          TOKEN: ${{ github.token }}
          SUMAS_LINUX: ${{ needs.escritorio.outputs.sumas_linux }}
          SUMAS_WINDOWS: ${{ needs.escritorio.outputs.sumas_windows }}
        run: |
          set -euo pipefail
          mkdir -p inst
          # Por la URL de API del asset: la release puede seguir en borrador, y GitHub NO
          # devuelve los borradores por `releases/tags/<tag>` (404, v3.13.2): se busca en el
          # listado, como publicar-asset.sh.
          curl -fsS --max-time 60 --retry 3 -H @<(printf 'Authorization: token %s\n' "$TOKEN") \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq --arg t "$TAG" '[.[] | select(.tag_name == $t)][0] // error("no hay release \($t)")' |
            jq -r '.assets[] | select(.name | test("(\\.dmg|-installer\\.exe|-linux-.*\\.tar\\.xz)$")) | "\(.url) \(.name)"' |
            while read -r url nombre; do
              curl -fsSL --max-time 900 --retry 3 -H @<(printf 'Authorization: token %s\n' "$TOKEN") \
                -H 'Accept: application/octet-stream' -o "inst/$nombre" "$url"
            done
          # Los seis o nada: la lista de lo publicable la da empaquetar.sh.
          for p in linux windows macos; do
            bash apps/fyne/scripts/empaquetar.sh publicables "$p" inst >/dev/null || {
              echo "::error::faltan instaladores de $p en la release $TAG" >&2; exit 1; }
          done
          # Y solo esos: un instalador viejo que siga adjunto no entra en la lista.
          publicables="$(for p in linux windows macos; do bash apps/fyne/scripts/empaquetar.sh publicables "$p"; done)"
          for f in inst/*; do grep -qxF "${f##*/}" <<<"$publicables" || rm -f "$f"; done
          # Linux y Windows, idénticos a lo que acaba de compilar esta ejecución.
          for s in "$SUMAS_LINUX" "$SUMAS_WINDOWS"; do
            [ -n "$s" ] || { echo "::error::falta la suma de un turno de escritorio" >&2; exit 1; }
            printf '%s' "$s" | base64 -d | (cd inst && sha256sum -c --quiet -) || {
              echo "::error::un instalador de la release no es el que compiló esta ejecución" >&2; exit 1; }
          done

      - name: Escribir y firmar SHA256SUMS
        env:
          SYTUE_FIRMA_CLAVE: ${{ secrets.SYTUE_FIRMA_CLAVE }}
          SYTUE_FIRMA_PASSWORD: ${{ secrets.SYTUE_FIRMA_PASSWORD }}
        run: |
          set -euo pipefail
          scripts/firma-publicacion.sh sumas "$TAG" "$COMMIT" inst > SHA256SUMS
          cat SHA256SUMS
          scripts/firma-publicacion.sh firmar SHA256SUMS

      - name: Adjuntar SHA256SUMS a la release
        env:
          SYTUE_GIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ficheros=(SHA256SUMS)
          [ ! -s SHA256SUMS.sig ] || ficheros+=(SHA256SUMS.sig)
          bash deploy/sytue-git/bin/publicar-asset.sh "$TAG" "${ficheros[@]}"
