#
# FIRMA LOS AAB DE ANDROID CON LA CLAVE DE SUBIDA (Play App Signing) y los adjunta a
# la release. Ver «Android: Play App Signing» en docs/operations.md.
#
# iOS y macOS de tienda los construye Xcode Cloud al empujar el tag `tienda-vX.Y.Z`, y
# de ahí van a TestFlight. Aquí no hay secretos de Apple ni se adjuntan los .ipa a la
# release. Ver «Xcode Cloud» y «Apple: firma» en docs/operations.md.
#
# COMPILA AQUÍ (sin Codemagic desde el 2026-10-19). Nuestros runners
# son Linux ARM64 y Google no publica NDK para ese anfitrión: `accion.sh android-sdk`
# instala el de x86_64, que corre por qemu-user, y la CLI de Fyne va compilada para
# amd64 por lo mismo (empaquetar.sh lo explica). Go sigue siendo el nativo. Después se
# firman los quince AAB con la clave de subida, se verifican y se publican como
# `sytue-<app>-android.aab`. La clave de subida no sale de nuestros runners.

name: release-mobile

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag vX.Y.Z a publicar (vacío = la referencia elegida arriba)"
        type: string
        required: false

# Lo que puede hacer GITHUB_TOKEN en este flujo, y nada más (GitHub lo
# aplica; en Forgejo este campo se ignoraba y mandaba el token de cada paso).
permissions:
  contents: write

# `bash` EXPLÍCITO. Dentro de un `container:` GitHub ejecuta los `run:` con
# `sh -e` y no con bash: `set -o pipefail`, `[[`, los arrays y `<<<` mueren
# con «Illegal option» (cancelar-al-cerrar, 2026-09-27). Con `shell: bash`
# es `bash --noprofile --norc -eo pipefail`, que es lo que corría en la forja.
defaults:
  run:
    shell: bash

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  # El checkout lo escribe el runner (uid 1001) y los pasos corren como root dentro
  # del `container:`: git ve un propietario ajeno, se niega («dubious ownership»)
  # y `go build` muere con «error obtaining VCS status». La forja montaba el
  # workspace con el mismo usuario y no lo notaba.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  TAG: ${{ github.event.inputs.ref || github.ref_name }}
  # SHA-256 del certificado de SUBIDA. Es público (Play Console lo enseña) y fija con
  # qué clave se firma: un secreto cambiado por otra clave es rojo aquí y no un
  # rechazo de Play Console días después.
  HUELLA_SUBIDA: "97:5E:77:9A:17:F4:86:87:AE:96:BE:77:26:A4:9C:96:C0:11:80:46:0E:68:73:B3:B3:E8:F3:03:28:9C:5F:82"

jobs:
  android:
    name: Firmar los AAB de Fyne (Android)
    runs-on: sytue-arm64
    # Los runners propios del frontal (.github/RUNNERS.md): cada job en un
    # contenedor del Docker del CI, con el proxy filtrado como socket de Docker
    # y la caché de Go del host (con varios jobs, ancla `&ci` y `*ci`).
    container: &ci
      image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      env:
        DOCKER_HOST: unix:///run/sytue-ci/docker.sock
      volumes:
        - /srv/ci/run/proxy.sock:/run/sytue-ci/docker.sock
        - /var/cache/sytue-ci/go-build:/github/home/.cache/go-build
        - /var/cache/sytue-ci/go-mod:/github/home/go/pkg/mod
    # Medido en el frontal el 2026-10-19: 4 min 38 s por app con la caché fría; quince
    # apps son ~70 min, y el margen es el doble (scripts/ci-margen-de-reloj.sh).
    timeout-minutes: 150
    env:
      # Los forks de Fyne son privados: sin esto Go los pediría al proxy público.
      GOPRIVATE: github.com/thinkddr/*
      GOTOOLCHAIN: local
      UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
    steps:
      - name: Comprobar el tag y la clave de subida
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::«$TAG» no es un tag vX.Y.Z" >&2; exit 1 ;; esac
          : "${UPLOAD_KEYSTORE_B64:?falta el secreto ANDROID_UPLOAD_KEYSTORE_BASE64}"
          : "${UPLOAD_KEYSTORE_PASSWORD:?falta el secreto ANDROID_UPLOAD_KEYSTORE_PASSWORD}"
          : "${UPLOAD_KEY_ALIAS:?falta el secreto ANDROID_UPLOAD_KEY_ALIAS}"

      - name: Clonar el tag de la release
        env:
          SYTUE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYTUE_GIT_FORKS_TOKEN: ${{ secrets.SYTUE_GIT_FORKS_TOKEN }}
        run: |
          set -euo pipefail
          # Runner propio: el workspace SOBREVIVE entre jobs (lo deja el anterior,
          # con su .git), así que se vacía antes de clonar (.github/RUNNERS.md).
          find . -mindepth 1 -delete
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$SYTUE_GIT_TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "$TAG"
          git checkout -q FETCH_HEAD
          # La plomería del CI va con el WORKFLOW, no con el tag (2653); qué apps hay y
          # su versionCode, con el tag, que es lo que se compiló.
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$SYTUE_GIT_TOKEN" | base64 -w0)" \
            fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD -- .github/actions deploy/sytue-git/versions.env \
            deploy/sytue-git/bin/publicar-asset.sh \
            apps/fyne/scripts/play-publicar.sh apps/fyne/play
          git config --global "http.$GITHUB_SERVER_URL/.extraHeader" \
            "Authorization: Basic $(printf 'x-access-token:%s' "$SYTUE_GIT_TOKEN" | base64 -w0)"
          # Los forks de Fyne son PRIVADOS: se comprueba AQUÍ que el token los lee, no
          # media hora después al compilar (release-desktop v3.5.7 a v3.5.9).
          "$GITHUB_WORKSPACE/.github/actions/toolchain/forks.sh"

      - name: Preparar Go, el SDK de Android, JDK, bundletool y jq
        run: $GITHUB_WORKSPACE/.github/actions/toolchain/accion.sh go jq jdk bundletool android-sdk

      - name: Instalar la CLI Fyne fijada, para amd64
        run: |
          set -euo pipefail
          # AMD64 a propósito: `archNDK()` elige el NDK por la arquitectura de la CLI, y en
          # ARM64 no hay NDK. Corre por qemu-user. La versión, con el WORKFLOW.
          fyne_cli="$(git show "$GITHUB_SHA:deploy/sytue-git/versions.env" | sed -n 's/^FYNE_TOOLS_VERSION=//p')"
          GOARCH=amd64 go install "fyne.io/tools/cmd/fyne@v${fyne_cli:?versions.env no fija FYNE_TOOLS_VERSION}"
          echo "$(go env GOPATH)/bin/linux_amd64" >> "$GITHUB_PATH"

      - name: Compilar los AAB sin firmar
        run: |
          set -euo pipefail
          bash apps/fyne/scripts/empaquetar.sh android
          mkdir -p sin-firmar
          mv apps/fyne/dist/*-android-sin-firmar.aab sin-firmar/
          # UN AAB POR APP o nada: la lista sale del árbol del tag, y es roja si falta uno.
          bash apps/fyne/scripts/empaquetar.sh publicables android-sin-firmar sin-firmar >/dev/null || {
            echo "::error::no han salido todos los AAB sin firmar de $TAG." >&2
            exit 1
          }

      - name: Firmar y verificar con la clave de subida
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/sytue-upload.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d >"$keystore"
          unset UPLOAD_KEYSTORE_B64
          codigo="$(bash apps/fyne/scripts/empaquetar.sh version-code "$TAG")"
          minimo="$(sed -n 's/^ANDROID_MIN_SDK=//p' apps/fyne/scripts/empaquetar.sh)"
          [[ "$minimo" =~ ^[0-9]+$ ]] && [ "$minimo" -ge 24 ] || {
            echo "::error::$TAG no declara un ANDROID_MIN_SDK de 24 o más, requerido por la protección automática de Play." >&2
            exit 1
          }
          mkdir -p firmados
          for app in $(bash apps/fyne/scripts/empaquetar.sh publicables android-sin-firmar | sed 's/^sytue-//; s/-android-sin-firmar\.aab$//'); do
            entrada="sin-firmar/sytue-$app-android-sin-firmar.aab"
            salida="firmados/sytue-$app-android.aab"
            paquete="$(sed -n 's/^[[:space:]]*ID[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "apps/fyne/cmd/$app/FyneApp.toml" | head -1)"
            # Un AAB con firma previa tendría DOS firmantes al pasar por jarsigner.
            entradas="$(unzip -Z1 "$entrada")"
            if grep -q '^META-INF/' <<<"$entradas"; then
              echo "::error::$entrada ya trae META-INF: no debería venir firmado." >&2
              exit 1
            fi
            # La contraseña por :env, nunca en argv: `ps` y los logs verían -storepass.
            jarsigner -J-Duser.language=en -keystore "$keystore" -storetype PKCS12 \
              -storepass:env UPLOAD_KEYSTORE_PASSWORD -keypass:env UPLOAD_KEYSTORE_PASSWORD \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar "$salida" "$entrada" "$UPLOAD_KEY_ALIAS" >/dev/null
            # Sin -strict: una clave de subida es SIEMPRE autofirmada, y -strict lo trata
            # como error de cadena. Lo que importa: que verifique y que no quede ninguna
            # entrada sin firmar.
            verificado="$(jarsigner -J-Duser.language=en -verify "$salida")"
            grep -qx 'jar verified.' <<<"$verificado" && ! grep -q 'unsigned entries' <<<"$verificado" || {
              echo "::error::$salida no verifica con jarsigner: $verificado" >&2
              exit 1
            }
            # Un solo firmante y el certificado de SUBIDA, no otro.
            certificado="$(keytool -J-Duser.language=en -printcert -jarfile "$salida")"
            [ "$(grep -c '^Signer #' <<<"$certificado")" -eq 1 ] || {
              echo "::error::$salida no tiene exactamente un firmante." >&2
              exit 1
            }
            grep -q "SHA256: $HUELLA_SUBIDA" <<<"$certificado" || {
              echo "::error::$salida no está firmado con la clave de subida ($HUELLA_SUBIDA)." >&2
              exit 1
            }
            # Y lo que Play mira del manifiesto, leído del AAB firmado.
            manifiesto="$(bundletool dump manifest --bundle "$salida")"
            grep -q "package=\"$paquete\"" <<<"$manifiesto" &&
              grep -q "android:versionCode=\"$codigo\"" <<<"$manifiesto" &&
              grep -q "android:minSdkVersion=\"$minimo\"" <<<"$manifiesto" || {
              echo "::error::$salida no es $paquete con versionCode $codigo y mínimo SDK $minimo (los de $TAG)." >&2
              exit 1
            }
            echo "✓ $salida: $paquete, versionCode $codigo, mínimo SDK $minimo, firmado con la clave de subida"
          done
          bash apps/fyne/scripts/empaquetar.sh publicables android firmados >/dev/null

      - name: Publicar los AAB firmados
        env:
          SYTUE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t firmados < <(bash apps/fyne/scripts/empaquetar.sh publicables android firmados)
          bash deploy/sytue-git/bin/publicar-asset.sh "$TAG" "${firmados[@]}"

      # OPCIONAL: sin la cuenta de servicio los AAB se quedan en la release y se suben a
      # mano; con ella van a «internal» como borrador. Producción nunca: la decide el dueño.
      - name: Subir a Google Play (internal), si hay cuenta de servicio
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$PLAY_JSON" ]; then
            echo "::warning::sin el secreto GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: los AAB quedan en la release $TAG y no se suben a Google Play."
            exit 0
          fi
          umask 077
          export PLAY_CREDENCIALES="$RUNNER_TEMP/play.json"
          trap 'rm -f "$PLAY_CREDENCIALES"' EXIT
          printf '%s' "$PLAY_JSON" >"$PLAY_CREDENCIALES"
          unset PLAY_JSON
          # Play NO tumba el job: los AAB firmados ya están en la release, que es lo que
          # este workflow garantiza. Un 403 (cuenta de servicio sin permisos) o un 404
          # (paquete que aún no existe en la consola) queda como aviso con lo que dijo Google.
          bash apps/fyne/scripts/play-publicar.sh --aab firmados ||
            echo "::warning::Google Play rechazó la subida (arriba, qué contestó): los AAB firmados siguen en la release $TAG."
