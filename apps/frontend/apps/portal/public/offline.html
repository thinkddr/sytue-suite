<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14232a" media="(prefers-color-scheme: dark)" />
    <title>No connection — Sytue One</title>
    <!-- Pagina estatica: sin datos de usuario, autocontenida (marca en linea). -->
    <!-- sytue-theme:start -->
<style>
/* Sytue — tres modos (claro, traslúcido, oscuro) por tres COLORES elegibles: petróleo
 * (la hoja sin atributo), azul cobalto y el de cada app (`data-color`, al final de la
 * hoja; este último es el predeterminado). El color pone acción, selección, enlace y
 * foco, y tiñe un punto los neutros. Claro: lienzo gris frío y superficies blancas. Traslúcido: velos sobre un
 * fondo del color. Oscuro: casi negro con un punto del color.
 * Este archivo y colors.json se distribuyen con scripts/sync-branding.sh.
 * No usar el color como único indicador de estado; conservar texto e iconos.
 */

:root {
  /* ---- Primario = el COLOR, aquí PETRÓLEO (acción, selección, enlace y foco en toda la suite) ----
   * 600 = relleno con texto blanco (AA) y anillo de foco en claro. 700 = texto/enlace
   * sobre blanco (AA). 400 = relleno en oscuro, con rótulo OSCURO encima. 300 =
   * texto/enlace y foco sobre oscuro. */
  --sytue-primary-50: #e9f6f6;
  --sytue-primary-100: #d9efef;
  --sytue-primary-200: #aee1e4;
  --sytue-primary-300: #7fd3d8; /* texto/enlace y foco sobre oscuro */
  --sytue-primary-400: #3cc4cc; /* relleno en oscuro, con rótulo oscuro */
  --sytue-primary-500: #1a9aa3; /* ≥ 3:1 sobre blanco: componente, nunca texto */

  /* --- Cuña del logotipo por organización ---------------------------------
     La marca que ve una organización que NO ha subido la suya: la nuestra, con la
     cuña teñida. Solo cambia la cuña; el badge blanco y el monograma se quedan,
     porque lo que se personaliza es el acento, no la marca.

     Doce y no un tono libre del círculo cromático: un hue aleatorio produce
     fucsias y verdes fluorescentes que no son de esta casa, y además no habría
     forma de garantizar el contraste. Estos doce están medidos —todos por encima
     de 3:1 contra el badge blanco Y contra el monograma— y recorren el círculo
     manteniendo la saturación y la luminosidad del latón de la marca, así que
     cualquiera de ellos se lee como una variante nuestra y no como otro logo.

     El índice sale del slug de la organización: mismo slug, mismo color, siempre.
     Con cientos de miles de organizaciones se repiten por construcción; esto es
     ayuda de reconocimiento —distinguir dos pestañas abiertas—, no un
     identificador. Ver packages/ui/src/components/OrgMark.tsx. */
  --sytue-orgmark-1: #9c743a;
  --sytue-orgmark-2: #847f40;
  --sytue-orgmark-3: #678853;
  --sytue-orgmark-4: #468c6f;
  --sytue-orgmark-5: #308c8c;
  --sytue-orgmark-6: #3b87a2;
  --sytue-orgmark-7: #597fae;
  --sytue-orgmark-8: #7775ad;
  --sytue-orgmark-9: #8f6da0;
  --sytue-orgmark-10: #a06888;
  --sytue-orgmark-11: #a9676c;
  --sytue-orgmark-12: #a76c51;

  --sytue-primary-600: #0f7680; /* base relleno con texto blanco (AA) */
  --sytue-primary-700: #0c636b; /* texto/enlace sobre blanco (AA) */
  --sytue-primary-800: #0a4a50;
  --sytue-primary-900: #083b40;
  --sytue-primary-950: #04262a;
  --sytue-primary: #0f7680;
  --sytue-primary-hover: #0c636b;
  --sytue-primary-active: var(--sytue-primary-800);
  --sytue-on-primary: #ffffff;
  --sytue-primary-text: var(--sytue-primary-700);
  /* Relleno de los glifos de dos tonos (el trazo es `currentColor`): el primario del
   * tema. Se declara una vez y sigue al primario cuando el oscuro lo reasigna. */
  --sytue-glyph-fill: var(--sytue-primary);
  /* La muestra de cada color elegible, para el selector: tiene que enseñar también
   * el que NO está pintado, así que no puede salir de `--sytue-primary`. Es el
   * primario claro de cada uno y no cambia con el modo ni con el color en vigor. */
  --sytue-swatch-petroleo: #0f7680;
  --sytue-swatch-cobalto: #3b5fe0;
  /* ---- Rampa del carril ----
   * Los pasos del primario que usan el carril y el marco. Son los del primario salvo
   * en «el de cada app» para las apps de icono rojo, que solo tiñen el carril: ahí su
   * bloque los reasigna y deja el primario en el de la casa (ADR 0072). */
  --sytue-rail-50: var(--sytue-primary-50);
  --sytue-rail-100: var(--sytue-primary-100);
  --sytue-rail-300: var(--sytue-primary-300);
  --sytue-rail-700: var(--sytue-primary-700);
  --sytue-rail-800: var(--sytue-primary-800);
  --sytue-rail-900: var(--sytue-primary-900);
  --sytue-rail-950: var(--sytue-primary-950);
  /* ---- fin de la rampa del carril ---- */

  /* ---- Cobre: familia de datos y gráficos ----
   * Fue la señal de «estás aquí»; hoy esa señal es `--sytue-indicator` (el primario).
   * Nunca relleno con texto encima (para eso, el 600) ni texto sobre claro (el 700). */
  --sytue-copper-300: #f29c77;
  --sytue-copper-400: #ee7d52; /* señal sobre cromo oscuro — ≥ 4,7:1 */
  --sytue-copper-500: #e06a36; /* señal sobre blanco, papel y tinta — ≥ 3:1 */
  --sytue-copper-600: #b44a1d; /* relleno — blanco 5,3:1 */
  --sytue-copper-700: #963d17; /* texto sobre blanco — 7:1 */

  /* ---- Acento secundario = TINTA marina (cromo de la suite, texto, gráficos) ---- */
  --sytue-accent-50: #f2f5f7;
  --sytue-accent-100: #e3eaee;
  --sytue-accent-200: #c6d3da;
  --sytue-accent-300: #9fb3bd;
  --sytue-accent-400: #6f8792;
  --sytue-accent-500: #4d6470;
  --sytue-accent-600: #36505c;
  --sytue-accent-700: #224656;
  --sytue-accent-800: #1a3541; /* tinta — 11,9:1 sobre papel */
  --sytue-accent-900: #11232b;
  --sytue-accent-950: #0a151a;
  --sytue-accent: var(--sytue-accent-800);
  --sytue-accent-hover: var(--sytue-accent-700);
  --sytue-on-accent: #ffffff;
  --sytue-accent-text: var(--sytue-accent-700);

  /* ---- Acento terciario (violeta) — solo datos/producto, nunca acción de UI ---- */
  --sytue-violet-300: #b8a6ff;
  --sytue-violet-400: #9a7eff;
  --sytue-violet-500: #7c5cff;
  --sytue-violet-600: #6740e6;
  --sytue-violet-700: #5430bd;
  --sytue-violet: var(--sytue-violet-500);
  --sytue-violet-text: var(--sytue-violet-700);
  --sytue-violet-bg: #f0edfc;

  /* ---- Neutros con un punto del COLOR: superficies y líneas (0-400) → texto (500-700)
   * → superficies del tema oscuro (800+) ----
   * Misma escalera de luminancia que la anterior, girada hacia el matiz del color.
   * Los escalones que coinciden con un rol del tema llevan su nombre al lado. */
  --sytue-neutral-0: #ffffff; /* superficie */
  --sytue-neutral-25: #fafcfc;
  --sytue-neutral-50: #f6f9f9;
  --sytue-neutral-100: #f1f6f6; /* lienzo — bg de la suite */
  --sytue-neutral-150: #e8efef; /* hundido */
  --sytue-neutral-200: #e0e8e8; /* línea suave */
  --sytue-neutral-300: #cad5d6; /* línea / borde */
  --sytue-neutral-400: #919ea0; /* decorativo (no texto) */
  --sytue-neutral-500: #586a6f; /* texto sutil */
  --sytue-neutral-600: #43555a; /* texto atenuado */
  --sytue-neutral-700: #34464b;
  --sytue-neutral-800: #283639;
  --sytue-neutral-850: #1a2628; /* oscuro: menús y superficie elevada */
  --sytue-neutral-900: #131c1e; /* oscuro: superficie */
  --sytue-neutral-950: #0a1011; /* oscuro: fondo */
  --sytue-neutral-1000: #070c0d; /* oscuro: hundido */

  /* Cromo nombrado: la barra superior (chrome), el menú lateral (rail), la banda de
   * cabecera de panel (chrome-2) y su elevación (chrome-3). Claro como el contenido; el
   * tema oscuro lo reasigna más abajo.
   *
   * VIVEN AQUÍ, no solo en la copia de packages/config: este fichero es la fuente
   * de verdad y `scripts/sync-branding.sh` hace `cp -f` sobre aquella. Un `var()`
   * sin definir es guaranteed-invalid: la declaración se descarta EN SILENCIO, sin
   * error ni fallback, y el cromo se quedaría sin borde, sin hover y sin divisor. */
  --sytue-rail: #ffffff;
  --sytue-chrome: #ffffff;
  --sytue-chrome-2: #f1f6f6;
  --sytue-chrome-3: #f1f6f6;
  /* Texto e iconos sobre el cromo. `warning` es el relleno del medidor de cuota cuando
   * se acerca al límite, que vive en el menú lateral de Mail y Drive. */
  --sytue-on-chrome: #0f1d20;
  --sytue-on-chrome-muted: #43555a;
  --sytue-on-chrome-warning: var(--sytue-warning-text);
  /* Estados SOBRE el cromo. theme.css los mapea a --color-chrome-* (utilidades
   * bg-chrome-hover, border-chrome-border…); los consume la topbar compartida por
   * toda la suite. El velo es el hundido: se ve sobre la barra blanca (1,17:1) y
   * también sobre la banda de cabecera (1,06:1). */
  --sytue-chrome-hover: #e8efef;
  --sytue-chrome-active: var(--sytue-selected);
  --sytue-chrome-divider: var(--sytue-border);
  --sytue-chrome-border: var(--sytue-border);
  /* Anillo de foco de los controles que viven SOBRE el cromo (topbar, menú lateral). */
  --sytue-chrome-focus: #0f7680;

  /* «Estás aquí»: barra del ítem activo, subrayado de la pestaña activa, flecha de la
   * columna ordenada. Nunca relleno de botón, para eso está el primario. */
  --sytue-indicator: #0f7680;

  /* ---- Semánticos (AA) ----
   * *base = relleno con texto blanco; *-text = texto/icono sobre claro;
   * *-bg = fondo suave. Nunca comunicar estado solo por color. */
  --sytue-success: #1d7443;
  --sytue-success-hover: #175c35;
  --sytue-success-text: #1a6a3d;
  --sytue-success-bg: #e5f3eb;
  --sytue-warning: #8a5d0c;
  --sytue-warning-hover: #6e4a09;
  --sytue-warning-text: #7f5a0f;
  --sytue-warning-bg: #fcf1d9;
  /* El rojo de marca subió de #b53a2e a #c34134 el 2026-09-21. Como relleno con texto
   * blanco #b53a2e iba sobrado (5,82:1), pero también es el BORDE de un campo inválido y
   * el punto de aviso de la campana, y ahí es un componente: sobre la tinta del cromo
   * daba 2,78:1 y sobre la superficie oscura 2,77:1, por debajo del 3:1 de WCAG 1.4.11.
   * #c34134 es el rojo más oscuro —o sea, el más cercano al de antes— que pasa los dos
   * a la vez sin bajar el blanco de encima de AA: 3,18:1 y 3,17:1, blanco 5,09:1. */
  --sytue-danger: #c34134;
  --sytue-danger-hover: #922e24;
  --sytue-danger-text: #a3342a;
  --sytue-danger-bg: #fbeae7;
  /* «Info» es AZUL y lo sigue siendo. Era un alias del primario mientras el primario
   * fue azul; con el color elegible se queda con sus valores, o un aviso informativo
   * se leería como uno de éxito. */
  --sytue-info: #1a6fbb;
  --sytue-info-hover: #165c9c;
  --sytue-info-text: #165c9c;
  --sytue-info-bg: #eaf3fb;

  /* ---- Color de producto (tile del app switcher / etiquetas) ----
   * Orientación entre apps: el color por app vive en el tile del launcher y en la
   * marca, no en el cromo. Escalón AA-safe (≥ 4.5:1 con blanco encima). */
  --sytue-product-one: #c2410c;
  --sytue-product-id: #8a6d0f;
  --sytue-product-drive: #16734d;
  --sytue-product-docs: #2968ec;
  --sytue-product-sheets: #4d7c0f;
  --sytue-product-slides: #b05321;
  --sytue-product-pdf: #d83b35;
  --sytue-product-mail: #dc3450;
  --sytue-product-calendar: #953be7;
  --sytue-product-contacts: #0e7490;
  --sytue-product-notes: #a91fb4;
  --sytue-product-photos: #2f8a2a;
  --sytue-product-chat: #b21e92;
  --sytue-product-meet: #8b34ca;
  --sytue-product-rooms: #4338ca;
  --sytue-product-cloud: #086ba0;
  --sytue-product-console: #506782;
  --sytue-product-hub: #0f766e;
  --sytue-product-erp: #b45309;
  --sytue-product-cast: #9f1239;
  --sytue-product-pages: #ca1682;
  --sytue-product-bases: #8a4b2a;

  /* ---- Presencia (Sytue Hub) — siempre con icono/forma, nunca solo color ----
   * Un punto de presencia es un INDICADOR de estado: WCAG 1.4.11 le pide 3:1 contra la
   * superficie donde se pinta, y son cuatro puntos que hay que distinguir ENTRE SÍ.
   * Que además lleven nombre accesible no los exime; lo que hace es que un daltónico
   * tampoco dependa del tono. Cada valor es el más cercano al de marca que pasa el 3:1
   * en los DOS temas a la vez, así que no hace falta reasignarlos en oscuro:
   *   online  #1d7443 -> #2a8f57 (oscuro 2,79 -> 3,96; claro 4,07)
   *   dnd     #b53a2e -> el rojo de peligro (oscuro 2,77 -> 3,17; claro 5,09)
   *   offline #a39c95 -> #8c847c (claro 2,71 -> 3,68; oscuro 4,38) */
  --sytue-presence-online: #2a8f57;
  --sytue-presence-away: #b27a0e;
  --sytue-presence-dnd: var(--sytue-danger);
  --sytue-presence-offline: #8c847c;

  /* ---- Avatares y colores de persona (autoría, cursores de coedición) ----
   * Vivos pero no chillones, bien separados en el círculo para distinguir a seis
   * personas de un vistazo. Iniciales en blanco AA (≥ 4,6:1) sobre todos. */
  --sytue-avatar-1: #0e7c74; /* turquesa  — blanco 5,06:1 */
  --sytue-avatar-2: #b8466a; /* frambuesa — blanco 5,09:1 */
  --sytue-avatar-3: #1f6fb5; /* cielo     — blanco 5,25:1 */
  --sytue-avatar-4: #b35633; /* cobre     — blanco 4,89:1 */
  --sytue-avatar-5: #2a7d48; /* verde     — blanco 5,09:1 */
  --sytue-avatar-6: #6a58b8; /* lavanda   — blanco 5,67:1 */

  /* Tarjetas de recurso: colores de grupo, independientes del estado. */
  --sytue-card-blue: #e8efff;
  --sytue-card-violet: #eeebf8;
  --sytue-card-mint: #e5f0ea;
  --sytue-card-rose: #f6e5ed;
  --sytue-card-amber: #f5efca;

  /* ---- Tema claro (rol semántico) ----
     El lienzo es gris verdoso y las superficies, blancas: se despegan del fondo con
     sombra suave en vez de con una línea. */
  --sytue-bg: #f1f6f6;
  /* Un paso bajo la superficie Y bajo el lienzo: es el hover de una fila, y tiene que
     verse tanto en una tarjeta blanca (1,17:1) como directamente sobre el lienzo. */
  --sytue-bg-subtle: #e8efef;
  --sytue-surface: #ffffff;
  --sytue-surface-raised: #ffffff;
  --sytue-menu-surface: #ffffff;
  --sytue-menu-hover: #ecf4f4;
  --sytue-menu-selected: #d9efef;
  --sytue-surface-sunken: #e8efef;
  --sytue-sidebar-bg: #ffffff;
  --sytue-sidebar-fg: #0f1d20;
  --sytue-sidebar-fg-muted: #43555a;
  /* Ítem activo del menú: tinte del primario, con la barra de `--sytue-indicator` que
     pinta el componente. */
  --sytue-sidebar-active-bg: #d9efef;
  --sytue-sidebar-active-fg: #0a4a50;
  --sytue-sidebar-hover-bg: #ecf4f4;
  --sytue-topbar-bg: #ffffff;
  --sytue-topbar-fg: #0f1d20;
  /* Banda de cabecera de panel (canal de Rooms, paneles del editor, cabecera de
     modal y de tabla): el tono del lienzo sobre la superficie blanca, así se lee como
     cabecera sin necesitar borde. */
  --sytue-header-bg: #f1f6f6;
  --sytue-header-fg: #0f1d20;
  /* Tinta de líneas, con el punto de color del texto. TODOS los bordes derivan de aquí
     por opacidad, y como se declaran en :root con `var()`, conmutan solos cuando el
     tema oscuro cambia la tinta en el mismo elemento. */
  --sytue-ink-rgb: 15, 29, 32;
  --sytue-border-subtle: rgba(15, 29, 32, 0.07);
  --sytue-border: rgba(15, 29, 32, 0.12);
  /* Contorno de control: ver la nota de LÍNEAS arriba. El tema oscuro lo reasigna. */
  --sytue-border-strong: rgba(15, 29, 32, 0.6);
  /* Anillo de la tesela de producto: en claro el badge ya contrasta contra el papel;
     en oscuro se enciende para devolverle contorno sin tocar la paleta. */
  --sytue-product-tile-ring: transparent;
  --sytue-text: #0f1d20;
  --sytue-text-muted: #43555a;
  --sytue-text-subtle: #586a6f;
  /* Selección (fila/ítem elegido): tinte translúcido del primario 600. Intensidad
     como token aparte (12 % claro, 16 % traslúcido y oscuro). */
  --sytue-selected-strength: 12%;
  --sytue-selected: color-mix(
    in srgb,
    var(--sytue-primary-600) var(--sytue-selected-strength),
    transparent
  );
  /* Foco: UN anillo del primario de 2px que contrasta ≥ 3:1 por su cuenta sobre blanco,
     lienzo y hundido (lo mide contraste-paleta.test.ts). */
  --sytue-focus-ring: #0f7680;
  --sytue-overlay: rgba(15, 29, 32, 0.36);
  /* La acción principal es el primario; los fondos de tarjeta no indican estado. */
  --sytue-primary: #0f7680;
  --sytue-primary-hover: #0c636b;
  --sytue-primary-active: var(--sytue-primary-800);
  --sytue-panel-surface: #ffffff;
  --sytue-card-emphasis: #2457e8;
  --sytue-card-emphasis-alt: #2e7485;
  --sytue-card-emphasis-warm: #ce6969;
  --sytue-on-card-emphasis: #ffffff;
  --sytue-on-card-emphasis-warm: #10141a;
  /* Luz del fondo ambiental compartido por web y nativo. Los nombres son los de la
     geometría (arranque, centro, final y foco cálido), no los del color: `blue` es hoy
     otro tono. Renombrarlos toca las apps nativas y no cambia un píxel. */
  --sytue-workspace-blue: #b6d8db;
  --sytue-workspace-middle: #d0e4e1;
  --sytue-workspace-mint: #ebe8d2;
  --sytue-workspace-warm: rgba(247, 201, 72, 0.24);

  --sytue-card-cyan: #dff0f3;
  --sytue-card-coral: #f5e1dc;
  --sytue-card-lime: #edf1d6;
  --sytue-card-slate: #e5e9ef;
  --sytue-card-solid-blue: #2457e8;
  --sytue-card-solid-violet: #6546c5;
  --sytue-card-solid-mint: #0f7680;
  --sytue-card-solid-rose: #b64068;
  --sytue-card-solid-amber: #f2c230;
  --sytue-card-solid-cyan: #157a92;
  --sytue-card-solid-coral: #ce6969;
  --sytue-card-solid-lime: #afc94d;
  --sytue-card-solid-slate: #202832;
  --sytue-on-card-solid-blue: #ffffff;
  --sytue-on-card-solid-violet: #ffffff;
  --sytue-on-card-solid-mint: #ffffff;
  --sytue-on-card-solid-rose: #ffffff;
  --sytue-on-card-solid-amber: #10141a;
  --sytue-on-card-solid-cyan: #ffffff;
  --sytue-on-card-solid-coral: #10141a;
  --sytue-on-card-solid-lime: #10141a;
  --sytue-on-card-solid-slate: #ffffff;
}

/* Tema oscuro elegido por la persona. */
[data-theme='dark'] {
  --sytue-card-blue: rgba(36, 87, 232, 0.22);
  --sytue-card-violet: rgba(101, 70, 197, 0.25);
  --sytue-card-mint: rgba(37, 118, 91, 0.22);
  --sytue-card-rose: rgba(182, 64, 104, 0.22);
  --sytue-card-amber: rgba(234, 214, 65, 0.12);
  --sytue-bg: #0a1011;
  --sytue-bg-subtle: #182325;
  --sytue-surface: #131c1e;
  --sytue-surface-raised: #1a2628;
  --sytue-menu-surface: #1a2628;
  --sytue-menu-hover: #243336;
  --sytue-menu-selected: #133f45;
  --sytue-surface-sunken: #070c0d;
  --sytue-rail: #0d1415;
  --sytue-chrome: #0d1415;
  --sytue-chrome-2: #182325;
  --sytue-chrome-3: #182325;

/* ==== COLOR: el de cada app ====
   Tercer valor del eje `data-color`: el carril y la acción toman el color de producto
   de la app que se está usando. La app la dice `data-app` en la raíz (la web lo pone
   con el prefijo bajo el que se sirve y, si se sirve en la raíz, con la primera etiqueta
   del host; por eso `admin`, `platform` y `web` van como alias de `console` y
   `pages`). Una superficie sin bloque —Hub, Mi cuenta— se queda en
   petróleo: el reparto de abajo, sin rampa propia, da los valores de la casa.

   Cada app aporta SOLO su rampa, derivada de `--sytue-product-<app>`: el 600 lleva
   rótulo blanco (4,7:1), el 700 es el carril y el enlace (6,6:1 con blanco), el 400 la
   acción en oscuro (rótulo oscuro a 4,7:1) y el 300 el enlace en oscuro (6:1). El
   reparto por modo va una vez.

   `--sytue-rail-*` y dejan la del primario en la de la casa, así que botón, enlace,
   selección y foco siguen en petróleo. Son las que el dueño decidió, de entre las que
   caen en la franja de tono de `--sytue-danger` (a menos de 26°), porque su color se
   confundía con el de peligro en insignias, enlaces y foco; Bases está en la franja y

/* ---- Forma «Carril»: el menú lateral es de color ----
   El color de marca vive en el menú lateral, del color elegido de arriba abajo: texto blanco,
   velos blancos para el hover y el ítem activo y ÁMBAR para «estás aquí».

   Los valores van AQUÍ y no en colors.css: son de la FORMA, no de la paleta. Esta hoja
   la leen la web y las apps nativas (apps/nucleo/tokens la interpreta encima de
   colors.css, en el mismo orden de carga), así que las dos pintan el mismo carril. De
   ella las nativas solo entienden los bloques de tokens; las reglas de clase de más
   abajo son cascada del navegador. Quien toque un token de aquí lo toca en los
   CUATRO bloques (claro, oscuro elegido, oscuro del sistema y traslúcido): esta hoja va
   después de colors.css y un valor que solo estuviera en `:root` pisaría al del tema. */
:root {
  --sytue-rail: #0c5f68;
  --sytue-sidebar-bg: #0c5f68;
  --sytue-sidebar-fg: #ffffff;
  --sytue-sidebar-fg-muted: rgba(255, 255, 255, 0.84);
  --sytue-sidebar-active-bg: rgba(255, 255, 255, 0.14);
  --sytue-sidebar-active-fg: #ffffff;
  --sytue-sidebar-hover-bg: rgba(255, 255, 255, 0.08);
  /* «Estás aquí» y relleno de los glifos de dos tonos dentro del carril. */
  --sytue-sidebar-indicator: #ffd45e;
  /* El botón principal sobre el carril: uno del mismo color no se vería, así que va blanco
     con el rótulo del color del carril. En oscuro vuelve al primario del tema. */
  --sytue-sidebar-primary: #ffffff;
  --sytue-sidebar-on-primary: #0c5f68;
  --sytue-sidebar-primary-hover: #e9f6f6;
  --sytue-sidebar-primary-active: #d9efef;
  --sytue-sidebar-focus: #ffffff;
  /* Líneas sobre el carril: divisores y contornos. */
  --sytue-sidebar-border: rgba(255, 255, 255, 0.16);
  /* Un campo de texto apoyado en el carril (el buscador de la barra en móvil): velo
     NEUTRO, sin tinte, para que valga con cualquier color de carril y en los tres temas. */
  --sytue-sidebar-field: rgba(0, 0, 0, 0.28);
}
[data-theme='dark'] {
  --sytue-rail: #0d2a2e;
  --sytue-sidebar-bg: #0d2a2e;
  --sytue-sidebar-fg: #e7efef;

  --sytue-sidebar-primary: #3cc4cc;
  --sytue-sidebar-on-primary: #04161a;
  --sytue-sidebar-primary-hover: #33b0b8;

    --sytue-rail: #0d2a2e;

/* ==== fin del carril de cada app ==== */

[data-theme='translucent'] body {
  background-image: var(--workspace-canvas);
  background-attachment: fixed;
}
[data-theme='translucent'] .bg-bg {
  background-color: transparent;
}
/* Salvo en un diálogo: vive en la capa superior, fuera del lienzo de body, y transparente
   dejaba el texto oscuro sobre el velo negro (visor de Fotos). Opaco como los demás. */
[data-theme='translucent'] dialog.bg-bg {
  background-color: var(--sytue-surface-raised);
}

/* ---- El CARRIL: menú lateral de color de marca y zona de marca de la barra superior ----
   El carril es del color elegido en los tres modos y la barra superior, clara. Las dos comparten
   la familia del cromo (`on-chrome`, `chrome-hover`…), así que dentro del carril esa
   familia se reasigna a los valores del menú lateral, junto con lo que sobre el color
   dejaría de verse: el indicador de «estás aquí» y el relleno de los glifos pasan a
   ÁMBAR; el anillo de foco, a blanco; el botón principal, a blanco con rótulo del color
   (uno del mismo color no se distinguiría del carril), y el enlace y el velo de selección, a
   los del menú.

   Se reasignan `--sytue-*` Y `--color-*`: el puente de theme.css se resuelve UNA vez en
   :root y no se reevalúa en los descendientes. La regla cuelga de las utilidades que
   PINTAN el carril, no de un componente: quien pinte `bg-sidebar` es un carril.

   `--sytue-surface` va sin su puente a propósito: es el hueco del aro `-inset`, que aquí
   tiene que ser del color del carril; `bg-surface` lee `--color-surface` y sigue blanco.

   En la forma «Marco» la barra superior ENTERA y la barra móvil son cromo de color (el
   bloque de la forma, al final de esta hoja), así que entran en la misma regla; en
   «Carril» la superior solo lo es en <768px, con la regla de más abajo. La barra móvil
   es hermana de la hoja: estos tokens no se heredan dentro del contenido. */
:root:not([data-forma='carril']) :is(.sytue-topbar-carril, .sytue-mobilebar),
.bg-sidebar,
.bg-rail {
  --sytue-on-chrome: var(--sytue-sidebar-fg);
  --color-on-chrome: var(--sytue-sidebar-fg);
  --sytue-on-chrome-muted: var(--sytue-sidebar-fg-muted);
  --color-on-chrome-muted: var(--sytue-sidebar-fg-muted);
  --sytue-on-chrome-warning: var(--sytue-sidebar-indicator);
  --color-on-chrome-warning: var(--sytue-sidebar-indicator);
  --sytue-chrome-hover: var(--sytue-sidebar-hover-bg);
  --color-chrome-hover: var(--sytue-sidebar-hover-bg);
  --sytue-chrome-active: var(--sytue-sidebar-active-bg);
  --color-chrome-active: var(--sytue-sidebar-active-bg);
  --sytue-chrome-divider: var(--sytue-sidebar-border);
  --color-chrome-divider: var(--sytue-sidebar-border);
  --sytue-chrome-border: var(--sytue-sidebar-border);
  --color-chrome-border: var(--sytue-sidebar-border);
  --sytue-chrome-focus: var(--sytue-sidebar-focus);
  --sytue-focus-ring: var(--sytue-sidebar-focus);
  --sytue-topbar-fg: var(--sytue-sidebar-fg);
  --color-topbar-fg: var(--sytue-sidebar-fg);
  --sytue-header-fg: var(--sytue-sidebar-fg);
  --color-header-fg: var(--sytue-sidebar-fg);
  --sytue-indicator: var(--sytue-sidebar-indicator);
  --color-indicator: var(--sytue-sidebar-indicator);
  --sytue-glyph-fill: var(--sytue-sidebar-indicator);
  --sytue-primary: var(--sytue-sidebar-primary);
  --color-primary: var(--sytue-sidebar-primary);
  --sytue-on-primary: var(--sytue-sidebar-on-primary);
  --color-on-primary: var(--sytue-sidebar-on-primary);
  --sytue-primary-hover: var(--sytue-sidebar-primary-hover);
  --sytue-primary-active: var(--sytue-sidebar-primary-active);
  --sytue-primary-text: var(--sytue-sidebar-fg);
  --color-primary-text: var(--sytue-sidebar-fg);
  --sytue-selected: var(--sytue-sidebar-active-bg);
  --color-selected: var(--sytue-sidebar-active-bg);
  --sytue-surface: var(--sytue-sidebar-bg);
}

/* En <768px el menú lateral va en un cajón y no se ve: la BARRA SUPERIOR entera es el
   carril (`TopBar rail` le pone `.sytue-topbar-carril`). Misma lista de tokens que arriba
   —un test las compara— más el fondo de la propia barra, y el buscador en velo oscuro:
   es un campo de `bg-surface`, y blanco macizo en mitad de la barra de color pesaría
   más que la marca. */
@media (max-width: 767.98px) {
  .sytue-topbar-carril {
    background: var(--sytue-sidebar-bg);
    color: var(--sytue-sidebar-fg);
    box-shadow: none;
    --sytue-topbar-bg: var(--sytue-sidebar-bg);
    --sytue-on-chrome: var(--sytue-sidebar-fg);
    --color-on-chrome: var(--sytue-sidebar-fg);
    --sytue-on-chrome-muted: var(--sytue-sidebar-fg-muted);
    --color-on-chrome-muted: var(--sytue-sidebar-fg-muted);
    --sytue-on-chrome-warning: var(--sytue-sidebar-indicator);
    --color-on-chrome-warning: var(--sytue-sidebar-indicator);
    --sytue-chrome-hover: var(--sytue-sidebar-hover-bg);
    --color-chrome-hover: var(--sytue-sidebar-hover-bg);
    --sytue-chrome-active: var(--sytue-sidebar-active-bg);
    --color-chrome-active: var(--sytue-sidebar-active-bg);
    --sytue-chrome-divider: var(--sytue-sidebar-border);
    --color-chrome-divider: var(--sytue-sidebar-border);
    --sytue-chrome-border: var(--sytue-sidebar-border);
    --color-chrome-border: var(--sytue-sidebar-border);
    --sytue-chrome-focus: var(--sytue-sidebar-focus);
    --sytue-focus-ring: var(--sytue-sidebar-focus);
    --sytue-topbar-fg: var(--sytue-sidebar-fg);
    --color-topbar-fg: var(--sytue-sidebar-fg);
    --sytue-header-fg: var(--sytue-sidebar-fg);
    --color-header-fg: var(--sytue-sidebar-fg);
    --sytue-indicator: var(--sytue-sidebar-indicator);
    --color-indicator: var(--sytue-sidebar-indicator);
    --sytue-glyph-fill: var(--sytue-sidebar-indicator);
    --sytue-primary: var(--sytue-sidebar-primary);
    --color-primary: var(--sytue-sidebar-primary);
    --sytue-on-primary: var(--sytue-sidebar-on-primary);
    --color-on-primary: var(--sytue-sidebar-on-primary);
    --sytue-primary-hover: var(--sytue-sidebar-primary-hover);
    --sytue-primary-active: var(--sytue-sidebar-primary-active);
    --sytue-primary-text: var(--sytue-sidebar-fg);
    --color-primary-text: var(--sytue-sidebar-fg);
    --sytue-selected: var(--sytue-sidebar-active-bg);
    --color-selected: var(--sytue-sidebar-active-bg);
    --sytue-surface: var(--sytue-sidebar-bg);
  }
  /* La zona de marca ya va sobre la barra de color: sin su propio fondo, o en el
     traslúcido se apilarían dos velos y saldría una esquina más oscura. */
  .sytue-topbar-carril .sytue-esquina-marca {
    background: transparent;
  }
  /* El campo es `bg-surface`, así que la «vuelta al tema» de abajo le devuelve el anillo
     de foco del tema, que sobre el carril no se vería: se le repone el del carril. */
  .sytue-topbar-carril input {
    --sytue-focus-ring: var(--sytue-sidebar-focus);
    background-color: var(--sytue-sidebar-field);
    border-color: transparent;
    color: var(--sytue-sidebar-fg);
  }
  .sytue-topbar-carril input::placeholder {
    color: var(--sytue-sidebar-fg-muted);
  }
  /* El avatar de la cuenta y el punto de aviso de la campana: el disco es del color de la
     persona y el punto, rojo de peligro; cualquiera de los dos puede coincidir con el
     del carril (con el color de Mail, rojo sobre rojo). Aro del texto del carril, como
     las muestras de color del menú. En «Marco» la barra es de color a cualquier ancho, y
     lo llevan también en escritorio (al final). */
  .sytue-topbar-carril .sytue-aro-carril {
    border-radius: 9999px;
    box-shadow: 0 0 0 1.5px var(--sytue-sidebar-fg);
  }
  /* Y el menú lateral es un CAJÓN sobre el contenido. El carril del traslúcido deja ver
     un punto de lo que tiene debajo, que en escritorio es el fondo ambiental y aquí,
     texto: se colaba entre los rótulos del menú. Su mismo color, sobre una base opaca. */
  [data-theme='translucent'] nav.bg-sidebar {
    background-color: var(--sytue-neutral-50);
    background-image: linear-gradient(var(--sytue-sidebar-bg), var(--sytue-sidebar-bg));
  }
}

/* Lo que se abre o se apoya DENTRO del carril con su propia superficie —el conmutador de
   aplicaciones, un menú, un popover, un diálogo, una pista, una tarjeta blanca— vuelve a
   los valores del tema: una variable se hereda, y sin esto saldría con el indicador
   ámbar y un botón blanco sobre blanco. Los valores «de fuera» son las copias
   `--sytue-root-*`, que se resuelven en :root y nadie reasigna.

   `:where()` deja la especificidad a cero: `.sytue-menu-surface`, más abajo, sigue
   poniendo su hover y su selección. */
html {
  --sytue-root-on-chrome: var(--sytue-on-chrome);
  --sytue-root-on-chrome-muted: var(--sytue-on-chrome-muted);
  --sytue-root-on-chrome-warning: var(--sytue-on-chrome-warning);
  --sytue-root-chrome-hover: var(--sytue-chrome-hover);
  --sytue-root-chrome-active: var(--sytue-chrome-active);
  --sytue-root-chrome-divider: var(--sytue-chrome-divider);
  --sytue-root-chrome-border: var(--sytue-chrome-border);
  --sytue-root-chrome-focus: var(--sytue-chrome-focus);
  --sytue-root-focus-ring: var(--sytue-focus-ring);
  --sytue-root-topbar-fg: var(--sytue-topbar-fg);
  --sytue-root-header-fg: var(--sytue-header-fg);
  --sytue-root-indicator: var(--sytue-indicator);
  --sytue-root-glyph-fill: var(--sytue-glyph-fill);
  --sytue-root-primary: var(--sytue-primary);
  --sytue-root-on-primary: var(--sytue-on-primary);
  --sytue-root-primary-hover: var(--sytue-primary-hover);
  --sytue-root-primary-active: var(--sytue-primary-active);
  --sytue-root-primary-text: var(--sytue-primary-text);
  --sytue-root-selected: var(--sytue-selected);
  --sytue-root-surface: var(--sytue-surface);
}
:where(.bg-sidebar, .bg-rail, .sytue-topbar-carril, .sytue-mobilebar)

    .sytue-menu-surface,
    .sytue-popover-surface,
    .bg-surface,
    .bg-surface-raised,
    [role='dialog'],
    [role='menu'],
    [role='listbox'],
    [role='tooltip']
  ) {
  --sytue-on-chrome: var(--sytue-root-on-chrome);

  --sytue-on-chrome-muted: var(--sytue-root-on-chrome-muted);
  --color-on-chrome-muted: var(--sytue-root-on-chrome-muted);
  --sytue-on-chrome-warning: var(--sytue-root-on-chrome-warning);

  --color-chrome-hover: var(--sytue-root-chrome-hover);
  --sytue-chrome-active: var(--sytue-root-chrome-active);
  --color-chrome-active: var(--sytue-root-chrome-active);
  --sytue-chrome-divider: var(--sytue-root-chrome-divider);
  --color-chrome-divider: var(--sytue-root-chrome-divider);
  --sytue-chrome-border: var(--sytue-root-chrome-border);
  --color-chrome-border: var(--sytue-root-chrome-border);
  --sytue-chrome-focus: var(--sytue-root-chrome-focus);
  --sytue-focus-ring: var(--sytue-root-focus-ring);
  --sytue-topbar-fg: var(--sytue-root-topbar-fg);
  --color-topbar-fg: var(--sytue-root-topbar-fg);
  --sytue-header-fg: var(--sytue-root-header-fg);
  --color-header-fg: var(--sytue-root-header-fg);
  --sytue-indicator: var(--sytue-root-indicator);
  --color-indicator: var(--sytue-root-indicator);
  --sytue-glyph-fill: var(--sytue-root-glyph-fill);
  --sytue-primary: var(--sytue-root-primary);
  --color-primary: var(--sytue-root-primary);
  --sytue-on-primary: var(--sytue-root-on-primary);
  --color-on-primary: var(--sytue-root-on-primary);
  --sytue-primary-hover: var(--sytue-root-primary-hover);
  --sytue-primary-active: var(--sytue-root-primary-active);

    <!--
      Idioma. Esta pagina la sirve el service worker desde la cache: no hay servidor
      que negocie nada, asi que lo hace el navegador con la MISMA regla que el
      middleware (cookie explicita > idioma del navegador). El ingles es la fuente de
      verdad y ya esta en el HTML, de modo que si el script no llega a correr se lee
      igual. Estaba entera en espanol, y era la unica pagina que ve quien se queda sin
      red: el aviso mas importante de la suite hablaba un solo idioma.

      Y ya no promete que «tus cambios se sincronizaran al reconectar»: el service
      worker del portal no guarda ediciones (solo cascaron estatico, ADR-0024 fase 1).
    -->
    <script>
      (function () {
        var textos = {
          es: [
            'Sin conexión — Sytue One',
            'Sin conexión',
            'No hay conexión con Sytue One. Comprueba tu red y vuelve a intentarlo.',
            'Volver a intentarlo',
          ],
          fr: [
            'Pas de connexion — Sytue One',
            'Pas de connexion',
            'Sytue One est injoignable. Vérifiez votre réseau et réessayez.',
            'Réessayer',
          ],
          de: [
            'Keine Verbindung — Sytue One',
            'Keine Verbindung',
            'Sytue One ist nicht erreichbar. Prüfen Sie Ihr Netz und versuchen Sie es erneut.',
            'Erneut versuchen',
          ],
          it: [
            'Nessuna connessione — Sytue One',
            'Nessuna connessione',
            'Sytue One non è raggiungibile. Controlla la rete e riprova.',
            'Riprova',
          ],
        };
        var cookie = /(?:^|;)\s*sytue_locale=([a-z]{2})/.exec(document.cookie);
        var idioma = cookie ? cookie[1] : (navigator.language || 'en').slice(0, 2).toLowerCase();
        var m = textos[idioma];
        if (!m) return;
        document.documentElement.lang = idioma;
        document.title = m[0];
        document.querySelector('h1').textContent = m[1];
        document.querySelector('p').textContent = m[2];
        document.querySelector('button').textContent = m[3];
      })();
    </script>
