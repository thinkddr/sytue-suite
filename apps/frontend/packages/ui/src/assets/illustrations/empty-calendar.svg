<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="0 0 200 160" fill="none" role="img" aria-label="Sin eventos">
  <title>Calendario sin eventos</title>
  <line x1="46" y1="122" x2="154" y2="122" stroke="var(--sytue-border)" stroke-width="2" stroke-linecap="round"/>
  <!-- Cuerpo del calendario -->
  <rect x="56" y="48" width="88" height="66" rx="8" stroke="var(--sytue-neutral-400)" stroke-width="2.4"/>
  <line x1="56" y1="66" x2="144" y2="66" stroke="var(--sytue-neutral-400)" stroke-width="2.4"/>
  <line x1="76" y1="40" x2="76" y2="52" stroke="var(--sytue-neutral-400)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="124" y1="40" x2="124" y2="52" stroke="var(--sytue-neutral-400)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Casillas de días, apenas insinuadas -->
  <g stroke="var(--sytue-border-strong)" stroke-width="2" stroke-linecap="round">
    <line x1="72" y1="80" x2="86" y2="80"/><line x1="96" y1="80" x2="110" y2="80"/>
    <line x1="72" y1="94" x2="86" y2="94"/>
  </g>
  <!-- Único día marcado: acento violeta (color de dato/Calendar) -->
  <rect x="110" y="86" width="18" height="16" rx="4" stroke="var(--sytue-violet-500)" stroke-width="2.4"/>
</svg>
