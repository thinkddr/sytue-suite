#
# SYTUE CALCUS de Sytue Office, la edición local: sin cuenta, sin cifrado y sin
# servidor. Identificador y esquema propios: convive con la edición conectada.
Website = "https://sytue.eu"

[Details]
  Name = "Sytue Calcus Office"
  ID = "eu.sytue.office.calcus"
  Icon = "Icon.png"
  Version = "0.1.0"
  Build = 1

[Development]
  esquema = "sytueoffice-sheets"
  bundle = "office"
  extensiones = "xlsx,xltx,ods,ots,numbers,csv,tsv,calcus"
  ficheros = "si"
