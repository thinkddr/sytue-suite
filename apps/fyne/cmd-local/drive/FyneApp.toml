# SYTUE DRIVE de Sytue Office, la edición local (apps/fyne/PLAN-EDICION-LOCAL.md §6.4): un
# gestor de ficheros sobre `~/Sytue Office/Drive`, sin cuenta, sin cifrado y sin servidor.
# Identificador, esquema y carpeta de datos son distintos de los de la edición conectada,
# así que las dos conviven (R-CONVIVE).
Website = "https://sytue.eu"

[Details]
  Name = "Sytue Drive Office"
  ID = "eu.sytue.office.drive"
  Icon = "Icon.png"
  Version = "0.1.0"
  Build = 1

[Development]
  esquema = "sytueoffice-drive"
  bundle = "office"
  ficheros = "si"
