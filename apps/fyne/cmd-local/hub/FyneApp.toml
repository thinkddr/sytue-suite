#
# EL HUB DE SYTUE OFFICE, la edición local (apps/fyne/PLAN-EDICION-LOCAL.md §6.15): el
# lanzador de las demás apps de la edición, lo reciente de todas y la búsqueda entre
# ellas, sin cuenta, sin cifrado y sin servidor. Identificador, esquema y carpeta de
# datos son distintos de los del Hub conectado (`cmd/hub`), así que los dos conviven
# (R-CONVIVE). El icono es el del Hub conectado.
#
# Solo escritorio: en el móvil cada app va por separado y no hay Hub. `movil = "no"`
# lo dice para `empaquetar.sh apps_moviles`, que de momento solo deja fuera a `demo`.
Website = "https://sytue.eu"

[Details]
  Name = "Sytue Office"
  ID = "eu.sytue.office.hub"
  Icon = "Icon.png"
  Version = "0.1.0"
  Build = 1

[Development]
  esquema = "sytueoffice-one"
  bundle = "office"
  movil = "no"
