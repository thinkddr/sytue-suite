# SYTUE MAIL de Sytue Office, la edición local (apps/fyne/PLAN-EDICION-LOCAL.md §6.9):
# un cliente para las cuentas de correo de la persona, sin cuenta de Sytue, sin cifrado
# y sin servidor de Sytue. Identificador, esquema y carpeta de datos son distintos de
# los de la edición conectada, así que las dos conviven (R-CONVIVE).
Website = "https://sytue.eu"

[Details]
  Name = "Sytue Mail Office"
  ID = "eu.sytue.office.mail"
  Icon = "Icon.png"
  Version = "0.1.0"
  Build = 1

[Development]
  esquema = "sytueoffice-mail"
  bundle = "office"
  extensiones = "eml"
  # Se ofrece como programa de correo: `mailto:` abre el redactor (l.AlAbrirEnlace).
  esquemas_extra = "mailto"
  ficheros = "si"
