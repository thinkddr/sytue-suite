# SYTUE PHOTOS de Sytue Office, la edición local (apps/fyne/PLAN-EDICION-LOCAL.md §6.8):
# una fototeca en este equipo, sin cuenta, sin cifrado y sin servidor. Identificador,
# esquema y carpeta de datos son distintos de los de la edición conectada, así que las
# dos conviven (R-CONVIVE).
Website = "https://sytue.eu"

[Details]
  Name = "Sytue Photos Office"
  ID = "eu.sytue.office.photos"
  Icon = "Icon.png"
  Version = "0.1.0"
  Build = 1

[Development]
  esquema = "sytueoffice-photos"
  bundle = "office"
  extensiones = "jpg,jpeg,png,gif"
  ficheros = "si"
  # Guarda en la galería del sistema lo que se exporta (apps/nucleo/carrete).
  fototeca = "si"
