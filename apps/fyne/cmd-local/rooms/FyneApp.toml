# SYTUE ROOMS de Sytue Office, la edición local (apps/fyne/PLAN-EDICION-LOCAL.md §6.14):
# sin cuenta de Sytue, sin cifrado propio y sin servidor. Es un cliente de los servicios
# de mensajería que la persona configura; sin ninguno, canales de notas en este equipo.
# Identificador, esquema y carpeta de datos son distintos de los de la edición conectada,
# así que las dos conviven (R-CONVIVE).
#
# Se compila con `-tags goolm`, como toda la suite: la pantalla enlaza el paquete Matrix
# de la suite (sin libolm). Ver main.go por la llamada nativa.
Website = "https://sytue.eu"

[Details]
  Name = "Sytue Rooms Office"
  ID = "eu.sytue.office.rooms"
  Icon = "Icon.png"
  Version = "0.1.0"
  Build = 1

[Development]
  esquema = "sytueoffice-rooms"
  bundle = "office"
