#
# METADATOS DE SYTUE BASES, en el formato propio de Fyne. Lo lee `fyne package`
# él solo, así que `apps/fyne/scripts/empaquetar.sh` no tiene una segunda tabla de
# productos que se desincronice: que este fichero exista es lo que hace que la
# cadena empaquete este directorio.
#
# CADA PRODUCTO ES SU PROPIA APLICACIÓN también en nativo, igual que en la web es
# su propio subdominio. Por eso esto es un `cmd/` aparte con su identificador
# aparte, y no una pantalla más dentro de un binario de la suite.
#
# EL ICONO es `Icon.png`, al lado: la marca a sangre de `branding/marks`,
# con el contorno del selector de apps; lo genera `scripts/gen-iconos-fyne.sh` y
# `sesion/esquemas_test.go` comprueba el color y el contorno.
Website = "https://sytue.eu"

[Details]
  Name = "Sytue Bases"
  ID = "eu.sytue.bases"
  Icon = "Icon.png"
  Version = "0.1.0"
  Build = 1

# CÓMO LA LLAMAN LAS DEMÁS. `empaquetar.sh` lo lee de aquí y lo escribe donde
# cada sistema lo busca: el intent-filter del AndroidManifest, `CFBundleURLTypes`
# en macOS y iOS, `MimeType=x-scheme-handler/…` en el .desktop de Linux y la
# clave de registro del instalador de Windows.
#
# Y el programa lo lee además en tiempo de ejecución
# (`fyne.CurrentApp().Metadata().Custom["esquema"]`): es el redirect_uri del login
# en el móvil (RFC 8252 §7.1) y tiene que coincidir con lo registrado en Sytue ID
# (migración 0109).
[Development]
  esquema = "sytue-bases"
  widget_acciones = "open,search"
  # El instalador de escritorio que la lleva (empaquetar.sh): «Sytue One» o «Sytue Drive».
  bundle = "one"
