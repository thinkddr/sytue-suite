#
# METADATOS DE SYTUE CALCUS, en el formato propio de Fyne: los lee `fyne package`
# él solo, así que `apps/fyne/scripts/empaquetar.sh` no tiene una segunda tabla de
# productos que se desincronice. Que este fichero exista es lo que hace que la
# cadena empaquete este directorio.
#
# EL ICONO es `Icon.png`, al lado: la marca a sangre de `branding/marks`,
# con el contorno del selector de apps; lo genera `scripts/gen-iconos-fyne.sh` y
# `sesion/esquemas_test.go` comprueba el color y el contorno.
Website = "https://sytue.eu"

[Details]
  Name = "Sytue Calcus"
  ID = "eu.sytue.calcus"
  Icon = "Icon.png"
  Version = "0.1.0"
  Build = 1

# CÓMO LA LLAMAN LAS DEMÁS. Las apps son INDEPENDIENTES —una instalación por
# producto, igual que en la web un subdominio por producto— y se invocan entre sí
# por su esquema de URL: abrir una hoja desde Drive o desde el Hub es
# `sytue-sheets://…`, no una pantalla más de otro binario.
#
# `empaquetar.sh` lo lee de aquí y lo escribe donde cada sistema lo busca: el
# intent-filter del AndroidManifest, `CFBundleURLTypes` en macOS y iOS,
# `MimeType=x-scheme-handler/…` en el .desktop de Linux y la clave de registro del
# instalador de Windows. Una sola declaración, cinco destinos.
#
# Va en `[Development]`, que es la tabla de metadatos propios de Fyne, así que el
# programa lo lee además en tiempo de ejecución
# (`fyne.CurrentApp().Metadata().Custom["esquema"]`) — que es donde hace falta: es
# el redirect_uri del login (RFC 8252 §7.1) y tiene que coincidir con lo
# registrado en Sytue ID.
[Development]
  esquema = "sytue-sheets"
  widget_acciones = "open,search"
  # El instalador de escritorio que la lleva (empaquetar.sh): «Sytue One» o «Sytue Drive».
  bundle = "one"

# Lo que el sistema le ofrece a esta app en «Abrir con»: son las extensiones que la web
# abre en este producto (`api.Extensiones`, espejo de `abrir-con.ts`), y
# `TestCadaAppDeclaraLasExtensionesDeSuProducto` las compara. `empaquetar.sh` las
# escribe como tipos MIME en Linux y Android y como `OpenWithProgids` en Windows.
  extensiones = "numbers,ods,ots,xlsx,xltx"
  # Abre ficheros del equipo que la persona elige (subir, adjuntar, importar, insertar): en
  # la Mac App Store, `empaquetar.sh macappstore` le da el derecho de sandbox
  # `files.user-selected.read-write`. Las que no lo declaran no lo llevan.
  ficheros = "si"
