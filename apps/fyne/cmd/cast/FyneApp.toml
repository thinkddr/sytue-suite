#
# METADATOS DE SYTUE CAST, en el formato propio de Fyne. Lo lee `fyne package`
# él solo, así que `apps/fyne/scripts/empaquetar.sh` no tiene una segunda tabla de
# productos que se desincronice: que este fichero exista es lo que hace que la
# cadena empaquete este directorio.
#
# CADA PRODUCTO ES SU PROPIA APLICACIÓN también en nativo, igual que en la web es
# su propio subdominio. Por eso esto es un `cmd/` aparte con su identificador
# aparte, y no una pantalla más dentro de un binario de la suite.
#
# EL ICONO es `Icon.png`, al lado: la marca a sangre de `branding/marks`,
# con el contorno del selector de apps; lo genera `scripts/gen-iconos-fyne.sh` y
# `sesion/esquemas_test.go` comprueba el color y el contorno.
Website = "https://sytue.eu"

[Details]
  Name = "Sytue Cast"
  ID = "eu.sytue.cast"
  Icon = "Icon.png"
  Version = "0.1.0"
  Build = 1

# CÓMO LA LLAMAN LAS DEMÁS. `empaquetar.sh` lo lee de aquí y lo escribe donde
# cada sistema lo busca: el intent-filter del AndroidManifest, `CFBundleURLTypes`
# en macOS y iOS, `MimeType=x-scheme-handler/…` en el .desktop de Linux y la
# clave de registro del instalador de Windows. Una sola declaración, cinco
# destinos.
#
# Y el programa lo lee además en tiempo de ejecución
# (`fyne.CurrentApp().Metadata().Custom["esquema"]`), que es donde hace falta: es
# el redirect_uri del login (RFC 8252 §7.1) y tiene que coincidir con lo
# registrado en Sytue ID.
[Development]
  esquema = "sytue-cast"
  widget_acciones = "open,search"
  # El instalador de escritorio que la lleva (empaquetar.sh): «Sytue One» o «Sytue Drive».
  bundle = "one"
  # Emitir desde la app abre la cámara, el micrófono y la pantalla con la misma llamada
  # nativa de Rooms (`llamada`, ver main.go): `empaquetar.sh` pide CAMERA, RECORD_AUDIO y
  # la proyección de pantalla en Android y pone NSMicrophoneUsageDescription y
  # NSCameraUsageDescription en macOS e iOS. Sin esto Android deniega el permiso sin
  # preguntar y macOS e iOS matan la app al abrir el micrófono.
  llamadas = "si"
  # El vídeo en la imagen dentro de imagen del sistema en Android (la app encogida en una
  # esquina, sesion.ImagenEnImagen): `empaquetar.sh` pone `supportsPictureInPicture` en la
  # actividad —en el binario, que la CLI de Fyne no conoce el atributo— y los cambios de
  # tamaño en `configChanges`, para que encoger la app no la vuelva a crear.
  imagenEnImagen = "si"
  # Abre ficheros del equipo que la persona elige (subir, adjuntar, importar, insertar): en
  # la Mac App Store, `empaquetar.sh macappstore` le da el derecho de sandbox
  # `files.user-selected.read-write`. Las que no lo declaran no lo llevan.
  ficheros = "si"
