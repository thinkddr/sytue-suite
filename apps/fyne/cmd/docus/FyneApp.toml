#
# METADATOS DE SYTUE DOCUS, en el formato propio de Fyne: los lee `fyne package` él
# solo, así que `apps/fyne/scripts/empaquetar.sh` no tiene una segunda tabla de
# productos que se desincronice. Que este fichero exista es lo que hace que la cadena
# empaquete este directorio.
#
# EL ICONO es `Icon.png`, al lado: la marca a sangre de `branding/marks`,
# con el contorno del selector de apps; lo genera `scripts/gen-iconos-fyne.sh` y
# `sesion/esquemas_test.go` comprueba el color y el contorno.
#
# Docus, Calcus y Diapos son TRES aplicaciones y no una con tres modos
# (docs/CONVENTIONS.md §13.6). El cromo lo comparten por paquete, no por binario, así
# que cada una tiene su identificador y su esquema — y un identificador de paquete no
# se puede cambiar una vez subido a una tienda.
Website = "https://sytue.eu"

[Details]
  Name = "Sytue Docus"
  ID = "eu.sytue.docus"
  Icon = "Icon.png"
  Version = "0.1.0"
  Build = 1

# Cómo la llaman las demás: es el redirect_uri del login (RFC 8252 §7.1) y tiene que
# coincidir con lo registrado en Sytue ID.
[Development]
  esquema = "sytue-docs"
  widget_acciones = "open,search"
  # El instalador de escritorio que la lleva (empaquetar.sh): «Sytue One» o «Sytue Drive».
  bundle = "one"

# Lo que el sistema le ofrece a esta app en «Abrir con»: son las extensiones que la web
# abre en este producto (`api.Extensiones`, espejo de `abrir-con.ts`), y
# `TestCadaAppDeclaraLasExtensionesDeSuProducto` las compara. `empaquetar.sh` las
# escribe como tipos MIME en Linux y Android y como `OpenWithProgids` en Windows.
  extensiones = "docx,dotx,odt,ott,pages"
  # Abre ficheros del equipo que la persona elige (subir, adjuntar, importar, insertar): en
  # la Mac App Store, `empaquetar.sh macappstore` le da el derecho de sandbox
  # `files.user-selected.read-write`. Las que no lo declaran no lo llevan.
  ficheros = "si"
