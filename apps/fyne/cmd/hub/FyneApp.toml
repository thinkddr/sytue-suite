#
# METADATOS DE SYTUE HUB, en el formato propio de Fyne: los lee `fyne package` él
# solo, así que `apps/fyne/scripts/empaquetar.sh` no tiene una segunda tabla de
# productos que se desincronice. Que este fichero exista es lo que hace que la cadena
# empaquete este directorio.
#
# EL ICONO es `Icon.png`, al lado: la marca a sangre de `branding/marks`,
# con el contorno del selector de apps; lo genera `scripts/gen-iconos-fyne.sh` y
# `sesion/esquemas_test.go` comprueba el color y el contorno.
#
# `ID` es el del producto y no lleva `.fyne.`: esto SÍ es un producto de la suite, a
# diferencia de `cmd/demo`. La clave técnica del Hub sigue siendo `one` —cambiarla
# arrastraría client_id de OIDC, ingress y enlaces guardados—, y por eso el
# identificador de paquete es `eu.sytue.one` y no `eu.sytue.hub`.
Website = "https://sytue.eu"

[Details]
  Name = "Sytue Hub"
  ID = "eu.sytue.one"
  Icon = "Icon.png"
  Version = "0.1.0"
  Build = 1

# CÓMO LA LLAMAN LAS DEMÁS. Cada producto es su propia aplicación también en
# escritorio y en móvil (`docs/CONVENTIONS.md` §13.6) y se invocan entre sí por su
# esquema de URL: `empaquetar.sh` lo lee de aquí y lo escribe en el intent-filter del
# AndroidManifest, en `CFBundleURLTypes` de macOS y iOS, en el
# `MimeType=x-scheme-handler/…` del .desktop de Linux y en la clave de registro del
# instalador de Windows.
#
# El esquema es `sytue-<clave de producto>`, la misma clave del catálogo y del token de
# color. Lo declara `hub.EsquemaDe`, y el Hub —que es quien lanza a todos los demás—
# es la app que fija la convención para las dieciséis restantes.
#
# El programa lo lee además en tiempo de ejecución
# (`fyne.CurrentApp().Metadata().Custom["esquema"]`), que es donde hace falta: es el
# redirect_uri del login (RFC 8252 §7.1) y tiene que coincidir con lo registrado en
# Sytue ID.
[Development]
  esquema = "sytue-one"
  widget_acciones = "open,search"
  # El instalador de escritorio que la lleva (empaquetar.sh): «Sytue One» o «Sytue Drive».
  bundle = "one"
