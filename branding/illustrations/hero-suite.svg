<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" fill="none" role="img" aria-label="Sytue One: la suite europea, soberana y libre">
  <title>Sytue One — suite integrada</title>
  <desc>Constelación de tiles de producto en torno al símbolo de marca, sobre el campo grafito de la marca. Line-art sobrio.</desc>
  <!--
    Superficie de marca fija, como og/og-image.svg: campo grafito (#1a1d21) y el
    latón (#b98f4f) como ÚNICO acento, en el símbolo y en las estrellas. Todo lo
    demás es blanco con opacidad, así que no hay un tercer color que mantener.
  -->
  <rect width="640" height="480" rx="20" fill="#1a1d21"/>
  <!-- Rejilla técnica muy sutil -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="120" x2="640" y2="120"/><line x1="0" y1="240" x2="640" y2="240"/><line x1="0" y1="360" x2="640" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/><line x1="480" y1="0" x2="480" y2="480"/>
  </g>
  <!-- Órbitas de conexión (una sola app integrada) -->
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round">
    <path d="M320 240 L188 152"/><path d="M320 240 L452 152"/><path d="M320 240 L188 328"/>
    <path d="M320 240 L452 328"/><path d="M320 240 L320 116"/><path d="M320 240 L320 364"/>
  </g>
  <!-- Tiles de producto satélite: line-art blanco con el molde del badge (rx 9/40). -->
  <g stroke="#ffffff" stroke-opacity="0.88" stroke-width="2.4" fill="#1a1d21" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mail -->
    <g transform="translate(164 128)"><rect width="48" height="48" rx="10.8"/><rect x="11" y="16" width="26" height="18" rx="3"/><path d="M12 18l12 8 12-8" fill="none"/></g>
    <!-- Drive -->
    <g transform="translate(428 128)"><rect width="48" height="48" rx="10.8"/><path d="M11 18h10l3 3h13v14a2 2 0 0 1-2 2H13a2 2 0 0 1-2-2V18z"/></g>
    <!-- Calendar -->
    <g transform="translate(164 304)"><rect width="48" height="48" rx="10.8"/><rect x="12" y="15" width="24" height="21" rx="3"/><path d="M12 22h24"/><path d="M18 12v6M30 12v6"/></g>
    <!-- Chat -->
    <g transform="translate(428 304)"><rect width="48" height="48" rx="10.8"/><path d="M12 18a3 3 0 0 1 3-3h18a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H22l-7 6v-6h0a3 3 0 0 1-3-3V18z"/></g>
    <!-- Cloud (arriba) -->
    <g transform="translate(296 92)"><rect width="48" height="48" rx="10.8"/><path d="M15 33h13a6 6 0 0 0 .6-11.9A8 8 0 0 0 14 19.2 5.8 5.8 0 0 0 15 33z"/></g>
  </g>
  <!-- Núcleo: el símbolo de branding/logo/sytue-mark.svg a 88 px (×2,2), con el badge
       del og-image, un punto más oscuro que el campo para que se despegue de él. -->
  <g transform="translate(276 196) scale(2.2)">
    <defs><clipPath id="hero-badge"><rect width="40" height="40" rx="9"/></clipPath></defs>
    <g clip-path="url(#hero-badge)">
      <rect width="40" height="40" fill="#0c0e10"/>
      <polygon points="40,14 40,40 14,40" fill="#b98f4f"/>
    </g>
    <g transform="translate(3.98 26)"><path fill="#ffffff" d="M6.145 0.236Q4.694 0.236 3.577-0.177Q2.460-0.591 1.751-1.380Q1.042-2.170 0.838-3.287L3.835-3.803Q4.071-2.965 4.662-2.546Q5.253-2.127 6.241-2.127Q7.165-2.127 7.697-2.476Q8.229-2.825 8.229-3.362Q8.229-3.835 7.847-4.136Q7.466-4.437 6.682-4.598L4.608-5.027Q2.868-5.382 2.009-6.236Q1.149-7.090 1.149-8.433Q1.149-9.593 1.783-10.425Q2.417-11.258 3.545-11.709Q4.673-12.160 6.198-12.160Q7.616-12.160 8.658-11.768Q9.700-11.376 10.345-10.656Q10.989-9.937 11.204-8.959L8.347-8.454Q8.164-9.066 7.643-9.458Q7.122-9.851 6.241-9.851Q5.446-9.851 4.909-9.518Q4.372-9.185 4.372-8.626Q4.372-8.175 4.721-7.863Q5.070-7.552 5.919-7.380L8.078-6.950Q9.818-6.596 10.667-5.795Q11.516-4.995 11.516-3.706Q11.516-2.524 10.828-1.638Q10.141-0.752 8.932-0.258Q7.724 0.236 6.145 0.236M13.170 4.254L13.912 1.826L14.309 1.923Q14.954 2.095 15.458 2.020Q15.963 1.944 16.269 1.611Q16.576 1.278 16.640 0.677L16.726 0.032L12.214-12.010L15.641-12.010L17.661-5.779Q18.026-4.598 18.262-3.416Q18.337-3.019 18.423-2.610Q18.520-3.019 18.617-3.427Q18.907-4.608 19.293-5.779L21.399-12.010L24.783-12.010L19.680 1.418Q19.315 2.385 18.746 3.094Q18.176 3.803 17.328 4.189Q16.479 4.576 15.276 4.576Q14.631 4.576 14.073 4.485Q13.514 4.394 13.170 4.254M28.360 0.204Q27.576 0.204 27.039-0.328Q26.502-0.859 26.502-1.644Q26.502-2.428 27.039-2.959Q27.576-3.491 28.360-3.491Q29.144-3.491 29.682-2.959Q30.219-2.428 30.219-1.644Q30.219-0.859 29.682-0.328Q29.144 0.204 28.360 0.204M28.360-7.767Q27.576-7.767 27.039-8.298Q26.502-8.830 26.502-9.614Q26.502-10.398 27.039-10.930Q27.576-11.462 28.360-11.462Q29.144-11.462 29.682-10.930Q30.219-10.398 30.219-9.614Q30.219-8.830 29.682-8.298Q29.144-7.767 28.360-7.767"/></g>
  </g>
  <!-- Soberanía europea: círculo de estrellas UE, sobrio, esquina inferior -->
  <g transform="translate(548 400)" fill="#b98f4f">
    <circle cx="0" cy="-26" r="2.2"/><circle cx="13" cy="-22.5" r="2.2"/><circle cx="22.5" cy="-13" r="2.2"/>
    <circle cx="26" cy="0" r="2.2"/><circle cx="22.5" cy="13" r="2.2"/><circle cx="13" cy="22.5" r="2.2"/>
    <circle cx="0" cy="26" r="2.2"/><circle cx="-13" cy="22.5" r="2.2"/><circle cx="-22.5" cy="13" r="2.2"/>
    <circle cx="-26" cy="0" r="2.2"/><circle cx="-22.5" cy="-13" r="2.2"/><circle cx="-13" cy="-22.5" r="2.2"/>
  </g>
</svg>
