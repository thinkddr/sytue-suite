  rooms-web:
    build: *frontend-build
    <<: [*restart, *logging]
    profiles: ["full", "rooms"]
    networks: [edge, backend]
    command: ["bun", "run", "--filter", "@sytue/rooms", "dev", "--host", "0.0.0.0", "--port", "4330"]
    ports: ["4330:4330"]
    environment:
      <<: *frontend-env
      # `sytue-chat`, no `sytue-rooms`: la migración 0023 renombró el client a
      # «Sytue Rooms» pero CONSERVÓ el id (es clave ajena de sesiones, tokens y
      # consentimientos). Con `sytue-rooms` el IdP responde «client_id
      # desconocido» y Rooms no deja entrar en local. Igual que el chart de Helm.
      SYTUE_OIDC_CLIENT_ID: sytue-chat
      SYTUE_OIDC_REDIRECT_URI: https://rooms.sytue.localhost/auth/callback
      SYTUE_OIDC_POST_LOGOUT_URI: https://rooms.sytue.localhost/
    volumes: *frontend-volumes
    depends_on:
      id:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Sytue Rooms (Chat+Meet unificados) se sirve en su HOST CANÓNICO PROPIO.
      - "traefik.http.routers.rooms-web.rule=Host(`rooms.sytue.localhost`)"
      - "traefik.http.routers.rooms-web.entrypoints=websecure"
      - "traefik.http.routers.rooms-web.tls=true"
      - "traefik.http.services.rooms-web.loadbalancer.server.port=4330"
      # Hosts LEGADOS: meet.* (su app Astro ya se retiró) y chat.* (Rooms vivía ahí)
      # responden 301 permanente a rooms.*, preservando el path. El middleware
      # redirige ANTES de tocar el backend, así que ambos routers pueden colgar del
      # servicio rooms-web (nunca proxyan a él). `$${1}` escapa la interpolación de
      # Compose para que Traefik reciba el literal `${1}`.
      - "traefik.http.routers.meet-redirect.rule=Host(`meet.sytue.localhost`)"
      - "traefik.http.routers.meet-redirect.entrypoints=websecure"
      - "traefik.http.routers.meet-redirect.tls=true"
      - "traefik.http.routers.meet-redirect.service=rooms-web"
      - "traefik.http.routers.meet-redirect.middlewares=meet-to-rooms"
      - "traefik.http.middlewares.meet-to-rooms.redirectregex.regex=^https?://meet.sytue.localhost/(.*)"
      - "traefik.http.middlewares.meet-to-rooms.redirectregex.replacement=https://rooms.sytue.localhost/$${1}"
      - "traefik.http.middlewares.meet-to-rooms.redirectregex.permanent=true"
      - "traefik.http.routers.chat-redirect.rule=Host(`chat.sytue.localhost`)"
      - "traefik.http.routers.chat-redirect.entrypoints=websecure"
      - "traefik.http.routers.chat-redirect.tls=true"
      - "traefik.http.routers.chat-redirect.service=rooms-web"
      - "traefik.http.routers.chat-redirect.middlewares=chat-to-rooms"
      - "traefik.http.middlewares.chat-to-rooms.redirectregex.regex=^https?://chat.sytue.localhost/(.*)"
      - "traefik.http.middlewares.chat-to-rooms.redirectregex.replacement=https://rooms.sytue.localhost/$${1}"
      - "traefik.http.middlewares.chat-to-rooms.redirectregex.permanent=true"
