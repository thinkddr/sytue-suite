# Sytue One — apps web COMPILADAS (overlay de docker-compose.yml) ===============
# ---------------------------------------------------------------------------
# Es el modo por defecto de ./sytue-deploy y de `make dev-up`. Cada app web se sirve
# con su servidor SSR compilado (target `runtime` del Dockerfile) en vez de con
# `astro dev`: medido con la suite completa arrancada, las 18 apps en modo
# desarrollo ocupaban 11,4 GiB (0,6-0,9 GiB cada una); compiladas, unos 80 MiB.
# Para trabajar en caliente en UNA app: `make dev-app P=<perfil>` sin este overlay.
#
#   docker compose -f docker-compose.yml -f frontlite.yml up -d --build
#
# GENERADO a partir de los frontends del compose base: si se añade una app allí,
# hay que añadirla aquí (una entrada por app, todas iguales salvo APP y PORT).
#
# Lo que cambia respecto al modo desarrollo, y por qué:
#   - build.target runtime + APP: una imagen por app, con `dist/` y las
#     dependencias de producción. Las PUBLIC_* se hornean al compilar (build.args).
#   - command: el CMD de la imagen (SSR, o el servidor estático de `www`, que es
#     `output: 'static'`), escrito aquí porque el entrypoint propio lo anula.
#   - PORT: el servidor compilado escucha en `PORT`, no en el de astro.config; se
#     fija al mismo puerto que publica y enruta Traefik.
#   - NODE_ENV=production: el base pone development (lo necesita `astro dev`).
#   - entrypoint + volumen + sysctl: el relé de loopback (dev-loopback-relay.mjs),
#     porque Bun resuelve *.localhost a 127.0.0.1 también en producción; la imagen
#     corre como `bun` y la sysctl le deja escuchar en el 443 de su propio
#     contenedor sin ser root.
# ---------------------------------------------------------------------------
name: sytue-one-dev

x-runtime-build: &runtime-build
  context: ../../apps/frontend
  dockerfile: Dockerfile
  target: runtime
  args: &runtime-args
    PUBLIC_OIDC_ISSUER: https://id.sytue.localhost
    PUBLIC_HUB_URL: https://hub.sytue.localhost
    PUBLIC_SYTUE_HUB_BASE_URL: https://hub.sytue.localhost
    PUBLIC_SYTUE_DRIVE_BASE_URL: https://drive-dav.sytue.localhost
    PUBLIC_SYTUE_DOCS_BASE_URL: https://docs-api.sytue.localhost
    PUBLIC_SYTUE_CLOUD_API_URL: https://cloud.sytue.localhost

x-runtime-svc: &runtime-svc
  # El mismo CMD que la imagen: al fijar un entrypoint propio, Docker descarta el
  # CMD de la imagen y el contenedor terminaría sin hacer nada.
  command:
    - /bin/sh
    - -c
    - 'if [ "$$SYTUE_FRONTEND_APP" = www ]; then exec bun ./static-serve.mjs; else exec bun ./dist/server/entry.mjs; fi'
  entrypoint:
    - /bin/sh
    - -c
    - 'bun /opt/sytue/relay.mjs & exec "$$@"'
    - sytue
  volumes: !override
    - ../../apps/frontend/dev-loopback-relay.mjs:/opt/sytue/relay.mjs:ro
  sysctls:
    net.ipv4.ip_unprivileged_port_start: 0
  mem_limit: 256m

services:
  portal:
    <<: *runtime-svc
    build:
      <<: *runtime-build
      args:
        <<: *runtime-args
        APP: portal
    environment:
      NODE_ENV: production
      PORT: "4321"

  console:
    <<: *runtime-svc
