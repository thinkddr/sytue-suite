apiVersion: v2
name: sytue-analytics-api
description: >-
  Sytue Analytics — API DE LECTURA y hogar de los crons (ADR 0026). Servicio Go propio,
  INTERNO y autenticado con los JWT de Sytue ID (JWKS): lo consume el BFF del panel
  (seccion /projects/[slug]/analytics de cloud-dashboard). Aplica las migraciones del
  esquema sytue_analytics y corre EN PROCESO la rotacion de la sal diaria, las
  particiones y el rollup — no hace falta CronJob. Comparte imagen con el colector y
  cambia el ENTRYPOINT a /app/analytics-api. Código Apache-2.0, (c) 2026 Daniel Delgado Ramos.
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.31.0-0"
home: https://sytue.eu
keywords: [sytue, analytics, privacy, api, rollup, go]
maintainers:
  - name: Sytue Platform
    email: platform@sytue.eu
annotations:
  licenses: MIT
  sytue.eu/stack: go
