apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sytue-analytics-api.fullname" . }}
  labels:
    {{- include "sytue-analytics-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # El cron vive en este proceso y aplica migraciones al arrancar: Recreate evita
  # que la replica nueva y la vieja se solapen rotando la sal o tocando particiones.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sytue-analytics-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sytue-analytics-api.labels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: analytics-api
    spec:
      automountServiceAccountToken: false
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: analytics-api
          image: "{{ include "sytue-analytics-api.imageRegistry" . }}/{{ .Values.image.repository }}:{{ ((.Values.global).image | default dict).tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # UNA imagen, DOS procesos: el ENTRYPOINT por defecto es el colector, asi
          # que la API se arranca cambiandolo. No existe build-arg BINARY.
          command: ["/app/analytics-api"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if (.Values.global).otlp }}
            {{- if (.Values.global).otlp.endpoint }}
            # Telemetria: metricas OTLP directas a Cockpit, sin agente intermedio.
            # Sale del umbrella y no de este chart para que los catorce escriban al
            # MISMO sitio; si cada uno apuntara al suyo, no habria con que comparar.
            # Vacio => no se exporta y el servicio sigue sirviendo igual.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ (.Values.global).otlp.endpoint | quote }}
            {{- end }}
            {{- if (.Values.global).otlp.tokenSecret }}
            # Por Secret y nunca por values: aunque el token solo permita escribir,
            # con el se puede envenenar la serie que decide un escalado.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ (.Values.global).otlp.tokenSecret }}
                  key: {{ (.Values.global).otlp.tokenKey | default "otlp-headers" }}
                  optional: true
            {{- end }}
            {{- end }}
            # Runtime Go atado a los limites del pod (helper sytue.goRuntimeEnv del umbrella):
            # GOMAXPROCS=techo(limits.cpu) via downward API; GOMEMLIMIT=~85% de limits.memory.
            {{- include "sytue.goRuntimeEnv" (dict "container" "analytics-api" "memLimit" .Values.resources.limits.memory) | nindent 12 }}
            {{- include "sytue.logCollectorEnv" . | nindent 12 }}
            {{- if ne (include "sytue-analytics-api.env" .) "base" }}
            # config.Load valida ENV ∈ {dev,staging,prod}; "base" (default del helper
            # para labels) haria ABORTAR el binario -> solo se inyecta si es real.
            - name: ENV
              value: {{ include "sytue-analytics-api.env" . | quote }}
            {{- end }}
            # config.Load da prioridad a PORT sobre HTTP_ADDR (paridad con compose).
            - name: PORT
              value: "{{ .Values.service.targetPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            # ----- Sytue ID (OIDC; validacion JWT via JWKS) -----
            # La API es interna pero NO abierta: cada peticion trae el JWT del humano
            # que reenvia el BFF del panel, y el tenant sale del token (RLS).
            - name: OIDC_ISSUER
              value: {{ include "sytue-analytics-api.oidcIssuer" . | quote }}
            - name: OIDC_JWKS_URL
              value: {{ include "sytue.oidcJwksUrl" . | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ include "sytue-analytics-api.corsAllowedOrigins" . | quote }}
            - name: RESERVED_HOST_SUFFIXES
              value: {{ .Values.config.reservedHostSuffixes | quote }}
            - name: ANALYTICS_PAGES_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.analyticsPagesSecret }}
                  key: secret
            # ----- Postgres EXTERNO (RDB; agregados, particiones y sal) -----
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.dsnKey }}
            # Pool pgx POR replica (bajo en prod: PgBouncer multiplexa hacia la RDB).
            - name: DB_MAX_CONNS
              value: {{ .Values.config.dbMaxConns | quote }}
            # DSN DIRECTO a la RDB (bypass del pooler). platform/pkg/pg lo lee del
            # entorno para las MIGRACIONES: sus advisory locks son de SESION y a
            # traves de PgBouncer en transaction pooling se rompen. Opcional: sin
            # PgBouncer no existe y se usa DATABASE_URL.
            - name: DATABASE_DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.dsnDirectKey }}
                  optional: true
            # KEK AES-256 de la SAL DIARIA (la misma que el colector): sin ella no se
            # puede descifrar la sal del dia ni rotarla. Por eso NO es opcional.
            - name: SYTUE_ANALYTICS_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: key-encryption-key
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "sytue-analytics-api.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
