{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sytue-analytics-api.fullname" . }}
  labels:
    {{- include "sytue-analytics-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sytue-analytics-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Sin Ingress publico: solo la suite. En la practica, el BFF del panel
    # (cloud-dashboard) y el scrape de metricas/salud.
    - from:
        - namespaceSelector:
            matchLabels:
              sytue.eu/role: ingress
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sytue-one
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-suite: PgBouncer (6432) y Sytue ID (JWKS privado del release).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sytue-one
    # RDB directa (5432; migraciones y mantenimiento) y HTTPS (443) — solo UE.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
{{- end }}
