{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sytue-analytics-ingest.fullname" . }}
  labels:
    {{- include "sytue-analytics-ingest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sytue-analytics-ingest.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Desde el ingress controller. Es la UNICA via de entrada real: el beacon llega
    # al dominio del cliente, Traefik casa la ruta /_sytue de SU Ingress y, tras
    # resolver el Service ExternalName del namespace del tenant, marca este Service
    # en el puerto 8094. La conexion la abre el pod de Traefik, no el del tenant.
    - from:
        - namespaceSelector:
            matchLabels:
              sytue.eu/role: ingress
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    # Desde la propia suite: solo el scrape de metricas/salud. Ningun servicio de
    # Sytue One llama al colector (el panel lee de analytics-api, nunca de aqui).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sytue-one
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PgBouncer (pooler de la suite, 6432). Deliberadamente NO hay regla hacia otros
    # servicios: el colector es publico y sin autenticar, y su radio de explosion se
    # acota a lo unico que necesita — escribir eventos.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pgbouncer
    # El recolector de logs de Sytue ID (sytue.logCollectorEnv): los avisos y
    # errores de este servicio van a la pantalla «qué está fallando». Solo ese
    # destino y solo el puerto del POD del IdP.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sytue-id
      ports:
        - protocol: TCP
          port: {{ .Values.config.idApiPort }}
    # RDB directa (5432) y HTTPS (443) para telemetria/Secret Manager — solo UE.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
{{- end }}
