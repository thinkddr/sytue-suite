{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sytue-bases.fullname" . }}
  labels: {{- include "sytue-bases.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sytue-bases.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
