{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sytue-cast.fullname" . }}
  labels:
    {{- include "sytue-cast.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sytue-cast.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Desde el ingress canonico (Traefik) — trafico publico cast.sytue.eu: la API,
    # el WebSocket del chat, /media y los webhooks del SFU cuando vive fuera.
    - from:
        - namespaceSelector:
            matchLabels:
              sytue.eu/role: ingress
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    # Desde el resto de la suite (el BFF de la app Astro por /public, el Hub, intents).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sytue-one
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-suite: Sytue ID (JWKS y people:resolve), Drive (la cuota), el Hub (avisos)
    # y el SFU LiveKit cuando se despliega dentro del cluster (chart `livekit`).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sytue-one
    # Postgres EXTERNO (RDB), S3 (Object Storage UE) y HTTPS: la API del SFU de
    # LiveKit cuando vive fuera del cluster (443 al host rooms-sfu.<dominio>, como
    # en el piloto), Secret Manager.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
{{- if .Values.transcoder.enabled }}
---
# El transcodificador: SOLO salida. Nadie le habla (sin Service), y el habla con
# Postgres (la cola), S3 (original y derivadas), Drive (la cuota) y el Hub.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sytue-cast.transcoderFullname" . }}
  labels:
    {{- include "sytue-cast.transcoderLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sytue-cast.transcoderSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sytue-one
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}
