apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sytue-cloud-api.fullname" . }}
  labels:
    {{- include "sytue-cloud-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sytue-cloud-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sytue-cloud-api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "sytue-cloud-api.fullname" .) }}
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cloud-api
          image: "{{ include "sytue-cloud-api.imageRegistry" . }}/{{ .Values.image.repository }}:{{ ((.Values.global).image | default dict).tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          # Nombres de env = services/cloud/internal/config/config.go (una sola Config
          # para los tres binarios; cloud-api usa este subconjunto). Los secretos SOLO
          # por secretKeyRef del existingSecret; los no-secretos por value.
          env:
            {{- include "sytue.logCollectorEnv" . | nindent 12 }}
            {{- if (.Values.global).otlp }}
            {{- if (.Values.global).otlp.endpoint }}
            # Telemetria: metricas OTLP directas a Cockpit, sin agente intermedio.
            # Sale del umbrella y no de este chart para que los catorce escriban al
            # MISMO sitio; si cada uno apuntara al suyo, no habria con que comparar.
            # Vacio => no se exporta y el servicio sigue sirviendo igual.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ (.Values.global).otlp.endpoint | quote }}
            {{- end }}
            {{- if (.Values.global).otlp.tokenSecret }}
            # Por Secret y nunca por values: aunque el token solo permita escribir,
            # con el se puede envenenar la serie que decide un escalado.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ (.Values.global).otlp.tokenSecret }}
                  key: {{ (.Values.global).otlp.tokenKey | default "otlp-headers" }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- if ne (include "sytue-cloud-api.env" .) "base" }}
            # config.go valida ENV ∈ {dev,staging,prod}; "base" (default del helper para
            # labels) es inválido → solo lo inyectamos como env si es un valor real. Sin él,
            # config.go cae a "dev". go-live fija env=prod en values-go-live.yaml.
            {{- if (.Values.global).dragonflyUrl }}
            # Cache efimera compartida. Sytue Cloud la usa para resolver los TOKENS DE
            # API, que se validan en CADA peticion autenticada por token: hoy es un
            # viaje a PostgreSQL por peticion.
            #
            # Sale del umbrella para que apunte al MISMO sitio que id, hub, rooms y docs.
            # Ausente => se resuelve contra PostgreSQL, que es el comportamiento previo;
            # la degradacion es correcta con cualquier numero de replicas porque no se
            # guarda estado, solo se evita repetir una consulta.
            - name: DRAGONFLY_URL
              value: {{ (.Values.global).dragonflyUrl | quote }}
            {{- if ((.Values.global).cache).secretName }}
            # La contraseña va por Secret y APARTE de la URL. La URL no es un secreto
            # —es la misma en dev y en prod— y se deja como `value:` a la vista para
            # que se pueda comprobar que los siete servicios apuntan a la MISMA cache;
            # meterla dentro de la URL obligaría a mandar la URL entera por Secret y
            # ese gate se quedaría ciego.
            #
            # `optional: true` a propósito: sin la clave en el Secret, Dragonfly
            # tampoco la exige (misma referencia opcional en su chart) y el conjunto
            # sigue funcionando sin autenticación, que es el comportamiento previo.
            - name: DRAGONFLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ ((.Values.global).cache).secretName }}
                  key: {{ ((.Values.global).cache).passwordKey | default "dragonfly-password" }}
                  optional: true
            {{- end }}
            {{- if ((.Values.global).cache).secretName }}
            # Sella lo que se guarda en la cache. SIN ELLA NO SE CACHEA: el valor
            # cacheado decide autenticación, y aceptarlo sin sello es dejar que quien
            # escriba en Dragonfly emita credenciales. Ausente => todo se resuelve
            # contra PostgreSQL, más lento y correcto.
            - name: CACHE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ ((.Values.global).cache).secretName }}
                  key: {{ ((.Values.global).cache).signingKeyKey | default "cache-signing-key" }}
                  optional: true
            {{- end }}
            {{- end }}
            - name: ENV
              value: {{ include "sytue-cloud-api.env" . | quote }}
            {{- end }}
            - name: HTTP_ADDR
              value: ":{{ .Values.service.targetPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PUBLIC_URL
              value: "https://{{ include "sytue-cloud-api.host" . }}"
            - name: APPS_DOMAIN
              value: {{ .Values.config.appsDomain | quote }}
            - name: PREVIEW_DOMAIN
              value: {{ .Values.config.previewDomain | quote }}
            - name: INGRESS_TARGET
              value: {{ .Values.config.ingressTarget | quote }}
            - name: OIDC_ISSUER
              value: {{ include "sytue-cloud-api.oidcIssuer" . | quote }}
            - name: OIDC_JWKS_URL
              value: {{ include "sytue.oidcJwksUrl" . | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.config.oidcAudience | quote }}
            # API administrativa de identidad por red interna del namespace.
            # Reenvía el JWT del humano; Sytue ID revalida tenant+permisos.
            - name: IDENTITY_API_URL
              value: {{ .Values.config.identityApiUrl | default (printf "http://%s-id:80" .Release.Name) | quote }}
            # Avisos de despliegue al centro de notificaciones de la suite
            # (topBar y apps nativas): mismo patrón que syerp/calendar.
            - name: HUB_BASE_URL
              value: {{ .Values.config.hubUrl | default (printf "http://%s-hub" .Release.Name) | quote }}
            # El secreto de la puerta interna del Hub (/internal/notifications), el MISMO en
            # el Hub y en cada servicio que avisa. Lo genera el chart paraguas
            # (sytue-one/templates/secretos-internos.yaml); sin él, fuera de dev, el
            # servicio no arranca.
            - name: HUB_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: sytue-hub-internal
                  key: secret
            # Alertas por correo: un canal `mailto:` en una alert_policy se
            # entrega por SMTP en vez de por webhook. Vacío = sin correo, y las
            # alertas por webhook siguen igual (el binario lo dice una vez y
            # sigue, no falla).
            - name: SMTP_HOST
              value: {{ .Values.config.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.config.smtp.port | quote }}
            - name: SMTP_FROM
              value: {{ .Values.config.smtp.from | quote }}
            {{- if .Values.config.smtp.host }}
            # Credencial del BUZÓN, no de la sesión de nadie: el servidor de
            # correo rechaza un From que no sea suyo. `optional: true` como el
            # resto de secretos que puede no haber emitido nadie todavía.
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: smtp-user
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: smtp-password
                  optional: true
            {{- end }}
            - name: REGISTRY_URL
              value: {{ .Values.config.registry | quote }}
            - name: DB_MAX_CONNS
              value: {{ .Values.config.dbMaxConns | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.config.s3.endpoint | quote }}
            - name: S3_REGION
              value: {{ .Values.config.s3.region | quote }}
            - name: S3_BUCKET
              value: {{ .Values.config.s3.bucket | quote }}
            - name: S3_USE_SSL
              value: {{ .Values.config.s3.useSSL | quote }}
            # ── Obligatorias (config.Load l.Require): sin ellas el binario ABORTA ──
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: database-url
            - name: SECRET_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: secret-enc-key
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: s3-secret-key
            # ── Feature-env OPCIONAL (optional:true ⇒ clave ausente => feature gated-off) ──
            # GitHub App (repos privados + comentario de preview en PR). Ausentes ⇒ no-op.
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: github-app-id
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: github-app-private-key
                  optional: true
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: github-app-client-id
                  optional: true
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: github-app-client-secret
                  optional: true
            # Sytue Git como forja: la tercera vía del alta —«créame el
            # repositorio»— necesita las tres. Sin ellas, forge.New devuelve nil,
            # el arranque lo dice en el log y el panel ofrece solo las otras dos
            # vías en vez de enseñar un botón que falla.
            #
            # Son de una aplicación OAuth2 registrada EN la forja, no un token de
            # administrador: Cloud puede exactamente lo que cada usuario consiente
            # y él lo revoca desde su cuenta.
            - name: FORGE_URL
              value: {{ .Values.config.forgeUrl | quote }}
            - name: FORGE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: forge-client-id
                  optional: true
            - name: FORGE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: forge-client-secret
                  optional: true
            # HMAC de webhooks git entrantes. Ausente, el servicio NO ARRANCA en
            # producción (config.validate): el endpoint es público y sin firma
            # cualquiera dispara un build. `optional` sigue puesto para dev/staging.
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: webhook-secret
                  optional: true
            # Registry privado (pull de imágenes). Ausentes ⇒ registry sin auth.
            - name: REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: registry-username
                  optional: true
            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: registry-password
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "sytue-cloud-api.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
