apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sytue-cloud-builder.fullname" . }}
  labels:
    {{- include "sytue-cloud-builder.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sytue-cloud-builder.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sytue-cloud-builder.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "sytue-cloud-builder.fullname" .) }}
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: builder
          image: "{{ include "sytue-cloud-builder.imageRegistry" . }}/{{ .Values.image.repository }}:{{ ((.Values.global).image | default dict).tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          # Nombres de env = services/cloud/internal/config/config.go (Config compartida;
          # el builder orquesta Jobs Kaniko/CNB). Secretos SOLO por secretKeyRef.
          env:
            {{- include "sytue.logCollectorEnv" . | nindent 12 }}
            {{- if (.Values.global).otlp }}
            {{- if (.Values.global).otlp.endpoint }}
            # Telemetria: metricas OTLP directas a Cockpit, sin agente intermedio.
            # Sale del umbrella y no de este chart para que los catorce escriban al
            # MISMO sitio; si cada uno apuntara al suyo, no habria con que comparar.
            # Vacio => no se exporta y el servicio sigue sirviendo igual.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ (.Values.global).otlp.endpoint | quote }}
            {{- end }}
            {{- if (.Values.global).otlp.tokenSecret }}
            # Por Secret y nunca por values: aunque el token solo permita escribir,
            # con el se puede envenenar la serie que decide un escalado.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ (.Values.global).otlp.tokenSecret }}
                  key: {{ (.Values.global).otlp.tokenKey | default "otlp-headers" }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- if ne (include "sytue-cloud-builder.env" .) "base" }}
            # config.go valida ENV ∈ {dev,staging,prod}; "base" es inválido → solo se
            # inyecta si es un valor real (sin él, config.go cae a "dev"). go-live: env=prod.
            - name: ENV
              value: {{ include "sytue-cloud-builder.env" . | quote }}
            # El secreto de la puerta interna del Hub (/internal/notifications), el MISMO en
            # el Hub y en cada servicio que avisa. Lo genera el chart paraguas
            # (sytue-one/templates/secretos-internos.yaml); sin él, fuera de dev, el
            # servicio no arranca.
            - name: HUB_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: sytue-hub-internal
                  key: secret
            {{- end }}
            - name: HTTP_ADDR
              value: ":{{ .Values.service.targetPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DB_MAX_CONNS
              value: {{ .Values.config.dbMaxConns | quote }}
            # kube => client-go sobre Kapsule (crea Jobs); stub => dev sin clúster.
            - name: RUNNER_MODE
              value: {{ .Values.config.runnerMode | quote }}
            - name: BUILD_NAMESPACE
              value: {{ .Values.config.buildNamespace | quote }}
            - name: REGISTRY_URL
              value: {{ .Values.config.registry | quote }}
            # Imagen del executor de Kaniko (Dockerfile builds); pinnear por digest en prod.
            - name: BUILDKIT_IMAGE
              value: {{ .Values.buildkit.image | quote }}
            - name: CRANE_IMAGE
              value: {{ .Values.crane.image | quote }}
            # Cloud Native Buildpacks (deploy sin Dockerfile). CNB_RUN_IMAGE opcional.
            - name: CNB_BUILDER_IMAGE
              value: {{ .Values.cnb.builderImage | quote }}
            - name: CNB_GIT_IMAGE
              value: {{ .Values.cnb.gitImage | quote }}
            {{- with .Values.cnb.runImage }}
            - name: CNB_RUN_IMAGE
              value: {{ . | quote }}
            {{- end }}
            # Object Storage (S3 UE): cache de capas + sink de logs de build.
            - name: S3_ENDPOINT
              value: {{ .Values.config.s3.endpoint | quote }}
            - name: S3_REGION
              value: {{ .Values.config.s3.region | quote }}
            - name: S3_BUCKET
              value: {{ .Values.config.s3.bucket | quote }}
            - name: S3_USE_SSL
              value: {{ .Values.config.s3.useSSL | quote }}
            # ── Obligatorias (config.Load l.Require): sin ellas el binario ABORTA ──
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: database-url
            - name: SECRET_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: secret-enc-key
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: s3-secret-key
            # ── Feature-env OPCIONAL (optional:true ⇒ clave ausente => feature gated-off) ──
            # Push al Registry privado (Scaleway Container Registry).
            - name: REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: registry-username
                  optional: true
            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: registry-password
                  optional: true
            # GitHub App: clone de repos privados en el build. Ausentes ⇒ solo repos públicos.
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: github-app-id
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: github-app-private-key
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "sytue-cloud-builder.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
