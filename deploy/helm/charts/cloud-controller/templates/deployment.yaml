apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sytue-cloud-controller.fullname" . }}
  labels:
    {{- include "sytue-cloud-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Singleton: al recrear no solapar dos reconciliadores contra el mismo estado.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sytue-cloud-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # envFrom se lee al arrancar: incluso cambiar solo el ServiceAccount de
        # la API debe recargar su identidad, publicada por el otro subchart.
        sytue.eu/runtime-config-revision: {{ .Release.Revision | quote }}
      labels:
        {{- include "sytue-cloud-controller.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "sytue-cloud-controller.fullname" .) }}
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: "{{ include "sytue-cloud-controller.imageRegistry" . }}/{{ .Values.image.repository }}:{{ ((.Values.global).image | default dict).tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          # La identidad procede del chart de cloud-api, incluidos sus overrides
          # de ServiceAccount; nunca se replica en values del controller.
          envFrom:
            - configMapRef:
                name: {{ include "sytue-cloud-api.runtimeAccessConfigMap" . }}
          # Nombres de env = services/cloud/internal/config/config.go (Config compartida;
          # el controller reconcilia workload). Secretos por secretKeyRef.
          env:
            {{- include "sytue.logCollectorEnv" . | nindent 12 }}
            {{- if (.Values.global).otlp }}
            {{- if (.Values.global).otlp.endpoint }}
            # Telemetria: metricas OTLP directas a Cockpit, sin agente intermedio.
            # Sale del umbrella y no de este chart para que los catorce escriban al
            # MISMO sitio; si cada uno apuntara al suyo, no habria con que comparar.
            # Vacio => no se exporta y el servicio sigue sirviendo igual.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ (.Values.global).otlp.endpoint | quote }}
            {{- end }}
            {{- if (.Values.global).otlp.tokenSecret }}
            # Por Secret y nunca por values: aunque el token solo permita escribir,
            # con el se puede envenenar la serie que decide un escalado.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ (.Values.global).otlp.tokenSecret }}
                  key: {{ (.Values.global).otlp.tokenKey | default "otlp-headers" }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- if ne (include "sytue-cloud-controller.env" .) "base" }}
            # config.go valida ENV ∈ {dev,staging,prod}; "base" es inválido → solo se
            # inyecta si es un valor real (sin él, config.go cae a "dev"). go-live: env=prod.
            - name: ENV
              value: {{ include "sytue-cloud-controller.env" . | quote }}
            # El secreto de la puerta interna del Hub (/internal/notifications), el MISMO en
            # el Hub y en cada servicio que avisa. Lo genera el chart paraguas
            # (sytue-one/templates/secretos-internos.yaml); sin él, fuera de dev, el
            # servicio no arranca.
            - name: HUB_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: sytue-hub-internal
                  key: secret
            {{- end }}
            - name: HTTP_ADDR
              value: ":{{ .Values.service.targetPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DB_MAX_CONNS
              value: {{ .Values.config.dbMaxConns | quote }}
            # Modo de ejecución del PaaS: kube = client-go sobre Kapsule (producción).
            - name: RUNNER_MODE
              value: {{ .Values.config.runnerMode | quote }}
            # Vacío => configuración in-cluster (usa el ServiceAccount del pod).
            - name: KUBECONFIG
              value: ""
            - name: RECONCILE_INTERVAL
              value: {{ .Values.config.reconcileInterval | quote }}
            - name: BUILD_NAMESPACE
              value: {{ .Values.config.buildNamespace | quote }}
            - name: CERT_ISSUER
              value: {{ include "sytue-cloud-controller.certIssuer" . | quote }}
            - name: APPS_DOMAIN
              value: {{ .Values.config.appsDomain | quote }}
            - name: PREVIEW_DOMAIN
              value: {{ .Values.config.previewDomain | quote }}
            - name: INGRESS_TARGET
              value: {{ .Values.config.ingressTarget | quote }}
            {{- if .Values.config.analytics.enabled }}
            # Medición en PRIMERA PARTE (ADR 0026). Sin esta variable, applyIngress NO
            # añade la ruta /_sytue al Ingress de las apps de cliente y la medición
            # queda apagada del todo (config.go: vacío = no se añade la ruta, porque
            # adivinar el namespace dejaría a cada app con una ruta que no resuelve).
            # Es el nombre DNS INTERNO del colector del propio release; el controlador
            # lo usa como ExternalName del Service puente en el namespace del tenant.
            - name: ANALYTICS_INGEST_HOST
              value: {{ include "sytue-cloud-controller.analyticsIngestHost" . | quote }}
            {{- end }}
            - name: REGISTRY_URL
              value: {{ .Values.config.registry | quote }}
            - name: MANAGED_POSTGRES_IMAGE
              value: {{ .Values.config.managedImages.postgres | quote }}
            - name: MANAGED_POSTGREST_IMAGE
              value: {{ .Values.config.managedImages.postgrest | quote }}
            - name: MANAGED_RCLONE_IMAGE
              value: {{ .Values.config.managedImages.rclone | quote }}
            - name: HTTP_TASK_IMAGE
              value: {{ .Values.config.managedImages.httpTask | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.config.s3.endpoint | quote }}
            - name: S3_REGION
              value: {{ .Values.config.s3.region | quote }}
            - name: S3_BUCKET
              value: {{ .Values.config.s3.bucket | quote }}
            - name: S3_USE_SSL
              value: {{ .Values.config.s3.useSSL | quote }}
            # BD del control-plane (misma que cloud-api/builder): DATABASE_URL obligatorio.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: database-url
            # Clave AES-256-GCM que sella secretos de servicios gestionados (obligatoria).
            - name: SECRET_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: secret-enc-key
            # Object Storage (S3 UE) — obligatorios para config.Load.
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: s3-secret-key
            # Credenciales del Registry (opcionales: solo si se despliega desde uno privado).
            - name: REGISTRY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: registry-username
                  optional: true
            - name: REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: registry-password
                  optional: true
            {{- with .Values.config.clusterCidrs }}
            # CIDR de pods/services que las NetworkPolicy de tenant excluyen del egress.
            # Vacío ⇒ default Kapsule de config.go (DefaultClusterCIDRs).
            - name: CLUSTER_CIDRS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.scw.orgId }}
            # Scaleway IAM: acuña credenciales S3 por-tenant ACOTADAS al bucket.
            - name: SCW_ORG_ID
              value: {{ . | quote }}
            {{- end }}
            # SCW_SECRET_KEY (token de plataforma con derecho IAM). Ausente ⇒ la provisión
            # de storage por-tenant queda FAIL-CLOSED (no se entregan las claves root).
            - name: SCW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: scw-secret-key
                  optional: true
            # Credenciales S3 ACOTADAS a backups/* para el CronJob de backup. Ausentes ⇒
            # el controller cae a las claves de plataforma (S3_ACCESS_KEY/S3_SECRET_KEY).
            - name: S3_BACKUP_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: s3-backup-access-key
                  optional: true
            - name: S3_BACKUP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: s3-backup-secret-key
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "sytue-cloud-controller.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
