{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sytue-cloud-controller.fullname" . }}
  labels:
    {{- include "sytue-cloud-controller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sytue-cloud-controller.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Sin API pública: solo el scrape de métricas/salud desde la propia suite
    # (Prometheus / health) sobre el puerto http del controller.
    - from:
        - namespaceSelector:
            matchLabels:
              sytue.eu/role: ingress
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sytue-one
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sytue-one
    # Kubernetes API (despliega en namespaces tenant), Scaleway API, S3 y RDB (PostgreSQL).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 5432
{{- end }}
