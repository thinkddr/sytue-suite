{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (include "sytue-cloud-controller.fullname" .) }}
  labels:
    {{- include "sytue-cloud-controller.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
---
# ClusterRole global del reconciliador de Sytue Cloud (CLOUD-11 / INF-06).
# SOLO contiene los permisos que requieren alcance de clúster: crear/etiquetar
# namespaces de tenants (`tenant-<slug>`), consultar métricas de pods para
# rightsizing y delegar mediante RoleBindings namespaced los dos catálogos de
# permisos (el de runtime de cloud-api y el de cargas de tenant del propio
# controller). NO incluye secrets, deployments ni ningún otro recurso namespaced
# a escala de clúster: así nunca tiene acceso a los secretos de plataforma (`sytue`)
# ni de `kube-system`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sytue-cloud-controller.fullname" . }}
  labels:
    {{- include "sytue-cloud-controller.labels" . | nindent 4 }}
rules:
  # Crear bindings namespaced no permite conceder otros roles: Kubernetes exige
  # poseer sus permisos o el verbo bind sobre el rol referenciado. El controller
  # NO tiene pods/exec ni acceso global a secrets; solo puede bind estos dos
  # catálogos concretos dentro de cada namespace tenant-<slug>, sin escalate ni
  # escritura de ClusterRoleBindings/ClusterRoles/Roles.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["sytue-cloud-runtime", "sytue-cloud-controller"]
    verbs: ["get", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames:
      - {{ include "sytue-cloud-api.fullname" . | quote }}
      - {{ printf "%s-tenant" (include "sytue-cloud-controller.fullname" .) | quote }}
    verbs: ["bind"]
  # Namespaces de tenants (único recurso core de alcance clúster).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Uso REAL de los pods de app (SampleResourceUsage, rightsizing.go): solo lectura.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
# Catálogo de permisos de workload de tenant (SIN ClusterRoleBinding).
# El reconciliador lo vincula únicamente mediante un RoleBinding namespaced
# (`sytue-cloud-controller`) dentro de cada namespace `tenant-<slug>` verificado
# (CLOUD-11 / INF-06).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-tenant" (include "sytue-cloud-controller.fullname" .) }}
  labels:
    {{- include "sytue-cloud-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sytue-cloud-controller.fullname" . }}
  labels:
    {{- include "sytue-cloud-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sytue-cloud-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default (include "sytue-cloud-controller.fullname" .) }}
    namespace: {{ .Release.Namespace }}
{{- end }}
