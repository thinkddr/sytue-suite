{{- if .Values.runtimeClass.create }}
# RuntimeClass gVisor para todas las cargas de trabajo de tenant (CLOUD-12).
# Requiere que containerd en los nodos de carga tenga registrado el runtime
# `runsc` (ver runbook en docs/operations.md).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtimeClass.name | default "gvisor" }}
  labels:
    {{- include "sytue-cloud-controller.labels" . | nindent 4 }}
handler: {{ .Values.runtimeClass.handler | default "runsc" }}
{{- end }}
