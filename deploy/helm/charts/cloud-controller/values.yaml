# Sytue Cloud Controller — reconciliador del PaaS. Sin ingress público.
# UNICO proceso con client-go (su ServiceAccount lleva el ClusterRole de workload).
enabled: true
replicaCount: 1              # singleton (reconciliador); el líder es implícito por réplica única

image:
  registry: ""
  repository: sytue-cloud-controller
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8093           # puerto de salud del controller (Dockerfile.controller / main.go)

# Requests MEDIDOS en producción (kubectl top, 2026-08-09), no estimados: en
# Kubernetes la factura la fija lo RESERVADO, no lo usado, y estos pods pedían
# 25-75 veces su consumo real. Esa reserva inflada obligó a un tercer nodo cuando
# la CPU real del clúster estaba al 3 %.
#
# El límite NO se toca: un pico sigue pudiendo usar toda la CPU que necesite. Y
# bajar el request hace al HPA MÁS sensible —calcula el porcentaje sobre el
# request—, que es justo lo que hace falta para escalar por demanda real.
resources:
  requests:
    cpu: 15m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 512Mi

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

# Config del reconciliador. Los nombres de env los fija services/cloud/internal/config
# (mismo Config para api/builder/controller); aquí van los que USA el controller.
config:
  logLevel: info
  dbMaxConns: 10
  # RUNNER_MODE=kube => implementación de producción con client-go sobre Kapsule
  # (stub sería dev sin clúster). El controller es el único que la activa.
  runnerMode: kube
  reconcileInterval: 15s
  # Namespace donde corren/observan los Jobs de build (alineado con cloud-builder).
  buildNamespace: sytue-paas-builds
  # Hosts de runtime del PaaS (SPEC): apps prod, previews por PR y CNAME destino.
  appsDomain: apps.sytue.eu
  previewDomain: preview.sytue.eu
  ingressTarget: ingress.sytue.eu
  # Registry Scaleway de donde se despliegan las imágenes de proyectos.
  # Namespace del PaaS en el Container Registry. Lo crea Terraform como
  # `sytue-<env>-paas` (infra/terraform/modules/registry): decía `sytue-paas`,
  # que NO existe, así que en producción cada build de cliente fallaba al
  # publicar con un 401 —Scaleway responde 401 y no 404 a un namespace que no
  # está—. El overlay de cada entorno lo fija; este es el de prod.
  registry: rg.fr-par.scw.cloud/sytue-prod-paas
  # Medición en PRIMERA PARTE (ADR 0026). Con esto activo, el controlador añade a
  # CADA app de cliente una ruta /_sytue EN SU PROPIO DOMINIO (más específica que "/",
  # así que Traefik la prefiere) apuntando a un Service ExternalName hacia el colector.
  # Es lo que hace que el sitio se identifique por el Host y que el script no lleve
  # identificador alguno. Ponerlo a false si se despliega SIN analytics-ingest: una
  # ruta que no resuelve en el Ingress de un cliente es peor que no medir.
  analytics:
    enabled: true
    # Override del DNS interno del colector. Vacío => el Service de este release
    # (<release>-analytics-ingest.<namespace>.svc.cluster.local).
    ingestHost: ""
  managedImages:
    # 18.6 y no 18.4: la 18.4 arrastra los cuatro avisos de PostgreSQL del
    # 2026-08-13, corregidos en 18.5 (la imagen oficial no publicó esa etiqueta y
    # saltó a 18.6). El que obliga aquí es CVE-2026-19385 (8.8): un desbordamiento
    # en `pg_dump` al volcar listas largas de transformaciones de función deja a
    # QUIEN CREA OBJETOS ejecutar código como el usuario que corre pg_dump. En
    # estas bases quien crea objetos es el cliente, y quien corre pg_dump somos
    # nosotros desde el CronJob de backup: es un salto de tenant a plataforma.
    #
    # También CVE-2026-6471 (7.2): con privilegio REPLICATION se puede hacer
    # dlopen de cualquier fichero visible para el proceso.
    postgres: postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    postgrest: postgrest/postgrest:v14.16@sha256:bea1c76a856fa39d1e542d25911cf95d02fe2bf971992d033044ff209f1504b8
    # rclone (MIT) sustituye a MinIO Client: `mc` es AGPL-3.0 —prohibida por el
    # firewall clean-room— y MinIO lo archivó en noviembre de 2025.
    rclone: rclone/rclone:1.75.0@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548
    # curl (licencia curl, permisiva): con esta imagen corre una tarea programada
    # que solo llama a una URL, sin obligar a nadie a empaquetar una imagen para
    # hacer un POST cada noche.
    httpTask: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
  # Object Storage (S3 UE) para cache de builds/logs. endpoint/región overridable.
  s3:
    endpoint: https://s3.fr-par.scw.cloud
    region: fr-par
    bucket: sytue-paas-build-cache
    useSSL: true
  # CERT_ISSUER: ClusterIssuer de cert-manager para el TLS de los dominios de cliente.
  # Por defecto sigue al issuer de la plataforma (global.tls.issuer); overridable.
  certIssuer: ""
  # SCW_ORG_ID: organización Scaleway para acuñar credenciales S3 por-tenant vía IAM.
  # Vacío ⇒ provisión de storage por-tenant FAIL-CLOSED (requiere scw-secret-key en el Secret).
  scw:
    orgId: ""
  # CLUSTER_CIDRS (CSV) que las NetworkPolicy de tenant excluyen del egress. Vacío ⇒
  # default Kapsule de config.go (pods 100.64.0.0/14, services 10.32.0.0/12).
  clusterCidrs: ""

# Secret (existingSecret) sytue-cloud-controller. OBLIGATORIAS (config.Load l.Require):
# database-url, secret-enc-key, s3-access-key, s3-secret-key. OPCIONALES (secretKeyRef
# optional:true): registry-username, registry-password, scw-secret-key (IAM por-tenant),
# s3-backup-access-key, s3-backup-secret-key (CronJob de backup acotado a backups/*).
# Materializados desde Scaleway Secret Manager por el bootstrap de producción.
existingSecret: sytue-cloud-controller

# RBAC: el controller reconcilia workload. Su ServiceAccount lleva el
# ClusterRole de workload (namespaces/deployments/services/ingresses/jobs/secrets/
# quotas/limitranges/netpols/hpa/cert-manager Certificates/metrics).
# No tiene pods/exec ni escritura de ClusterRoleBindings. Solo puede vincular el
# catálogo de logs/terminal de cloud-api mediante RoleBindings de tenant.
rbac:
  create: true
serviceAccount:
  create: true
  name: ""

# RuntimeClass para aislar los contenedores de tenant con un kernel en espacio
# de usuario (gVisor / runsc, CLOUD-12).
runtimeClass:
  create: true
  name: gvisor
  handler: runsc

# PodDisruptionBudget. El controller corre como singleton (1 réplica); el PDB usa
# maxUnavailable para no bloquear drains/upgrades del nodo.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Reparto anti-afinidad suave por zona y nodo (cuando hay >1 réplica).
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10004
  fsGroup: 10004
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
