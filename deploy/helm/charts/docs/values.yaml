# sytue-docs — defaults del subchart (servicio Go). global.* lo inyecta el umbrella.
# Estado en PostgreSQL (RDB Scaleway, UE). Sin Redis/Valkey ni motores AGPL.
enabled: true
subdomain: docs
component: docs
replicaCount: 2

image:
  registry: ghcr.io/thinkddr   # global.imageRegistry lo pisa en producción
  repository: sytue-docs
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8083             # puerto del SPEC

ingress:
  enabled: true
  className: traefik
  annotations: {}
  # docs.sytue.eu: el editor Astro (sytue-frontend) sirve "/"; el backend Go expone
  # todo bajo /api/v1, incluida la colaboración por WebSocket
  # (/api/v1/documents/{id}/ws, handler.go): no hay ningún prefijo /colab que servir.
  paths:
    # `/api/v1` y NO `/api`: el BFF de la app Astro sirve sus propias rutas
    # bajo /api/<recurso>, y un Prefix en /api se las quedaba TODAS y se las
    # mandaba al servicio Go, que solo expone /api/v1. El navegador recibía
    # 404 en cada carga y la app decía «no se pudieron cargar los datos».
    - path: /api/v1
      pathType: Prefix
    # WOPI. Son rutas del servicio Go, NO de la app Astro, y van una a una con
    # `Exact`: un Prefix en /wopi se quedaría también con /wopi/editor, que es la
    # página del editor y la sirve el frontend.
    #
    # Sin estas tres entradas el catálogo y el formulario del host caen en la app
    # Astro y devuelven 404: «abrir en el editor» no llegaría a existir.
    - path: /wopi/discovery.xml
      pathType: Exact
    - path: /wopi/view
      pathType: Exact
    - path: /wopi/edit
      pathType: Exact
  tls:
    secretName: tls-docs-sytue-eu

# Right-sized al footprint MEDIDO (Go ~6-40MiB RSS idle): requests modestos para
# densidad/coste; limits con cabecera para picos (modelo doc + colab; burstable).
# Requests MEDIDOS en producción (kubectl top, 2026-08-09), no estimados: en
# Kubernetes la factura la fija lo RESERVADO, no lo usado, y estos pods pedían
# 25-75 veces su consumo real. Esa reserva inflada obligó a un tercer nodo cuando
# la CPU real del clúster estaba al 3 %.
#
# El límite NO se toca: un pico sigue pudiendo usar toda la CPU que necesite. Y
# bajar el request hace al HPA MÁS sensible —calcula el porcentaje sobre el
# request—, que es justo lo que hace falta para escalar por demanda real.
resources:
  requests:
    cpu: 15m
    memory: 64Mi
  limits:
    cpu: "2"
    memory: 512Mi

autoscaling:
  # Etiqueta `job` de la serie de metricas, para el HPA por demanda real.
  # Es el ServiceName del BINARIO, que no siempre coincide con el nombre del
  # chart ni con el del directorio; por eso se escribe y no se deduce.
  metricJob: sytue-docs
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  # Sin memoria: en Go la RSS queda alta tras el GC (mala señal de escalado) y
  # GOMEMLIMIT (~85% de limits.memory) ya la acota -> se escala solo por CPU.

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

config:
  # Correo al dueño cuando alguien le pide editar un documento. `from` es el buzón
  # de Docs («Sytue Docs <docs@…>») y su contraseña va en el secret `sytue-docs`,
  # claves `smtp-user` y `smtp-password`. Sin `from`, no sale ninguno.
  smtp: {}
  #  addr: ""          # vacío: <release>-mail-mx:587
  #  from: ""
  #  tlsServerName: "" # el certificado del MTA (mx.<dominio>)
  #  user: ""          # usuario SASL en claro; vacío: `smtp-user` de existingSecret
  #  passwordSecret: "" # Secret con `smtp-password`; vacío: existingSecret
  # Autoridad de sellado de tiempo de las firmas (RFC 3161).
  #
  # IZENPE (Izenpe S.A., sector público vasco), docs/decisions.md#0051. Medido el
  # 2026-09-24 contra la lista de confianza de la UE: su TSA es un servicio de
  # sellado CUALIFICADO en vigor («Qualified TimeStamp issued by tsa.izenpe.com
  # 2025»), abierto y sin registro, y el certificado que firma cada token es el
  # que la lista declara. El Certum gratuito de antes NO es cualificado (no está
  # en la lista como QTST). Su política dice que hay un número de peticiones al
  # mes gratis y que a partir de ahí se contrata; el número no lo publica.
  #
  # Solo viaja la huella SHA-256 de la firma: ni el documento, ni la firma, ni
  # quién firma (docs/security.md#111-plan-de-cumplimiento-rgpd).
  selloUrl: "http://tsa.izenpe.com"
  # Raíz de la cadena de la TSA de Izenpe, «ROOT CA QC IZENPE» (válida hasta
  # 2045; SHA-256 8E:5B:8B:AE:DC:4D:58:BE:0E:30:1C:CC:B6:ED:17:3C:08:D7:C7:7C:E4:
