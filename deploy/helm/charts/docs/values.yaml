  # OID de política, si la autoridad elegida exige uno.
  selloPolitica: ""
  # Secret con `sello-usuario` y `sello-clave` para las autoridades que piden
  # autenticación básica. La credencial NUNCA en values: con ella se emiten sellos
  # a nombre de la organización.
  selloSecret: ""

  # Raíz pública de Sytue Docs para el catálogo WOPI. Vacía => se deriva del host
  # del propio chart, que es lo correcto en cualquier despliegue normal.
  publicUrl: ""
  # Hosts WOPI admitidos, separados por comas (se admite `*.dominio`). Vacío =>
  # solo el Sytue Drive de esta suite.
  wopiAllowedHosts: ""
  # Tamano del pool pgx por replica (DB_MAX_CONNS). Prod lo baja (3-5):
  # PgBouncer multiplexa hacia la RDB (ver values-prod.yaml del umbrella).
  dbMaxConns: 10
  logLevel: info
  s3Bucket: docs-blobs
# Postgres EXTERNO (Scaleway RDB). DSN por secret (nunca en git).
postgresql:
  existingSecret: sytue-docs-db
  dsnKey: dsn

# Object Storage S3 (blobs grandes). Hereda global.objectStorage; puede aislarse
# por servicio en despliegues híbridos.
objectStorage: {}
# Secretos de la app (OIDC client secret y especificos del servicio).
existingSecret: sytue-docs

# PodDisruptionBudget: garantiza disponibilidad durante drains/upgrades del cluster.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1   # alternativa a minAvailable (usar uno u otro)

# Reparto anti-afinidad suave por zona y nodo (alta disponibilidad multi-AZ, UE).
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
