{{- $globalObjectStorage := ((.Values.global).objectStorage | default dict) -}}
{{- $objectStorage := .Values.objectStorage | default dict -}}
{{- $remote := ((.Values.global).objectStorageRemote | default dict) -}}
{{- $remoteSecret := $remote.existingSecret | default "sytue-object-storage-remote" -}}
{{- $objectStorageSecret := $objectStorage.existingSecret | default $globalObjectStorage.existingSecret | default "sytue-object-storage" -}}
{{- $objectStorageRegion := $objectStorage.region | default $globalObjectStorage.region | default "fr-par" -}}
{{- $objectStorageUseSSL := true -}}
{{- if hasKey $globalObjectStorage "useSSL" -}}
  {{- $objectStorageUseSSL = $globalObjectStorage.useSSL -}}
{{- end -}}
{{- if hasKey $objectStorage "useSSL" -}}
  {{- $objectStorageUseSSL = $objectStorage.useSSL -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sytue-drive.fullname" . }}
  labels:
    {{- include "sytue-drive.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sytue-drive.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sytue-drive.labels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: drive
    spec:
      automountServiceAccountToken: false
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: drive
          image: "{{ include "sytue-drive.imageRegistry" . }}/{{ .Values.image.repository }}:{{ ((.Values.global).image | default dict).tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if (.Values.global).otlp }}
            {{- if (.Values.global).otlp.endpoint }}
            # Telemetria: metricas OTLP directas a Cockpit, sin agente intermedio.
            # Sale del umbrella y no de este chart para que los catorce escriban al
            # MISMO sitio; si cada uno apuntara al suyo, no habria con que comparar.
            # Vacio => no se exporta y el servicio sigue sirviendo igual.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ (.Values.global).otlp.endpoint | quote }}
            {{- end }}
            {{- if (.Values.global).otlp.tokenSecret }}
            # Por Secret y nunca por values: aunque el token solo permita escribir,
            # con el se puede envenenar la serie que decide un escalado.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ (.Values.global).otlp.tokenSecret }}
                  key: {{ (.Values.global).otlp.tokenKey | default "otlp-headers" }}
                  optional: true
            {{- end }}
            {{- end }}
            # Runtime Go atado a los limites del pod (helper sytue.goRuntimeEnv del umbrella):
            # GOMAXPROCS=techo(limits.cpu) via downward API; GOMEMLIMIT=~85% de limits.memory.
            {{- include "sytue.goRuntimeEnv" (dict "container" "drive" "memLimit" .Values.resources.limits.memory) | nindent 12 }}
            {{- include "sytue.logCollectorEnv" . | nindent 12 }}
            - name: ENV
              value: {{ include "sytue-drive.env" . | quote }}
            - name: HTTP_ADDR
              value: ":{{ .Values.service.targetPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            # Avisos al centro de notificaciones de la suite (topBar y apps
            # nativas): mismo patrón que syerp/cloud-api.
            - name: HUB_BASE_URL
              value: {{ .Values.config.hubUrl | default (printf "http://%s-hub" .Release.Name) | quote }}
            # El secreto de la puerta interna del Hub (/internal/notifications), el MISMO en
            # el Hub y en cada servicio que avisa. Lo genera el chart paraguas
            # (sytue-one/templates/secretos-internos.yaml); sin él, fuera de dev, el
            # servicio no arranca.
            - name: HUB_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: sytue-hub-internal
                  key: secret
            # «X pide editar» también por correo, desde la cuenta común de avisos
            # (avisos@<dominio>): `config.smtp` y el helper común. El correo de quien
            # concede sale de Sytue ID con la sesión de quien pide.
            - name: ID_URL
              value: {{ .Values.config.idUrl | default (printf "http://%s-id" .Release.Name) | quote }}
            # WebDAV con Basic y una contrasena de aplicacion (el gestor de ficheros de
            # Linux, «Archivos» de Android): Drive la canjea en Sytue ID por un token
            # (POST /internal/app-passwords/token). Mismo valor que
            # SYTUE_ID_INTERNAL_SECRET; sin el, /dav solo admite el Bearer.
            - name: ID_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: sytue-id-internal
                  key: token
                  optional: true
            {{- include "sytue.correoEnv" (dict "root" . "prefijo" "") | nindent 12 }}
            - name: PUBLIC_URL
              value: "https://{{ include "sytue-drive.host" . }}"
            # ----- Sytue ID (OIDC; validacion JWT via JWKS) -----
            - name: OIDC_ISSUER
              value: {{ include "sytue-drive.oidcIssuer" . | quote }}
            - name: OIDC_JWKS_URL
              value: {{ include "sytue.oidcJwksUrl" . | quote }}
            # `OIDC_CLIENT_ID`/`OIDC_CLIENT_SECRET` vivieron aqui sin que ningun
            # binario Go los leyera: este servicio valida el JWT por JWKS y no hace
            # ningun flujo de codigo. Quien usa credenciales de cliente es el BFF, y
            # las suyas se llaman SYTUE_OIDC_CLIENT_SECRET. Montaban un secreto real
            # en un pod que no lo usa, y ademas tapaban el gate de prefijos.
            # ----- Sytue Rooms: verja de los ADJUNTOS DE CANAL -----
            # Drive pregunta a Rooms si el usuario sigue siendo miembro del canal antes
            # de servir el adjunto (el roster vive en Rooms, los bytes aqui). El secreto
            # es OPCIONAL: sin el, esa superficie queda cerrada (fail-closed) y el resto
            # de Drive funciona igual. El MISMO valor vive en el secret de Rooms.
            # La papelera de Drive llega a Sytue Docs (mig 0027, internal/docssync):
            # tirar, restaurar o purgar el fichero de un documento hace lo mismo con el
            # documento. Con un secreto PROPIO de Docs y Drive (estas puertas borran),
            # que genera el chart paraguas (secretos-internos.yaml). Sin él, la papelera
            # de cada uno va por su cuenta.
            - name: DOCS_URL
              value: {{ .Values.config.docsUrl | default (printf "http://%s-docs" .Release.Name) | quote }}
            # Sytue Bases: «exportar una vista a una carpeta» lee por su conector de solo lectura.
            - name: BASES_URL
              value: {{ .Values.config.basesUrl | default (printf "http://%s-bases" .Release.Name) | quote }}
            - name: DOCS_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: sytue-docs-drive-internal
                  key: secret
                  optional: true
            - name: ROOMS_URL
              value: {{ .Values.config.roomsUrl | default (printf "http://%s-rooms" .Release.Name) | quote }}
            - name: ROOMS_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: rooms-internal-secret
                  optional: true
            # ----- Sytue Cast: CUOTA COMPARTIDA del plan (mig 0026) -----
            # La cuota es una para toda la suite y Drive es su dueño. Cast guarda los
            # videos en su bucket, pero lo que ocupan cuenta aqui: lo declara en
            # PUT /internal/quota/external/cast con este secreto. OPCIONAL: sin el, la
            # ruta no deja pasar a nadie y la cuota cuenta solo lo de Drive. El MISMO
            # valor vive en el Secret sytue-cast (clave cast-internal-secret).
            - name: CAST_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: cast-internal-secret
                  optional: true
            # ----- HOST WOPI: abrir los ficheros en un editor externo -----
            # El editor lo despliega el cliente (su Collabora, su Office for the web):
            # la suite no incorpora motores AGPL. Las dos piezas son OPCIONALES y se
            # apagan juntas — sin clave no se acunan tokens, y sin descubrimiento no se
            # sabe con que URL abre el editor cada tipo de fichero, asi que Drive no
            # ofrece la accion en vez de llevar a una pantalla en blanco.
            - name: WOPI_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: wopi-key
                  optional: true
            # KEK del almacén S3 de terceros de cada organización (mig 0023). Sin
            # ella la función queda apagada: las credenciales ajenas o van
            # selladas o no se aceptan.
            # El servicio de integraciones presta a Drive el token OAuth de Google
            # Drive / OneDrive (almacenamiento conectado por consentimiento).
            - name: INTEGRATIONS_URL
              value: {{ .Values.config.integrationsUrl | default (printf "http://%s-integrations.%s.svc.cluster.local" .Release.Name .Release.Namespace) | quote }}
            - name: INTEGRATIONS_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: integrations-internal-secret
                  optional: true
            # Túnel de Sytue Cloud para el NAS del cliente (Pangolin). Sin llave, la
            # clase «NAS» del almacén de terceros no se ofrece.
            - name: TUNNEL_API_URL
              value: {{ .Values.config.tunnel.apiUrl | quote }}
            - name: TUNNEL_ORG
              value: {{ .Values.config.tunnel.org | quote }}
            # El NAS se publica en el dominio de CONTENIDO DE CLIENTES, aparte del de
            # la suite (FILE-09). Sin él o sin su id en el proxy, la clase «NAS» no
            # se ofrece.
            - name: TUNNEL_DOMAIN_ID
              value: {{ .Values.config.tunnel.domainId | quote }}
            - name: SYTUE_CLIENT_CONTENT_DOMAIN
              value: {{ (.Values.global).dominioDeClientes | default "" | quote }}
            - name: TUNNEL_ENDPOINT
              value: {{ .Values.config.tunnel.endpoint | quote }}
            - name: TUNNEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: tunnel-api-key
                  optional: true
            - name: EXTERNAL_STORAGE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: external-storage-key
                  optional: true
            # Sin valor explicito, el catalogo de Sytue Docs: el editor de la casa
            # es cliente WOPI y no hace falta desplegar nada mas para abrir un
            # .docx de Drive.
            #
            # El host sale del DOMINIO de este despliegue, no de una constante:
            # `global.docsHost` no existe en ningun values, asi que el defecto
            # anterior mandaba al Drive de staging a pedirle el catalogo a la
            # produccion de Docs — y a acunar contra ella los tokens.
            - name: WOPI_DISCOVERY_URL
              value: {{ .Values.config.wopiDiscoveryUrl | default (printf "https://docs.%s/wopi/discovery.xml" (include "sytue-drive.domain" .)) | quote }}
            # ----- Postgres EXTERNO (Scaleway RDB; unica fuente de verdad) -----
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.dsnKey }}
            # Pool pgx POR replica (bajo en prod: PgBouncer multiplexa hacia la RDB).
            - name: DB_MAX_CONNS
              value: {{ .Values.config.dbMaxConns | quote }}
            {{- if .Values.config.defaultQuotaGb }}
            # Cuota por tenant. El servicio trae 10 GB por defecto, que en un
            # servidor pequeño es demasiado: los blobs viven en el MISMO disco
            # que PostgreSQL, así que un Drive sin techo no se queda sin espacio
            # él solo, se lleva la base de datos por delante.
            - name: DEFAULT_QUOTA_GB
              value: {{ .Values.config.defaultQuotaGb | quote }}
            {{- end }}
            # DSN DIRECTO a la RDB (bypass del pooler) para estado de sesion:
            # LISTEN/NOTIFY y advisory locks de migraciones (platform/pkg/pg).
            # Opcional: sin PgBouncer (staging/dev) no existe y se usa DATABASE_URL.
            - name: DATABASE_DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.dsnDirectKey }}
                  optional: true
            # ----- Object Storage S3 (Scaleway fr-par, UE) -----
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ $objectStorageSecret }}
                  key: endpoint
            - name: S3_USE_SSL
              value: {{ $objectStorageUseSSL | quote }}
            - name: S3_REGION
              value: {{ $objectStorageRegion | quote }}
            - name: S3_BUCKET
              value: {{ .Values.config.s3Bucket | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $objectStorageSecret }}
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $objectStorageSecret }}
                  key: secret-key
            {{- if $remote.enabled }}
            # ----- Almacén remoto: todo lo nuevo a Scaleway One Zone (ADR 0038) -----
            - name: S3_REMOTE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ $remoteSecret }}
                  key: endpoint
            - name: S3_REMOTE_REGION
              value: {{ $remote.region | default "fr-par" | quote }}
            - name: S3_REMOTE_STORAGE_CLASS
              value: {{ $remote.storageClass | default "ONEZONE_IA" | quote }}
            - name: S3_REMOTE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ $remoteSecret }}
                  key: bucket
            - name: S3_REMOTE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $remoteSecret }}
                  key: access-key
            - name: S3_REMOTE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $remoteSecret }}
                  key: secret-key
            - name: S3_LOCAL_TENANTS
              value: {{ $remote.localTenants | default "" | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "sytue-drive.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
