apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sytue-hub.fullname" . }}
  labels:
    {{- include "sytue-hub.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sytue-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sytue-hub.labels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: hub
    spec:
      automountServiceAccountToken: false
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hub
          image: "{{ include "sytue-hub.imageRegistry" . }}/{{ .Values.image.repository }}:{{ ((.Values.global).image | default dict).tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if (.Values.global).otlp }}
            {{- if (.Values.global).otlp.endpoint }}
            # Telemetria: metricas OTLP directas a Cockpit, sin agente intermedio.
            # Sale del umbrella y no de este chart para que los catorce escriban al
            # MISMO sitio; si cada uno apuntara al suyo, no habria con que comparar.
            # Vacio => no se exporta y el servicio sigue sirviendo igual.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ (.Values.global).otlp.endpoint | quote }}
            {{- end }}
            {{- if (.Values.global).otlp.tokenSecret }}
            # Por Secret y nunca por values: aunque el token solo permita escribir,
            # con el se puede envenenar la serie que decide un escalado.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ (.Values.global).otlp.tokenSecret }}
                  key: {{ (.Values.global).otlp.tokenKey | default "otlp-headers" }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- if (.Values.global).dragonflyUrl }}
            # Cache efimera compartida entre replicas (Dragonfly). Sale del
            # umbrella y no de cada chart para que los tres servicios que la usan
            # apunten al MISMO sitio: si divergen, la presencia se parte igual
            # que si no hubiera cache.
            #
            # Ausente ⇒ platform/pkg/cache degrada a no-op y el servicio sigue
            # sirviendo con estado en memoria del proceso. Eso solo es correcto
            # con UNA replica, y por eso el autoescalado de estos servicios
            # depende de que esta variable exista.
            - name: DRAGONFLY_URL
              value: {{ (.Values.global).dragonflyUrl | quote }}
            {{- if ((.Values.global).cache).secretName }}
            # La contraseña va por Secret y APARTE de la URL. La URL no es un secreto
            # —es la misma en dev y en prod— y se deja como `value:` a la vista para
            # que se pueda comprobar que los siete servicios apuntan a la MISMA cache;
            # meterla dentro de la URL obligaría a mandar la URL entera por Secret y
            # ese gate se quedaría ciego.
            #
            # `optional: true` a propósito: sin la clave en el Secret, Dragonfly
            # tampoco la exige (misma referencia opcional en su chart) y el conjunto
            # sigue funcionando sin autenticación, que es el comportamiento previo.
            - name: DRAGONFLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ ((.Values.global).cache).secretName }}
                  key: {{ ((.Values.global).cache).passwordKey | default "dragonfly-password" }}
                  optional: true
            {{- end }}
            {{- end }}
            # Runtime Go atado a los limites del pod (helper sytue.goRuntimeEnv del umbrella):
            # GOMAXPROCS=techo(limits.cpu) via downward API; GOMEMLIMIT=~85% de limits.memory.
            {{- include "sytue.goRuntimeEnv" (dict "container" "hub" "memLimit" .Values.resources.limits.memory) | nindent 12 }}
            {{- include "sytue.logCollectorEnv" . | nindent 12 }}
            - name: ENV
              value: {{ include "sytue-hub.env" . | quote }}
            # El secreto de la puerta interna del Hub (/internal/notifications), el MISMO en
            # el Hub y en cada servicio que avisa. Lo genera el chart paraguas
            # (sytue-one/templates/secretos-internos.yaml); sin él, fuera de dev, el
            # servicio no arranca.
            - name: HUB_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: sytue-hub-internal
                  key: secret
            - name: HTTP_ADDR
              value: ":{{ .Values.service.targetPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PUBLIC_URL
              value: "https://{{ include "sytue-hub.host" . }}"
            # Lo que ESTA instalación levanta, para que el frontal no ofrezca
            # accesos a lo que no está desplegado. Vacía ⇒ se presenta todo.
            - name: APPS
              value: {{ (.Values.config.apps | default (list)) | join "," | quote }}
            # ----- Sytue ID (OIDC; validacion JWT via JWKS) -----
            - name: OIDC_ISSUER
              value: {{ include "sytue-hub.oidcIssuer" . | quote }}
            - name: OIDC_JWKS_URL
              value: {{ include "sytue.oidcJwksUrl" . | quote }}
            # `OIDC_CLIENT_ID`/`OIDC_CLIENT_SECRET` vivieron aqui sin que ningun
            # binario Go los leyera: este servicio valida el JWT por JWKS y no hace
            # ningun flujo de codigo. Quien usa credenciales de cliente es el BFF, y
            # las suyas se llaman SYTUE_OIDC_CLIENT_SECRET. Montaban un secreto real
            # en un pod que no lo usa, y ademas tapaban el gate de prefijos.
            # ----- Postgres EXTERNO (RDB; estado + fan-out LISTEN/NOTIFY, sin Redis/Valkey) -----
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.dsnKey }}
            # Pool pgx POR replica (bajo en prod: PgBouncer multiplexa hacia la RDB).
            - name: DB_MAX_CONNS
              value: {{ .Values.config.dbMaxConns | quote }}
            # DSN DIRECTO a la RDB (bypass del pooler) para estado de sesion:
            # LISTEN/NOTIFY y advisory locks de migraciones (platform/pkg/pg).
            # Opcional: sin PgBouncer (staging/dev) no existe y se usa DATABASE_URL.
            - name: DATABASE_DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.dsnDirectKey }}
                  optional: true
            # ----- Backends federados (servicios Go internos del cluster) -----
            - name: DRIVE_BASE_URL
              value: {{ .Values.config.driveUrl | default (printf "http://%s-drive" .Release.Name) | quote }}
            - name: MAIL_BASE_URL
              value: {{ .Values.config.mailUrl | default (printf "http://%s-mail" .Release.Name) | quote }}
            - name: CALENDAR_BASE_URL
              value: {{ .Values.config.calendarUrl | default (printf "http://%s-calendar" .Release.Name) | quote }}
            - name: CONTACTS_BASE_URL
              value: {{ .Values.config.contactsUrl | default (printf "http://%s-contacts" .Release.Name) | quote }}
            - name: NOTES_BASE_URL
              value: {{ .Values.config.notesUrl | default (printf "http://%s-notes" .Release.Name) | quote }}
            - name: ROOMS_BASE_URL
              value: {{ .Values.config.roomsUrl | default (printf "http://%s-rooms" .Release.Name) | quote }}
            - name: ERP_BASE_URL
              value: {{ .Values.config.erpUrl | default (printf "http://%s-syerp" .Release.Name) | quote }}
            # Solo para «Exportar tus datos»: guardan datos de la persona, aunque no se busquen.
            - name: DOCS_BASE_URL
              value: {{ .Values.config.docsUrl | default (printf "http://%s-docs" .Release.Name) | quote }}
            - name: PHOTOS_BASE_URL
              value: {{ .Values.config.photosUrl | default (printf "http://%s-syphotos" .Release.Name) | quote }}
            - name: CAST_BASE_URL
              value: {{ .Values.config.castUrl | default (printf "http://%s-cast" .Release.Name) | quote }}
            - name: PAGES_BASE_URL
              value: {{ .Values.config.pagesUrl | default (printf "http://%s-pages" .Release.Name) | quote }}
            - name: BASES_BASE_URL
              value: {{ .Values.config.basesUrl | default (printf "http://%s-bases" .Release.Name) | quote }}
            - name: ID_BASE_URL
              value: {{ .Values.config.idUrl | default (printf "http://%s-id" .Release.Name) | quote }}
            # El nombre visible de las organizaciones de fuera en la campana (Sytue ID,
            # /internal/orgs/names). Sin él, la campana enseña su identificador.
            - name: ID_NOMBRES_ORGS_SECRET
              valueFrom:
                secretKeyRef:
                  name: sytue-id-nombres-orgs
                  key: secret
                  optional: true
            # La búsqueda federada pregunta también al gateway de integraciones (lo de
            # Google y Microsoft 365 conectados). Sin esto el Hub caía en su valor por
            # defecto, `http://integrations:8093`, que no existe en el clúster: cada
            # búsqueda decía «integrations no ha respondido» (visto en producción el
            # 2026-09-27: «lookup integrations … no such host»).
            - name: INTEGRATIONS_BASE_URL
              value: {{ .Values.config.integrationsUrl | default (printf "http://%s-integrations" .Release.Name) | quote }}
            {{- /* Sytue AI: traduce una frase a los filtros de la búsqueda federada
                   («las facturas de Acme del mes pasado» → sources=drive, kinds=file,
                   from=…). CONDICIONAL Y SIN RESPALDO, igual que en el frontend:
                   ausente significa «no hay IA», y entonces el Hub busca literalmente
                   como ha hecho siempre. Apuntar a un Service que no existe cambiaría
                   una función que falta por una espera de ocho segundos en CADA
                   búsqueda sin resultados.

                   Interna y no por el ingress: por aquí pasa lo que la gente
                   escribe en el buscador. */}}
            {{- if (.Values.global).ai }}
            {{- if (.Values.global).ai.enabled }}
            - name: SYTUE_AI_URL
              value: "http://{{ .Release.Name }}-ai.{{ .Release.Namespace }}.svc.cluster.local"
            {{- end }}
            {{- end }}
            # Las URLs públicas se usan en los enlaces de los resultados de búsqueda
            # y en los deep-links de los intents. Sin ellas los defaults de
            # desarrollo terminan en *.sytue.localhost.
            #
            # CON EL PREFIJO DE LA APP, y no solo el host. Cada superficie se sirve
            # bajo su prefijo (`/mail`, `/calendar`…) y el Hub le PEGA una ruta
            # detrás: `intents.go` compone `Calendar + "/events/new?"`,
            # `Mail + "/messages/<id>"`, `Drive + "/files/<id>"` y siete más. Con la
            # base a pelo salía `https://calendar.<dominio>/events/new`, que no casa
            # con ninguna regla del ingress y da «404 page not found».
            #
            # No lo salva el 301 de la raíz: ese solo redirige la raíz DESNUDA del
            # host (`^https?://host/?$`), no una ruta profunda. Es el mismo hueco
            # que dejaba a cada app sirviendo el favicon del portal.
            #
            # Medido el 2026-09-09 pulsando «Crear evento» en un hilo de Mail: la
            # pestaña nueva abría en `calendar.sytue.eu/events/new?action=create…`
            # y respondía 404. Los DIEZ deep-links del resolutor estaban igual.
            - name: DRIVE_PUBLIC_URL
              value: {{ printf "https://drive.%s/drive" (include "sytue-hub.domain" .) | quote }}
            - name: MAIL_PUBLIC_URL
              value: {{ printf "https://mail.%s/mail" (include "sytue-hub.domain" .) | quote }}
            - name: CALENDAR_PUBLIC_URL
              value: {{ printf "https://calendar.%s/calendar" (include "sytue-hub.domain" .) | quote }}
            - name: CONTACTS_PUBLIC_URL
              value: {{ printf "https://contacts.%s/contacts" (include "sytue-hub.domain" .) | quote }}
            - name: NOTES_PUBLIC_URL
              value: {{ printf "https://notes.%s/notes" (include "sytue-hub.domain" .) | quote }}
            - name: ROOMS_PUBLIC_URL
              value: {{ printf "https://rooms.%s/rooms" (include "sytue-hub.domain" .) | quote }}
            - name: ERP_PUBLIC_URL
              value: {{ printf "https://erp.%s/erp" (include "sytue-hub.domain" .) | quote }}
            - name: PAGES_PUBLIC_URL
              value: {{ printf "https://web.%s/web" (include "sytue-hub.domain" .) | quote }}
            - name: BASES_PUBLIC_URL
              value: {{ printf "https://bases.%s/bases" (include "sytue-hub.domain" .) | quote }}
            {{- with .Values.descargas }}
            {{- if .bucket }}
            # Instaladores nativos para el actualizador de las apps de escritorio: el
            # bucket de la página de descargas, con su credencial de solo lectura.
            # `optional`: sin el Secret, `/api/v1/instaladores` responde 503 y las apps
            # siguen como están.
            - name: DOWNLOADS_BUCKET
              value: {{ .bucket | quote }}
            - name: DOWNLOADS_ENDPOINT
              value: {{ .endpoint | quote }}
            {{- if .publicEndpoint }}
            - name: DOWNLOADS_PUBLIC_ENDPOINT
              value: {{ .publicEndpoint | quote }}
            {{- end }}
            - name: DOWNLOADS_REGION
              value: {{ .region | quote }}
            - name: DOWNLOADS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secret | quote }}
                  key: access-key
                  optional: true
            - name: DOWNLOADS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secret | quote }}
                  key: secret-key
                  optional: true
            {{- end }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "sytue-hub.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
