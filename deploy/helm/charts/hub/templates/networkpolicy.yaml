{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sytue-hub.fullname" . }}
  labels:
    {{- include "sytue-hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sytue-hub.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Desde el ingress controller (tráfico público hub.sytue.eu)
    - from:
        - namespaceSelector:
            matchLabels:
              sytue.eu/role: ingress
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    # Desde otras superficies de la suite (shell global llama al Hub)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sytue-one
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Backends federados intra-suite (servicios Go: drive/mail/calendar/contacts/notes/chat).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sytue-one
    # Postgres EXTERNO (RDB) + Sytue ID/JWKS y Secret Manager via HTTPS (solo UE).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
{{- end }}
