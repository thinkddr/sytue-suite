apiVersion: v2
name: sytue-id
description: >-
  Sytue ID — servicio Go propio de identidad (OIDC/OAuth2 Authorization Code + PKCE,
  refresh, JWKS, discovery, SCIM, MFA/WebAuthn) sobre librerias Apache-2.0
  (ory/fosite o zitadel/oidc). Pieza NUCLEAR de la suite: cada servicio Go valida sus
  JWT via JWKS. Estado en PostgreSQL (RDB Scaleway, UE). Expuesto en id.sytue.eu.
  Código Apache-2.0, (c) 2026 Daniel Delgado Ramos; sin motores AGPL ni Redis.
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.31.0-0"
home: https://sytue.eu
keywords: [sytue, id, identity, oidc, oauth2, scim, webauthn, go]
maintainers:
  - name: Sytue Platform
    email: platform@sytue.eu
annotations:
  licenses: MIT
  sytue.eu/stack: go
