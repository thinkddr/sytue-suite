apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sytue-integrations.fullname" . }}
  labels:
    {{- include "sytue-integrations.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sytue-integrations.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sytue-integrations.labels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: integrations
    spec:
      automountServiceAccountToken: false
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: integrations
          image: "{{ include "sytue-integrations.imageRegistry" . }}/{{ .Values.image.repository }}:{{ ((.Values.global).image | default dict).tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if (.Values.global).otlp }}
            {{- if (.Values.global).otlp.endpoint }}
            # Telemetria: metricas OTLP directas a Cockpit, sin agente intermedio.
            # Sale del umbrella y no de este chart para que los catorce escriban al
            # MISMO sitio; si cada uno apuntara al suyo, no habria con que comparar.
            # Vacio => no se exporta y el servicio sigue sirviendo igual.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ (.Values.global).otlp.endpoint | quote }}
            {{- end }}
            {{- if (.Values.global).otlp.tokenSecret }}
            # Por Secret y nunca por values: aunque el token solo permita escribir,
            # con el se puede envenenar la serie que decide un escalado.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ (.Values.global).otlp.tokenSecret }}
                  key: {{ (.Values.global).otlp.tokenKey | default "otlp-headers" }}
                  optional: true
            {{- end }}
            {{- end }}
            # Runtime Go atado a los limites del pod (helper sytue.goRuntimeEnv del umbrella):
            # GOMAXPROCS=techo(limits.cpu) via downward API; GOMEMLIMIT=~85% de limits.memory.
            {{- include "sytue.goRuntimeEnv" (dict "container" "integrations" "memLimit" .Values.resources.limits.memory) | nindent 12 }}
            {{- include "sytue.logCollectorEnv" . | nindent 12 }}
            - name: ENV
              value: {{ include "sytue-integrations.env" . | quote }}
            # El gateway fija la escucha desde PORT (config.go); HTTP_ADDR se mantiene
            # por coherencia con el resto de servicios de la suite.
            - name: PORT
              value: "{{ .Values.service.targetPort }}"
            - name: HTTP_ADDR
              value: ":{{ .Values.service.targetPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PUBLIC_URL
              value: "https://{{ include "sytue-integrations.host" . }}"
            # Adónde vuelve el admin tras autorizar en el proveedor. Sin esto el
            # servicio usaba su defecto de desarrollo y el consentimiento terminaba
            # en `console.sytue.localhost`, con la conexión rechazada.
            - name: CONSOLE_URL
              value: {{ include "sytue-integrations.consoleURL" . | quote }}
            # El almacenamiento conectado vuelve a Drive, también sin plan Admin.
            - name: DRIVE_PUBLIC_URL
              value: {{ .Values.config.drivePublicUrl | default (printf "https://drive.%s" (include "sytue-integrations.domain" .)) | quote }}
            - name: ROOMS_PUBLIC_URL
              value: {{ .Values.config.roomsPublicUrl | default (printf "https://rooms.%s" (include "sytue-integrations.domain" .)) | quote }}
            - name: MAIL_PUBLIC_URL
              value: {{ .Values.config.mailPublicUrl | default (printf "https://mail.%s" (include "sytue-integrations.domain" .)) | quote }}
            - name: CALENDAR_PUBLIC_URL
              value: {{ .Values.config.calendarPublicUrl | default (printf "https://calendar.%s" (include "sytue-integrations.domain" .)) | quote }}
            - name: CONTACTS_PUBLIC_URL
              value: {{ .Values.config.contactsPublicUrl | default (printf "https://contacts.%s" (include "sytue-integrations.domain" .)) | quote }}
            - name: NOTES_PUBLIC_URL
              value: {{ .Values.config.notesPublicUrl | default (printf "https://notes.%s" (include "sytue-integrations.domain" .)) | quote }}
            - name: SYTUE_INTEGRATIONS_WHATSAPP_CONFIG_ID
              value: {{ .Values.config.whatsappConfigId | default "" | quote }}
            - name: WHATSAPP_GRAPH_VERSION
              value: {{ .Values.config.whatsappGraphVersion | default "v26.0" | quote }}
            - name: SYTUE_INTEGRATIONS_WHATSAPP_WEBHOOK_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: whatsapp-webhook-verify-token
                  optional: true
            {{- if .Values.platformOAuth.existingSecret }}
            - name: SYTUE_INTEGRATIONS_OAUTH_CLIENTS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformOAuth.existingSecret | quote }}
                  key: {{ .Values.platformOAuth.clientsKey | quote }}
                  optional: true
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformOAuth.existingSecret | quote }}
                  key: google-oauth-client-id
                  optional: true
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformOAuth.existingSecret | quote }}
                  key: google-oauth-client-secret
                  optional: true
            - name: MICROSOFT_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformOAuth.existingSecret | quote }}
                  key: microsoft-oauth-client-id
                  optional: true
            - name: MICROSOFT_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformOAuth.existingSecret | quote }}
                  key: microsoft-oauth-client-secret
                  optional: true
            - name: MICROSOFT_TEAMS_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformOAuth.existingSecret | quote }}
                  key: microsoft-teams-oauth-client-id
                  optional: true
            - name: MICROSOFT_TEAMS_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformOAuth.existingSecret | quote }}
                  key: microsoft-teams-oauth-client-secret
                  optional: true
            - name: SLACK_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformOAuth.existingSecret | quote }}
                  key: slack-oauth-client-id
                  optional: true
            - name: SLACK_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformOAuth.existingSecret | quote }}
                  key: slack-oauth-client-secret
                  optional: true
            {{- end }}
            # ----- Sytue ID (OIDC; validacion JWT via JWKS) -----
            - name: OIDC_ISSUER
              value: {{ include "sytue-integrations.oidcIssuer" . | quote }}
            - name: OIDC_JWKS_URL
              value: {{ include "sytue.oidcJwksUrl" . | quote }}
            # Sytue ID por el Service interno: de ahi salen el directorio de la
            # organizacion (usuarios y grupos a aprovisionar) y el canje de los tokens
            # delegados de la migracion de contenido.
            - name: ID_URL
              value: {{ .Values.config.idUrl | default (printf "http://%s-id" .Release.Name) | quote }}
            # IDENTIDAD DE SERVICIO, distinta de la de arriba. `sytue-gateway` es el
            # client client_credentials que siembra la migración 0017 con los scopes
            # id.directory.read e id.apps.manage; `sytue-integrations` es el client
            # con el que se validan los tokens de las PERSONAS que entran a la
            # superficie, y no admite client_credentials.
            #
            # Aquí se pasaba el segundo. El resultado: activar una conexión de
            # Google Workspace o Microsoft 365 moría con «Sytue ID no responde
            # ahora mismo», que es lo que devuelve el asistente ante un 502, con
            # Sytue ID sano al otro lado.
            - name: SYTUE_INTEGRATIONS_ID_CLIENT_ID
              value: {{ .Values.config.gatewayClientId | default "sytue-gateway" | quote }}
            - name: SYTUE_INTEGRATIONS_ID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: gateway-client-secret
            # ----- Postgres EXTERNO (RDB; instancias, secretos sellados, auditoria) -----
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.dsnKey }}
            # Pool pgx POR replica (bajo en prod: PgBouncer multiplexa hacia la RDB).
            - name: DB_MAX_CONNS
              value: {{ .Values.config.dbMaxConns | quote }}
            # DSN DIRECTO a la RDB (bypass del pooler) para las migraciones (advisory
            # locks) y el outbox. Opcional: sin PgBouncer se usa DATABASE_URL.
            - name: DATABASE_DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.dsnDirectKey }}
                  optional: true
            # ----- Secretos de instancia at-rest -----
            # KEK AES-256 (base64) con la que se sellan los secretos de cada conector.
            # Sin ella el servicio arranca sano pero rechaza guardarlos (503): jamas se
            # persiste una credencial de un tercero en claro.
            - name: SYTUE_INTEGRATIONS_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: key-encryption-key
            # Token de operador: habilita PUT /operator/delegated-client. Opcional —
            # sin el, esa ruta ni se monta.
            # Secreto interno: Sytue Drive pide con él el token OAuth de una instancia
            # de Google Drive u OneDrive (/internal/v1/storage/*). Opcional: sin él,
            # esos endpoints no se montan y el almacenamiento conectado por
            # consentimiento no está disponible.
            - name: SYTUE_INTEGRATIONS_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: internal-secret
                  optional: true
            - name: SYTUE_INTEGRATIONS_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: operator-token
                  optional: true
            # ----- Sytue Rooms (destino de los equipos de Microsoft Teams) -----
            # La migracion recrea equipos, canales y miembros por la API publica de
            # Rooms, con el token delegado de quien lanza el trabajo.
            - name: ROOMS_URL
              value: {{ .Values.config.roomsUrl | default (printf "http://%s-rooms" .Release.Name) | quote }}
            # ----- Sytue Cloud (destino de las aplicaciones de Google Cloud) -----
            # Cada servicio de Cloud Run o sitio de Firebase Hosting llega como un
            # proyecto con sus variables, sus dominios y su escala; los buckets, con
            # sus objetos. Se escribe con el token delegado de la persona destino.
            - name: CLOUD_URL
              value: {{ .Values.config.cloudUrl | default (printf "http://%s-cloud-api" .Release.Name) | quote }}
            # ----- Sytue Git (destino de los repositorios que trae la migracion) -----
            # Con GIT_URL y el token de administrador de la forja, el asistente de
            # migracion importa los repositorios de GitHub a nombre de cada persona
            # (cabecera Sudo). Sin ellos el resto de la migracion funciona igual y solo
            # el contenido de tipo 'repos' se rechaza con un motivo legible.
            {{- if .Values.config.gitUrl }}
            - name: GIT_URL
              value: {{ .Values.config.gitUrl | quote }}
            {{- end }}
            - name: SYTUE_INTEGRATIONS_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: git-token
                  optional: true
            # ----- Egress hacia terceros (una sola puerta, con politica) -----
            - name: EGRESS_RATE_PER_SEC
              value: {{ .Values.config.egressRatePerSec | quote }}
            - name: EGRESS_BURST
              value: {{ .Values.config.egressBurst | quote }}
            - name: EGRESS_TIMEOUT
              value: {{ .Values.config.egressTimeout | quote }}
            - name: EGRESS_MAX_REDIRECTS
              value: {{ .Values.config.egressMaxRedirects | quote }}
            - name: POLICY_CACHE_TTL
              value: {{ .Values.config.policyCacheTTL | quote }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "sytue-integrations.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
