{{- if .Values.ingress.enabled }}
{{- $host := include "sytue-integrations.host" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sytue-integrations.fullname" . }}
  labels:
    {{- include "sytue-integrations.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ include "sytue-integrations.clusterIssuer" . | quote }}
    # SSE/WebSocket (notificaciones/presencia): Traefik no bufferea ni limita el cuerpo
    # por defecto; el streaming funciona sin anotaciones extra.
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | default "/" }}
            pathType: {{ .Values.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "sytue-integrations.fullname" . }}
                port:
                  name: http
{{- end }}
