apiVersion: v2
name: sytue-livekit-egress
description: >-
  Egress de LiveKit (Apache-2.0): el proceso que GRABA una reunión. No es parte
  del SFU: se une a la sala como un participante más, compone el mosaico y sube
  el fichero al bucket de grabaciones. Recibe el trabajo por el store de routing
  compartido (Dragonfly), que es su único canal —no expone API HTTP—, así que sin
  ese store no hace nada aunque esté desplegado y sano.
type: application
version: 1.0.0
appVersion: "1.14.0"
kubeVersion: ">=1.31.0-0"
keywords: [sytue, livekit, egress, grabacion, reuniones]
maintainers:
  - name: Sytue Platform
    email: platform@sytue.eu
annotations:
  licenses: Apache-2.0
