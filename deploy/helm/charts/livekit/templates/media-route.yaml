{{- if eq .Values.mediaService.type "ClusterIP" }}
# ICE/TCP por el Traefik de la suite, en vez de por un Load Balancer propio.
#
# POR QUÉ: un LB-S de Scaleway cuesta ~20 EUR/mes con su IP, y este solo
# publicaba un puerto TCP. Traefik ya termina el 5349 (TURN/TLS) de este mismo
# chart —ver turn-route.yaml—, así que la pieza existía; esto es el mismo patrón
# para el 7881.
#
# `HostSNI("*")` y no un dominio: ICE/TCP no es TLS y no manda SNI. El comodín
# solo es válido en un entryPoint SIN TLS, que es como se declara `rtctcp` en el
# values del umbrella. Con TLS puesto, Traefik rechazaría la ruta al arrancar.
#
# LO QUE HAY QUE MOVER JUNTO CON ESTO, o las llamadas dejan de conectar: el SFU
# anuncia su IP en los candidatos ICE (`rtc.node_ip` del configmap). Si el
# tráfico pasa a entrar por la IP de Traefik y LiveKit sigue anunciando la del LB
# viejo, el cliente intenta ir a una dirección que ya no escucha — y el fallo es
# del tipo que no da error: la sala abre, se ve el «conectando» y nadie se oye.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "livekit.fullname" . }}-rtc-tcp
  labels:
    {{- include "livekit.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.mediaService.tcpEntryPoint }}
  routes:
    - match: HostSNI(`*`)
      services:
        - name: {{ include "livekit.fullname" . }}-media
          port: rtc-tcp
{{- end }}
