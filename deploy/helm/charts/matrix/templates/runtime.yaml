{{- $name := .Release.Name -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  homeserver.yaml: |
    server_name: {{ .Values.serverName | quote }}
    public_baseurl: {{ .Values.publicURL | quote }}
    pid_file: /tmp/synapse.pid
    signing_key_path: /data/signing.key
    media_store_path: /data/media
    report_stats: false
    enable_registration: false
    allow_guest_access: false
    enable_metrics: false
    enable_search: false
    enable_room_list_search: false
    allow_public_rooms_without_auth: false
    allow_public_rooms_over_federation: false
    federation_domain_whitelist: []
    trusted_key_servers: []
    suppress_key_server_warning: true
    url_preview_enabled: false
    presence:
      enabled: false
    password_config:
      enabled: false
      localdb_enabled: false
    user_directory:
      enabled: false
      search_all_users: false
    room_list_publication_rules:
      - action: deny
    encryption_enabled_by_default_for_room_type: all
    listeners:
      - port: 8008
        bind_addresses: ['0.0.0.0']
        type: http
        tls: false
        x_forwarded: true
        resources:
          - names: [client]
            compress: false
    sso:
      client_whitelist:
        - {{ printf "%s/rooms/matrix/callback" .Values.roomsURL | quote }}
        - {{ printf "%s/rooms/matrix/native/callback" .Values.roomsURL | quote }}
        - 'http://127.0.0.1:'
    max_upload_size: 100M
    log_config: /config/log.yaml
  log.yaml: |
    version: 1
    formatters:
      plain:
        format: '%(asctime)s %(levelname)s %(name)s %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: plain
    loggers:
      synapse.access.http:
        level: WARNING
      synapse.http.site:
        level: WARNING
      synapse.storage.SQL:
        level: WARNING
    root:
      level: WARNING
      handlers: [console]
    disable_existing_loggers: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app: {{ $name }}}
  ports: [{name: http, port: 8008, targetPort: http}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/part-of: sytue-one
        app.kubernetes.io/component: matrix
      annotations:
        checksum/config: {{ toJson .Values | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: signing-key
          image: {{ .Values.image | quote }}
          command: [python, -m, synapse.app.homeserver]
          args: [-c, /config/homeserver.yaml, -c, /secrets/config.yaml, --generate-keys]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: secrets, mountPath: /secrets, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: synapse
          image: {{ .Values.image | quote }}
          command: [python, -m, synapse.app.homeserver]
          args: [-c, /config/homeserver.yaml, -c, /secrets/config.yaml]
          ports: [{name: http, containerPort: 8008}]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: secrets, mountPath: /secrets, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        - name: secrets
          secret: {secretName: {{ .Values.existingSecret }}, defaultMode: 0440}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.storageSize }}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.issuer | quote }}
spec:
  ingressClassName: {{ .Values.ingressClass | quote }}
  tls:
    - hosts: [{{ .Values.serverName | quote }}]
      secretName: tls-{{ .Values.serverName | replace "." "-" }}
  rules:
    - host: {{ .Values.serverName | quote }}
      http:
        paths:
          # No public /_synapse/admin, federation, metrics or registration API.
          - path: /_matrix/client
            pathType: Prefix
            backend: {service: {name: {{ $name }}, port: {name: http}}}
          - path: /_matrix/media
            pathType: Prefix
            backend: {service: {name: {{ $name }}, port: {name: http}}}
          - path: /_synapse/client
            pathType: Prefix
            backend: {service: {name: {{ $name }}, port: {name: http}}}
          - path: /.well-known/matrix/client
            pathType: Exact
            backend: {service: {name: {{ $name }}, port: {name: http}}}
