apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sytue-notes.fullname" . }}
  labels:
    {{- include "sytue-notes.labels" . | nindent 4 }}
  annotations:
    # Capacidad del backend para el corte/rollback; no certifica el ciphertext.
    sytue.eu/notes-write-version: "2"
spec:
  # Un servidor anterior no debe escribir mientras el nuevo migra contenido E2E.
  # Recreate espera a que terminen todos los pods antiguos antes de arrancar los nuevos.
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sytue-notes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sytue-notes.labels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: notes
    spec:
      automountServiceAccountToken: false
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: notes
          image: "{{ include "sytue-notes.imageRegistry" . }}/{{ .Values.image.repository }}:{{ ((.Values.global).image | default dict).tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if (.Values.global).otlp }}
            {{- if (.Values.global).otlp.endpoint }}
            # Telemetria: metricas OTLP directas a Cockpit, sin agente intermedio.
            # Sale del umbrella y no de este chart para que los catorce escriban al
            # MISMO sitio; si cada uno apuntara al suyo, no habria con que comparar.
            # Vacio => no se exporta y el servicio sigue sirviendo igual.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ (.Values.global).otlp.endpoint | quote }}
            {{- end }}
            {{- if (.Values.global).otlp.tokenSecret }}
            # Por Secret y nunca por values: aunque el token solo permita escribir,
            # con el se puede envenenar la serie que decide un escalado.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ (.Values.global).otlp.tokenSecret }}
                  key: {{ (.Values.global).otlp.tokenKey | default "otlp-headers" }}
                  optional: true
            {{- end }}
            {{- end }}
            # Runtime Go atado a los limites del pod (helper sytue.goRuntimeEnv del umbrella):
            # GOMAXPROCS=techo(limits.cpu) via downward API; GOMEMLIMIT=~85% de limits.memory.
            {{- include "sytue.goRuntimeEnv" (dict "container" "notes" "memLimit" .Values.resources.limits.memory) | nindent 12 }}
            {{- include "sytue.logCollectorEnv" . | nindent 12 }}
            - name: ENV
              value: {{ include "sytue-notes.env" . | quote }}
            - name: HTTP_ADDR
              value: ":{{ .Values.service.targetPort }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PUBLIC_URL
              value: "https://{{ include "sytue-notes.host" . }}"
            # Avisos al centro de notificaciones: «te piden editar un cuaderno»
            # (peticiones.go). Mismo patrón que calendar.
            - name: HUB_BASE_URL
              value: {{ .Values.config.hubUrl | default (printf "http://%s-hub" .Release.Name) | quote }}
            - name: HUB_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: sytue-hub-internal
                  key: secret
            # «X pide editar» también por correo, desde la cuenta común de avisos
            # (avisos@<dominio>): `config.smtp` y el helper común. El correo de quien
            # concede sale de Sytue ID con la sesión de quien pide.
            - name: ID_BASE_URL
              value: {{ .Values.config.idUrl | default (printf "http://%s-id" .Release.Name) | quote }}
            {{- include "sytue.correoEnv" (dict "root" . "prefijo" "") | nindent 12 }}
            # ----- Sytue ID (OIDC; validacion JWT via JWKS) -----
            - name: OIDC_ISSUER
              value: {{ include "sytue-notes.oidcIssuer" . | quote }}
            - name: OIDC_JWKS_URL
              value: {{ include "sytue.oidcJwksUrl" . | quote }}
            # `OIDC_CLIENT_ID`/`OIDC_CLIENT_SECRET` vivieron aqui sin que ningun
            # binario Go los leyera: este servicio valida el JWT por JWKS y no hace
            # ningun flujo de codigo. Quien usa credenciales de cliente es el BFF, y
            # las suyas se llaman SYTUE_OIDC_CLIENT_SECRET. Montaban un secreto real
            # en un pod que no lo usa, y ademas tapaban el gate de prefijos.
            # ----- Postgres EXTERNO (Scaleway RDB; unica fuente de verdad) -----
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.dsnKey }}
            # Pool pgx POR replica (bajo en prod: PgBouncer multiplexa hacia la RDB).
            - name: DB_MAX_CONNS
              value: {{ .Values.config.dbMaxConns | quote }}
            # DSN DIRECTO a la RDB (bypass del pooler) para estado de sesion:
            # LISTEN/NOTIFY y advisory locks de migraciones (platform/pkg/pg).
            # Opcional: sin PgBouncer (staging/dev) no existe y se usa DATABASE_URL.
            - name: DATABASE_DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.dsnDirectKey }}
                  optional: true
            # Auto-purga de papelera. El worker corre en TODAS las replicas: el
            # DELETE es idempotente —cada fila caducada se borra una vez y la
            # siguiente no la encuentra— asi que no hace falta coordinarlas.
            - name: TRASH_RETENTION
              value: {{ .Values.config.trashRetention | quote }}
            - name: TRASH_GC_INTERVAL
              value: {{ .Values.config.trashGcInterval | quote }}

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "sytue-notes.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
