{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sytue-pgbouncer.fullname" . }}
  labels:
    {{- include "sytue-pgbouncer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sytue-pgbouncer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Solo los servicios de la suite (el egress servicio->pgbouncer lo permite
    # la NetworkPolicy baseline del umbrella: trafico intra-suite entre pods
    # con app.kubernetes.io/part-of=sytue-one).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sytue-one
      ports:
        - protocol: TCP
          port: {{ .Values.listenPort }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL EXTERNO (Scaleway RDB, endpoint privado UE).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
