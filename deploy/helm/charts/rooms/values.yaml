# sytue-rooms — defaults del subchart (servicio Go). global.* lo inyecta el umbrella.
# Estado en PostgreSQL (RDB Scaleway, UE). Sin Redis/Valkey ni motores AGPL.
enabled: true
subdomain: rooms
component: rooms
replicaCount: 2

image:
  registry: ""                 # cae a global.imageRegistry (Scaleway Registry, UE)
  repository: sytue-rooms
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8085             # puerto del SPEC (mensajería y videollamada)

ingress:
  enabled: true
  className: traefik
  annotations: {}
  # rooms.sytue.eu: el SPA Astro (sytue-frontend) sirve "/"; el backend Go expone API
  # REST y el WebSocket de tiempo real bajo prefijos.
  paths:
    # `/api/v1` y NO `/api`: el BFF de la app Astro sirve sus propias rutas
    # bajo /api/<recurso>, y un Prefix en /api se las quedaba TODAS y se las
    # mandaba al servicio Go, que solo expone /api/v1 y /api/bot. El navegador
    # recibía 404 en cada carga y la app decía «no se pudieron cargar los datos».
    - path: /api/v1
      pathType: Prefix
    # El webhook de bots va aparte porque NO cuelga de /api/v1.
    - path: /api/bot
      pathType: Prefix
    - path: /ws
      pathType: Prefix
    # Webhooks ENTRANTES (server.go: /hooks/{token} y los forzados slack/teams).
    # No llevan JWT a propósito: el token opaco de la ruta ES la autorización, con
    # rate-limit por token+IP. La URL se le enseña al admin al crear el webhook
    # (integrations.go), así que sin esta regla Slack/Teams POSTean contra el SPA
    # y la capa de compatibilidad de Rooms queda muerta en producción.
    - path: /hooks
      pathType: Prefix
    # Avisos del SFU (server.go: /webhooks/livekit). Hacen falta AQUÍ en cuanto
    # LiveKit vive fuera del clúster —como en deploy/rooms-sfu/—: entonces sus
    # POST entran por el ingress y no por el Service interno, y sin esta regla
    # caen en el SPA. Comprobado el 2026-09-06 contra el piloto: 404 en
    # `participant_connection_aborted` y en `room_finished`, o sea que las salas
    # no se cerraban nunca y el canal no publicaba «la reunión ha terminado».
    #
    # Con el SFU dentro del clúster la regla sobra pero no estorba: la ruta exige
    # la firma de LiveKit —`signer.ParseWebhook` valida el JWT del Authorization
    # contra el api_secret y compara el hash del cuerpo— y sin ella responde 401.
    - path: /webhooks
      pathType: Prefix
  tls:
    secretName: tls-rooms-sytue-eu

# Right-sized al footprint MEDIDO (Go ~6-40MiB RSS idle): requests modestos para
# densidad/coste; limits con cabecera para picos (estado WS/fan-out; burstable).
# Requests MEDIDOS en producción (kubectl top, 2026-08-09), no estimados: en
# Kubernetes la factura la fija lo RESERVADO, no lo usado, y estos pods pedían
# 25-75 veces su consumo real. Esa reserva inflada obligó a un tercer nodo cuando
# la CPU real del clúster estaba al 3 %.
#
# El límite NO se toca: un pico sigue pudiendo usar toda la CPU que necesite. Y
# bajar el request hace al HPA MÁS sensible —calcula el porcentaje sobre el
# request—, que es justo lo que hace falta para escalar por demanda real.
resources:
  requests:
    cpu: 15m
    memory: 96Mi
  limits:
    cpu: "2"
    memory: 256Mi

autoscaling:
  # Etiqueta `job` de la serie de metricas, para el HPA por demanda real.
  # Es el ServiceName del BINARIO, que no siempre coincide con el nombre del
  # chart ni con el del directorio; por eso se escribe y no se deduce.
  metricJob: sytue-rooms
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  # Sin memoria: en Go la RSS queda alta tras el GC (mala señal de escalado) y
  # GOMEMLIMIT (~85% de limits.memory) ya la acota -> se escala solo por CPU.

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

config:
  matrix:
    enabled: false
    required: true
    internalURL: http://sytue-matrix:8008
    homeserverURL: ""
    serverName: ""
    ssoProviderID: oidc-sytue
    sourceURL: https://github.com/element-hq/synapse/tree/v1.163.0
    existingSecret: sytue-matrix
  # Tamano del pool pgx por replica (DB_MAX_CONNS). Prod lo baja (3-5):
  # PgBouncer multiplexa hacia la RDB (ver values-prod.yaml del umbrella).
  dbMaxConns: 10
  logLevel: info
  # OAuth account gateway; empty URL follows the release service name.
  integrationsUrl: ""
  integrationsSecret: sytue-integrations

  # --- Videollamada (la otra mitad de Rooms) --------------------------------
  # livekitUrl: URL pública WS de señalización que recibe el cliente. Vacío => wss://
  # del propio host de Rooms.
  livekitUrl: ""
  # livekitApiHost: endpoint interno del SFU para la API server-to-server. Vacío =>
  # se deriva del release: http://<release>-livekit:7880.
  livekitApiHost: ""

  # Grabación de reuniones. VACÍO = apagada, y es el valor por defecto a propósito:
  # grabar exige un bucket, un egress desplegado y un store de routing entre los
  # dos. Con el bucket puesto y el egress sin desplegar, el botón de grabar falla
  # DESPUÉS de avisar a la sala de que se está grabando.
  recordingBucket: ""
  # Plantilla del compositor: "grid" (mosaico) o "speaker" (quien habla, grande).
  recordingLayout: "grid"

  # Correo a canal: el dominio de `<canal>+<token>@<dominio>`. DEBE ser el
  # `channelMailDomain` del chart de Mail, que es quien recibe esos correos y los
  # publica en el canal; aqui solo se PUBLICA, con el secreto de cada webhook
  # entrante, para que la web y las apps nativas ensenen la direccion. Vacio =
  # apagado: no se ofrece ninguna direccion (una que rebota es peor).
  channelMailDomain: ""

# Object Storage donde el egress deja las grabaciones. Vacío => hereda el global
# de la suite (secret `sytue-object-storage`).
objectStorage: {}

# Postgres EXTERNO (Scaleway RDB). DSN por secret (nunca en git).
postgresql:
  existingSecret: sytue-rooms-db
  dsnKey: dsn
  # DSN directo a la RDB (bypass PgBouncer) para LISTEN/migraciones; opcional.
  dsnDirectKey: dsn-direct

# Secretos de la app (OIDC client secret y especificos del servicio).
existingSecret: sytue-rooms

# Web Push (VAPID). Las CLAVES viven en el Secret `existingSecret`
# (`vapid-public`/`vapid-private`), materializadas por 02b-secretos.sh desde
# Scaleway Secret Manager: aqui solo va el contacto, que no es secreto.
webPush:
  # `sub` del JWT VAPID: buzon real al que los servicios de push escriben si
  # nuestras notificaciones dan problemas.
  subject: mailto:tls@sytue.eu

# PodDisruptionBudget: garantiza disponibilidad durante drains/upgrades del cluster.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1   # alternativa a minAvailable (usar uno u otro)

# Reparto anti-afinidad suave por zona y nodo (alta disponibilidad multi-AZ, UE).
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
