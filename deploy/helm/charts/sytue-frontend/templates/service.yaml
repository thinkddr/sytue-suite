{{- $root := . -}}
{{- range $app, $cfg := .Values.apps }}
{{- if $cfg.enabled }}
{{- $d := $root.Values.defaults }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sytue-frontend.appFullname" (dict "ctx" $root "app" $app) }}
  labels:
    {{- include "sytue-frontend.appLabels" (dict "ctx" $root "app" $app) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "sytue-frontend.appSelectorLabels" (dict "ctx" $root "app" $app) | nindent 4 }}
{{- end }}
{{- end }}
