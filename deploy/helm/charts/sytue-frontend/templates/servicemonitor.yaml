{{- /* El ServiceMonitor exige el CRD monitoring.coreos.com/v1: sin el Prometheus
     Operator, aplicarlo hace fallar el despliegue ENTERO. `global.metrics.serviceMonitor.enabled:
     false` los apaga todos de una vez; un `values` no puede olvidarse de un servicio.
     Se compara con false a propósito: sin global definido, la clave vale nil y manda la local. */}}
{{- if and .Values.serviceMonitor.enabled (ne ((((.Values.global).metrics) | default dict).serviceMonitor | default dict).enabled false) }}
{{- $root := . -}}
{{- range $app, $cfg := .Values.apps }}
{{- if $cfg.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sytue-frontend.appFullname" (dict "ctx" $root "app" $app) }}
  labels:
    {{- include "sytue-frontend.appLabels" (dict "ctx" $root "app" $app) | nindent 4 }}
    {{- with (($root.Values.global).metrics | default dict).serviceMonitor }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "sytue-frontend.appSelectorLabels" (dict "ctx" $root "app" $app) | nindent 6 }}
  endpoints:
    - port: http
      path: {{ $root.Values.serviceMonitor.path }}
      interval: {{ $root.Values.serviceMonitor.interval }}
{{- end }}
{{- end }}
{{- end }}
