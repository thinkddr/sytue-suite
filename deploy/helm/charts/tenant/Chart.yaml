apiVersion: v2
name: sytue-tenant
description: >-
  Plantilla de onboarding de tenant (organizacion) Sytue One. Crea el namespace
  tenant-<slug> con ResourceQuota, LimitRange y NetworkPolicy de aislamiento.
  Se instala una vez por tenant (helm install tenant-<slug> ./charts/tenant ...).
  Mapea con el grupo org/<slug> de Sytue ID y los datos por tenant (esquema/RLS en
  PostgreSQL + prefijos S3); ver CONVENTIONS.md (v4) §9. Código Apache-2.0, (c) 2026 Daniel Delgado Ramos.
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.31.0-0"
home: https://sytue.eu
keywords: [sytue, tenant, multi-tenant, namespace, quota]
maintainers:
  - name: Sytue Platform
    email: platform@sytue.eu
annotations:
  licenses: MIT
  sytue.eu/stack: go
