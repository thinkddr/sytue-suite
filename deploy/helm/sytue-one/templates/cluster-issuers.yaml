{{- /*
ClusterIssuers de cert-manager para TLS automático (Let's Encrypt).
- Staging: usa el endpoint de pruebas de ACME (certificados no confiables) para no
  agotar el rate-limit de producción.
- Prod: endpoint de producción de ACME.
Reto HTTP-01 vía el ingress canónico Traefik (global.ingress.className).
cert-manager se instala como release cluster-wide independiente antes del
umbrella. Los issuers se crean si global.tls.createIssuers=true.
*/ -}}
{{- if .Values.global.tls.createIssuers }}
{{- range $name, $cfg := .Values.global.tls.issuers }}
{{- if $cfg.enabled }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
  labels:
    {{- include "sytue-one.labels" (dict "context" $ "component" "cert-manager") | nindent 4 }}
spec:
  acme:
    server: {{ $cfg.server | quote }}
    email: {{ $.Values.global.tls.email | required "global.tls.email es obligatorio para ACME" | quote }}
    privateKeySecretRef:
      name: {{ printf "%s-account-key" $name }}
    solvers:
      {{- $dns01 := $.Values.global.tls.dns01 | default dict }}
      {{- if $dns01.enabled }}
      # DNS-01 SOLO para los comodines, y por eso lleva `selector.dnsNames`: sin
      # él, cert-manager elegiría este solver también para los hostnames
      # normales, que hoy se resuelven bien por HTTP-01 y no necesitan una
      # credencial con escritura en DNS. Un solver de más aquí amplía el radio de
      # daño de esa clave sin ganar nada.
      #
      # El webhook de Scaleway NO viene con cert-manager: hay que desplegarlo
      # aparte. Si esto se enciende sin él, las peticiones de certificado se
      # quedan pendientes para siempre —no fallan— y el síntoma aparece cuando
      # caduca el certificado viejo.
      - selector:
          dnsNames:
            {{- range $dns01.comodines }}
            - {{ . | quote }}
            {{- end }}
        dns01:
          webhook:
            groupName: acme.scaleway.com
            solverName: scaleway
            # LAS DOS MITADES DE LA CREDENCIAL, y con los nombres que el webhook
            # entiende. Aquí ponía un solo `secretKeyRef`, que no es un campo del
            # solver de Scaleway: el webhook no recibía nada y fallaba con
            # «scaleway-sdk-go: access key cannot be empty». Un SDK de Scaleway
            # necesita access key Y secret key; con una sola no arranca.
            #
            # El síntoma no es un error: el Challenge no llega a publicar el TXT,
            # el Order se queda `pending` PARA SIEMPRE y el certificado nunca se
            # emite. El comodín de `*.sytue.eu` estuvo así, y con él el host de
            # cada organización.
            #
            # El namespace donde se buscan estos Secret NO es este: para un
            # ClusterIssuer, cert-manager resuelve los secretos en su
            # `--cluster-resource-namespace` (aquí `cert-manager`, porque el
            # despliegue usa `$(POD_NAMESPACE)`). De ahí que `02b-secretos.sh` lo
            # materialice allí y que el webhook tenga un Role para leerlo allí.
            config:
              accessKeySecretRef:
                name: {{ $dns01.secretName | quote }}
                key: access-key
              secretKeySecretRef:
                name: {{ $dns01.secretName | quote }}
                key: secret-key
      {{- end }}
      - http01:
          ingress:
            class: {{ $.Values.global.ingress.className | quote }}
            # acmesolver también vive en el registry privado; el Secret se
            # materializa en el namespace del Ingress antes de crear el Issuer.
            podTemplate:
              spec:
                imagePullSecrets:
                  - name: sytue-registry
{{- end }}
{{- end }}
{{- end }}
