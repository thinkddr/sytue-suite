{{- /*
Los secretos de las puertas internas entre servicios (`secretosInternos` en values:
nombre del Secret → clave). Cada uno lo comparten los dos extremos de una llamada
interna —p. ej. sytue-hub-internal: el Hub y todos los que avisan; sytue-contacts-
internal: Sytue ID y Contacts (/internal/avatar-sync)—. Se generan AQUÍ, en el
clúster, la primera vez, y en cada `helm upgrade` se conserva el que ya hay
(`lookup`): cambiarlo en caliente dejaría a los pods viejos del rollout sin poder
llamar. Nunca pasan por git, ni por los values, ni por argv. `resource-policy: keep`
para que desinstalar la release no se los lleve.

Solo van aquí los que nadie más crea: un Secret que ya aplica un script
(02b-secretos.sh, deploy.sh) choca con Helm por la propiedad del objeto.

Hasta el 2026-09-25 sytue-hub-internal no existía y todos caían al secreto de
desarrollo del código; sytue-contacts-internal tampoco, y como es `optional`, la
foto de Sytue ID no llegaba a Contactos sin error en ningún sitio.
*/ -}}
{{- range $nombre, $clave := .Values.secretosInternos }}
{{- $previo := lookup "v1" "Secret" $.Release.Namespace $nombre }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nombre }}
  labels:
    app.kubernetes.io/part-of: sytue-one
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $previo $previo.data (index $previo.data $clave) }}
  {{ $clave }}: {{ index $previo.data $clave }}
  {{- else }}
  {{ $clave }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
