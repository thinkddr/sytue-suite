# sprintf-js 1.1.3 llega al árbol fijado de Renovate (tools/renovate/bun.lock, #540) por
# global-agent → roarr, el registro de su proxy, que solo se activa con GLOBAL_AGENT_* y
# dependencias.yml no lo define. Sin versión corregida; decisión del dueño (15/10/2026):
# fusionar CI-02 con esta excepción y que vuelva a avisar a los 60 días.
[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
ignoreUntil = 2026-12-14
reason = "sprintf-js solo lo usa el registro del proxy de Renovate (global-agent/roarr), inactivo sin GLOBAL_AGENT_*; sin versión corregida"
