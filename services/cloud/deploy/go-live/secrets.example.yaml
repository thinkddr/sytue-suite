# secrets.example.yaml — PLANTILLA DE NOMBRES de los secretos de go-live de Sytue
# Cloud. Solo NOMBRES: los valores son placeholders <...>, NUNCA valores reales.
#
# ┌─ NO APLICAR ESTE FICHERO ──────────────────────────────────────────────────┐
# │ Esto NO es un manifiesto de Kubernetes aplicable. Los secretos van a         │
# │ Scaleway Secret Manager (infra/terraform/modules/secrets) y se inyectan en   │
# │ Kapsule vía Sealed Secrets, materializándose como los `existingSecret` que    │
# │ referencian los charts. NUNCA a git (CONVENTIONS §10). Este fichero solo      │
# │ documenta QUÉ Secret y QUÉ clave rellena cada valor.                          │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# Fuente de verdad de las claves de entorno: services/cloud/internal/config/config.go
# (una sola Config para los tres binarios). Las data-keys de cada Secret salen de los
# secretKeyRef de deploy/helm/charts/cloud-{api,builder,controller}/templates/deployment.yaml
# y de internal/controller/kubeprovisioner.go (sytue-platform-s3) / internal/builder (sytue-registry).

# ── Secret: sytue-cloud-controller ────────────────────────────────────────────
# existingSecret del chart cloud-controller. El controller es el ÚNICO con client-go.
# database-url, secret-enc-key, s3-access-key y s3-secret-key son OBLIGATORIOS
# (config.Load los exige con l.Require); registry-* son opcionales.
sytue-cloud-controller:
  database-url: "postgres://<user>:<pass>@<host>:5432/<db>?sslmode=require"  # -> DATABASE_URL (DSN Scaleway RDB)
  secret-enc-key: "<base64-32-bytes>"        # -> SECRET_ENC_KEY (AES-256-GCM; `openssl rand -base64 32`)
  s3-access-key: "<scw-access-key>"          # -> S3_ACCESS_KEY (Object Storage UE)
  s3-secret-key: "<scw-secret-key>"          # -> S3_SECRET_KEY
  registry-username: "<opcional>"            # -> REGISTRY_USERNAME (opcional; deploy desde registry privado)
  registry-password: "<opcional>"            # -> REGISTRY_PASSWORD (opcional)
  scw-secret-key: "<opcional>"               # -> SCW_SECRET_KEY (IAM: acuña creds S3 por-tenant; fail-closed si falta)
  s3-backup-access-key: "<opcional>"         # -> S3_BACKUP_ACCESS_KEY (key IAM acotada a arn:aws:s3:::<bucket>/backups/*)
  s3-backup-secret-key: "<opcional>"         # -> S3_BACKUP_SECRET_KEY

# ── Secret: sytue-cloud-builder ───────────────────────────────────────────────
# existingSecret del chart cloud-builder (orquesta los Jobs Kaniko/CNB). Las 4
# primeras son OBLIGATORIAS (config.Load l.Require); el resto opcionales.
sytue-cloud-builder:
  database-url: "postgres://<user>:<pass>@<host>:5432/<db>?sslmode=require"  # -> DATABASE_URL
  secret-enc-key: "<base64-32-bytes>"        # -> SECRET_ENC_KEY
  s3-access-key: "<scw-access-key>"          # -> S3_ACCESS_KEY (cache de capas + logs de build)
  s3-secret-key: "<scw-secret-key>"          # -> S3_SECRET_KEY
  registry-username: "<opcional>"            # -> REGISTRY_USERNAME (push al Registry privado)
  registry-password: "<scw-registry-secret>" # -> REGISTRY_PASSWORD
  github-app-id: "<opcional>"                # -> GITHUB_APP_ID (clone de repos privados en build)
  github-app-private-key: "<opcional pem>"   # -> GITHUB_APP_PRIVATE_KEY

# ── Secret: sytue-cloud-api ───────────────────────────────────────────────────
# existingSecret del chart cloud-api. Las 4 primeras son OBLIGATORIAS
# (config.Load l.Require: sin ellas cloud-api ABORTA al arrancar); el resto son
# feature-env opcionales (secretKeyRef optional:true ⇒ ausente => feature gated-off).
sytue-cloud-api:
  database-url: "postgres://<user>:<pass>@<host>:5432/<db>?sslmode=require"  # -> DATABASE_URL (BD del control-plane)
  secret-enc-key: "<base64-32-bytes>"        # -> SECRET_ENC_KEY (AES-256-GCM)
  s3-access-key: "<scw-access-key>"          # -> S3_ACCESS_KEY (lectura de logs de build)
  s3-secret-key: "<scw-secret-key>"          # -> S3_SECRET_KEY
  github-app-id: "<opcional>"                # -> GITHUB_APP_ID
  github-app-private-key: "<opcional pem>"   # -> GITHUB_APP_PRIVATE_KEY (RS256)
  github-app-client-id: "<opcional Iv1....>" # -> GITHUB_APP_CLIENT_ID
  github-app-client-secret: "<opcional>"     # -> GITHUB_APP_CLIENT_SECRET
  webhook-secret: "<opcional hmac>"          # -> WEBHOOK_SECRET (HMAC de /webhooks/git)
  registry-username: "<opcional>"            # -> REGISTRY_USERNAME
  registry-password: "<opcional>"            # -> REGISTRY_PASSWORD

# ── Secret: sytue-platform-s3 ─────────────────────────────────────────────────
# NO lo crea ops a mano: lo MATERIALIZA el controller en cada namespace de tenant
# (kubeprovisioner.go: upsertPlatformS3Secret), leyendo S3_BACKUP_* si existen o
# cayendo a S3_* de plataforma. Se monta SOLO en el pod del CronJob de backup.
# Lo que ops controla es acuñar la key acotada a backups/* y fijar S3_BACKUP_* en
# el Secret sytue-cloud-controller (endurecimiento §4c del runbook):
sytue-platform-s3:            # (informativo: generado por el controller, claves resultantes)
  S3_ENDPOINT: "https://s3.fr-par.scw.cloud"  # <- s3EndpointURL(cfg)
  S3_ACCESS_KEY: "<= S3_BACKUP_ACCESS_KEY | S3_ACCESS_KEY>"
  S3_SECRET_KEY: "<= S3_BACKUP_SECRET_KEY | S3_SECRET_KEY>"
  S3_BUCKET: "sytue-paas-build-cache"
# Claves acotadas OPCIONALES que ops fija en el Secret del CONTROLLER (no aquí):
#   S3_BACKUP_ACCESS_KEY / S3_BACKUP_SECRET_KEY  (key IAM Scaleway limitada a arn:aws:s3:::<bucket>/backups/*)

# ── Secret: sytue-registry ────────────────────────────────────────────────────
# imagePullSecret / docker config que montan los Jobs Kaniko y CNB
# (internal/builder: RegistrySecret="sytue-registry", clave .dockerconfigjson →
# config.json). Tipo kubernetes.io/dockerconfigjson. Vive en el namespace de builds
# (BUILD_NAMESPACE=sytue-paas-builds). Se crea, p. ej.:
#   kubectl -n sytue-paas-builds create secret docker-registry sytue-registry \
#     --docker-server=rg.fr-par.scw.cloud --docker-username=nologin \
#     --docker-password='<scw-registry-secret>'
sytue-registry:
  .dockerconfigjson: "<base64 docker config.json con auth de rg.fr-par.scw.cloud>"
