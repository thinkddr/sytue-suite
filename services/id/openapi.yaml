openapi: 3.1.0
info:
  title: Sytue ID
  version: 0.1.0
  description: >
    Proveedor de identidad nuclear de Sytue One: OIDC/OAuth2 (Authorization Code
    + PKCE, refresh_token, client_credentials), JWKS y discovery, userinfo,
    gestión de usuarios/organizaciones/roles, SCIM 2.0 y MFA/WebAuthn.

    AVISO DE SEGURIDAD: la autenticación de Sytue ID requiere una auditoría de
    seguridad independiente ANTES de producción (docs/CONVENTIONS.md §0.7, §8, §10).
  license:
    name: MIT
servers:
  - url: https://id.sytue.eu
    description: Producción (Scaleway, solo UE)
  - url: https://id.sytue.localhost
    description: Desarrollo (Traefik + mkcert)
  - url: http://localhost:8081
    description: Desarrollo directo

tags:
  - name: OIDC
  - name: OAuth2
  - name: SCIM
  - name: Identity
  - name: WebAuthn

paths:
  /.well-known/openid-configuration:
    get:
      tags: [OIDC]
      summary: Documento de discovery del proveedor (OIDC Discovery 1.0)
      responses:
        "200":
          description: Metadatos del proveedor
          content:
            application/json:
              schema:
                type: object

  /.well-known/jwks.json:
    get:
      tags: [OIDC]
      summary: Conjunto de claves públicas de firma (JWKS, RFC 7517)
      responses:
        "200":
          description: JWKS
          content:
            application/json:
              schema: { type: object }

  /oauth2/authorize:
    get:
      tags: [OAuth2]
      summary: Authorization endpoint (Authorization Code + PKCE)
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: nonce, in: query, required: false, schema: { type: string } }
        - { name: code_challenge, in: query, required: false, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: false, schema: { type: string, enum: [S256, plain] } }
      responses:
        "302":
          description: Redirección con code+state, o a /login si no hay sesión

  /oauth2/token:
    post:
      tags: [OAuth2]
      summary: Token endpoint (authorization_code | refresh_token | client_credentials | token-exchange)
      description: >-
        El grant `urn:ietf:params:oauth:grant-type:token-exchange` (RFC 8693)
        canjea el access token del propio client por otro que actúa EN NOMBRE de
        un usuario de su organización (`sub` del usuario, `act.sub` del client),
        con TTL de minutos, sin refresh token y con los scopes recortados a la
        intersección de lo pedido, lo concedido al client y lo que el usuario
        tendría. Solo lo pueden usar los clients marcados como delegables por el
        operador de plataforma (mig 0025); el resto reciben `unauthorized_client`.
        Cada canje queda en el log de auditoría (`oauth.token.exchange`).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    [
                      authorization_code,
                      refresh_token,
                      client_credentials,
                      "urn:ietf:params:oauth:grant-type:token-exchange",
                    ]
                code: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string }
                refresh_token: { type: string }
                scope: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
                subject_token:
                  { type: string, description: "token-exchange: access token del propio client" }
                subject_token_type:
                  type: string
                  enum:
                    [
                      "urn:ietf:params:oauth:token-type:access_token",
                      "urn:ietf:params:oauth:token-type:jwt",
                    ]
                requested_token_type:
                  type: string
                  enum:
                    [
                      "urn:ietf:params:oauth:token-type:access_token",
                      "urn:ietf:params:oauth:token-type:jwt",
                    ]
                requested_subject:
                  { type: string, description: "token-exchange: email o uuid del usuario a representar" }
                audience:
                  { type: string, description: "token-exchange: client destinatario del token" }
      responses:
        "200":
          description: Tokens emitidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string }
                  expires_in: { type: integer }
                  refresh_token: { type: string }
                  id_token: { type: string }
                  scope: { type: string }
                  issued_token_type:
                    { type: string, description: "solo en token-exchange (RFC 8693 §2.2.1)" }
        "400":
          description: >-
            Error OAuth2 (invalid_grant, invalid_request, invalid_scope,
            unauthorized_client; en token-exchange también invalid_target cuando
            el sujeto o la audiencia pedidos no son admisibles)
        "401":
          description: invalid_client

  /oauth2/userinfo:
    get:
      tags: [OIDC]
      summary: UserInfo endpoint (OIDC Core §5.3)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Claims del usuario }
        "401": { description: Token inválido }

  /oauth2/revoke:
    post:
      tags: [OAuth2]
      summary: Revocación de tokens (RFC 7009)
      responses:
        "200": { description: Procesado (respuesta uniforme) }

  /oauth2/logout:
    get:
      tags: [OIDC]
      summary: RP-Initiated Logout (end_session)
      parameters:
        - { name: client_id, in: query, schema: { type: string } }
        - { name: post_logout_redirect_uri, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirección al destino registrado }
        "200": { description: Sesión cerrada }

  /login/webauthn/begin:
    post:
      tags: [Auth]
      summary: Inicia el login por passkey (WebAuthn assertion) — emite un reto
      description: >-
        Público (aún no hay sesión), rate-limitado como el login. Responde siempre
        200 con un reto; allowCredentials es una pista para el flujo usuario-primero.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { email: { type: string, description: 'Opcional (usuario-primero); vacío ⇒ discoverable' } }
      responses:
        "200":
          description: PublicKeyCredentialRequestOptions (challenge, rpId, allowCredentials, ...)
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge: { type: string }
                  rpId: { type: string }
                  allowCredentials: { type: array, items: { type: object } }
                  timeout: { type: integer }
                  userVerification: { type: string }

  /login/webauthn/finish:
    post:
      tags: [Auth]
      summary: Completa el login por passkey — verifica la assertion y abre sesión
      description: >-
        Verifica firma, reto (un solo uso), origen/RP-ID y signCount (anti-clonación).
        Al superarlo fija la cookie de sesión SSO (amr=webauthn[,mfa]).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                rawId: { type: string }
                type: { type: string }
                response:
                  type: object
                  properties:
                    authenticatorData: { type: string }
                    clientDataJSON: { type: string }
                    signature: { type: string }
                    userHandle: { type: string }
                return_to: { type: string }
      responses:
        "200":
          description: Sesión creada; cookie SSO fijada
          content:
            application/json:
              schema: { type: object, properties: { redirect: { type: string } } }
        "401": { description: Passkey no verificada (mensaje genérico) }

  /forgot-password:
    get:
      tags: [Auth]
      summary: Formulario de solicitud de reseteo (HTML)
      responses: { "200": { description: 'Formulario o aviso uniforme (?sent=1)' } }
    post:
      tags: [Auth]
      summary: Solicita el enlace de reseteo — respuesta UNIFORME (no enumera)
      description: >-
        Rate-limitado. Responde siempre 303 a ?sent=1 exista o no la cuenta; el token
        firmado (HMAC), de un solo uso y caduco se envía por email en segundo plano.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { email: { type: string } } }
      responses:
        "303": { description: 'Redirección uniforme a /forgot-password?sent=1' }

  /reset-password:
    get:
      tags: [Auth]
      summary: Formulario de nueva contraseña (valida la firma del token)
      parameters: [{ name: token, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: Formulario de nueva contraseña }
        "400": { description: Enlace inválido, manipulado o caducado }
    post:
      tags: [Auth]
      summary: Fija la nueva contraseña — consume el token y revoca las sesiones
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, new_password, confirm_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8 }
                confirm_password: { type: string, minLength: 8 }
      responses:
        "200": { description: Contraseña actualizada; sesiones revocadas }
        "400": { description: Token inválido, caducado o ya usado }
        "422": { description: Contraseña débil o no coincide }

  /scim/v2/Users:
    get:
      tags: [SCIM]
      summary: Listar usuarios (SCIM 2.0)
      security: [{ scimBearer: [] }]
      parameters:
        - { name: filter, in: query, schema: { type: string }, description: 'userName eq "x"' }
        - { name: startIndex, in: query, schema: { type: integer } }
        - { name: count, in: query, schema: { type: integer } }
      responses:
        "200": { description: ListResponse }
    post:
      tags: [SCIM]
      summary: Crear usuario (provisioning)
      security: [{ scimBearer: [] }]
      responses:
        "201": { description: Usuario creado }
        "409": { description: Ya existe }

  /scim/v2/Users/{id}:
    get:
      tags: [SCIM]
      security: [{ scimBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Usuario }, "404": { description: No existe } }
    put:
      tags: [SCIM]
      security: [{ scimBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Reemplazado } }
    patch:
      tags: [SCIM]
      security: [{ scimBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Modificado } }
    delete:
      tags: [SCIM]
      security: [{ scimBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Eliminado (lógico) } }

  /api/v1/me:
    get:
      tags: [Identity]
      summary: Perfil del usuario autenticado
      description: >
        Incluye `password_policy` ({ min_length, require_complexity }), solo lectura: la
        política efectiva que se exigirá al cambiar la contraseña (la más estricta de las
        organizaciones de la persona, con el suelo de 8 ya aplicado). Se omite si no se
        puede calcular.
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Perfil + membresías + política de contraseña efectiva } }

  /api/v1/me/sessions:
    get:
      tags: [Identity]
      summary: Sesiones SSO activas del usuario (dispositivos), la actual marcada
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Lista de sesiones (id, ip, user_agent, amr, auth_time, expires_at, current) } }

  /api/v1/me/password:
    post:
      tags: [Identity]
      summary: Cambiar la propia contraseña (self-service)
      description: >
        Verifica la contraseña actual (Argon2id, tiempo constante), aplica la
        política mínima (>= 8 caracteres, distinta de la actual) y revoca TODAS las
        sesiones y refresh tokens del usuario para invalidar credenciales robadas.
        Rate-limitado. La contraseña nunca se registra.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200": { description: "Contraseña cambiada ({ sessions_revoked })" }
        "400": { description: La nueva contraseña no cumple la política }
        "401": { description: La contraseña actual no es correcta }

  /api/v1/me/recovery-email:
    put:
      tags: [Identity]
      summary: Poner, cambiar o retirar el correo de recuperación
      description: >
        Pide la contraseña actual. Con `email`, manda un enlace de confirmación a
        esa dirección y no la fija hasta que se confirma (202). Con `email` vacío,
        retira el actual (200). No vale una dirección del dominio de la suite ni
        el propio correo de acceso. El correo de recuperación es también un
        identificador de acceso y recibe el enlace de «olvidé mi contraseña».
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: "Retirado ({ recovery_email: \"\" })" }
        "202": { description: "Enlace enviado ({ pending })" }
        "400": { description: Dirección no válida o de Sytue }
        "401": { description: La contraseña actual no es correcta }

  /api/v1/me/username:
    put:
      tags: [Identity]
      summary: Cambiar el @usuario
      description: >
        Pide la contraseña actual. El @usuario anterior queda reservado 30 días para
        quien lo dejó (nadie más puede elegirlo ni recibirlo asignado) y no se puede
        volver a cambiar dentro de ese plazo. En una cuenta personal el @usuario es su
        dirección de Sytue y no se cambia desde aquí (`username_is_address`). Los
        errores llevan su código (`username_invalid`, `username_taken`,
        `username_recent`, `username_is_address`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, description: "Con o sin la arroba delante." }
                password: { type: string }
      responses:
        "200": { description: "{ username }" }
        "400": { description: "@usuario no válido" }
        "401": { description: La contraseña actual no es correcta }
        "409": { description: "Ocupado, reservado o es su dirección" }
        "429": { description: "Ya se cambió en los últimos 30 días" }

  /api/v1/me/phone:
    put:
      tags: [Identity]
      summary: Cambiar o añadir el móvil (manda el código por SMS)
      description: >
        Pide la contraseña actual y manda un código de seis dígitos por SMS al móvil
        nuevo (E.164; se admiten espacios y el prefijo 00). No lo fija: eso es
        `POST /api/v1/me/phone/verify`. Diez minutos, cinco intentos, otro código
        tras un minuto (`code_wait`), y los mismos límites que el alta por número, por
        IP y global por hora (`sms_limit`). Que el número ya es de otra cuenta no se
        dice aquí sino tras el código.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string }
      responses:
        "202": { description: "Código enviado ({ pending })" }
        "400": { description: "Móvil no válido (`phone_invalid`)" }
        "401": { description: La contraseña actual no es correcta }
        "409": { description: "Ya es su móvil (`phone_same`)" }
        "429": { description: "`code_wait` o `sms_limit`" }
        "502": { description: "El SMS no salió (`sms_failed`)" }
        "503": { description: "Sin SMS configurados (`sms_unavailable`)" }

  /api/v1/me/phone/verify:
    post:
      tags: [Identity]
      summary: Confirmar el código y fijar el móvil nuevo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { description: "{ phone }" }
        "400": { description: "Código incorrecto (`code_wrong`)" }
        "409": { description: "El móvil ya es de otra cuenta (`phone_has_account`)" }
        "410": { description: "Sin código pendiente, caducado o sin intentos (`code_expired`)" }

  /api/v1/me/mfa/totp/enroll:
    post:
      tags: [WebAuthn]
      summary: Iniciar enrolamiento TOTP (genera secreto; NO activa aún)
      description: >
        Genera un secreto TOTP (crypto/rand) sin confirmar y devuelve el URI
        otpauth:// y el secreto base32 para el QR / entrada manual. No activa MFA
        hasta /confirm. 409 si ya hay un TOTP confirmado.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ otpauth_uri, secret, qr_png? }" }
        "409": { description: Ya hay un TOTP activo }

  /api/v1/me/mfa/totp/confirm:
    post:
      tags: [WebAuthn]
      summary: Confirmar y activar el TOTP con un primer código
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string, description: Código de 6 dígitos } }
      responses:
        "200": { description: "TOTP activado ({ mfa_enabled: true, recovery_codes: [...] }); los códigos de recuperación se devuelven UNA vez" }
        "400": { description: Código incorrecto }
        "409": { description: No hay enrolamiento pendiente }

  /api/v1/me/mfa/totp/recovery-codes:
    post:
      tags: [WebAuthn]
      summary: Regenerar los códigos de recuperación TOTP (invalida los anteriores)
      description: >
        Genera un lote nuevo de códigos de recuperación de un solo uso y los
        devuelve UNA vez (solo se persiste su hash); los anteriores dejan de
        servir. Requiere el TOTP activo.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ recovery_codes: [...] }" }
        "409": { description: El TOTP no está activado }

  /api/v1/me/mfa/totp:
    delete:
      tags: [WebAuthn]
      summary: Desactivar el TOTP (exige un código vigente o la contraseña)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                password: { type: string }
      responses:
        "200": { description: "TOTP desactivado ({ mfa_enabled })" }
        "401": { description: No se pudo verificar la identidad }
        "409": { description: El TOTP no está activado }

  /api/v1/orgs:
    post:
      tags: [Identity]
      summary: Crear organización (tenant); el solicitante queda owner
      security: [{ bearerAuth: [] }]
      responses: { "201": { description: Organización creada } }

  /api/v1/orgs/{slug}/members:
    post:
      tags: [Identity]
      summary: Añadir miembro a la organización con rol
      security: [{ bearerAuth: [] }]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Miembro añadido } }

  /api/v1/onboarding/subscription:
    get:
      tags: [Identity]
      summary: Estado del derecho de acceso de Sytue One durante el alta
      description: >-
        Devuelve el contrato local de 6 EUR por usuario/mes, asientos, miembros
        activos y paid_until. `entitled` solo es true tras verificar el pago
        contra la API autenticada de Mollie; una sesión sin derecho no contiene
        claim tenant y no da acceso a ninguna API de la suite.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Estado de suscripción
          content:
            application/json:
              schema:
                type: object
                required: [status, seats, active_members, unit_price_cents, currency, entitled]
                properties:
                  status: { type: string, enum: [pending, active, past_due, canceled] }
                  seats: { type: integer, minimum: 1, maximum: 10000 }
                  active_members: { type: integer, minimum: 0 }
                  unit_price_cents: { type: integer, const: 600 }
                  currency: { type: string, const: EUR }
                  paid_until: { type: [string, "null"], format: date-time }
                  entitled: { type: boolean }
        "401": { description: Sesión de alta ausente o inválida }

  /api/v1/onboarding/subscription/checkout:
    post:
      tags: [Identity]
      summary: Crear el primer pago de la suscripción mensual
      description: >-
        El importe se calcula exclusivamente en servidor a 600 céntimos EUR por
        asiento. La URL devuelta pertenece al checkout HTTPS de Mollie.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "201":
          description: Checkout creado
          content:
            application/json:
              schema:
                type: object
                required: [checkout_url, amount_cents, currency, seats]
                properties:
                  checkout_url: { type: string, format: uri }
                  amount_cents: { type: integer, minimum: 600 }
                  currency: { type: string, const: EUR }
                  seats: { type: integer }
        "409": { description: La organización ya tiene derecho activo }

  /billing/webhooks/mollie:
    post:
      tags: [Identity]
      summary: Webhook verificado de pagos Mollie
      description: >-
        El cuerpo solo aporta un ID opaco. Sytue ID vuelve a consultar el pago
        con su API key, valida cliente, importe, moneda y suscripción, y procesa
        duplicados de forma idempotente. Reembolsos y chargebacks suspenden el
        derecho de acceso.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id]
              properties: { id: { type: string, pattern: "^tr_[A-Za-z0-9]{6,77}$" } }
      responses:
        "200": { description: Evento verificado y aplicado }
        "400": { description: Pago no verificable o ajeno al contrato local }

  /api/v1/admin/users:
    get:
      tags: [Identity]
      summary: Listar usuarios de la organización activa (admin/owner), keyset (created_at, id) DESC
      description: >
        Paginación keyset estable sin OFFSET: `cursor` es el token opaco devuelto
        como `nextCursor` por la página anterior (vacío en la primera página);
        `nextCursor` vuelve vacío al agotar el directorio. Requiere rol
        owner/admin; el ámbito es la organización del claim `tenant` del token.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Token opaco de continuación }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Página de usuarios de la organización
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        email: { type: string }
                        email_verified: { type: boolean }
                        name: { type: string }
                        mfa_enabled: { type: boolean }
                        status: { type: string, enum: [active, suspended, deleted] }
                        role: { type: string, enum: [owner, admin, member, billing] }
                        created_at: { type: string, format: date-time }
                  nextCursor: { type: string, description: Vacío cuando no hay más páginas }
        "400": { description: cursor o limit inválidos }
        "403": { description: Rol insuficiente o token sin organización activa }

  /api/v1/admin/users/{id}/password:
    post:
      tags: [Identity]
      summary: Reset de contraseña por admin/owner (soporte / recuperación)
      description: >
        Un owner/admin fija una contraseña a un usuario de su organización activa
        y revoca sus sesiones. Deny-by-default (requireRole owner/admin) + no sobre
        uno mismo y a un owner solo otro owner. Aislado por tenant (el objetivo
        debe ser miembro de la org activa). La contraseña no se registra; la acción
        sí se audita.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties: { new_password: { type: string, minLength: 8 } }
      responses:
        "200": { description: "Contraseña fijada ({ id, sessions_revoked })" }
        "400": { description: La contraseña no cumple la política }
        "403": { description: Rol insuficiente o acción no permitida sobre el objetivo }
        "404": { description: El usuario no es miembro de la organización activa }

  /api/v1/admin/privacy/requests:
    get:
      tags: [Identity]
      summary: Registro de solicitudes RGPD de la organización activa (owner/admin)
      description: >
        Lo que la organización, como responsable del tratamiento, ha recibido de
        las personas (arts. 15–21): tipo, canal, recepción, plazo de un mes y su
        prórroga de dos (art. 12.3), verificación de identidad y resolución. Lo
        más reciente primero, hasta 500. Reservado a owner/admin, no delegable.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, received, in_progress, completed, rejected] } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [access, rectification, erasure, restriction, portability, objection] } }
        - { name: overdue, in: query, required: false, schema: { type: string, enum: ["1"] }, description: Solo las abiertas con el plazo vencido }
      responses:
        "200":
          description: Solicitudes y recuento de abiertas y vencidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: { type: array, items: { $ref: "#/components/schemas/PrivacyRequest" } }
                  summary:
                    type: object
                    properties: { open: { type: integer }, overdue: { type: integer } }
                  response_months: { type: integer }
                  extension_months: { type: integer }
        "400": { description: Filtro desconocido }
        "403": { description: Rol insuficiente o cuenta personal }
    post:
      tags: [Identity]
      summary: Registrar una solicitud RGPD en nombre de una persona
      description: >
        La persona se identifica por su cuenta de la organización (`user_id`) o
        por su correo; si el correo es de una cuenta de la organización, se
        enlaza sola. El plazo se cuenta desde `received_at` (por defecto, ahora;
        como mucho un año atrás). Se audita sin el correo de la persona.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, channel]
              properties:
                subject_email: { type: string, format: email }
                subject_name: { type: string, maxLength: 200 }
                user_id: { type: string, format: uuid }
                kind: { type: string, enum: [access, rectification, erasure, restriction, portability, objection] }
                channel: { type: string, enum: [email, web, letter, phone, in_person, other] }
                received_at: { type: string, description: RFC3339 o AAAA-MM-DD }
                identity_verified: { type: boolean }
                identity_method: { type: string, maxLength: 200 }
                notes: { type: string, maxLength: 4000 }
      responses:
        "201": { description: "Solicitud registrada ({ request })" }
        "400": { description: Tipo, canal, correo o fecha no válidos }
        "404": { description: "`user_id` no es de la organización activa" }

  /api/v1/admin/privacy/requests/{id}:
    get:
      tags: [Identity]
      summary: Una solicitud RGPD con su historia y si admite supresión física
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: "{ request, events, erasure: { available, reason } }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: "#/components/schemas/PrivacyRequest" }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        at: { type: string, format: date-time }
                        actor_id: { type: string }
                        action: { type: string }
                        detail: { type: object }
                  erasure:
                    type: object
                    properties:
                      available: { type: boolean }
                      reason: { type: string, enum: [not_erasure, completed, in_progress, closed, no_account, not_member] }
        "404": { description: No es de la organización activa }
    patch:
      tags: [Identity]
      summary: Avanzar o cerrar una solicitud abierta
      description: >
        Cerrar (`completed` o `rejected`) exige una resolución escrita, que es lo
        que se le contesta a la persona. Una supresión en curso no se da por
        resuelta hasta que el barrido la termina. Una solicitud cerrada no cambia.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [received, in_progress, completed, rejected] }
                resolution: { type: string, maxLength: 4000 }
                notes: { type: string, maxLength: 4000 }
                identity_verified: { type: boolean }
                identity_method: { type: string, maxLength: 200 }
      responses:
        "200": { description: "Solicitud actualizada ({ request })" }
        "400": { description: Estado desconocido o cierre sin resolución }
        "409": { description: Solicitud cerrada, o supresión aún en curso }

  /api/v1/admin/privacy/requests/{id}/extend:
    post:
      tags: [Identity]
      summary: Prorrogar dos meses el plazo (una vez, antes de que venza)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, maxLength: 1000 } }
      responses:
        "200": { description: "Plazo prorrogado ({ request })" }
        "400": { description: Sin motivo }
        "409": { description: Ya prorrogada, vencida o cerrada }

  /api/v1/admin/privacy/requests/{id}/erase:
    post:
      tags: [Identity]
      summary: Supresión física de la cuenta de una solicitud de supresión
      description: >
        Pide reautenticación y que se escriba el correo de la persona. Da de baja
        la cuenta sin ventana de recuperación, borra en el acto lo que sirve para
        entrar y, en el siguiente barrido, anonimiza la ficha, quita sus
        membresías y borra lo que los demás servicios guardan de la persona. Se
        niega si la cuenta es también de otra organización o tiene su cuenta
        personal, y si dejaría una organización sin administración. Lo que la
        persona creó para la organización (buzón, archivos, eventos) se queda en
        la organización.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties: { confirm: { type: string, description: Correo de la persona } }
      responses:
        "200": { description: "Supresión iniciada ({ request, note })" }
        "400": { description: La confirmación no coincide }
        "401": { description: Hace falta reautenticarse }
        "403": { description: La propia cuenta, o un owner siendo admin }
        "409": { description: No es una supresión de cuenta, cuenta de fuera, única administradora o ya en curso }

  /api/v1/webauthn/register/begin:
    post:
      tags: [WebAuthn]
      summary: Iniciar registro de passkey (PublicKeyCredentialCreationOptions)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Opciones de creación } }

  /api/v1/webauthn/register/finish:
    post:
      tags: [WebAuthn]
      summary: Finalizar registro de passkey (verificación de attestation)
      security: [{ bearerAuth: [] }]
      responses: { "201": { description: Passkey registrada } }

components:
  schemas:
    PrivacyRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject_user_id: { type: string, format: uuid }
        subject_email: { type: string }
        subject_name: { type: string }
        kind: { type: string, enum: [access, rectification, erasure, restriction, portability, objection] }
        channel: { type: string, enum: [email, web, letter, phone, in_person, other] }
        received_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        extended: { type: boolean }
        extension_reason: { type: string }
        identity_verified: { type: boolean }
        identity_method: { type: string }
        status: { type: string, enum: [received, in_progress, completed, rejected] }
        resolution: { type: string }
        notes: { type: string }
        erasure_started_at: { type: string, format: date-time }
        erasure_completed_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT emitido por Sytue ID (validado vía JWKS).
    scimBearer:
      type: http
      scheme: bearer
      description: Token bearer estático del proveedor de aprovisionamiento SCIM.
