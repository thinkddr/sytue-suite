<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WhatsApp Business · Sytue</title>
    <style nonce="{{.Nonce}}">
      :root { color-scheme: light dark; font: 17px/1.5 system-ui,sans-serif; }
      body { margin: 0; background: Canvas; color: CanvasText; }
      main { max-width: 28rem; margin: 12vh auto; padding: 1.5rem; }
      h1 { font-size: 1.7rem; line-height: 1.2; letter-spacing: -.03em; }
      button { min-height: 2.75rem; padding: .65rem 1rem; border: 0; border-radius: .75rem; background: #245cd4; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .55; cursor: default; }
      button:focus-visible { outline: 3px solid #6c9cff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>WhatsApp Business</h1>
      <p id="status" role="status" aria-live="polite">Loading…</p>
      <button id="continue" type="button" disabled>Continue in Meta</button>
    </main>
    <script nonce="{{.Nonce}}">
      (() => {
        'use strict';
        const roomsOrigin = {{.RoomsOrigin}};
        const opener = window.opener;
        const status = document.getElementById('status');
        const button = document.getElementById('continue');
        let config = null;
        let settled = false;
        let timeout;
        const send = (type, detail = {}) => {
          if (opener && config) opener.postMessage({ type, state: config.state, ...detail }, roomsOrigin);
        };
        const fail = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          button.disabled = true;
          status.textContent = config?.labels.failed || 'Return to Rooms and try again.';
          send('sytue:whatsapp:error');
        };
        const receive = (event) => {
          if (config || !opener || event.source !== opener || event.origin !== roomsOrigin) return;
          const value = event.data;
          if (!value || value.type !== 'sytue:whatsapp:start' || typeof value.state !== 'string' || !value.state || value.state.length > 16384 || !/^\d{1,64}$/.test(value.app_id) || !/^\d{1,64}$/.test(value.config_id) || !/^v\d{1,3}\.\d{1,2}$/.test(value.graph_version)) return;
          const labels = value.labels;
          if (!labels || !['continue', 'loading', 'failed', 'done'].every((key) => typeof labels[key] === 'string' && labels[key].length <= 1000)) return;
          config = value;
          window.removeEventListener('message', receive);
          button.textContent = labels.continue;
          status.textContent = labels.loading;
          const script = document.createElement('script');
          script.src = 'https://connect.facebook.net/en_US/sdk.js';
          script.async = true;
          script.referrerPolicy = 'no-referrer';
          script.onerror = fail;
          timeout = setTimeout(fail, 20000);
          script.onload = () => {
            clearTimeout(timeout);
            if (!window.FB || settled) return fail();
            window.FB.init({ appId: config.app_id, version: config.graph_version, xfbml: false, cookie: false });
            status.textContent = 'WhatsApp Business';
            button.disabled = false;
            button.focus();
          };
          document.head.append(script);
        };
        button.addEventListener('click', () => {
          if (!config || !window.FB || settled || button.disabled) return;
          button.disabled = true;
          // Keep FB.login in this click's stack. The popup blocker sees a user gesture.
          try {
            window.FB.login((response) => {
              if (settled) return;
              const code = response?.authResponse?.code;
              if (typeof code !== 'string' || !code || code.length > 8192) return fail();
              settled = true;
              status.textContent = config.labels.done;
              // Meta's code expires in thirty seconds: do not wait for any other event.
              send('sytue:whatsapp:code', { code });
              config = null;
            }, { config_id: config.config_id, response_type: 'code', override_default_response_type: true, extras: { setup: {} } });
          } catch { fail(); }
        });
        if (!opener) { fail(); return; }
        window.addEventListener('message', receive);
        opener.postMessage({ type: 'sytue:whatsapp:ready' }, roomsOrigin);
      })();
    </script>
  </body>
</html>
