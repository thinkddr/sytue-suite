openapi: 3.1.0
info:
  title: Sytue Mail API
  description: >-
    API de cara al cliente de Sytue Mail (servidor de correo Sytue-native).
    Incluye el recurso de sesión JMAP (RFC 8620), el endpoint JMAP por lotes y
    una API REST de conveniencia (mismo modelo) que usa @sytue/api-clients.
    Los sobres de mensaje viven en PostgreSQL; los .eml crudos y adjuntos en
    Object Storage S3. SMTP (25/465/587) e IMAPS (993) se sirven aparte para
    clientes de terceros. Clean-room, © 2026 Daniel Delgado Ramos (thinkddr); sin motores de correo AGPL.
  version: "1.0.0"
  license:
    name: MIT
servers:
  - url: https://mail.sytue.eu
    description: Producción
  - url: https://mail.sytue.localhost
    description: Desarrollo (Traefik + mkcert)

security:
  - bearerAuth: []

tags:
  - name: jmap
  - name: mailboxes
  - name: messages
  - name: send

paths:
  /healthz:
    get:
      summary: Liveness
      security: []
      responses:
        "200": { description: Proceso vivo }
  /readyz:
    get:
      summary: Readiness (PostgreSQL + S3)
      security: []
      responses:
        "200": { description: Listo }
        "503": { description: Alguna dependencia no disponible }

  /.well-known/jmap:
    get:
      tags: [jmap]
      summary: Descubrimiento JMAP (RFC 8620 §2.2)
      security: []
      responses:
        "308": { description: Redirección al recurso de sesión }

  /jmap/session:
    get:
      tags: [jmap]
      summary: Recurso de sesión JMAP (capacidades, cuentas, URLs)
      responses:
        "200":
          description: Sesión JMAP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JmapSession" }

  /jmap:
    post:
      tags: [jmap]
      summary: Endpoint JMAP (sobre Request -> Response por lotes, RFC 8620 §3.3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JmapRequest" }
      responses:
        "200":
          description: Respuesta JMAP por lotes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JmapResponse" }

  /api/v1/mailboxes:
    get:
      tags: [mailboxes]
      summary: Listar buzones de la cuenta (con contadores)
      responses:
        "200":
          description: Lista de buzones
          content:
            application/json:
              schema:
                type: object
                properties:
                  mailboxes:
                    type: array
                    items: { $ref: "#/components/schemas/Mailbox" }
    post:
      tags: [mailboxes]
      summary: Crear un buzón de usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parent_id: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Buzón creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }
        "409": { description: Ya existe un buzón con ese nombre }

  /api/v1/mailboxes/{mailboxID}/messages:
    get:
      tags: [messages]
      summary: Listar sobres de un buzón (paginado keyset, más recientes primero)
      parameters:
        - { name: mailboxID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - name: cursor
          in: query
          description: >-
            Cursor keyset "fecha de orden,id" (RFC 3339 + uuid) del último mensaje
            de la página anterior (la fecha de orden es unsnoozed_at si lo trae, si
            no received_at); se toma tal cual del next_cursor de la
            respuesta previa. Vacío u omitido = primera página.
          schema: { type: string }
      responses:
        "200":
          description: Lista de mensajes
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  limit: { type: integer }
                  next_cursor:
                    type: string
                    description: Cursor de la página siguiente ("" si no hay más).

  /api/v1/threads/{threadID}/messages:
    get:
      tags: [messages]
      summary: Listar el hilo completo, atravesando carpetas
      description: >-
        Todos los mensajes vivos de un hilo de la cuenta, estén en la carpeta que
        estén (Recibidos, Enviados, Archivo): es lo que la vista de conversación
        no puede armar desde el listado de UNA carpeta. Más recientes primero,
        igual que el listado de buzón. Sin paginación (tope de 200 mensajes por
        hilo). Owner-scoped: un hilo de otra cuenta devuelve la lista vacía, no
        404 —no se confirma su existencia—.
      parameters:
        - { name: threadID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Mensajes del hilo (lista vacía si no es de la cuenta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  muted:
                    type: boolean
                    description: El hilo está silenciado (sus respuestas nuevas van al Archivo).
                  snoozed_until:
                    type: string
                    format: date-time
                    description: Hasta cuándo está pospuesto; ausente si no lo está.

  /api/v1/snoozes:
    get:
      tags: [messages]
      summary: Listar las conversaciones pospuestas
      description: >-
        Los hilos pospuestos de la cuenta y la fecha en que vuelven a Recibidos,
        el que vuelve antes primero.
      responses:
        "200":
          description: Posposiciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  snoozes:
                    type: array
                    items: { $ref: "#/components/schemas/Snooze" }

  /api/v1/threads/{threadID}/snooze:
    put:
      tags: [messages]
      summary: Posponer una conversación
      description: >-
        Mueve lo que el hilo tenga en Recibidos al buzón de rol `snoozed` hasta
        `until`; entonces vuelve a Recibidos con lo más reciente sin leer. Una
        respuesta nueva al hilo lo devuelve antes. Sobre un hilo ya pospuesto,
        cambia la fecha.
      parameters:
        - { name: threadID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: { type: string, format: date-time, description: Entre un minuto y un año desde ahora. }
      responses:
        "200":
          description: Pospuesta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snooze" }
        "400": { description: "Fecha fuera de rango (code invalid_snooze)" }
        "404": { description: El hilo no es de la cuenta }
        "409": { description: "Nada en Recibidos que posponer (code nothing_to_snooze)" }
    delete:
      tags: [messages]
      summary: Quitar la posposición
      description: Devuelve ya a Recibidos un hilo pospuesto, sin marcarlo como no leído.
      parameters:
        - { name: threadID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Devuelta a Recibidos }
        "404": { description: No estaba pospuesta o no es de la cuenta }

  /api/v1/threads/{threadID}/mute:
    put:
      tags: [messages]
      summary: Silenciar o dejar de silenciar una conversación
      description: >-
        Silenciada, lo que el hilo tenga en Recibidos se archiva y las respuestas
        nuevas van directas al Archivo, sin aviso.
      parameters:
        - { name: threadID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties:
                muted: { type: boolean }
      responses:
        "200":
          description: Estado nuevo
          content:
            application/json:
              schema:
                type: object
                properties:
                  muted: { type: boolean }
                  archived: { type: integer, description: Mensajes que se sacaron de Recibidos. }
        "404": { description: El hilo no es de la cuenta }

  /api/v1/messages/{messageID}:
    get:
      tags: [messages]
      summary: Obtener el sobre de un mensaje
      parameters:
        - { name: messageID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Mensaje
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { description: No encontrado }
    delete:
      tags: [messages]
      summary: Borrar (soft) un mensaje
      parameters:
        - { name: messageID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Borrado }

  /api/v1/messages/{messageID}/raw:
    get:
      tags: [messages]
      summary: Descargar el .eml crudo (RFC 5322) desde S3
      parameters:
        - { name: messageID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Mensaje crudo
          content:
            message/rfc822: {}

  /api/v1/messages/{messageID}/flags:
    post:
      tags: [messages]
      summary: Añadir/quitar un flag o keyword (\Seen, \Flagged, ...)
      parameters:
        - { name: messageID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flag, add]
              properties:
                flag: { type: string, example: "\\Seen" }
                add: { type: boolean }
      responses:
        "204": { description: Aplicado }

  /api/v1/messages/{messageID}/move:
    post:
      tags: [messages]
      summary: Mover un mensaje a otro buzón
      parameters:
        - { name: messageID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailbox_id]
              properties:
                mailbox_id: { type: string, format: uuid }
      responses:
        "204": { description: Movido }

  /api/v1/send:
    post:
      tags: [send]
      summary: Encolar un mensaje saliente (firma DKIM + cola PostgreSQL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipients, raw]
              properties:
                from: { type: string, format: email }
                recipients:
                  type: array
                  items: { type: string, format: email }
                raw:
                  type: string
                  description: Mensaje RFC 5322 completo construido por el cliente
      responses:
        "202": { description: Encolado para entrega diferida }

  /api/v1/admin/audit-log:
    get:
      tags: [jmap]
      summary: Traza de auditoría de la organización activa (owner/admin)
      description: >
        La traza de docs/security.md §1.7 de este servicio: los accesos a datos de
        cliente (`acceso.*`: mensajes leídos o descargados, adjuntos, buzones compartidos, delegación y exportación) y la de cumplimiento (legal hold, eDiscovery). Quién, qué (id del recurso, nunca su
        contenido), cuándo y desde dónde (`detail.ip`, `detail.request_id`).
        Paginación keyset (occurred_at, id) DESC con los filtros en la consulta;
        `format=csv` exporta hasta 5000 filas. La traza `acceso.*` se guarda doce
        meses.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 100 }, description: Prefijo de la acción }
        - { name: actor, in: query, required: false, schema: { type: string }, description: Subcadena del actor }
        - { name: since, in: query, required: false, schema: { type: string }, description: RFC3339 o AAAA-MM-DD }
        - { name: until, in: query, required: false, schema: { type: string }, description: RFC3339 o AAAA-MM-DD (inclusivo) }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv] } }
      responses:
        "200":
          description: Página de la traza ({ items, nextCursor }) o CSV
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        occurred_at: { type: string, format: date-time }
                        actor: { type: string }
                        action: { type: string }
                        target: { type: string }
                        detail: { type: object }
                  nextCursor: { type: string }
        "400": { description: Filtros, fechas o cursor no válidos }
        "403": { description: Rol insuficiente }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de Sytue ID (OIDC), validado por JWKS.
  schemas:
    Mailbox:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        role:
          type: string
          enum: ["", inbox, sent, drafts, trash, junk, archive, snoozed]
        total_emails: { type: integer }
        unread_emails: { type: integer }
    Snooze:
      type: object
      properties:
        thread_id: { type: string, format: uuid }
        until: { type: string, format: date-time }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        mailbox_id: { type: string, format: uuid }
        thread_id: { type: string, format: uuid }
        message_id: { type: string }
        subject: { type: string }
        from: { type: string }
        from_name: { type: string }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        preview: { type: string }
        size: { type: integer }
        keywords: { type: array, items: { type: string } }
        has_attachment: { type: boolean }
        received_at: { type: string, format: date-time }
        date: { type: string, format: date-time }
        unsnoozed_at:
          type: string
          format: date-time
          description: >-
            Cuándo volvió de «Pospuestos» al vencer la fecha. Las listas ordenan por
            ella cuando la hay (lo devuelto sube arriba, como en Gmail) y la fila la
            enseña en lugar de received_at. Ausente si no se pospuso o se trajo a mano.
    JmapSession:
      type: object
      properties:
        capabilities: { type: object, additionalProperties: true }
        accounts: { type: object, additionalProperties: true }
        primaryAccounts: { type: object, additionalProperties: { type: string } }
        username: { type: string }
        apiUrl: { type: string }
        downloadUrl: { type: string }
        uploadUrl: { type: string }
        state: { type: string }
    JmapRequest:
      type: object
      required: [using, methodCalls]
      properties:
        using: { type: array, items: { type: string } }
        methodCalls:
          type: array
          items:
            type: array
            description: "[methodName, arguments, callId]"
    JmapResponse:
      type: object
      properties:
        methodResponses:
          type: array
          items: { type: array }
        sessionState: { type: string }
